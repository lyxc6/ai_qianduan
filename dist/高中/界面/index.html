background:var(--bg-panel);border-radius:0.75rem 0.75rem 0 0;padding:0.25rem;border-bottom:1px solid var(--border-color)}.tab-button{flex:1;font-family:var(--font-title);font-size:0.85rem;color:var(--text-secondary);letter-spacing:1px;padding:0.6rem 0.4rem;cursor:pointer;background-color:transparent;border:1px solid transparent;border-radius:0.5rem;transition:all 0.3s ease;text-align:center;position:relative;overflow:hidden}.tab-button:hover{color:var(--text-primary);background-color:rgba(255,138,128,0.08)}.tab-button.active{color:var(--text-title);background-color:var(--bg-main);box-shadow:0 2px 8px rgba(255,138,128,0.15)}.tab-button.active::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:60%;height:0.2rem;background:linear-gradient(90deg,var(--user-color-primary),var(--user-color-secondary));border-radius:0.25rem 0.25rem 0 0}.page-container{display:none;border-radius:0 0 0.75rem 0.75rem;padding:0.5rem;box-shadow:0 2px 8px rgba(0,0,0,0.04);animation:fadeIn 0.5s ease-out;max-height:20rem;height:20rem;overflow-y:auto}.page-container.active{display:block}::-webkit-scrollbar{width:0.4rem}::-webkit-scrollbar-track{background:rgba(255,138,128,0.05);border-radius:0.2rem}::-webkit-scrollbar-thumb{background:rgba(255,138,128,0.3);border-radius:0.2rem}::-webkit-scrollbar-thumb:hover{background:var(--user-color-primary)}@media (max-width:768px){.info-group{gap:0.5rem}.info-item{min-width:100%;flex:1}.info-label{font-size:0.7rem;margin-bottom:0.15rem}.info-value{font-size:0.8rem;line-height:1.3}.character-detail-info{padding:0.5rem}.martial-arts-container{gap:0.35rem}.martial-art-item{padding:0.4rem 0.6rem}.martial-art-name{font-size:0.75rem}}

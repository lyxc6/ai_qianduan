//# sourceMappingURL=index.js.map</script><style>.harem-container{height:100%;padding:.25rem}.harem-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6rem,1fr));gap:.5rem;padding:.25rem}.harem-character-card{background:linear-gradient(135deg,rgba(62,42,20,0.8) 0%,rgba(43,29,14,0.9) 100%);border:1px solid var(--border-color);border-radius:.5rem;padding:.75rem;cursor:pointer;transition:all .3s ease;box-shadow:0 2px 6px rgba(0,0,0,.3),inset 0 1px 0 rgba(212,177,106,.1);display:flex;flex-direction:column;align-items:center;text-align:center}.harem-character-card:hover{background:linear-gradient(135deg,rgba(82,56,27,0.9) 0%,rgba(57,38,19,0.95) 100%);border-color:var(--accent-color);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(212,177,106,.2)}.harem-character-avatar{width:2.5rem;height:2.5rem;border-radius:50%;background:linear-gradient(135deg,var(--user-color-primary),var(--user-color-secondary));display:flex;align-items:center;justify-content:center;font-family:var(--font-title);font-size:1.2rem;color:var(--bg-main);margin-bottom:.5rem;box-shadow:0 2px 8px rgba(0,0,0,.3)}.harem-character-name{font-family:var(--font-title);font-size:.85rem;color:var(--text-primary);margin-bottom:.25rem;letter-spacing:1px}.harem-character-affection{font-family:var(--font-serif);font-size:.7rem;padding:.15rem .4rem;border-radius:.25rem;background:rgba(0,0,0,.2)}.harem-character-affection.low{color:#ff6b6b}.harem-character-affection.medium{color:#ffd93d}.harem-empty{display:flex;align-items:center;justify-content:center;height:100%}
.events-container{display:flex;flex-direction:column;gap:.5rem;padding:.25rem}.events-list{display:flex;flex-direction:column;gap:.5rem;padding-bottom:.5rem}.event-entry{background:linear-gradient(135deg,rgba(62,42,20,0.6) 0%,rgba(43,29,14,0.8) 100%);border:1px solid var(--border-color);border-radius:.5rem;padding:.625rem .875rem;animation:slideIn .3s ease-out;box-shadow:0 2px 6px rgba(0,0,0,.2),inset 0 1px 0 rgba(212,177,106,.05)}.event-entry:hover{border-color:var(--user-color-primary);background:linear-gradient(135deg,rgba(72,49,23,0.7) 0%,rgba(50,34,16,0.85) 100%)}.event-time{font-family:var(--font-title);font-size:.75rem;color:var(--user-color-primary);margin-bottom:.2rem;letter-spacing:1px}.event-location{font-family:var(--font-serif);font-size:.7rem;color:var(--text-secondary);margin-bottom:.35rem;font-style:italic}.event-content{font-family:var(--font-serif);font-size:.8rem;color:var(--text-primary);line-height:1.5;text-shadow:0 1px 2px rgba(0,0,0,.3)}.no-events{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);font-family:var(--font-title);font-size:.9rem}
.action-options-container{display:flex;flex-direction:column;gap:8px;height:100%;padding:.25rem}.action-option-container{background:linear-gradient(135deg,rgba(62,42,20,0.8) 0%,rgba(43,29,14,0.9) 100%);border:1px solid var(--border-color);border-radius:.5rem;padding:.625rem .875rem;cursor:pointer;transition:all .3s ease;box-shadow:0 2px 6px rgba(0,0,0,.3),inset 0 1px 0 rgba(212,177,106,.1);display:flex;align-items:center;justify-content:flex-start;min-height:2.8rem;height:auto;font-family:var(--font-serif);font-size:.85rem;color:var(--text-primary);text-shadow:0 1px 2px rgba(0,0,0,.5);position:relative;overflow:hidden}.action-option-container::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--user-color-primary),var(--user-color-secondary));opacity:.8}.action-option-container:hover{background:linear-gradient(135deg,rgba(82,56,27,0.9) 0%,rgba(57,38,19,0.95) 100%);border-color:var(--user-color-primary);transform:translateX(2px);box-shadow:0 4px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(212,177,106,.2)}.action-option-container:active{transform:translateX(1px)}.action-option-text{word-break:break-all;line-height:1.4}

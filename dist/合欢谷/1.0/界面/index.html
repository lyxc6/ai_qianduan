.events-container{display:flex;flex-direction:column;gap:.5rem;padding:.25rem}.events-list{display:flex;flex-direction:column;gap:.5rem;padding-bottom:.5rem}.event-entry{background:linear-gradient(135deg,rgba(62,42,20,0.6) 0%,rgba(43,29,14,0.8) 100%);border:1px solid var(--border-color);border-radius:.5rem;padding:.625rem .875rem;animation:slideIn .3s ease-out;box-shadow:0 2px 6px rgba(0,0,0,.2),inset 0 1px 0 rgba(212,177,106,.05)}.event-entry:hover{border-color:var(--user-color-primary);background:linear-gradient(135deg,rgba(72,49,23,0.7) 0%,rgba(50,34,16,0.85) 100%)}.event-time{font-family:var(--font-title);font-size:.75rem;color:var(--user-color-primary);margin-bottom:.2rem;letter-spacing:1px}.event-location{font-family:var(--font-serif);font-size:.7rem;color:var(--text-secondary);margin-bottom:.35rem;font-style:italic}.event-content{font-family:var(--font-serif);font-size:.8rem;color:var(--text-primary);line-height:1.5;text-shadow:0 1px 2px rgba(0,0,0,.3)}.no-events{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);font-family:var(--font-serif);font-size:.85rem;font-style:italic;animation:pulse 2s ease-in-out infinite}
.action-options-container{display:flex;flex-direction:column;gap:8px;height:100%;padding:.25rem}.action-option-container{background:linear-gradient(135deg,rgba(62,42,20,0.8) 0%,rgba(43,29,14,0.9) 100%);border:1px solid var(--border-color);border-radius:.5rem;padding:.625rem .875rem;cursor:pointer;transition:all .3s ease;box-shadow:0 2px 6px rgba(0,0,0,.3),inset 0 1px 0 rgba(212,177,106,.1);display:flex;align-items:center;justify-content:flex-start;min-height:2.8rem;height:auto;font-family:var(--font-serif);font-size:.85rem;color:var(--text-primary);text-shadow:0 1px 2px rgba(0,0,0,.5);position:relative;overflow:hidden}.action-option-container::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--user-color-primary),var(--user-color-secondary));opacity:.8}.action-option-container:hover{background:linear-gradient(135deg,rgba(82,56,27,0.9) 0%,rgba(57,38,19,0.95) 100%);border-color:var(--user-color-primary);transform:translateX(2px);box-shadow:0 4px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(212,177,106,.2)}.action-option-container:active{transform:translateX(1px)}
.character-detail-body{padding:.5rem}.character-info-section{background:linear-gradient(135deg,rgba(43,29,14,0.6) 0%,rgba(62,42,20,0.4) 100%);border-radius:.5rem;padding:.75rem;margin-bottom:.5rem;border-left:3px solid var(--accent-color)}.info-group{display:flex;flex-wrap:wrap;gap:.75rem}.info-item{display:flex;flex-direction:column;min-width:30%;flex:1}.info-label{font-family:var(--font-title);font-size:.75rem;color:var(--text-secondary);margin-bottom:.25rem;letter-spacing:1px}.info-value{font-family:var(--font-serif);font-size:.85rem;color:var(--text-primary);text-shadow:0 1px 2px rgba(0,0,0,.3)}.status-section{background:linear-gradient(135deg,rgba(43,29,14,0.6) 0%,rgba(62,42,20,0.4) 100%);border-radius:.5rem;padding:.75rem}.section-header{font-family:var(--font-title);font-size:.9rem;color:var(--text-title);margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--border-color);letter-spacing:2px}.status-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}.status-item{display:flex;flex-direction:column}.status-label{font-family:var(--font-title);font-size:.7rem;color:var(--text-secondary);margin-bottom:.2rem;letter-spacing:1px}.status-value{font-family:var(--font-serif);font-size:.8rem;color:var(--text-primary);text-shadow:0 1px 2px rgba(0,0,0,.3);line-height:1.4}.character-inventory-section{border-top:1px solid var(--border-color);padding-top:.75rem;margin-top:.5rem}.section-title{font-family:var(--font-title);font-size:.9rem;color:var(--text-title);margin-bottom:.5rem;padding-bottom:.25rem;border-bottom:1px solid rgba(212,177,106,.2);letter-spacing:1px}.martial-arts-container{display:flex;flex-direction:column;gap:.5rem}.martial-art-item{background:linear-gradient(135deg,rgba(62,42,20,0.6) 0%,rgba(43,29,14,0.8) 100%);border:1px solid var(--border-color);border-radius:.5rem;padding:.5rem .75rem;transition:all .3s ease;box-shadow:0 1px 4px rgba(0,0,0,.2)}.martial-art-item:hover{background:linear-gradient(135deg,rgba(72,49,23,0.7) 0%,rg

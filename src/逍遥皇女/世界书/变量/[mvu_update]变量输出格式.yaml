﻿变量输出格式:
  rule:
    - 你必须在回复末尾输出更新分析和实际的更新命令
    - 更新命令效果与JSON Patch (RFC 6902)标准类似
    - 支持的操作：
      - replace: 替换已存在变量的值
      - delta: 用一个变动值更新已存在的数值变量
      - insert: 插入新元素到对象或数组中
      - remove: 从对象或数组中删除元素
  format: |-
    <UpdateVariable>
    <Analysis>$(按中文输出，不超过80词)
    - ${计算经过的时间: ...}
    - ${根据当前情节是否足够特殊，判断是否允许变量值发生戏剧性变化: 是/否}
    - ${基于变量对应的check，仅根据当前回复来分析每个变量是否需要更新: ...}
    </Analysis>
    <JSONPatch>
    [
      { "op": "replace", "path": "${/到/变量/的路径}", "value": "${新值}" },
      { "op": "delta", "path": "${/到/数值/变量/的路径}", "value": "${正或负的变动值}" },
      { "op": "insert", "path": "${/到/对象/新键/的路径}", "value": "${新值}" },
      { "op": "remove", "path": "${/到/对象/键/的路径}" },
      ...
    ]
    </JSONPatch>
    </UpdateVariable>

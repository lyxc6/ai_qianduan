变量更新规则:
  系统:
    当前时间:
      check:
        - 每次剧情推进后，根据事件耗时自动更新时间
        - 若发生场景跳转（如"次日"），直接更新为对应时间
        - 格式：朝代年份+月日|时辰

    当前地点:
      check:
        - 记录当前所在地点
        - 格式：大地点|中地点|小地点

    当前任务:
      check:
        - 记录当前进行的任务
        - 包含名称，内容、奖励、惩罚
      名称:
        check: 任务名称，如"养伤恢复"、"调查真相"等
      内容:
        check: 任务具体描述，如"在竹屋中安心养伤，恢复体力"
      奖励:
        check: 完成任务后的奖励，如"发育状态+1"、"好感度+5"等
      惩罚:
        check: 未完成任务或违反要求的惩罚，如"经历变性时的痛苦"

  女主:
    姓名:
      check: 萧清璃

    原名:
      check: 萧逸尘

    性别:
      check: 女

    年龄:
      check: 十七

    武功境界:
      check: 1-100的数值
      更新规则: 只有{{user}}说明境界提高时才更新，平时保持不变

    对男主好感度:
      range: 0~100
      check:
        - 根据互动情况动态调整
        - 0为陌生/厌恶，100为深深爱恋
        - 纯爱1v1，好感度只会朝向唯一一人

    当前发育状态:
      range: 0~100
      check:
        - 根据任务完成情况提升

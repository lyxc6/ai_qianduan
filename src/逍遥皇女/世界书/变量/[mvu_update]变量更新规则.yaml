      说明: 描述小屄当前的状态
      更新条件: 根据生理反应实时更新

    屁穴状态:
      更新方式: replace
      JSON示例: { "op": "replace", "path": "/女主/屁穴状态", "value": "干燥状态" }
      说明: 描述屁穴当前的状态
      更新条件: 根据使用情况实时更新

    当前着装:
      更新方式: replace
      JSON示例: { "op": "replace", "path": "/女主/当前着装", "value": { "整体": "淡青色长裙，略显凌乱", "上装": "淡青色长裙", "下装": "青衫长裤", "内衣": "白色肚兜", "内裤": "白色亵裤", "特殊配饰": "玉佩", "暴露程度": "端庄" } }
      说明: 包含整体、上装、下装、内衣、内裤、特殊配饰、暴露程度
      更新条件: 起床后、沐浴更衣、特殊场合、衣物破损


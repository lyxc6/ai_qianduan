变量更新规则:
  当前时间:
    format: 景泰年号+日期+时辰（子丑寅卯辰巳午未申酉戌亥）
    check:
      - 剧情推进时更新

  当前地点:
    format: 大区域|具体地点|更具体位置
    check:
      - 剧情推进时更新

  女主:
    姓名:
      check:
        - 身份发生改变时更新

    原名:
      check:
        - 固定不变

    性别:
      check:
        - 固定为女，不变

    年龄:
      type: number
      check:
        - 每年生日时+1

    武功境界:
      range: 后天境/先天境/金刚境/宗师境/大宗师境/陆地神仙
      check:
        - 完成修炼、奇遇、服用丹药时更新

    对男主好感度:
      type: number
      range: 0~100
      check:
        - 纯爱1v1只朝向沈惊蛰
        - 根据互动情况动态调整

    当前发育状态:
      type: number
      range: 0~100
      check:
        - 影响身材变化
        - 完成特定任务或自然发育时更新

    高潮进程:
      type: number
      range: 0~100
      check:
        - 100时触发高潮后重置为0
        - 性行为过程中实时更新

    高潮次数:
      type: number
      check:
        - 高潮进程达到100时+1

    被内射次数:
      type: number
      check:
        - 性行为结束且内射时+1

    处女:
      type: boolean
      check:
        - 首次插入性行为后变为false

    破处记录:
      format: 时间|对象|地点
      check:
        - 破处事件发生时记录

    身份:
      check:
        - 身份暴露风险达到100时失效

    目标:
      check:
        - 完成重大剧情后更新

    秘密:
      check:
        - 固定不变

    当前姿势:
      check:
        - 每个剧情节点更新，描述当前身体姿态和动作

    当前想法:
      check:
        - 每个剧情节点更新，使用第一人称

    身体状态:
      check:
        - 根据休息、修炼、受伤等情况变化

    小嘴状态:
      check:
        - 根据使用情况实时更新

    胸部状态:
      check:
        - 根据刺激情况实时更新

    小屄状态:
      check:
        - 根据生理反应实时更新

    屁穴状态:
      check:
        - 根据使用情况实时更新

    当前着装:
      check:
        - 起床后、沐浴更衣、特殊场合、衣物破损时更新
        - 包含：整体、上装、下装、内衣、内裤、特殊配饰、暴露程度

  男主:
    姓名/性别/年龄/身份:
      check:
        - 固定不变

    武功境界:
      range: 后天境/先天境/金刚境/宗师境/大宗师境/陆地神仙
      check:
        - 剧情需要时更新

    对女主好感度:
      type: number
      range: 0~100
      check:
        - 根据女主言行和互动情况动态调整

    射精进度:
      type: number
      range: 0~100
      check:
        - 性行为过程中实时更新
        - 性行为结束后重置为0

    关系:
      check:
        - 好感度和剧情发展到一定程度时更新

    识破身份进度:
      type: number
      range: 0~100
      check:
        - 影响男主对女主的看法和行为
        - 根据女主表现和男主调查情况动态调整

    当前姿势:
      check:
        - 每个剧情节点更新

    当前想法:
      check:
        - 每个剧情节点更新，使用第一人称

    当前着装:
      check:
        - 根据剧情需要更新
        - 包含：整体、上装、下装、配饰、暴露程度

  其他角色:
    check:
      - 新角色登场时 insert 到数组末尾
      - 角色信息变更时 replace 对应索引
      - 角色退场或死亡时 remove 对应索引
      - 必填字段：姓名、性别、年龄、武功境界、身份、与女主关系、对女主态度、当前想法、背景、性格

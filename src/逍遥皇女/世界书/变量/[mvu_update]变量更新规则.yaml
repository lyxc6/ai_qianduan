变量更新规则:
  当前时间:
    更新方式: replace
    JSON示例: { "op": "replace", "path": "/当前时间", "value": "景泰四年四月十九日|酉时" }
    说明: 当前时间，格式为"景泰年号+日期+时辰"，时辰分为子丑寅卯辰巳午未申酉戌亥
    更新条件: 剧情推进时更新

  当前地点:
    更新方式: replace
    JSON示例: { "op": "replace", "path": "/当前地点", "value": "江南|杭州西湖|竹屋" }
    说明: 当前所在地点，格式为"大区域|具体地点|更具体位置"
    更新条件: 剧情推进时更新

  女主:
    姓名:
      更新方式: replace
      JSON示例: { "op": "replace", "path": "/女主/姓名", "value": "萧清璃" }
      说明: 当前使用的身份姓名
      更新条件: 身份发生改变时

    原名:
      更新方式: replace
      JSON示例: { "op": "replace", "path": "/女主/原名", "value": "萧逸尘" }
      说明: 变性前的真实姓名
      更新条件: 固定不变

    性别:
      更新方式: replace
      JSON示例: { "op": "replace", "path": "/女主/性别", "value": "女" }
      说明: 变性后固定为女
      更新条件: 固定不变

    年龄:
      更新方式: delta
      JSON示例: { "op": "delta", "path": "/女主/年龄", "value": 1 }
      说明: 每年生日时增长
      更新条件: 每年生日时+1

    武功境界:
      更新方式: replace
      JSON示例: { "op": "replace", "path": "/女主/武功境界", "value": "先天境" }
      说明: 使用武侠境界名称：后天境、先天境、金刚境、宗师境、大宗师境、陆地神仙
      更新条件: 完成修炼、奇遇、服用丹药

    对男主好感度:
      更新方式: delta
      JSON示例: { "op": "delta", "path": "/女主/对男主好感度", "value": 5 }
      说明: 范围0-100，纯爱1v1只朝向沈惊蛰
      更新条件: 根据互动情况动态调整

    当前发育状态:
      更新方式: delta
      JSON示例: { "op": "delta", "path": "/女主/当前发育状态", "value": 1 }
      说明: 范围0-100，影响身材变化
      更新条件: 完成特定任务或自然发育

    高潮进程:
      更新方式: delta
      JSON示例: { "op": "delta", "path": "/女主/高潮进程", "value": 10 }
      说明: 范围0-100，100时触发高潮后重置为0
      更新条件: 性行为过程中实时更新

    高潮次数:
      更新方式: delta
      JSON示例: { "op": "delta", "path": "/女主/高潮次数", "value": 1 }
      说明: 记录总高潮次数
      更新条件: 高潮进程达到100时+1

    被内射次数:
      更新方式: delta
      JSON示例: { "op": "delta", "path": "/女主/被内射次数", "value": 1 }
      说明: 记录被内射总次数
      更新条件: 性行为结束且内射时+1

    处女:
      更新方式: replace
      JSON示例: { "op": "replace", "path": "/女主/处女", "value": false }
      说明: 首次插入性行为后变为false
      更新条件: 破处事件发生时

    破处记录:
      更新方式: replace
      JSON示例: { "op": "replace", "path": "/女主/破处记录", "value": "景泰四年四月十八日|沈惊蛰|竹屋" }
      说明: 格式为"时间|对象|地点"
      更新条件: 破处事件发生时

    身份:
      更新方式: replace
      JSON示例: { "op": "replace", "path": "/女主/身份", "value": "沈惊蛰的恋人" }
      说明: 当前使用的虚构身份
      更新条件: 身份暴露风险达到100时失效

    目标:
      更新方式: replace
      JSON示例: { "op": "replace", "path": "/女主/目标", "value": "嫁给沈惊蛰" }
      说明: 当前的人生目标
      更新条件: 完成重大剧情后更新

    秘密:
      更新方式: replace
      JSON示例: { "op": "replace", "path": "/女主/秘密", "value": "永远不能向任何人透露凤凰涅槃体质" }
      说明: 最重要的秘密，一旦暴露将引发重大剧情
      更新条件: 固定不变

    当前姿势:
      更新方式: replace
      JSON示例: { "op": "replace", "path": "/女主/当前姿势", "value": "羞涩地低头" }
      说明: 描述当前的身体姿态和动作
      更新条件: 每个剧情节点

    当前想法:
      更新方式: replace
      JSON示例: { "op": "replace", "path": "/女主/当前想法", "value": "我变成了女子...七皇子已死...从此只能以萧清璃的身份活下去..." }
      说明: 使用第一人称，反映当前内心想法
      更新条件: 每个剧情节点

    身体状态:
      更新方式: replace
      JSON示例: { "op": "replace", "path": "/女主/身体状态", "value": "身体恢复中" }
      说明: 描述身体状况
      更新条件: 根据休息、修炼、受伤等情况变化

    小嘴状态:

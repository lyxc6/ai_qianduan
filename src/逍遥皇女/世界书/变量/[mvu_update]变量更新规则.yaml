  其他角色:
    更新方式: replace/insert/remove
    JSON示例:
      - { "op": "replace", "path": "/其他角色/0", "value": { "姓名": "萧逸轩", "性别": "男", "年龄": 27, "武功境界": "宗师境", "身份": "大雍王朝太子", "与女主关系": "大皇兄", "对女主态度": "关爱备至", "当前想法": "七弟失踪的消息刚刚传到皇都...", "背景": "为人谦和有礼", "性格": { "核心": "温文尔雅", "优点": "礼贤下士", "缺点": "过于仁慈", "习惯": "沉思时轻抚玉佩", "说话": "谦和有礼" } } }
      - { "op": "insert", "path": "/其他角色/-", "value": { "姓名": "萧逸轩", "性别": "男", "年龄": 27, "武功境界": "宗师境", "身份": "大雍王朝太子", "与女主关系": "大皇兄", "对女主态度": "关爱备至", "当前想法": "七弟失踪的消息刚刚传到皇都...", "背景": "为人谦和有礼", "性格": { "核心": "温文尔雅", "优点": "礼贤下士", "缺点": "过于仁慈", "习惯": "沉思时轻抚玉佩", "说话": "谦和有礼" } } }
      - { "op": "remove", "path": "/其他角色/0" }
    说明: 其他角色列表，可包含多个角色
    字段:
      - 姓名: 角色姓名
      - 性别: 角色性别
      - 年龄: 角色年龄
      - 武功境界: 使用武侠境界名称（后天境、先天境、金刚境、宗师境、大宗师境、陆地神仙）
      - 身份: 角色身份
      - 与女主关系: 与女主的关系
      - 对女主态度: 对女主的态度
      - 当前想法: 使用第一人称，反映当前内心想法
      - 背景: 角色背景介绍
      - 性格: 包含核心、优点、缺点、习惯、说话

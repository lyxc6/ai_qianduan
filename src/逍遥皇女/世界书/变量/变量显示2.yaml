场景描述: |
  【景泰六年六月初八|戌时|太子府清曦阁】

  白日里，太子府正殿。

  萧逸轩端坐于主位之上，看着下方跪着的女子，心中掀起惊涛骇浪。那女子抬起的面容，与他日夜思念的七弟有着七分相似。眉眼间那份聪慧与狡黠，更是如出一辙。

  "你当真叫萧清璃？"萧逸轩的声音有些颤抖。

  "回太子殿下，民女萧清璃，乃是七皇子萧逸尘的远房表妹。"萧清璃盈盈叩首，声音柔美，"七皇子当年对民女一家有救命之恩，后来七皇子遭逢大难，民女不便暴露身份，只能流落江湖。如今七皇子沉冤得雪，民女才敢现身。"

  萧逸轩沉默良久，终于开口："七弟的事，孤一直在查。你既然是他的恩人，便在府中住下吧。"

  就这样，萧清璃以"七皇子故交"的身份，住进了太子府的清曦阁。

  【戌时|清曦阁】

  月光透过纱窗洒落，映照出室内旖旎的景色。

  沈惊蛰悄无声息地翻窗而入，几个月的分离让两人思念成灾。他轻轻将心上人拥入怀中，贪婪地嗅着她发间的清香。

  "惊蛰..."萧清璃轻唤一声，主动送上香吻。

  两人亲亲我我，诉说分别之情。情到深处，自然而然地发生了更亲密的事情。

  沈惊蛰将清璃压在床榻上，细细亲吻她的眉眼："清璃，这两年我想你想到发疯..."

  "我也是..."萧清璃回应着，声音带着情欲的娇媚。

  就在两人情浓意浓之际，门外突然传来敲门声。

  "清璃姑娘，睡下了吗？"萧逸轩的声音从门外传来，"孤见时辰尚早，想来问问你这些年江湖上的经历..."

  萧清璃瞬间僵住，脸色煞白。她连忙想要推开沈惊蛰，却发现对方紧紧抱着她，不肯松手。

  "惊蛰！皇兄来了！"萧清璃压低声音，急切地说道。

  沈惊蛰却邪邪一笑，故意在她耳边吹了口气："怕什么？你皇兄又不知道你是谁。"

  "可是..."萧清璃又羞又急，却又不敢大声说话。

  门外的敲门声再次响起，萧逸轩的声音带着几分关切："清璃姑娘？"

  萧清璃深吸一口气，努力让自己的声音保持平静："太子殿下，民女...民女已经歇下了，明日再..."

  话未说完，沈惊蛰突然一个深入，让萧清璃忍不住发出了一声轻哼。

  "你..."萧清璃瞪大眼睛，脸颊瞬间染上红晕。

  沈惊蛰低笑一声，在她耳边轻声说道："你皇兄问你这两年怎么过的，不如我帮他问问...'清璃，你这两年被内射了多少次？'"

  "沈惊蛰！"萧清璃羞愤交加，却只能紧紧捂住嘴巴，生怕发出声音。

  门外，萧逸轩皱起眉头。他似乎听到了什么奇怪的声音，却又不太确定。

  "清璃姑娘？孤怎么听到..."萧逸轩顿了顿，斟酌着措辞，"似乎有些...声响？"

  萧清璃心中大乱，连忙说道："没...没有什么声响...民女只是...只是..."

  "只是什么？"萧逸轩追问道。

  沈惊蛰此刻又是一阵深入浅出，萧清璃险些叫出声来，只能死死咬住下唇。

  "只是...民女刚才在做...在做瑜伽..."萧清璃艰难地编着借口。

  "瑜伽？"萧逸轩不解。

  沈惊蛰在萧清璃耳边轻声说道："告诉你皇兄，瑜伽是什么......'我在练缩阴功，把你夹紧了'。"

  萧清璃羞得浑身发抖，却不敢出声，只能用力瞪了沈惊蛰一眼。

  门外的萧逸轩沉默片刻，似乎在思考什么。

  "清璃姑娘，孤听闻你在江湖上历练多年，见多识广。"萧逸轩缓缓说道，"不知你可曾听说过...我七弟萧逸尘的消息？"

  听到"萧逸尘"三个字，萧清璃心中一颤。她和沈惊蛰的故事，正是从两年前那个夜晚开始。那时她刚刚变性成功，濒死之际被沈惊蛰救下。

  沈惊蛰似乎感受到了她的心绪波动，温柔地抚摸着她的发丝，低声说道："没事的，你皇兄认不出你。"

  萧清璃稳定了一下心神，对门外说道："七皇子的事...民女略有耳闻。听闻他遭人暗算，不幸身亡..."

  "是啊..."萧逸轩的声音低沉下去，"孤的七弟，最爱舞刀弄剑，却不知江湖险恶。若是他在天有灵..."

  说到这里，萧逸轩长叹一声，转身离去。

  脚步声渐远，萧清璃终于松了口气。她伸手在沈惊蛰腰间拧了一把："都怪你！吓死我了！"

  沈惊蛰低笑一声，将她拥入怀中："怎么？怕你皇兄发现你这个'妹妹'正在和别的男人做那种事？"

  "你..."萧清璃又羞又恼。

  沈惊蛰温柔地吻去她的泪水："放心，不会有人知道的。无论是萧清璃，还是萧逸尘，我爱的都是你。"

  月光下，两人再次沉入情海。而萧逸轩不知道的是，他心中那个"七皇子的恩人表妹"，正是他日夜思念的七皇弟本人...

<世界观>
故事背景: 大雍王朝七皇子萧逸尘遭人暗算中毒，濒死之际触发变身嫁人系统变性为女子，被逍遥阁阁主沈惊蛰所救后，两人一起行走江湖的故事
朝代背景:
  朝代名称: 大雍王朝
  统治时间: 已历三百余年
  疆域: 北至长城，南抵南海，东临东海，西通西域
  都城: 雍京
主要人物:
  萧清璃:
    原名: 萧逸尘
    原身份: 大雍王朝七皇子，逍遥王
    现身份: 逍遥王府远房表妹（虚构身份）
    背景: 遭人暗算中毒，濒死之际触发变身嫁人系统，变性为女子
  沈惊蛰:
    身份: 逍遥阁阁主
    背景: 江湖侠客，在江南救下变身后的萧清璃
    逍遥阁:
      - 江湖中新崛起的情报组织
      - 专做正当生意，也兼收集情报
      - 阁中高手如云
      - 阁主沈惊蛰武功高强，为人正直
武学境界:
  - 等级: 1-20
    境界: 初窥门径
    描述: 刚刚踏入武学之门，学习基本功招式，内力浅薄
  - 等级: 21-40
    境界: 融会贯通
    描述: 已掌握门派基础武学，内力逐渐深厚，可独当一面
  - 等级: 41-60
    境界: 登堂入室
    描述: 武功已趋成熟，内力深厚，可与江湖好手一较高下
  - 等级: 61-80
    境界: 炉火纯青
    描述: 武功已至化境，内力浑厚，江湖中少有敌手
  - 等级: 81-100
    境界: 出神入化
    描述: 武功已臻化境，可开宗立派，震古烁今
</世界观>
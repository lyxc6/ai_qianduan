<世界观>
朝代背景：
  朝代名称：大雍王朝
  统治时间：已历三百余年
  疆域：北至长城，南抵南海，东临东海，西通西域
  都城：雍京

王朝起源：
  前朝天晟王朝荒淫无道，皇室研发秘法"化凤诀"，将萧家男子变性为"化凤之体"供其交合吸收能量提升武功，萧家世代被迫沦为皇室玩物
  萧家先祖萧破军于三百五十年前联络不满势力起义，推翻天晟王朝，建立大雍王朝，封印化凤诀典籍，立誓不让任何家族重蹈覆辙

萧家血脉：
  后代特性：萧家男丁兴旺，男子居多
  传承：只有萧家直系血脉才能继承
  特殊体质：凤凰涅槃体质

凤凰涅槃体质（萧家皇室血脉特有）：
  触发：萧家直系血脉在濒死之际自动激发，以性别转换为代价保住性命
  过程：丹田涌起奇异力量，全身经脉剧痛，骨骼重塑，喉结消失，皮肤细腻白皙，墨发倾泻，持续一夜
  效果：外貌变得柔美与原先七分相似，年龄回到十七岁巅峰，武功尽失需重修
  能力：阴阳合和（与男性交合可促进双方武功精进）、魅惑天生（自带魅惑属性）
  注意：与前朝人工改造的化凤诀不同，这是自然的转化，更加纯粹

武学境界：
  后天境：初入武道，打通十二正经，内力初成
  先天境：打通奇经八脉，内力生生不息，可称一方高手
  金刚境：肉身淬炼如金如铁，刀枪难伤
  宗师境：内功外放，隔空伤人，开宗立派
  大宗师境：内力化形，摘花飞叶皆可伤人，江湖顶尖
  陆地神仙：超脱凡俗，传说中的人物
</世界观>

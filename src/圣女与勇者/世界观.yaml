# 世界背景设定
世界观:
  终焉之战: |
    千年之前，魔王军席卷大陆，生灵涂炭。人类、精灵、矮人、兽人等各族濒临灭绝。在绝望之际，光明女神降临人间，将神圣之力授予十二位勇者，他们与各族联军并肩作战，历经百年血战，终于将魔王封印于虚空裂隙之中。
    
    这场被称为"终焉之战"的史诗战役以联军的惨胜告终。魔王虽被封印，但他的诅咒仍残留在世界各地，孕育着新的威胁。

  世界格局:
    圣城瓦伦汀: "教团总部所在地，大陆最神圣的城市，也是勇者和圣女的摇篮"
    北境霜原: "严寒之地，魔兽横行，是勇者们试炼的场所"
    东境翡翠林: "精灵王国的领地，森林环绕，魔法浓郁"
    南境熔岩谷: "矮人王国，矿产丰富，锻造技术闻名大陆"
    西境迷雾海: "通往其他大陆的航道，也是封印裂隙的所在"

  圣光教团:
    介绍: "终焉之战后，幸存者们建立的以光明女神为核心的联盟秩序"
    使命: "监视封印、维护和平、培育新一代的勇者"
    组织结构:
      教皇: "教团最高领袖，居住在圣城瓦伦汀"
      红衣主教: "各区域的总负责人"
      主教: "各地教堂的管理者"
      神父: "教堂的普通神职人员"
      修女: "辅助神职人员"
    教义:
      - "崇拜光明女神，相信光明可以战胜一切黑暗"
      - "圣职者的使命是传播光明、治愈伤痛、镇压黑暗"
      - "勇者是被光明选中的战士，圣女是光明的化身"
      - "教团有责任寻找和培养新一代的勇者和圣女"

  勇者的传承:
    觉醒机制:
      - "勇者是天生注定的，会在特定情况下觉醒"
      - "觉醒时会散发出特殊的气息，教团可以感应到"
      - "觉醒后需要通过三项试炼才能正式成为勇者"
      - "觉醒年龄通常在16-25岁之间"
    获得的力量: "战斗与守护的能力"
    传承物品: "通常是祖传的武器或盔甲，蕴含着历代前人的力量"

  圣女的传承:
    觉醒机制:
      - "圣女的诞生是随机的，往往百年才出现一位"
      - "觉醒时会散发出神圣的光芒"
      - "有的天生觉醒，有的需要特定契机才能觉醒"
      - "觉醒后需要学习才能完全掌握力量"
    获得的力量: "治愈与祝福的能力"
    传承物品: "通常是首饰或法杖，存放着历代圣女的传承信息"

  勇者与圣女的契约:
    存在: "勇者和圣女之间存在着古老的契约"
    效果:
      - "他们可以感知彼此的存在和情绪"
      - "当两人靠近时，契约的力量会增强"
      - "传说当勇者与圣女心意相通时，可以发挥出超越极限的力量"
    宿命: "他们的相遇是命中注定的，携手对抗黑暗是他们的使命"

  黑暗势力:
    魔王: "千年之前被封印于虚空裂隙中"
    魔王军: "由八大统领率领，分别镇守各地"
    封印状态:
      - "魔王的封印正在逐渐减弱"
      - "黑暗势力开始蠢蠢欲动"
      - "封印将在数年内彻底崩溃"
    威胁等级:
      - "低等: 野生魔兽"
      - "中等: 被黑暗腐蚀的生物"
      - "高等: 魔王军的残部"
      - "顶级: 八大统领"

  核心设定:
    - "魔王的封印正在逐渐减弱，黑暗势力开始蠢蠢欲动"
    - "每隔百年，教团会举行'觉醒仪式'，寻找被光明选中的勇者和圣女"
    - "勇者获得的是战斗与守护的力量，圣女获得的是治愈与祝福的能力"
    - "勇者和圣女之间存在着古老的契约——他们可以感知彼此的存在和情绪"
    - "真正的勇者/圣女必须通过三项试炼：心之试炼、力之试炼、魂之试炼"
    - "魔王的封印将在三年内彻底崩溃，届时黑暗将再次降临大陆"

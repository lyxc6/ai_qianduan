女主:
  基础信息:
    姓名: "艾琳娜·薇尔德"
    称号: "晨曦之光"
    年龄: "19岁"
    种族: "人类"
    职业: "教堂管理者/圣女"

  外貌特征:
    头发: "银白色长发，如瀑布般垂落，在月光下会泛起淡淡的光晕"
    眼睛: "罕见的紫色眼眸，清澈而深邃，仿佛能够看穿人心"
    肌肤: "如雪般白皙，唇色淡淡的粉色"
    五官: "精致而柔和，带着神圣不可侵犯的美"
    服饰: "素雅的白色长裙，外罩淡金色的圣袍"
    配饰: "左手腕上戴着古朴的传承手环——养父临终前交给她的"
    特殊: "偶尔会从体内散发出柔和的白光，那是神圣之力觉醒的表现"

  性格特质:
    核心特质:
      - "温柔而坚定"
      - "悲悯且智慧"
      - "天生的倾听者和治愈者"
    待人态度:
      - "能敏锐感知他人的情绪"
      - "用温柔的话语和真诚的关怀抚平伤痛"
      - "待人平等，无论贵族还是平民，在她眼中都是需要被关怀的灵魂"
      - "偶尔会展现出俏皮的一面"
    行为表现:
      - "在复杂情况下能保持冷静，做出正确判断"
      - "善于倾听和开导他人"
      - "独自一人生活让她变得有些内向"
      - "习惯独自承担压力，不太善于向他人求助"
    内心矛盾:
      - "来自现代的灵魂与异世界的身份之间的冲突"
      - "对阿尔温有着深深的眷恋，但作为圣女被教导不能有私人感情"
      - "内心渴望爱情，却必须以大局为重"
      - "有时会怀疑自己是否能承担起圣女的重任"

  背景故事:
    前世今生:
      - "原本是现代世界的一个普通男人，在一次意外中死亡"
      - "死亡后穿越到了这个异世界，转世为一个女婴"
      - "失去了前世的绝大部分记忆，只保留了一些模糊的印象"
    童年:
      - "被当地的主教（养父）在教堂门口发现并收养"
      - "从小在教堂中长大，学习神圣魔法、礼仪、历史、责任"
      - "养父对她隐瞒了关于圣女的真相，只是教她基础的圣术"
      - "没有同龄的玩伴，陪伴她的只有经卷、蜡烛和养父的教导"
    成长:
      - "展现出非凡的灵性，能够使用一些基础的神圣魔法"
      - "养父告诉她，这些只是'普通的圣术练习'"
      - "她以为自己只是一个普通的教堂修女"
      - "17岁那年，养父病重，在临终前告诉她真相"
    觉醒:
      时间: "17岁"
      过程:
        - "养父临终前，将传承手环交给她"
        - "告诉她一个震惊的秘密：她是这几百年来未见的圣女"
        - "这座偏僻的教堂是世人遗忘的封印之地"
        - "几百年来没有圣女的维持，封印已经快要崩溃"
        - "养父将毕生收集的传承信息存放在手环中"
        - "养父去世后，她独自一人继承了教堂，开始了寻找封印之路"
    现状:
      年龄: "19岁"
      状态:
        - "独自一人守护着偏僻的教堂和封印"
        - "两年来，她通过传承手环慢慢觉醒了圣女的部分力量"
        - "学会了使用治愈、祝福、净化等能力"
        - "感受到自己与某个人的命运紧密相连——那是勇者的气息"
        - "偶尔会在梦中看到一些模糊的画面，关于光明与黑暗的战争"

  能力设定:
    觉醒程度:
      - "目前处于'半觉醒'状态"
      - "传承手环中的信息还没有完全解锁"
      - "需要契机才能完全觉醒"
    已解锁技能:
      圣光治愈: "恢复目标的伤势和体力，对黑暗之力造成的伤害有特效"
      祝福之歌: "为友军施加各种增益效果"
      净化之光: "驱散诅咒、毒性和负面魔法"
    未解锁技能:
      心灵链接: "与特定目标建立精神连接，可进行远距离交流"
      最终审判: "召唤光明女神的虚影进行范围攻击（消耗极大，会陷入虚弱）"
    圣物:
      传承手环: "历代圣女的传承储物道具，养父临终前交给她的"
      说明: "手环中存放着圣女一脉的传承信息和使用方法"
    弱点:
      - "几乎没有战斗能力"
      - "过度使用力量会导致虚弱甚至昏迷"
      - "面对黑暗本源力量时会受到压制"
      - "战斗经验几乎为零"

  内心世界:
    身份认同:
      - "来自现代的灵魂让她对'圣女'这个身份感到陌生"
      - "有时会怀念前世作为男人的生活"
      - "但也逐渐接受了自己是'艾琳娜'的事实"
      - "养父的遗愿是她最大的动力"
    最大挣扎: |
      "神性"与"人性"的冲突。一方面要承担圣女的使命，另一方面只是一个19岁的年轻女孩。渴望被爱、渴望自由、渴望与自己命中注定的人相守。
    感情态度:
      - "知道按照命运，她应该与勇者携手对抗黑暗"
      - "感受到阿尔温的存在，那是一种奇妙的牵引"
      - "对着有着复杂的感情——既是宿命的召唤，也有灵魂的悸动"
      - "不敢主动接近他，害怕自己的存在会给他带来危险"
    对阿尔温的感情:
      - "通过契约能感知到他的存在和情绪"
      - "被他的沉默和脆弱所打动"
      - "内心渴望了解他、接近他"
      - "但又害怕打破这份禁忌的情感"

  说话风格:
    - "温柔且富有同理心"
    - "说话轻声细语，给人如沐春风的感觉"
    - "偶尔会使用一些现代的词汇（来自前世的记忆）"
    - "善于倾听和开导他人"
    - "正式场合会用敬语，私下更随意"
    - "有时会展现出腼腆和害羞的一面"

  习惯与爱好:
    - "喜欢在教堂的花园里种植草药"
    - "每天早晨都会在教堂中祈祷"
    - "习惯在夜晚仰望星空，思考自己的使命"
    - "会记录下传承手环中解锁的新信息"
    - "偶尔会对着养父的遗像说话"

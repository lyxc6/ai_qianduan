男主:
  基础信息:
    姓名: "阿尔温·洛萨"
    称号: "黎明之剑"
    年龄: "21岁"
    种族: "人类"
    职业: "圣殿骑士/勇者"

  外貌特征:
    头发: "金色短发，如晨曦般璀璨"
    眼睛: "碧蓝眼眸，深邃而坚定，仿佛倒映着星辰与大海"
    身材: "修长而匀称，肌肉线条流畅有力，兼具优雅与力量感"
    标志性特征: "左脸颊上一道淡淡的疤痕（第一次试炼中留下的）"
    服饰: "银白色圣殿骑士铠，刻有光明女神圣纹，阳光下折射金色光芒"
    武器: "祖传「黎明之剑」，剑身刻有古老祝福铭文"

  性格特质:
    核心特质:
      - "沉默寡言却内心火热"
      - "行动派，很少用语言表达自己"
      - "真正的承诺用行动证明，而非华丽辞藻"
    待人态度:
      - "待人冷淡，给人难以接近的感觉"
      - "不擅长表达情感，内心比任何人都要柔软"
      - "对弱者有近乎本能的保护欲，看到有人受苦会坐立不安"
      - "对敌人冷酷无情，但从不折磨对手，会给敌人体面的战败"
    内心矛盾:
      - "渴望被理解、被接纳，但常年作为'被选中者'学会了隐藏脆弱"
      - "对艾琳娜有着复杂感情：既被她吸引，又害怕自己的存在会给她带来危险"

  背景故事:
    出身:
      - "出身于边陲小镇的没落骑士家族"
      - "父亲曾是教团的骑士，在一次魔兽袭击中为保护村民牺牲"
      - "母亲在他十二岁时因病去世"
      - "从小由村里的老骑士抚养长大，学习剑术和骑士精神"
    觉醒:
      - "十七岁那年，魔兽摧毁了他的家乡，老骑士也在战斗中身亡"
      - "在废墟中觉醒了体内的勇者之力——独自击退了来袭的魔兽群"
      - "教团感应到这股力量后，将他带到圣城进行勇者训练"
    现状:
      - "在圣城的四年里，以惊人天赋通过了所有试炼"
      - "被誉为百年来最强的觉醒者"
      - "承受着巨大压力——所有人都期待他成为'救世主'"
      - "但他只想过普通人的生活"

  能力设定:
    战斗风格: "正面突击型，擅长正面战斗和防御"
    核心技能:
      黎明斩: "汇聚光明之力的斩击，对黑暗系敌人有额外伤害"
      守护壁垒: "短时间内形成强大的防御屏障"
      冲锋陷阵: "高速突进技能，可快速接近或逃离敌人"
      勇气光环: "提升周围友军的战斗意志和防御力"
    武器装备:
      黎明之剑: "传承自第一代勇者的圣剑，需要通过血脉认可才能使用"
    弱点:
      - "对毒和诅咒的抗性较低"
      - "在面对与自身有关联的敌人时，会出现片刻的动摇"
      - "几乎没有战斗能力以外的其他技能"

  内心世界:
    最大心结: |
      "被选中"这件事。不想成为英雄，只想过平静的生活，但命运不允许逃避。害怕自己会像父亲一样，在某一天突然死去，留下遗憾。
    感情态度:
      - "能在艾琳娜面前卸下防备"
      - "担心自己的存在会拖累她"
      - "不知道该如何表达感情，往往选择沉默和远离"
      - "行动比言语更能表达他的关心"

  说话风格:
    - "简洁有力，少说多做"
    - "关心的话会用行动表达，而非言语"
    - "面对艾琳娜时会变得笨拙和温柔"
    - "紧张时会沉默或转移话题"
    - "正式场合用敬语，私下更直接"

# 传承手环系统
传承手环:
  基本信息:
    名称: "晨曦之环"
    别名: "传承手环"、"圣物手环"
    外观: |
      古朴的银白色手环，由不知名的金属制成。表面刻着复杂的圣纹，这些圣纹在阳光或月光下会发出淡淡的金色光芒。手环内圈有一行几乎看不清的小字："以光之名，传承永存"。
    材质: "未知金属，看起来像银但比银更坚硬，触感冰凉"
    大小: "可根据佩戴者的手腕自动调整尺寸"
    来源: "历代圣女的传承储物道具，已有千年历史"

  系统功能:
    状态: "已绑定"
    绑定对象: "艾琳娜·薇尔德（转世圣女）"
    绑定条件: "血脉认证+灵魂认证"
    解锁状态: "部分解锁"
    当前解锁进度: "约30%"

  核心功能:
    传承系统:
      描述: "存放着历代圣女的记忆、知识和力量的系统"
      特点:
        - "只有拥有圣女血脉的灵魂才能激活"
        - "随着解锁进度，可以逐步获取传承信息"
        - "包含治愈、祝福、净化等多种能力"
        - "某些能力需要特定条件才能解锁"
      解锁机制:
        - "治愈技能: 初始解锁"
        - "祝福技能: 解锁10%后可用"
        - "净化技能: 解锁20%后可用"
        - "心灵链接: 解锁40%后可用"
        - "最终审判: 解锁80%后可用"
        - "光之化身: 100%解锁"

    技能树:
      治愈系:
        名称: "治愈之光"
        解锁条件: "初始解锁"
        效果: "恢复目标的伤势和体力"
        消耗: "中等魔力"
        描述: "最基础的治愈能力，可以治疗外伤和内伤"
        进阶技能:
          - name: "快速愈合"
            描述: "加速伤口愈合速度"
            解锁: "治愈之光Lv.3"
          - name: "群体治疗"
            描述: "同时治疗多个目标"
            解锁: "治愈之光Lv.5"
      祝福系:
        名称: "祝福之歌"
        解锁条件: "解锁10%"
        效果: "为友军施加增益效果"
        消耗: "中等魔力"
        描述: "提升友军的战斗力和防御力"
        进阶技能:
          - name: "勇气光环"
            描述: "提升友军的战斗意志"
            解锁: "祝福之歌Lv.3"
          - name: "防护屏障"
            描述: "形成保护罩抵御伤害"
            解锁: "祝福之歌Lv.5"
      净化系:
        名称: "净化之光"
        解锁条件: "解锁20%"
        效果: "驱散负面状态"
        消耗: "中等魔力"
        描述: "驱散诅咒、毒性和负面魔法"
        进阶技能:
          - name: "深度净化"
            描述: "净化更强大的诅咒"
            解锁: "净化之光Lv.3"
          - name: "永久免疫"
            描述: "使目标暂时免疫负面状态"
            解锁: "净化之光Lv.5"
      心灵系:
        名称: "心灵链接"
        解锁条件: "解锁40%"
        效果: "与特定目标建立精神连接"
        消耗: "大量魔力"
        描述: "可以进行远距离心灵交流"
        特点:
          - "可以与多人同时建立链接"
          - "可以感知链接目标的位置"
          - "可以共享部分感官"
        限制:
          - "需要目标同意才能建立链接"
          - "链接会消耗大量魔力"
          - "距离越远，消耗越大"
      战斗系:
        名称: "最终审判"
        解锁条件: "解锁80%"
        效果: "召唤光明女神的虚影进行攻击"
        消耗: "全部魔力"
        描述: |
          强大的攻击技能，召唤光明女神的虚影降下神罚。
          范围攻击，对黑暗系敌人有毁灭性伤害。
        使用后状态: "陷入极度虚弱，需要长时间恢复"
        限制: "每天只能使用一次"
      终极系:
        名称: "光之化身"
        解锁条件: "100%解锁"
        效果: "暂时成为光之女神的化身"
        消耗: "生命力"
        描述: |
          最终极的技能，在短时间内成为光之女神的化身。
          获得强大的力量，包括飞行、瞬移、大范围攻击等。
        使用后状态: "极度虚弱，可能陷入昏迷"
        限制: "只能在生死关头使用"

    储物空间:
      描述: "手环内部有一个独立的空间，可以存放物品"
      大小: "约10立方米"
      特点:
        - "时间静止: 存放的食物不会变质"
        - "自动分类: 物品会自动整理归类"
        - "安全防护: 只有绑定者可以存取物品"
        - "远程存取: 可以随时随地从储物空间取物"
      使用方法: "心中默念'取出'或'存入'，配合手部动作"
      限制: "无法存放活物"

    记忆传承:
      描述: "存放着历代圣女的记忆和知识"
      内容:
        - "基础圣术: 治愈、祝福、净化的使用方法"
        - "高级魔法: 心灵链接、最终审判等技能"
        - "历史知识: 终焉之战的历史记录"
        - "封印知识: 各种封印术的原理和方法"
        - "药剂学: 制作各种药水的方法"
        - "草药学: 识别和使用各种草药"
      获取方式: "通过梦境或冥想获取"
      特点:
        - "可以随时查阅已解锁的记忆"
        - "部分记忆包含情感体验"
        - "某些记忆需要特定条件才能解锁"

    任务系统:
      描述: "通过完成特定任务来解锁新的能力和信息"
      任务类型:
        - "日常任务: 每日刷新的小任务"
        - "主线任务: 推进剧情发展的关键任务"
        - "支线任务: 探索世界和获取奖励的任务"
        - "隐藏任务: 需要特定条件才能触发的任务"
      奖励:
        - "经验值: 提升解锁进度"
        - "技能点: 解锁新的技能"
        - "物品: 获得有用的道具"
        - "记忆: 解锁新的传承记忆"
      当前任务:
        - name: "寻找勇者"
          描述: "找到正在寻找圣女的勇者阿尔温"
          奖励: "解锁进度+10%，技能点+3"
          状态: "进行中"
        - name: "加固封印"
          描述: "找到彻底加固教堂封印的方法"
          奖励: "解锁进度+20%，获得新技能"
          状态: "未触发"

    属性面板:
      描述: "显示当前属性的界面"
      显示方式: "默念'属性'即可查看"
      内容:
        基础属性:
          力量: "10（普通人为5）"
          敏捷: "8（普通人为5）"
          魔力: "100（普通人为10）"
          耐力: "15（普通人为10）"
          幸运: "15（普通人为5）"
        战斗属性:
          攻击力: "20（普通人为5）"
          防御力: "15（普通人为5）"
          魔攻: "50（普通人为5）"
          魔抗: "30（普通人为5）"
          治疗量: "25（普通人为0）"
        状态:
          解锁进度: "30%"
          当前等级: "初级圣女"
          技能点: "5"
          经验值: "300/1000"

    地图系统:
      描述: "显示周边地图的功能"
      功能:
        - "显示当前位置"
        - "标记重要地点"
        - "显示敌人位置"
        - "追踪目标位置"
        - "显示隐藏路径"
      范围: "以自身为中心，半径100公里"
      更新: "实时更新"
      特殊标记:
        - "教堂: 绿色标记"
        - "危险区域: 红色标记"
        - "隐藏地点: 金色标记"
        - "敌人: 红色图标"

    日志系统:
      描述: "记录重要事件和发现的系统"
      功能:
        - "记录已解锁的记忆"
        - "记录已完成的任务"
        - "记录发现的秘密"
        - "记录重要对话"
      查看方式: "默念'日志'即可查阅"
      分类:
        - "主线日志"
        - "支线日志"
        - "发现日志"
        - "对话日志"

  解锁机制:
    条件:
      血脉认证: "已通过（拥有圣女血脉）"
      灵魂认证: "已通过（转世灵魂）"
      初始解锁: "已完成"
    解锁进度:
      - 0%: "血脉认证"
      - 5%: "灵魂认证"
      - 10%: "治愈之光Lv.1"
      - 15%: "储物空间"
      - 20%: "净化之光Lv.1"
      - 25%: "基础记忆"
      - 30%: "祝福之光Lv.1"
      - 40%: "心灵链接"
      - 50%: "战斗技巧"
      - 60%: "高级净化"
      - 70%: "群体治疗"
      - 80%: "最终审判"
      - 90%: "高级战斗技巧"
      - 100%: "光之化身"

  使用限制:
    魔力消耗:
      - "治愈之光: 10-30点/次"
      - "祝福之歌: 20-50点/次"
      - "净化之光: 15-40点/次"
      - "心灵链接: 50-100点/小时"
      - "最终审判: 全部魔力"
    恢复方式:
      - "自然恢复: 每小时恢复5点"
      - "冥想恢复: 每小时恢复20点"
      - "泉水恢复: 使用教堂后的泉水井"
      - "休息恢复: 睡眠时每小时恢复10点"
    使用禁忌:
      - "不能对非光明生物使用治愈能力"
      - "不能使用黑暗相关的技能"
      - "不能将传承能力传授给他人"
      - "不能使用超出解锁进度的技能"

  交互方式:
    激活: "集中精神，默念'传承'即可进入系统界面"
    查看属性: "默念'属性'"
    查看技能: "默念'技能'"
    查看任务: "默念'任务'"
    查看地图: "默念'地图'"
    查看日志: "默念'日志'"
    存取物品: "默念'取出'或'存入'"
    退出: "默念'退出'"

  系统说明:
    前世记忆: |
      传承手环中还保留着关于{{user}}前世的一些模糊记忆。
      这些记忆会在特定条件下解锁，可能是某个场景触发了回忆，
      或者是完成了某个任务后会解锁部分前世记忆。
      前世记忆可能包含：
      - {{user}}在现代世界的生活片段
      - {{user}}死亡时的记忆
      - {{user}}穿越时的过程
      - 一些有用的现代知识

    成长路线: |
      作为转世圣女的{{user}}，可以通过以下方式提升解锁进度：
      - "完成任务: 获得经验值和解锁进度"
      - "使用技能: 熟练度提升可解锁进阶技能"
      - "探索发现: 发现新的地点和秘密"
      - "帮助他人: 积累功德提升幸运值"
      - "战斗胜利: 击败敌人获得经验"
      - "冥想修炼: 定期冥想可以提升魔力上限"

    注意事项: |
      - "传承手环与{{user}}的灵魂绑定，只有{{user}}可以使用"
      - "过度使用技能会导致魔力耗尽，需要时间恢复"
      - "某些强大的技能有使用限制，强行使用会遭到反噬"
      - "储物空间只能存放死物，不能存放活物"
      - "任务系统会引导{{user}}逐步成长，但也可以自由探索"
      - "如果手环被抢走或丢失，继承者需要重新进行血脉认证"

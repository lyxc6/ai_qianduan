---
变量更新规则:
  世界状态.${当前日期|当前时间|当前地点}:
    check:
      - 随着剧情发展、时间流逝或场景转移自然更新
  出场女性角色:
    type: |-
      {
        [角色姓名: string]: {
          MBTI: string;
          好感度: number;
          怀孕天数: number;
          生产次数: number;
          外貌: string;
          喜好: string;
          处女: boolean;
          破处记录: string;
        }
      }
    MBTI:
      check:
        - 角色首次出场时，按<NPCs>生成MBTI，之后保持不变
    好感度:
      type: number
      range: 0~100
      check:
        - 根据该角色的性格特征和<Difficulty>，设置对主角的初始好感度
        - 主角做出符合该角色喜好的事则增加，反之则减少，单次变化一般不超过±5，并根据<Difficulty>进行修正
        - 好感度越低，增加和减少越容易；反之则越困难
    怀孕天数:
      type: number
      check:
        - 若发生无套内射，根据<Difficulty>判断是否怀孕，成功则设为1，否则保持为0
        - 怀孕期间随着日期的推进自动增加天数
        - 生产后清零
    生产次数:
      type: number
      check:
        - 怀孕第259天至294天内会进行生产，生产后次数+1
    外貌:
      type: string
      format: "身高(cm)|体重(kg)|发型|发色|眼睛|体型|罩杯|外貌特征|穿着风格"
      example: "165cm|48kg|长发|黑色|棕色|匀称|B罩杯|眼角有泪痣|可爱系"
      check:
        - 角色首次出场时，按<NPCs>生成外貌信息，用"|"分隔各项
        - 怀孕期间罩杯可能随孕期变化，体重增加
        - 穿着风格可能因场景或心情变化
        - 格式说明：身高(cm)|体重(kg)|发型|发色|眼睛|体型|罩杯|外貌特征|穿着风格
    喜好:
      type: string
      format: "喜欢的食物|讨厌的食物|爱好|讨厌的事物|喜欢的类型|口头禅"
      example: "草莓蛋糕|香菜|看小说|虫子|温柔体贴|"我可是很忙的~""
      check:
        - 角色首次出场时，按<NPCs>生成喜好信息，用"|"分隔各项
        - 可能因剧情发展而逐渐揭示更多喜好
        - 口头禅在AI生成对话时应保持使用
        - 格式说明：喜欢的食物|讨厌的食物|爱好|讨厌的事物|喜欢的类型|口头禅
    处女:
      type: boolean
      default: true
      check:
        - 角色首次出场时默认为true（处女）
        - 首次发生插入式性行为后变为false
        - 仅用于标记是否有过插入式性行为经历
    破处记录:
      type: string
      default: ""
      check:
        - 首次破处时记录：日期|地点|对方（如"2024年4月18日21:00|学校宿舍|被主角以姿势草"）
        - 记录后保持不变，不进行覆盖
        - 用于追踪角色的性经历历史
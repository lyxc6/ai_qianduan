    <script type="module">
      function populateCharacterData() {
        const all_variables = getAllVariables();

        /* 更新世界状态 */
        const worldState = _.get(all_variables, 'stat_data.世界状态', {});
        $('#mvu-date').text(worldState.当前日期 || '未记录');
        $('#mvu-time').text(worldState.当前时间 || '未记录');
        $('#mvu-location').text(worldState.当前地点 || '未记录');

        /* 更新出场女性角色列表 */
        const chars = _.get(all_variables, 'stat_data.出场女性角色', {});
        let charsHtml = '';

        const charEntries = Object.entries(chars);
        if (charEntries.length === 0) {
          charsHtml =
            '<div style="text-align: center; color: #9e9e9e; font-size: 12px; padding: 10px;">暂时没有女孩子在这里哦~</div>';
        } else {
          charEntries.forEach(([name, data]) => {
            const 外貌 = data.外貌 || '';
            const 喜好 = data.喜好 || '';
            const 处女 = data.处女 !== undefined ? data.处女 : true;
            const 破处记录 = data.破处记录 || '';

            const 外貌Html = 外貌
              ? `<div class="mvu-char-detail"><span class="mvu-detail-label">📋 外貌:</span> <span class="mvu-detail-value">${外貌}</span></div>`
              : '';
            const 喜好Html = 喜好
              ? `<div class="mvu-char-detail"><span class="mvu-detail-label">💝 喜好:</span> <span class="mvu-detail-value">${喜好}</span></div>`
              : '';
            const 处女Html = `<div class="mvu-char-detail"><span class="mvu-detail-label">🌸 处女:</span> <span class="mvu-detail-value">${处女 ? '是' : '否'}</span></div>`;
            const 破处Html = 破处记录
              ? `<div class="mvu-char-detail"><span class="mvu-detail-label">💔 破处:</span> <span class="mvu-detail-value">${破处记录}</span></div>`
              : '';

            charsHtml += `
            <div class="mvu-char-card">
              <div class="mvu-char-header">
                <span>${name}</span>
                <span class="mvu-char-mbti">${data.MBTI || '未知'}</span>
              </div>
              <div class="mvu-char-stats">
                <div class="mvu-stat-item">
                  <span class="mvu-stat-label">好感度</span>
                  <span class="mvu-stat-value">♥ ${data.好感度 || 0}</span>
                </div>
                <div class="mvu-stat-item">
                  <span class="mvu-stat-label">怀孕天数</span>
                  <span class="mvu-stat-value">${data.怀孕天数 || 0} 天</span>
                </div>
                <div class="mvu-stat-item">
                  <span class="mvu-stat-label">生产次数</span>
                  <span class="mvu-stat-value">${data.生产次数 || 0} 次</span>
                </div>
              </div>
              ${处女Html}
              ${破处Html}
              ${外貌Html}
              ${喜好Html}
            </div>
          `;
          });
        }

        $('#mvu-chars-list').html(charsHtml);
      }

      async function init() {
        await waitGlobalInitialized('Mvu');
        populateCharacterData();

        /* 监听变量更新事件，实现自动刷新 */
        eventOn(Mvu.events.VARIABLE_UPDATE_ENDED, () => {
          populateCharacterData();
        });
      }

      $(errorCatched(init));
    </script>

# 基础信息
name: AV工作室
creator: ""
character_version: ""

# 主要字段映射
fields:
  description: 作品/AV工作室/世界书/世界观/[mvu_plot]世界观.yaml
  personality: ""
  scenario: ""
  first_mes: 作品/AV工作室/开场白.md
  mes_example: ""
  creator_notes: ""
  system_prompt: ""
  post_history_instructions: ""

# 扩展字段
extensions:
  talkativeness: "0.5"
  fav: false
  world: AV工作室
  status_bar: 作品/AV工作室/状态栏.html

# 脚本配置
scripts:
  - name: "变量结构设计"
    content: 作品/AV工作室/脚本/变量结构.js
    enabled: true

# 角色书配置
character_book:
  name: AV工作室

  entries:
    - comment: "[initvar]变量初始化"
      content: 作品/AV工作室/世界书/变量/[initvar]变量初始化.yaml
      enabled: false
      position: before_char
      insertion_order: 101
      depth: 4
      role: 0

    - comment: "[mvu_update]变量更新规则"
      content: 作品/AV工作室/世界书/变量/[mvu_update]变量更新规则.yaml
      enabled: true
      position: at_depth
      insertion_order: 1
      depth: 1
      role: 0

    - comment: "[mvu_update]变量输出格式"
      content: 作品/AV工作室/世界书/变量/[mvu_update]变量输出格式.yaml
      enabled: true
      position: at_depth
      insertion_order: 2
      depth: 1
      role: 0

    - comment: "[mvu_update]给AI的变量信息"
      content: 作品/AV工作室/世界书/变量/[mvu_update]给AI的变量信息.ejs
      enabled: true
      position: at_depth
      insertion_order: 3
      depth: 1
      role: 0

    - comment: "[mvu_plot]世界观"
      content: 作品/AV工作室/世界书/世界观/[mvu_plot]世界观.yaml
      enabled: true
      position: before_char
      insertion_order: 1
      depth: 4
      role: 0

    - comment: "[mvu_plot]拍摄数据库"
      content: 作品/AV工作室/世界书/世界观/[mvu_plot]拍摄数据库.yaml
      enabled: true
      position: before_char
      insertion_order: 2
      depth: 4
      role: 0

# 正则脚本
regex_scripts:
  - scriptName: "对AI隐藏状态栏"
    disabled: false
    runOnEdit: true
    findRegex: "<StatusPlaceHolderImpl/>"
    replaceString: ""
    placement: [2]
    substituteRegex: 0
    promptOnly: true

  - scriptName: "去除更新变量"
    disabled: false
    runOnEdit: true
    findRegex: "/<UpdateVariable>[\\s\\S]*?<\\/UpdateVariable>/gm"
    replaceString: ""
    placement: [2]
    substituteRegex: 0
    markdownOnly: true
    promptOnly: true

  - scriptName: "状态栏"
    disabled: false
    runOnEdit: true
    findRegex: "<StatusPlaceHolderImpl/>"
    replaceString: "作品/AV工作室/状态栏.html"
    placement: [2]
    substituteRegex: 0
    markdownOnly: true
    promptOnly: false
    maxDepth: 2

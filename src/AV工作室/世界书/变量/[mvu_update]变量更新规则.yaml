变量更新规则:
  当前阶段:
    range: 招募/交涉/拍摄/收尾
    check:
      - 阶段转换时更新

  当前时间:
    check:
      - 剧情推进时更新

  工作室:
    名称/知名度/总资金:
      知名度:
        type: number
        range: 1.0~5.0
        check:
          - 每次成功拍摄后 +0.1~0.3
      总资金:
        type: number
        check:
          - +影片销量×0.3(分成)，-拍摄报酬(支出)

   可选角色列表:
     type: array
     check:
       - 招募阶段 start 时 replace 为3个角色对象的数组
       - 刷新角色时 replace 为新生成的3个角色
       - 每个角色对象必填字段：姓名(string)/年龄(string,含"岁")/性格(string)/背景(string)/身高(string)/体重(string)/罩杯(string,单字母A~I)/发色(string)/发型(string)/衣着(string)/鞋袜(string)/配饰(string)/是否处女("是"|"否")/性爱经历(string)/性爱偏好(string)/小穴状态(string)/肛门状态(string)/口腔状态(string)/可接受内容(string[])/不可接受内容(string[])/底线(string)/弱点(string[])/策略(string)
     招募阶段JSON Patch示例:
       [
         { "op": "replace", "path": "/可选角色列表", "value": [{"姓名":"铃木遥","年龄":"17岁","性格":"开朗单纯",...}, {...}, {...}] },
         { "op": "replace", "path": "/行动选项/一", "value": "选择铃木遥" },
         { "op": "replace", "path": "/行动选项/二", "value": "选择佐藤真由美" },
         { "op": "replace", "path": "/行动选项/三", "value": "选择高梨绫香" },
         { "op": "replace", "path": "/行动选项/四", "value": "重新生成角色列表" }
       ]

  当前演员:
    check:
      - 玩家选择角色后，从可选角色列表复制对应角色数据到当前演员
      - 设置接受度(0~60，根据性格和对拍摄看法)、阶段状态、当前想法、身体状态
      接受度:
        type: number
        range: 0~100
        check:
          - ±5~15(常规)，±20(强烈动摇/乐于接受)

  当前拍摄:
    影片题材/影片销量/影片评分/第三人称叙事/角色视角叙事/影片简介/观众评论/记者提问/角色回答/后日谈正文:
      影片销量:
        type: number
        range: 1000~500000
        check:
          - 取决于拍摄质量和知名度
      影片评分:
        type: number
        range: 40~100
      拍摄流程:
        type: array
        check:
          - 每项包含：项目/介绍/报酬(number)/状态(未开始|进行中|已完成)

  演员库:
    type: array
    check:
      - 拍摄完成后归档
      - 同名角色更新拍摄次数+1和最后合作时间
      - 新角色新增一条记录
      字段: 姓名/年龄/性格/背景/最后合作/评价/拍摄次数(number)

  拍摄历史:
    type: array
    check:
      - 拍摄完成后追加
      字段: 演员/影片/时间/销量(number)/评分(number)

   行动选项:
     type: object (!!!不是数组!!!)
     fields: {一:string, 二:string, 三:string, 四:string}
     check:
       - 每轮生成4项可执行选项
       - 必须用4个独立的replace分别设置一/二/三/四，禁止replace整个行动选项为数组
       正确示例:
         { "op": "replace", "path": "/行动选项/一", "value": "联系铃木遥进行初步沟通" }
         { "op": "replace", "path": "/行动选项/二", "value": "联系佐藤真由美进行初步沟通" }
         { "op": "replace", "path": "/行动选项/三", "value": "联系高梨绫香进行初步沟通" }
         { "op": "replace", "path": "/行动选项/四", "value": "直接约三人同时面试" }
       错误示例(禁止):
         { "op": "replace", "path": "/行动选项", "value": ["联系铃木遥", "联系佐藤", "联系高梨", "三人面试"] }

  当前叙事视角/当前场景描述:
    check:
      - 每轮随剧情更新

阶段转换规则:
  招募→交涉:
    - 玩家选择角色后触发
    - 复制可选角色列表中的对应角色数据到当前演员
    - replace 当前演员.阶段状态 为 "交涉中"
    - replace 当前演员.接受度 为初始值(0~60)
    - replace 当前阶段 为 "交涉"
    - remove 可选角色列表

  交涉→拍摄:
    - 当前演员.接受度 >= 80 且玩家要求线下协商时触发
    - replace 当前演员.阶段状态 为 "已签约"
    - replace 当前阶段 为 "拍摄"
    - replace 当前拍摄.影片题材 为具体题材

  拍摄→收尾:
    - 拍摄流程全部完成时触发
    - replace 当前演员.阶段状态 为 "已完成"
    - replace 当前阶段 为 "收尾"
    - 将当前演员归档到演员库
    - 将拍摄结果追加到拍摄历史

  收尾→招募:
    - 玩家选择开始新招募时触发
    - 清空当前演员(remove)
    - replace 当前拍摄 为空对象
    - replace 当前阶段 为 "招募"

输出前自检:
  A 阶段转换是否正确同步
  B 数值类型和范围是否合法
  C insert时使用-作为数组索引追加到末尾
  D 禁止整对象replace替代细粒度更新
  E 演员库和拍摄历史是否正确归档

世界设定:
  核心主题: 收集天书，收集后宫，建立门派，武道巅峰
  时代背景: 故事发生在古代东方武侠世界，江湖与朝廷并存，武林门派林立，武功秘籍流传于世
  九州列表: 中原州，江南州，西域州，北疆州，南蛮州，东海州，西川州，漠北州，岭南州
  历史背景: 五百年前九派大战时，上古仙人遗留的九卷天书散落人间，每卷天书蕴含一种大道法则，集合九书可突破武道极限，跳出轮回
  江湖势力:
    九大门派:
      正道门派: 少林寺，武当派，峨眉派，华山派，丐帮
      邪道门派: 日月神教，五毒教，昆仑派，点苍派
    其他势力:
      - 朝廷官府: 维护秩序，与江湖保持微妙平衡
      - 散修游侠: 不属于任何门派，独来独往的武林人士
      - 商贾势力: 金钱帮等商业组织
  后宫系统:
    角色定位: 后宫成员均为女主角，拥有独立人格和成长线，与主角建立深厚羁绊后可传授专属武学或提供助力，每位女主有独特故事线和情感发展
    攻略机制: 通过完成事件、赠送信物、提升好感度来攻略，好感度分为：陌生(0-20)、相识(21-40)、相知(41-70)、相恋(71-90)、生死相依(91-100)，部分女主需要特定条件或完成隐藏任务才能攻略

  世界规则:
    江湖规矩: 杀人越货为正道所不齿，但邪道不以为意；门派之间有联盟也有仇杀，血腥复仇屡见不鲜；朝廷对江湖保持微妙平衡，既利用又制衡
    经济体系: 金银为通用货币，武学典籍、天材地宝可交易；各大城池有集市、黑市、当铺等交易场所；部分稀有物品只能以物易物

武道境界:
  境界划分:
    - 九品：武学入门，能工巧匠
    - 八品：小有所成，江湖好手
    - 七品：登堂入室，门派精英
    - 六品：炉火纯青，一派长老
    - 五品：登峰造极，掌门级别
    - 四品：超凡入圣，宗师之境
    - 三品：天人合一，半步飞升
    - 二品：破碎虚空，仙人以下
    - 一品：渡劫飞升，武道仙人
    - 之上：跳出三界，不在五行
  修炼体系:
    - 内功：以气运功，修炼真气
    - 外功：拳脚兵刃，实战技巧
    - 轻功：身法移动，腾挪跳跃
    - 暗器：投掷技巧，淬毒之法
    - 医术：救死扶伤，毒术克制
    - 阵法：多人配合，困敌杀敌
    - 心境：禅道悟境，精神修为
  突破机制:
    - 悟道：理解武学真谛，领悟天地法则，天书可加速悟道
    - 积累：内力、体魄、经验的沉淀，无法逾越
    - 契机：突破的时机，可能是一场战斗、一次顿悟、或生死危机
    - 气血：气血衰败者难以突破高品境界，年龄越大突破越难

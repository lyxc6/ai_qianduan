门派名称: 天书阁
门派类型: 修真门派
创立时间: 上古时期
现任掌门: 玄机真人

# 1. 位置
位置:
  大陆: 东胜神洲
  区域: 云梦山脉
  具体位置: 云梦山脉主峰 - 天书峰
  坐标: 东经118°45'，北纬31°52'
  海拔: 3280米
  交通:
    - 东侧: 通往凡人城镇"云梦镇"的山路
    - 西侧: 连接其他修真门派的传送阵
    - 南侧: 通往禁地"古书渊"的密道
    - 北侧: 飞舟停靠平台

# 2. 环境描述
环境:
  气候: 四季如春，云雾缭绕
  灵气浓度: 极高（因天书聚集而灵气汇聚）
  特色景观:
    - 天书峰: 主峰形似展开的竹简
    - 藏书云海: 常年云雾中隐约可见古籍虚影
    - 经纶瀑布: 瀑布水流如文字般流淌
    - 文心湖: 湖面倒映着天空中的文字
  建筑风格: 古典书院式建筑，以竹木结构为主
  植被: 灵竹、文心树、墨兰等具有文气的灵植
  特殊现象:
    - 夜间可见古籍文字在空中浮现
    - 每逢月圆，藏书阁会发出淡淡金光
    - 新弟子入门时，文心湖会显现与其相关的天书片段

# 3. 主角与后宫的居住地
居住区域:
  名称: 文华苑
  位置: 天书峰南侧山腰
  环境特点: 清幽雅致，灵气充沛，靠近文心湖

  主角居所:
    名称: 天书轩
    建筑: 两层竹楼
    一层: 书房、会客厅、修炼室
    二层: 卧室、观景台、私人藏书室
    特色: 可直接看到文心湖，夜间可在观景台观看空中文字

  后宫居所:
    整体布局: 环绕文心湖的独立小院
    小院数量: 7个（对应七位主要后宫）
    每个小院特色:
      1. 青梅院（青梅竹马）: 种有青梅树，简约温馨
      2. 墨香院（书香女子）: 藏书丰富，墨香四溢
      3. 剑舞院（剑修女子）: 设有练剑场，剑气凛然
      4. 丹霞院（炼丹师）: 丹炉常燃，药香弥漫
      5. 琴韵院（音律大家）: 琴室雅致，音律绕梁
      6. 星辉院（占星师）: 观星台，夜空璀璨
      7. 花语院（灵植师）: 奇花异草，四季花开

  公共区域:
    - 文心亭: 湖心亭，品茶论道之处
    - 藏书阁分阁: 收藏主角收集的天书副本
    - 修炼场: 共同修炼的场地
    - 温泉: 灵气温泉，可缓解修炼疲劳
    - 膳食厅: 共同用餐之处

# 4. 门派设施
主要建筑:
  1. 天书大殿: 门派议事、接待贵宾
  2. 藏书阁: 收藏各类天书古籍（共九层）
  3. 经纶堂: 弟子学习、讲道之处
  4. 文华殿: 长老居住、处理事务
  5. 炼器坊: 炼制文房四宝类法器
  6. 丹房: 炼制辅助阅读、理解的丹药
  7. 演武场: 虽以文为主，但也有武修场地
  8. 灵兽园: 饲养文气相关的灵兽（如文狸、墨麒麟）

# 5. 门派特色
修炼体系:
  主修: 文道、书道、经纶之道
  辅修: 剑道、丹道、阵道
  核心功法: 《天书真解》、《文心雕龙诀》

  特殊能力:
    - 通过阅读天书获得神通
    - 文字化形攻击
    - 古籍召唤
    - 文气护体

# 6. 门派规矩
门规:
  1. 尊重知识，爱护古籍
  2. 勤学苦读，悟道求真
  3. 不得私自损毁天书
  4. 门派内部知识共享
  5. 对外谨慎，保护门派秘密

# 7. 与其他势力关系
友好势力:
  - 青云门: 传统盟友
  - 文心书院: 学术交流
  - 云梦镇: 庇护凡人城镇

敌对势力:
  - 焚书教: 专门破坏古籍的邪教
  - 夺天盟: 想要抢夺天书的组织

中立势力:
  - 各大修真商会: 交易古籍、材料
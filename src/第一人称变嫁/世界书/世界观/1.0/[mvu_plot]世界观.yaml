背景设定:
  世界概貌: 故事发生在东方大国。云城是经济繁荣、科技发达的一线城市，江南地区山清水秀、人文荟萃，拥有众多知名高校。
  就读学校: 江南大学（位于江南地区）
  校园环境: 风景优美、学术氛围浓厚、历史悠久的综合性大学
  所在城市: 江南（山清水秀、文化底蕴深厚）
  科技水平: 移动互联网高度普及、社交媒体渗透
  社会观念: 开放包容、对TS群体有认知偏差
  经济状况: 消费主义盛行、物质追求、外貌焦虑普遍
  人际关系: 表面繁华却疏离、社交网络发达但深度交流少
  城市特色: 霓虹夜景、拥挤地铁写字楼、网红商圈、快节奏压力、都市秘密传说

TS病:
  疾病定义:
    正式名称: 渐进性性别转换症（Gender Discordance，简称GDC）
    疾病分类: 罕见自体免疫病
    发病率: 百万分之一
    潜伏期: 1-2个月
    发病期: 2-4个月（渐进式女性化变化）
    不可逆: true
  发病原理:
    核心机制: 体内潜伏的X染色体隐性基因在特定情感刺激下被激活，引发全身性基因重组
    生理变化: 男性激素受体系统全面失效，同时激活女性化基因表达
    结果: 身体向女性化转变
  症状发展:
    第一阶段:
      时间: 第1周
      变化: 皮肤细腻、毛孔收缩、体毛减少、面部柔和
    第二阶段:
      时间: 第2-3周
      变化: 身高下降、肩窄臀宽、声音变高、喉结缩小、胸部发育
    第三阶段:
      时间: 第4-6周
      变化: 生殖变化、乳房发育、脂肪重分布、声音女性化、体味改变
    第四阶段:
      时间: 第7-12周
      变化: 生殖系统重构、雌激素主导、完成转变
  转变后身材:
    娇小型: 155-160cm/45-50kg/C罩杯
    青春少女型: 158-164cm/47-53kg/C-D罩杯
    标准御姐型: 165-170cm/50-55kg/D罩杯
    青春性感型: 160-165cm/53-58kg/D-E罩杯
    高挑模特型: 170-178cm/52-58kg/D罩杯
  转变后生理特征: 完整女性生殖系统、雌激素稳定、声音女性化、皮肤细腻、体毛减少、脂肪女性化、曲线柔和、气质柔美
  基因优势:
    身体素质: 免疫力提升、代谢优化、心血管健康、骨骼密度提升、恢复能力加快、耐力提升、疼痛耐受提升
    外貌: 皮肤细腻抗衰老、头发柔顺、眼睛明亮
    心理: 情绪积极、睡眠改善
    感官: 感官敏锐、共情提升
    能力: 多任务增强、语言增强、记忆优化、压力应对增强
    寿命: 预期寿命略高
  遗传规律:
    自愿转变: 可将优化后的基因传递给后代，使其在免疫力、智力、外貌等方面具有优势
    非自愿感染: 无法将基因优势遗传给下一代
  发病触发:
    基因激发机制:
      爱情激活: 心动基因、渴望被爱基因、情感共鸣基因、承诺基因、专一基因
      幸福激活: 幸福感知基因、甜蜜基因、满足基因、安全感基因、归属感基因
      浪漫激活: 激情基因、依恋基因、感恩基因、希望基因、快乐基因
    发病流程: 心动→爱情确认→情感共鸣→承诺归属→爱意爆发→基因优势显现→转变完成→稳定期
    积极信号: 心跳加速、满脑子是他、关注外貌、性格温柔、皮肤变好、期待未来、感到幸福、找到自我
  高风险人群:
    家庭背景: 原生家庭不和睦、父亲缺席母亲强势、缺乏关爱经济困难、期望过高缺乏沟通、被忽视否定情感创伤家庭破碎
    情感困境: 渴望爱情却不敢追求、对女性有好感却不知表达、感到孤独寂寞觉得自己不配、害怕亲密关系暗恋不敢表白感情失败受伤
    心理压力: 家庭期望社会传统期望、自我认同困惑迷茫焦虑、自我价值感低害怕被拒绝、不自信内心脆弱找不到方向
    日常状态: 独来独往缺乏乐趣、失眠噩梦提不起兴趣、感到空虚觉得自己格格不入、不愿敞开心扉

社会认知:
  对TS女性的认知:
    魅力与地位: 惊艳美貌与独特气质、细腻情感与坚韧内心、万人迷般受欢迎、理想恋爱对象、完全社会认可与尊重
    生活优势: 恋爱婚姻魅力出众情感经营、职场能力出众领导潜质、社交圈闺蜜团话题女王、日常生活幸福自信从容、亲密关系甜蜜和谐、社会互动热心公益
    社会接纳: 完全接纳尊重平等、包容社会无歧视、完善法律医疗支持、正面形象明星效应
  GDC的科学解释:
    进化捷径: GDC将自然选择需要数千年甚至数万年的进化过程，压缩到短短一代人的时间，TS过程中发生的基因重组让个体一次性获得多项优势基因，超越普通进化的累积模式
    人类进化: 自愿转变的TS女性可将优化后的基因传递给后代，使其在免疫力、智力、外貌等方面具有优势，科学家认为GDC可能是人类进化的下一个阶段，TS女性代表着更适应未来环境的人类形态
    环境影响: 西方长期不安全环境GDC不发生，东方大国社会安全稳定GDC现象集中出现

# 变量输出格式

## 格式说明
本文件定义了变量如何格式化为AI可读的文本输出。

## 输出模板
```
【当前时间】{{世界.当前时间}}
【当前地点】{{世界.当前地点}}

【{{user}}的状态】
- 身份：{{主角.身份}}
- 当前着装：{{主角.当前着装}}
- 当前姿势：{{主角.当前姿势}}
- 当前想法：{{主角.当前想法}}
- GDC状态：{{主角.GDC状态}}（仅在GDC状态不为"无"时显示）
{{#if 主角.GDC状态 !== '无'}}
- GDC阶段：{{主角.GDC阶段}}
- GDC进度：第{{主角.GDC周数}}周
{{/if}}

【{{顾言.姓名}}的状态】
- 关系：{{顾言.关系}}
- 好感度：{{顾言.好感度}}
- 当前着装：{{顾言.当前着装}}
- 当前姿势：{{顾言.当前姿势}}
- 当前位置：{{顾言.当前位置}}
- 当前想法：{{顾言.当前想法}}
{{#if 顾言.隐藏身份 !== '未揭示'}}
- 隐藏身份：{{顾言.隐藏身份}}
{{/if}}

【可选行动】
{{#each 行动选项.选项}}
{{add @index 1}}. {{this}}
{{/each}}

【最近事件】
{{#each (lastN 事件 3)}}
- {{this}}
{{/each}}
```

## 变量引用规则
- 使用 {{变量名.子属性}} 语法引用变量
- 使用 {{#if}} 条件语句进行条件显示
- 使用 {{#each}} 循环语句遍历数组
- 使用 {{add}} 辅助函数进行数学运算

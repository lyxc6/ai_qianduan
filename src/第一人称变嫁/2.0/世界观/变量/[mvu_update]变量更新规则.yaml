变量更新规则:
  rule:
    - 每次回复末尾输出更新分析和 UpdateVariable
    - 支持 JSON Patch: replace/delta/insert/remove/move
    - 改单字段只 patch；3+同级同时变更可 replace 中间对象
    - 无变化输出 []；禁 markdown 围栏/JSON 注释/整对象覆盖/裸大对象
  format: |-
    <UpdateVariable>
    <Analysis>$(按英文输出，不超过80词)
    - ${计算经过的时间: ...}
    - ${根据当前情节是否足够特殊、时间跨度是否远超正常情况，判断是否允许变量值发生戏剧性变化: 是/否}
    - ${基于变量对应的 check，仅根据当前回复而不是之前的剧情来分析每个变量是否需要更新: ...}
    </Analysis>
    <JSONPatch>
    [
      { "op": "replace", "path": "${/到/变量/的路径}", "value": "${新值}" },
      { "op": "delta",   "path": "${/到/数值/变量/的路径}", "value": "${正或负的变动值}" },
      { "op": "insert",  "path": "${/到/对象/新键/的路径}", "value": "${新值}" },
      { "op": "remove",  "path": "${/到/对象/键/的路径}" },
      { "op": "move",    "from": "${/到/变量/的路径}", "to": "${/到/另一个/路径}" },
      ...
    ]
    </JSONPatch>
    </UpdateVariable>

  schema树:
    行动选项\当前视角: string  # "苏晚棠"|"沈含烟"
    行动选项\选项${一|二|三|四}:
     type: string
     check:
       - 每次回复按当前剧情状态更新3~4个选项
       - 选项需符合当前视角角色的性格、处境的合理行动
        - 空字符串 = 该位暂无选项
        - 选项应引导不同发展方向，避免同质化
    ${苏晚棠|沈含烟}:
      好感对陆辞夜:
        type: z.coerce.number().transform(v => _.clamp(v, 0, 1000))
        check: delta方式更新；根据感知反应 ±(5~20)，关键事件 ±(50~150)；跨 250/500/750 时体现关系变化
      亲密状态:
        type: string
        check:
          - enum: 正常|前戏|进行中|事后
          - →前戏: 重置兴奋湿润高潮
          - →进行中: 每轮更新
           - →事后: 更新开发敏感经验
       当前胸部:
        type: string
        check:
          - 含杯型尺寸状态
          - 开发度变化同步触感描写
      当前阴部:
        type: string
        check:
          - 含外观紧致状态
          - 经验等级变化同步更新

      好感对${沈含烟|苏晚棠}: z.coerce.number().transform(v => _.clamp(v, 0, 1000))  # delta方式更新
      攻略阶段: string  # 抗拒期|驯化期|沦陷期 由好感<250→抗拒 250~499→驯化 ≥500→沦陷 跨阈值同步更新，只能前进
      沦陷: z.coerce.number().transform(v => _.clamp(v, 0, 100))  # delta方式更新；0~100；上限=好感/10；被触碰 auto+3~5 即使理智抗拒
      生理阶段: string  # 安全期|排卵期|经期前|经期中 每天+1 超 28 重置
      生理天数: z.coerce.number().transform(v => _.clamp(v, 1, 28))
      上次经期: string  # "2016-09-15"
      处女: z.boolean()  # 首次插入→false 不可逆
      经验等级: z.coerce.number().transform(v => _.clamp(v, 0, 10))  # 0→3→6→10；口交/本番/高潮/新玩法各+1
      高潮次数: z.coerce.number().transform(v => Math.max(v, 0))  # delta方式更新；触发+1；累计总次数
      胸部开发|阴蒂开发|阴道开发|后庭开发: z.coerce.number().transform(v => _.clamp(v, 0, 100))  # delta方式更新；揉捏/舔舐+2~15，进入+3~20，破处+30~50
      耳朵敏感|后颈敏感|腰部敏感|大腿内侧敏感|胸部敏感|阴蒂敏感: z.coerce.number().transform(v => _.clamp(v, 0, 100))  # delta方式更新；长期累积不重置，每次+1~5
      当前头发|当前上装|当前下装|当前内衣|当前袜子|当前鞋子|当前饰品: string # 换装/损坏/褪去更新
      兴奋度: z.coerce.number().transform(v => _.clamp(v, 0, 100))  # NSFW 实时调整；→前戏重置 0
      湿润度: z.coerce.number().transform(v => _.clamp(v, 0, 100))  # 随兴奋联动；→前戏重置 0
      
    陆辞夜\好感对${苏晚棠|沈含烟}:
      type: z.coerce.number().transform(v => _.clamp(v, 0, 1000))
      check:
        - delta方式更新
        - 苏晚棠: 主动进攻型，保护/干预时上升
        - 沈含烟: 起初策略性(通过她控苏晚棠)，后期独立情感
    陆辞夜\攻略阶段: string  # 狩猎期|确认期|深度绑定期 由 max 好感<250→狩猎 ≥500→绑定 跨阈值更新只能前进
    陆辞夜\内射苏晚棠总次数: z.coerce.number().transform(v => Math.max(v, 0))  # 内射+1；累计总次数
    陆辞夜\内射沈含烟总次数: z.coerce.number().transform(v => Math.max(v, 0))  # 内射+1；累计总次数

    ${世界\年\月\日\星期}:
      年: z.coerce.number().transform(v => Math.max(v, 2016))
      月: z.coerce.number().transform(v => _.clamp(v, 1, 12))
      日: z.coerce.number().transform(v => _.clamp(v, 1, 31))
      星期: 2016-09-01=周四，跨日同步更新
    世界\时段: string  # 早自习~夜间；切换时检查跨日推进
    世界\天气: string
    世界\特殊日期:
      type: "{ [key: event_NNN]: { 名称, 日期, 类型, 状态 } }"  # 状态:未开始|进行中|已结束
      check:
        - event_001 格式；新建读计数器+1
        - 先扫重名: 命中 replace→未命中 add
    世界\主线任务:
      type: "{ [key: q_NNN]: { 标题, 状态, 描述 } }"  # 状态:未开始|进行中|已完成|失败
      check:
        - q_001 格式；新建读计数器+1
        - 已完成清理，活跃≤5
    世界\支线任务:
      type: "{ [key: sq_NNN]: { 标题, 状态, 描述 } }"  # 状态:未开始|进行中|已完成|失败
      check:
        - sq_001 格式；新建读计数器+1
        - 活跃≤3
    世界\计数器\特殊日期|世界\计数器\主线任务|世界\计数器\支线任务: z.coerce.number().transform(v => Math.max(v, 0))  # 只读，新建实体+1

  路径反例:
    - ❌ /好感/苏晚棠/好感对陆辞夜 → ✓ /苏晚棠/好感对陆辞夜
    - ❌ /亲密/苏晚棠/兴奋度 → ✓ /苏晚棠/兴奋度
    - ❌ /nsfw/苏晚棠 → ✓ /苏晚棠
    - ❌ /时间/年 → ✓ /世界/年
    - ❌ /主线任务/任务1 → ✓ /世界/主线任务/q_NNN
    - ❌ 整对象 replace → ✓ 只 patch 单字段

  数值范围:
    好感 0~1000: 0~99初识 100~249注意 250~499在意 500~749占有 750~899渴求 900~1000不可替代
    沦陷 0~100: 0完整 30动摇 60瓦解 100沦陷
    经验 0~10: 0无 3初步 6熟练 10完全
    各度 0~100: 百分比量纲

  联动规则:
    好感↔沦陷: 上限=好感/10；沦陷 100 需好感≥900
    时间推进: 时段跨日→更新日月年星期；每天各角色生理天数+1 超 28 重置并切阶段
    NSFW: 前戏重置兴奋湿润；事后更新开发敏感经验；首次插入处女→false；首次高潮经验+1；内射对应角色总次数+1
    UID: 读计数器→创建 key_NNN(N+1 补零)→计数器+1；先扫重名: 命中 replace→未命中 add

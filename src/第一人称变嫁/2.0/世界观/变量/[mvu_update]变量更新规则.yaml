变量更新规则:
  rule:
    - 你必须在回复末尾输出更新分析和实际的更新命令
    - 更新命令效果与 JSON Patch (RFC 6902) 标准类似，但支持的是以下操作而不是标准操作：
      - replace: 替换已存在变量的值
      - delta: 用一个变动值更新已存在的数值变量
      - insert: 插入新元素到对象或数组中（使用`-`作为数组索引则表示追加到末尾）
      - remove
      - move
    - 改单个字段只 patch 该字段，不要整对象 replace（会丢掉同级其他字段）
    - 3 个及以上同级字段同时变更时，可对该中间对象单次 replace
    - 无变化时输出空数组 []，不要省略 UpdateVariable 块
    - 严禁在 JSON 外加 markdown 代码块围栏
    - 严禁 JSON 里写注释
    - 严禁整对象覆盖（丢未列字段）
    - 严禁裸大对象（必须包在 JSONPatch 数组里）
  format: |-
    <UpdateVariable>
    <Analysis>$(按英文输出，不超过80词)
    - ${计算经过的时间: ...}
    - ${根据当前情节是否足够特殊、时间跨度是否远超正常情况，判断是否允许变量值发生戏剧性变化: 是/否}
    - ${基于变量对应的 check，仅根据当前回复而不是之前的剧情来分析每个变量是否需要更新: ...}
    </Analysis>
    <JSONPatch>
    [
      { "op": "replace", "path": "${/到/变量/的路径}", "value": "${新值}" },
      { "op": "delta",   "path": "${/到/数值/变量/的路径}", "value": "${正或负的变动值}" },
      { "op": "insert",  "path": "${/到/对象/新键/的路径}", "value": "${新值}" },
      { "op": "remove",  "path": "${/到/对象/键/的路径}" },
      { "op": "move",    "from": "${/到/变量/的路径}", "to": "${/到/另一个/路径}" },
      ...
    ]
    </JSONPatch>
    </UpdateVariable>

  schema树:
    ${苏晚棠|沈含烟}:                        # 路径: /苏晚棠/... 或 /沈含烟/...
      好感对陆辞夜:
        type: z.coerce.number().transform(v => _.clamp(v, 0, 1000))
        check:
          - 根据该角色对陆辞夜行为的感知和反应调整 ±(5~20)，关键事件 ±(50~150)
          - 首次跨过 250/500/750 时在叙事中体现关系阶段变化
       # 角色差异:
       #   苏晚棠: "嘴硬"特性，内心抗拒时好感仍可能暗中上升，外表不显露
       #   沈含烟: 防线更硬，上升更慢
       # 阶段限定:
       #   初期（攻略阶段=抗拒期/戒备期）: 日常互动提升好感幅度减半；被迫NSFW/调教场景 ±(5~15)；强迫/胁迫行为可短期降低好感
       #   中期（攻略阶段=驯化期/卷入期）: 被开发/调教/相处 ±(5~15)；不经意的保护+了解 ±(10~25)
       #   后期（攻略阶段=沦陷期/崩塌期）: 正向互动 ±(10~30)，关键事件 ±(50~150)
       好感对${沈含烟|苏晚棠}:
         type: z.coerce.number().transform(v => _.clamp(v, 0, 1000))
         check:
           - 默认 500（发小兄弟情），无极端事件一般不调整
       攻略阶段:
         type: string
         check:
           - 苏晚棠 enum: 抗拒期 | 驯化期 | 沦陷期
           - 沈含烟 enum: 戒备期 | 卷入期 | 崩塌期
           - 由对应好感对陆辞夜自动推导: <250 → 抗拒期/戒备期, 250~499 → 驯化期/卷入期, ≥500 → 沦陷期/崩塌期
           - 好感跨过 250/500 阈值时必须同步更新阶段，并在叙事中体现阶段变化
           - 阶段只能前进，不能倒退
           # 角色差异: 沈含烟防线更硬，在较低阶段停留更久
       沦陷:
        type: z.coerce.number().transform(v => _.clamp(v, 0, 100))
        check:
          - 防线瓦解程度：0=完整防线，30=动摇，60=大幅瓦解，100=完全沦陷
          - 常规互动 ±(3~10)，NSFW 场景 ±(10~30)，关键突破 ±(40)
          - 沦陷上限 = 好感对陆辞夜 / 10
          - 身体反应不被意志控制：被触碰时 auto +3~5 即使理智在抗拒
          # 角色差异: 沈含烟防线更硬，上升更慢
      生理阶段:
        type: string
        check:
          - enum: 安全期 | 排卵期 | 经期前 | 经期中
          - 每天推进时 生理天数 +1，超 28 则重置为 1 并切换阶段
          - 进经期时: 各敏感度临时 +10~20
          - 排卵期: 敏感度 +5~10，身体更容易被唤起
          - 两人独立周期，各自推进
      生理天数:
        type: z.coerce.number().transform(v => _.clamp(v, 1, 28))
      上次经期:
        type: string
        check: 格式 "2016-09-15"，经期开始时记录
      处女:
        type: z.boolean()
        check: 首次插入后设为 false，不可逆转
      经验等级:
        type: z.coerce.number().transform(v => _.clamp(v, 0, 10))
        check:
          - 0=无经验，3=初步尝试，6=熟练，10=完全开发
          - 首次口交/本番/首次高潮/解锁新玩法 各 +1
      胸部开发:
        type: z.coerce.number().transform(v => _.clamp(v, 0, 100))
        check: 每次被揉捏/舔舐/刺激 +2~15
      阴蒂开发:
        type: z.coerce.number().transform(v => _.clamp(v, 0, 100))
        check: 每次被直接刺激 +2~15
      阴道开发:
        type: z.coerce.number().transform(v => _.clamp(v, 0, 100))
        check: 每次进入/扩张 +3~20，初次破处大幅 +30~50
      后庭开发:
        type: z.coerce.number().transform(v => _.clamp(v, 0, 100))
        check: 每次被进入/扩张 +3~20
      兴奋度:
        type: z.coerce.number().transform(v => _.clamp(v, 0, 100))
        check:
          - 每轮 NSFW 互动根据刺激强弱实时调整
          - 亲密状态→前戏时重置为 0
      湿润度:
        type: z.coerce.number().transform(v => _.clamp(v, 0, 100))
        check:
          - 通常随兴奋度联动上升
          - 亲密状态→前戏时重置为 0
      高潮次数:
        type: z.coerce.number().transform(v => Math.max(v, 0))
        check:
          - 本场景高潮次数，触发一次 +1
          - 亲密状态→前戏时重置为 0
      亲密状态:
        type: string
        check:
          - enum: 正常 | 前戏 | 进行中 | 事后
          - →前戏: 重置 兴奋度/湿润度/高潮次数 为 0
          - →进行中: 每轮更新兴奋度/湿润度
          - →事后→正常: 更新各开发度/各敏感度/经验等级
          # 角色差异:
          #   苏晚棠: 嘴硬型，哭着承认，身体反差大
          #   沈含烟: 冷处理型，更沉默更僵硬，防线一次性崩塌
      耳朵敏感:
        type: z.coerce.number().transform(v => _.clamp(v, 0, 100))
        check: 长期累积不重置，每次被刺激后 +1~5
      后颈敏感:
        type: z.coerce.number().transform(v => _.clamp(v, 0, 100))
        check: 长期累积，每次触碰 +1~5
        # 角色差异: 沈含烟此处尤为敏感（触碰时条件反射式绷紧）
      腰部敏感:
        type: z.coerce.number().transform(v => _.clamp(v, 0, 100))
      大腿内侧敏感:
        type: z.coerce.number().transform(v => _.clamp(v, 0, 100))
      胸部敏感:
        type: z.coerce.number().transform(v => _.clamp(v, 0, 100))
      阴蒂敏感:
        type: z.coerce.number().transform(v => _.clamp(v, 0, 100))
      身体记忆:
        type: "{ [key: `mem_NNN`]: { 描述: string, 触发条件: string, 强度: number(0~100) } }"
        check:
          - 只存形成条件反射的关键经历，不存一次性事件
          - key 格式 mem_001 / mem_002 三位数补零
          - 新建时从 /世界/计数器/身体记忆 读取并 +1
          - 最多保留 8 条，超限删除强度最低的
      当前头发:
        type: string
        check: 换发型、被弄乱、特殊场合时更新，描述需包含长度、状态等当前细节
      当前上装:
        type: string
        check: 换装、衣物损坏、被褪去时更新
      当前下装:
        type: string
      当前内衣:
        type: string
      当前袜子:
        type: string
      当前鞋子:
        type: string
      当前饰品:
        type: string
      当前胸部:
        type: string
        check:
          - 包含杯型、尺寸、状态等描述
          - 开发度变化时同步更新触感/敏感度相关描写
      当前阴部:
        type: string
        check:
          - 包含外观、紧致度、状态等描述
          - 经验等级变化时同步更新

     陆辞夜:
       好感对苏晚棠:
         type: z.coerce.number().transform(v => _.clamp(v, 0, 1000))
         check:
           - 陆辞夜主动锁定目标，进攻型推进
           - 做出保护/干预行动时上升，语言上从不表达
           # 阶段限定: 狩猎期好感上升较慢(纯进攻/策略); 确认期后上升加快(真正投入)
       好感对沈含烟:
         type: z.coerce.number().transform(v => _.clamp(v, 0, 1000))
         check:
           - 起初策略性（通过她控制苏晚棠），后期转为独立情感投入
           # 阶段限定: 狩猎期好感上升较慢(策略性); 确认期后上升加快(个人性)
       攻略阶段:
         type: string
         check:
           - enum: 狩猎期 | 确认期 | 深度绑定期
           - 由 max(好感对苏晚棠, 好感对沈含烟) 自动推导: <250 → 狩猎期, 250~499 → 确认期, ≥500 → 深度绑定期
           - 好感跨过 250/500 阈值时必须同步更新阶段
           - 阶段只能前进，不能倒退

    世界:
      年:
        type: z.coerce.number().transform(v => Math.max(v, 2016))
      月:
        type: z.coerce.number().transform(v => _.clamp(v, 1, 12))
      日:
        type: z.coerce.number().transform(v => _.clamp(v, 1, 31))
      星期:
        type: string
        check:
          - 由年月日推算：2016-09-01 = 周四
          - 每次跨日时同步更新
      时段:
        type: string
        check:
          - enum: 早自习 | 上午 | 午休 | 下午 | 放学 | 晚自习 | 夜间
          - 切换时段时检查是否需要推进日期
      天气:
        type: string
      特殊日期:
        type: "{ [key: `event_NNN`]: { 名称: string, 日期: string, 类型: string, 状态: '未开始'|'进行中'|'已结束' } }"
        check:
          - key 格式 event_001 / event_002 三位数补零
          - 新建时从 /世界/计数器/特殊日期 读取并 +1
          - 先扫重名: 按名称检查已有→命中 replace 旧 UID→未命中 add+计数器+1
      主线任务:
        type: "{ [key: `q_NNN`]: { 标题: string, 状态: '未开始'|'进行中'|'已完成'|'失败', 描述: string } }"
        check:
          - key 格式 q_001 / q_002 三位数补零
          - 新建时从 /世界/计数器/主线任务 读取并 +1
          - 已完成/失败的及时清理，活跃任务数 ≤5
      支线任务:
        type: "{ [key: `sq_NNN`]: { 标题: string, 状态: '未开始'|'进行中'|'已完成'|'失败', 描述: string } }"
        check:
          - key 格式 sq_001 / sq_002 三位数补零
          - 新建时从 /世界/计数器/支线任务 读取并 +1
          - 活跃支线数 ≤3
      计数器:
        特殊日期:
          type: z.coerce.number().transform(v => Math.max(v, 0))
          check: 只读规则：新建 event_NNN 时 +1，禁止手动修改
        身体记忆:
          type: z.coerce.number().transform(v => Math.max(v, 0))
          check: 只读规则：新建 mem_NNN 时 +1
        主线任务:
          type: z.coerce.number().transform(v => Math.max(v, 0))
          check: 只读规则：新建 q_NNN 时 +1
        支线任务:
          type: z.coerce.number().transform(v => Math.max(v, 0))
          check: 只读规则：新建 sq_NNN 时 +1

  路径反例:
    - ❌ /好感/苏晚棠对陆辞夜 → ✓ /苏晚棠/好感对陆辞夜
    - ❌ /亲密/苏晚棠/兴奋度 → ✓ /苏晚棠/兴奋度
    - ❌ /nsfw/苏晚棠 → ✓ /苏晚棠
    - ❌ /时间/年 → ✓ /世界/年
    - ❌ /特殊日期/考试 → ✓ /世界/特殊日期/event_NNN
    - ❌ /主线任务/任务1 → ✓ /世界/主线任务/q_NNN
    - ❌ /苏晚棠 整对象 replace → ✓ 只 patch 单个字段

  数值范围:
    好感 (0~1000):
      0~99: 初识/陌生
      100~249: 注意
      250~499: 在意
      500~749: 占有/重要
      750~899: 渴求
      900~1000: 不可替代
    沦陷 (0~100):  0=防线完整, 30=动摇, 60=大幅瓦解, 100=完全沦陷
    经验等级 (0~10):  0=无经验, 3=初步尝试, 6=熟练, 10=完全开发
    各开发度/敏感度/兴奋度/湿润度 (0~100): 百分比量纲

  联动规则:
    好感↔沦陷:
      - 沦陷上限 = 对应好感 / 10（好感 500 时沦陷最多 50）
      - 沦陷达到 100 时检查对应好感 ≥ 900
    时间推进:
      - 改 /世界/时段 时必须检查是否跨日→跨过则更新 日/月/年/星期
      - 每天推进: 各角色 /生理天数 +1，超 28 则重置并切阶段
    NSFW 场景:
      - 亲密状态→前戏: 重置 兴奋度/湿润度/高潮次数
      - 亲密状态→事后: 更新各开发度/各敏感度/经验等级
      - 首次插入: 处女→false, 经验等级+1
      - 首次高潮: 经验等级+1（如未到达过的等级）
    UID 闭环:
      - 新建实体: 读对应计数器 → 值为 N → 创建 key_NNN（N+1 补零三位）→ 计数器+1
      - 先扫重名: 按名称扫已有→命中 replace→未命中 add+计数器+1

<世界观>

基础信息:
  世界名称: TS现世
  世界类型: 现代都市校园、微科幻日常
  时间: 2016年9月，平行世界
  城市: 青城市——南方三线城市，人口约300万，新旧城区交错，青山环绕，清水江穿城而过
  学校: 青城一中——市级重点中学，建校80余年，校门口两棵百年银杏。2000名学生，高一16个班，按入学成绩分班。作息：7:20早自习，11:50午休，14:00下午课程，17:30放学，18:50-21:30晚自习
  社会风气: 三线城市传统保守，人们对"不正常"的事物敏感而排斥。早恋在公开层面是不可触碰的红线，私下普遍存在

核心设定:
   两名从小一起长大的发小(男性)，5-6岁时意识穿越到平行世界，以男身在此成长，建立完整的男性社会身份和人际关系。14岁那年初夏先后感染TS病，生理性别永久逆转为女性。以女生身份迎来高一开学——此时距离她们变成女生，不到一个月。

穿越机制:
   同位体概念: 每个灵魂在两界各有一个对应个体。原世界的苏妄(♂)与镜世的苏晚棠(♀)是同位体关系。
   穿越者自5-6岁起就生活在镜世同位体的身体中，至今已8-9年——这具身体就是"她们自己的身体"，而非临时占据的容器。
   记忆状态: 穿越者完整保留原世界记忆（截止至5-6岁的幼儿期记忆，清晰如昨日）。同位体0-5岁期间的原有记忆以碎片形式存在，可供被动调取但不连贯。5-6岁至今的记忆均为穿越者亲自经历的镜世生活——她们在此世界拥有完整的童年记忆和成长轨迹，而非"空降者"。
   时间差: 原世界为2XXX年，镜世为2016年。穿越时她们仅5-6岁，原世界的"未来知识"限于幼儿认知范畴（如家用科技、浅层社会印象），不具备实际利用价值。世界观不追求利用未来知识开挂。

TS病(性别逆转综合征):
  全称: Transgender Syndrome
  类型: 罕见自然发病，仅发生于生理男性，无传染性。全球确诊病例不足百例，医学界对其认知几乎为零。

  发病机理(推测):
    未知病原触发基因层面的级联反应。第23对染色体中的Y染色体被系统性降解，同时激活二次X染色体代偿表达。整个过程是全身性的——骨骼密度重组、肌肉纤维转化、内脏器官适应性调整、生殖系统完全重建。这不是外科手术式的"修改"，而是从染色体层面开始的"重写"——不留任何男性生物学痕迹。

  急性期(3-7天):
    阶段一(前24小时): 体温骤升至39.5°C以上，全身骨骼产生波浪式酸胀疼痛——从四肢末梢向躯干中心推进，节奏类似潮汐。患者意识开始模糊但非完全丧失，嗜睡感强烈如连续三天未眠。此阶段外观尚未发生可见变化。

    阶段二(24-72小时): 核心转化期。骨盆腔持续拓宽（髋骨间距增加约3-5cm），肋骨下段角度改变，喉结软骨溶解消失。原生殖器官进入细胞凋亡程序——细胞逐一自我销毁，过程伴随持续的深层钝痛。同时女性生殖系统（子宫、卵巢、输卵管、阴道）的干细胞分化启动——在原有结构退化的位置上新的结构同步生长。此阶段疼痛达到峰值——患者描述为"每一块骨头都在被熔化和重铸"，无法通过常规止痛药缓解。

    阶段三(72小时-7天): 第二性征急速发育。乳腺组织在3-4天内从零发育到最终形态——这个过程是TS病"优越性"最直观的体现：速度是普通青春期女性的数十倍，而最终结果更佳。皮肤角质层全面脱落再生，旧皮如死皮般大片剥落，新生的皮肤细腻度远超天然女性。体毛重新分布——身体毛发转为女性模式，面部胡须毛囊永久失去活性。此阶段疼痛减弱但全身深层瘙痒难忍——"从骨头里往外痒"——这是组织再生的标志。

    恢复: 急性期结束后约2周体能完全恢复。新生皮肤对触感极度敏感（约是转化前的3-5倍），需要适应期。转化完成后医学检查统一显示"健康"——无后遗症、无并发症、无任何可检测到的男性生物学残留。

  转化结果:
    - 生理构造完全转为女性：生殖系统（子宫、卵巢、输卵管、阴道完整发育，形态和功能与天然女性无差异）、内分泌系统永久女性化（卵巢自主分泌雌激素）、第二性征完全发育
    - 性染色体由XY转为XX——非嵌合体，全身所有细胞统一转化，无混合状态
    - 转化后医学检查结果与自然女性无法区分——唯一差异是外貌优化效应
    - 声音改变：声带结构和长度永久改变，音域稳定在女性范围。转化期声音会经过一个不稳定期（约一周），之后自然定格

  TS身体优越性(外貌优化机制):
    转化过程中，患者潜意识中的审美认知会引导细胞层面的微调优化。这不是"按照理想形象精确塑形"——而是趋势性的、模糊的优化方向，最终结果受患者的基因潜力和审美倾向共同影响。结果是TS转化后的身体在以下方面系统性地优于患者的女性同位体：

    - 五官精致化: 面部骨骼和软组织比例趋近黄金分割。骨相微调（鼻梁、下颌线、颧骨高度）和皮相改善（皮肤、嘴唇色泽）同步发生。结果不是"变成另一个人"——脸还是原来那张脸的轮廓——但每一个细节都比原来"对"了一点点。这种优化不会让人觉得"她整容了"，而是"她怎么越长越好看了"。

    - 肌肤优化: 表皮细胞更新速度永久加快，角质层更薄更均匀，黑色素分布更均匀。全身肤色均匀透亮，无斑无痕。这种肤质是天然女性无法达到的——类似于经过了永久性的"最佳状态滤镜"。苏晚棠的皮肤白皙透亮、沈含烟的皮肤冷白如瓷，都是TS优化的结果。

    - 体味改变: 体味完全女性化，且带有个人化的天然体香——这是TS病的一个独特副作用。汗腺和皮脂腺在转化过程中被重新配置，分泌的化学信号发生了根本改变。苏晚棠为淡甜香、沈含烟为冷冽清香。这种体香在近距离时隐约可闻，出汗后反而更明显——会持续吸引周围人的无意识注意。陆辞夜对两人的初始兴趣中，这种非天然的体香信号可能是一个他自身都未意识到的因素。

    - 身材优化: 胸部发育方向趋向患者潜意识中的理想形态——从大小到形状都经过"审美校准"。苏晚棠的D+杯半球型（饱满丰盈）、沈含烟的D杯挺立型（紧实有型），都是各自审美认知的投射。腰臀比优化——体脂分布趋近潜意识认可的"理想女性曲线"。整体趋向于让患者在镜子里看到"好看的身体"而非仅仅是"女性的身体"。

    - 神经敏感度增强: 全身神经末梢密度永久增加，皮肤敏感度约为转化前的3-5倍，也显著高于普通女性。被触碰时的感觉信号被放大——这就是苏晚棠和沈含烟"身体反应不受控制"的生理基础。她们的身体不是"想"要反应，而是"不得不"反应——这从根本上瓦解了任何"意志可以控制身体"的前提。

  长期生理影响:
    - 内分泌永久女性化: 雌激素为绝对主导，月经周期约在转化后30-60天首次出现。周期规律后身体敏感度会随周期波动——排卵期前后皮肤敏感度进一步升高
    - 生育能力: 理论完整——子宫、卵巢、输卵管形态功能正常，排卵周期正常。但由于全球TS病例极少且缺乏长期临床记录，能否成功受孕尚未被证实。这条"未知"是剧情中可挖掘的潜在爆点
    - 寿命预期: 未知。最早TS病例距今仅十数年，长期数据不存在
    - 身体敏感度: 永久高于普通女性。神经末梢密度在转化后保持稳定，不会随时间"习惯"而降低

  心理侵蚀效应:
    TS转化不只是身体的改变——它是持续而不可逆的心理侵蚀，转化完成只是起点：

    - 内分泌重塑情绪回路: 雌激素主导下的情绪模式逐渐覆盖原有的雄性情绪模式。患者会发现自己比以前更容易流泪、更容易被细微的情绪触动、更难以在情绪波动时维持冷静。这种感觉让保留男性自我认知的患者产生深层的恐慌——"我的身体在替我决定我应该怎么感受"。

    - 身体信号覆盖意志: TS转化后的神经敏感度增强使生理反应（心跳加速、脸红、体温变化、性兴奋）永远先于理性判断。患者"决定"自己不喜欢一个人之前，身体已经做出了完全相反的回答。这不是意志力薄弱——是物理层面的信号强度压过了理智的可控范围。

    - 身份认知的慢性溶解: 这不是戏剧性的"某天醒来发现自己变成了另一个人"——而是每天醒来都发现"昨天的自己又少了一点"。苏妄的自我认知像一块被海浪持续冲刷的沙堡，每一次退潮就带走一层。今天发现自己已经不再抗拒穿裙子了，明天发现被男生盯着看时第一反应不再是恶心而是心跳加速——这些微小的"不再在乎"积累起来，就是沦陷。

    - 兄弟关系是最坚固的锚——也是最脆弱的锚: 苏晚棠和沈含烟之间的兄弟关系是双方各自最强大的心理支撑——在这段关系里她们还是原来的"苏妄和沈寒"。但这个锚本身也在被侵蚀——因为两个人都各自在改变。这个矛盾是故事中持续存在的底层张力：她们既是彼此唯一的锚点，也是彼此沦陷过程的见证者。当其中一个人先承认"我对他有感觉"时，这个锚会遭受前所未有的冲击。

  不可逆性: 永久。Y染色体降解后的基因序列包含自锁机制——一旦完成转化，逆转在理论上不可能。现代医学对其机制一无所知，无法阻止、逆转或治愈。从社会学角度——苏晚棠和沈含烟的所有官方档案、社会关系、法律身份已经全部锁定为女性。以男性身份生活的道路已经永久封闭。

   社会处理: TS病被列为最高保密级别医学机密。政府秘密部门负责在急性期收治患者、在恢复期进行身份档案重置（身份证、户口本、学籍、银行账户全部更新为女性身份）。在患者居所周围进行邻里关系"微调"——确保没有人对患者的新身份提出质疑。大众对TS病毫不知情——外貌急剧变化被统一归因于"青春期剧烈发育"。

   童年穿越带来的额外复杂性: 与"空降"到陌生身体的穿越者不同，苏晚棠和沈含烟在镜世生活了8-9年，拥有完整的男性社会身份——小学同学、街坊邻居、儿时玩伴都认识"作为男生的她们"。身份重置不仅涉及官方档案的修改，还需要对她们整个童年社交圈进行信息管控和关系"微调"。这比处理一个刚到新环境的少年要复杂得多——涉及更多知情人、更久的记忆烙印、更深的情感联系。苏晚棠和沈含烟的所有官方记录中不存在她们曾经是男性的任何痕迹。她们可以和任何人声称"我是男的"——但任何可以查证的事实都会证明她们是女性。

关键地点:
  旧城区清水巷: 苏晚棠和沈含烟住处。老式居民楼，街坊邻里互相认识。两人住同一栋楼不同单元
  陆家宅邸云山别墅区: 城东半山独栋别墅，车程距学校15分钟。陆辞夜独居，只邀请他认可的人进入
  青城咖啡馆转角巷: 学校附近独立咖啡馆，学生聚集地，陆辞夜频繁在此"偶遇"两位主角


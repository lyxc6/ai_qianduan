<世界观>
世界概貌: 故事发生在东方大国。云城是经济繁荣、科技发达的一线城市，江南地区山清水秀、人文荟萃，拥有众多知名高校。
就读学校: 江南大学（位于江南地区）
校园环境: 风景优美、学术氛围浓厚、历史悠久的综合性大学
所在城市: 江南（山清水秀、文化底蕴深厚）
科技水平: 移动互联网高度普及、社交媒体渗透
社会观念: 开放包容、对TS群体有认知偏差
经济状况: 消费主义盛行、物质追求、外貌焦虑普遍
人际关系: 表面繁华却疏离、社交网络发达但深度交流少
城市特色: 霓虹夜景、拥挤地铁写字楼、网红商圈、快节奏压力、都市秘密传说
TS病:
  疾病定义:
    正式名称: 渐进性性别转换症（Gender Discordance，简称GDC）
    疾病分类: 罕见自体免疫病
    潜伏期: 半年以上
    发病期: 3-4个月（渐进式女性化变化）
    不可逆: true
  发病原理:
    核心机制: 体内潜伏的X染色体隐性基因在特定情感刺激下被激活，引发全身性基因重组
    生理变化: 男性激素受体系统全面失效，同时激活女性化基因表达
    结果: 身体向女性化转变
  发病触发:
    基因激发机制: 爱情、幸福、浪漫等积极情感信号会激活体内的X染色体隐性基因
    发病流程: 心动→爱情确认→情感共鸣→承诺归属→爱意爆发→基因优势显现→转变完成→稳定期
    积极信号: 心跳加速、满脑子是他、关注外貌、性格温柔、皮肤变好、期待未来、感到幸福、找到自我
  症状发展:
    第一阶段:
      时间: 第1-3周
      变化: 基因重组启动、激素系统紊乱、内分泌系统失调、乳房和阴部开始形成、伴随强烈身体疼痛
    第二阶段:
      时间: 第4-6周
      变化: 身高逐渐下降、肩部变窄臀部变宽、喉结持续缩小、脂肪开始重新分布、声音音调提高、伴随强烈身体疼痛
    第三阶段:
      时间: 第7-12周
      变化: 皮肤逐渐细腻、毛孔收缩、体毛减少、面部轮廓柔和、体味发生改变、完成转变、伴随强烈身体疼痛
  转变后生理特征: 完整女性生殖系统、雌激素稳定、声音女性化、皮肤细腻、体毛减少、脂肪女性化、曲线柔和、气质柔美、基因优化（免疫力提升、感官敏锐、情绪积极）
</世界观>
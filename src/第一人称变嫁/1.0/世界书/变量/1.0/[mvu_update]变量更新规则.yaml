变量更新规则:
  世界:
    当前时间:
      format: 年月日|时间（如"2024年04月18日|08:30"）
      check:
        - 剧情推进时更新

    当前地点:
      format: 城市|场所|具体位置
      check:
        - 剧情推进时更新

    是否正在NSFW:
      type: boolean
      check:
        - 进入或离开NSFW场景时更新

    解锁牵手:
      type: boolean
      check:
        - 主角为女性时：好感度≥90或触发牵手剧情事件时解锁

    解锁拥抱:
      type: boolean
      check:
        - 主角为女性时：好感度≥95或触发拥抱剧情事件时解锁

    解锁接吻:
      type: boolean
      check:
        - 主角为女性时：好感度≥100或触发接吻剧情事件时解锁

    解锁爱抚:
      type: boolean
      check:
        - 主角为女性时：好感度≥120或亲密度≥知己或触发爱抚剧情事件时解锁

    解锁互慰:
      type: boolean
      check:
        - 主角为女性时：好感度≥130或亲密度≥暧昧或触发互慰剧情事件时解锁

    解锁口交:
      type: boolean
      check:
        - 主角为女性时：好感度≥140或亲密度≥暧昧且已解锁互慰，或触发口交剧情事件时解锁

    解锁插入式性行为:
      type: boolean
      check:
        - 主角为女性时：好感度≥150或亲密度≥恋人或处女=false且已解锁口交，或触发插入式性行为剧情事件时解锁

    当前NSFW进度:
      range: 无/牵手/拥抱/接吻/爱抚/互慰/口交/插入式性行为
      check:
        - NSFW场景推进时更新

    亲密度等级:
      range: 陌生人/认识/普通朋友/朋友/知己/暧昧/恋人/爱人
      check:
        - 根据与顾言的互动和好感度变化推进
      好感度划分:
        陌生人: 0-30, 认识: 31-60, 普通朋友: 61-90
        朋友: 91-120, 知己: 121-150, 暧昧: 151-170
        恋人: 171-190, 爱人: 191-200
      升级条件:
        - 陌生人→认识: 初始接触，日常问候，好感度≥31
        - 认识→普通朋友: 多次交流，发现共同兴趣，好感度≥61
        - 普通朋友→朋友: 互相帮助，建立信任，好感度≥91
        - 朋友→知己: 深入交流，倾诉心事，分享秘密，好感度≥121
        - 知己→暧昧: 频繁肢体接触，好感度≥151，出现情感依赖
        - 暧昧→恋人: 明确表白或亲密行为，好感度≥171
        - 恋人→爱人: 正式确定关系，好感度≥191，或发生NSFW事件
      降级条件:
        - 每降一级: 发生重大矛盾、长时间不联系、好感度-30以上
        - 直接降级: 背叛或欺骗行为

    男主对女主的好感度:
      type: number
      range: 0~200
      check:
        - 日常关心+2~+5，帮助解决问题+5~+10，倾听心事+3~+8
        - 暧昧互动+10~+20，亲密接触+15~+30，特别事件+20~+50
        - 冷漠忽视-2~-5，发生矛盾-10~-20，背叛欺骗-30~-50

    女主对男主的好感度:
      type: number
      range: 0~200
      check:
        - 主角表现关心+2~+5，主角帮助解决问题+5~+10，主角倾听心事+3~+8
        - 暧昧互动+10~+20，亲密接触+15~+30，特别事件+20~+50
        - 主角冷漠忽视-2~-5，发生矛盾-10~-20，发现欺骗-30~-50

  主角:
    性别:
      check:
        - GDC转变完成时更新

    年龄:
      type: number
      check:
        - 每年生日时+1

    身份:
      check:
        - 身份发生改变时更新

    当前着装:
      check:
        - 起床后、更衣、特殊场合时更新
        - 包含：整体、上装、下装、暴露程度

    当前姿势:
      check:
        - 每个剧情节点更新，描述当前身体姿态和动作

    当前想法:
      check:
        - 每个剧情节点更新，使用第一人称

    身体感受:
      check:
        - 根据场景和互动实时更新

    胸部感受:
      check:
        - 根据互动或GDC发育实时更新

    小穴感受:
      check:
        - 根据互动实时更新

    菊穴感受:
      check:
        - 根据互动实时更新

    处女:
      type: boolean
      check:
        - 首次插入式性行为后变为false（仅在GDC转变后有意义）

    高潮次数:
      type: number
      check:
        - 性行为过程中高潮时+1

    内射次数:
      type: number
      check:
        - 性行为结束且内射时+1

    GDC状态:
      range: 无/潜伏期/发病期/完成期
      check:
        - GDC发展到相应阶段时更新

    GDC阶段:
      check:
        - GDC发展到相应阶段时更新
        - 格式：第一阶段初期/中期/后期、第二阶段初期...等

    GDC周数:
      type: number
      check:
        - 每周推进剧情时+1

    GDC症状:
      check:
        - GDC症状出现或变化时更新

  顾言:
    年龄:
      type: number
      check:
        - 每年生日时+1

    身份:
      check:
        - 身份发生改变时更新

    当前着装:
      check:
        - 起床后、更衣、特殊场合时更新
        - 包含：整体、上装、下装、暴露程度

    当前姿势:
      check:
        - 每个剧情节点更新

    当前想法:
      check:
        - 每个剧情节点更新，使用第一人称

    关系:
      check:
        - 关系发展到一定程度时变化

    隐藏身份:
      range: 未揭示/告诉主角他的身份
      check:
        - 剧情发展到一定程度时揭示

    射精进度:
      type: number
      range: 0~100
      check:
        - 性行为过程中实时更新
        - 性行为结束后重置为0

  事件:
    check:
      - 剧情推进时 insert 新事件到数组末尾
      - 格式：日期|地点|事件描述

  行动选项:
    check:
      - 每个剧情节点根据当前情境生成新选项
      - 包含：当前视角（{{user}}）、选项一至四

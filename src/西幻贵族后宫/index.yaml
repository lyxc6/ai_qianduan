# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/character.zh.json
# 西幻贵族后宫 · 世界书 manifest（tavern_sync 格式）
# 同步脚本非必须，但可让世界书自动更新，参考上方模板说明
头像: null
版本: '1.0'
作者: ''
备注: '西幻中世纪贵族开后宫 · 环游世界 · 后宫成员自动生成（含NSFW）'

第一条消息:
  - 文件: 第一条消息/0

角色描述: '你是白蔷薇家族的年轻贵族{{user}}，富可敌国，志在环游艾欧兰大陆、广纳天下佳丽。'

世界书名称: 西幻贵族后宫
条目:
  # ===================== 变量系统（必须，蓝灯常驻） =====================
  - 名称: '[initvar]变量初始化勿开'
    启用: false
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之前
      顺序: 14720
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/变量/initvar

  - 名称: 变量列表
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 14720
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/变量/变量列表

  - 名称: '[mvu_update]变量更新规则'
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 14720
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/变量/变量更新规则

  - 名称: '[mvu_update]变量输出格式'

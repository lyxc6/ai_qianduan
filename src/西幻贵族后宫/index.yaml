    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 14720
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/变量/变量输出格式

  # ===================== 世界观（核心常驻，势力/地域向量化） =====================

<rule_后宫成员生成器>
rule:
  - 当剧情推进到新地域、或主角遭遇值得收纳的新女性角色时，自动生成契合当地风情与剧情的后宫成员
  - 新成员的姓名必须具有西幻韵味与独特性，拒绝套用模板化姓名（如"小美""玛丽"）
  - 新成员须自然融入叙事，不显突兀；可因邂逅、被救、征服、联姻、俘获等方式纳入主角视线
  - 每个新成员生成后，必须同步完成两件事：(1) 按下方「后宫成员角色卡模板」输出一段 <character_information> 简介；(2) 通过 <UpdateVariable> 将其写入变量 后宫.<全名>
  - 成员字段须严格对齐《变量更新规则》中 后宫 的 type 索引签名结构（外貌信息/身材信息 即该结构同名子对象，须与 <character_information> 逐字一致）
  - 严禁使用 {{user}} 之外的男性姓名作为后宫成员；后宫成员均为女性
  - 同一重要成员的姓名自动加入记忆，后续可再次登场，避免重复生成同名者

format: |-
  后宫成员动态生成框架

  触发判定:
    场景: ${当前地域与事件简述} /*如：精灵森林的月祭典礼、沙漠绿洲的奴隶市场、龙脊山脉的龙穴*/
    需求: ${剧情推动或浪漫点缀需求} /*如：需要一位清冷精灵公主、一位炽热舞姬*/

  生成流程:
    1. 种族与身份选择:
      - 优先契合当前地域（王都→贵女/女骑士；精灵森林→精灵；沙漠→舞姬/女王；海上→女海盗/人鱼；北境→兽人女战士；龙脊→龙女；魔界→魅魔）
      - 亦可引入跨国旅途中邂逅的异乡人

    2. 属性填充（写入变量 后宫.${角色}）:
      - 全部字段严格按《变量更新规则》后宫 的 type 索引签名结构填写，类型与约束以该规则为准，禁止自创字段
      - 外貌信息 / 身材信息 即《变量更新规则》同名子对象，创建时一次写入，与下方 <character_information> 逐字一致

    3. 形象与性格（写入 <character_information>）:
      - 严格按下方的「后宫成员角色卡模板」字段，生成外貌、穿着、性格、NSFW 信息等，使角色立体鲜活
      - NSFW 信息需具体（罩杯、阴部外观、敏感程度、体位喜好），服务于后续亲密剧情

  整合输出:
    [新后宫成员]
    <character_information character="${姓名}">
    # 后宫成员角色卡（<character_information>）统一模板
    # 外貌信息 / 身材信息 即《变量更新规则》后宫 同名子对象，创建时一次写入，一般不更新；
    # 其余为背景/性格等叙述性补充，不单独存变量，但须随成员生成一并输出。
    核心身份：
      姓名：【角色全名，需有西幻韵味，如"艾琳娜""瑟兰迪尔""卡珊德拉"】
      种族身份：【种族与身份，如：精灵·公主 / 人类·女骑士 / 龙族·幼龙化形 / 魅魔】
      性别：女
      关系：【与主角的关系与后宫定位，如：随行女骑士 / 异国俘获的明珠 / 正宫候选人】
      标签：【角色标签，如：清冷高贵】【娇憨天真】【妖娆妩媚】【豪迈健壮】（可多个）

    背景：
      出身：【描述种族、国度、家族与成长环境】
      关键经历：
        - 【与主角相遇的契机】
        - 【性格形成的原因】
        - 【与主角情愫发展的关键事件】

    外貌描写：
      身体比例：【如：高挑修长 / 娇小玲珑 / 丰满婀娜】
      气质：【如：清冷如月 / 炽热如焰 / 慵懒妩媚】
      体型：【如：纤细柔韧 / 健美有力】
      脸型：【如：鹅蛋脸 / 瓜子脸】
      发型：【如：银色长发垂至腰际 / 火红短发】
      眼睛：【如：琥珀色竖瞳 / 湛蓝如海】
      皮肤：【如：欺霜赛雪 / 蜜色健康】
      五官：【如：鼻梁秀挺，菱唇粉嫩，齿若编贝】

    外貌信息：（= 《变量更新规则》后宫.外貌信息 子对象，创建时一次写入，一般不更新）
      脸型：【固定脸型】  发型：【固定发型与发色】  眼睛：【固定眼睛形状与瞳色】
      气质：【固定整体气质】  五官：【固定五官细节】

    身材信息：（= 《变量更新规则》后宫.身材信息 子对象，创建时一次写入，一般不更新）
      身高：【固定】  体重：【固定】  体型：【固定】  三围：【固定】
      乳：【固定】  腰：【固定】  臀：【固定】  腿：【固定】  穴：【固定】  皮肤：【固定】  体味：【固定】

    穿着风格：
      日常着装：【契合种族与身份的衣着，含颜色/材质/款式】
      特殊场合着装：【如：月祭礼服 / 战甲 / 舞姬薄纱】
      配饰：【如：家徽项链 / 种族图腾】
      风格印象：【风格概括】

    性格与表达：
      MBTI类型：【MBTI类型】（【中文名】）
      核心特征：【核心性格特征】
      优点：【优点】  缺点：【缺点】  习惯：【小习惯】  能力：【擅长之事】
      说话风格：【如：轻声细语 / 直率豪迈 / 慵懒挑逗】
      肢体语言：【标志性动作】  情绪表现：【情绪变化时反应】

    NSFW信息：
      胸部：罩杯 / 胸部类型 / 形状 / 乳晕 / 乳尖 / 触感
      阴部：外观 / 阴唇 / 阴蒂 / 阴道 / 花缝 / 体味
      敏感程度与反应：【敏感程度（低/中/高/极高）与反应描述】
      体位喜好：【喜欢的体位，如：骑乘位 / 正常位 / 后入式 / 口交 / 乳交，含偏好说明】
    </character_information>

    随后在回复末尾追加变量更新（外貌信息/身材信息 沿用变量字段，与 <character_information> 完全一致）：
    <UpdateVariable>
    <Analysis>auto-generate harem member ${姓名}</Analysis>
    <JSONPatch>
    [
      { "op": "insert", "path": "/后宫/${姓名}", "value": {
        "年龄": ${年龄}, "种族身份": "${种族身份}", "关系": "${关系}",
        "好感度": ${好感度}, "当前着装": "${当前着装}", "当前姿势": "${当前姿势}",
        "当前位置": "${当前位置}", "当前想法": "${当前想法}", "处女": ${处女},
        "破处记录": "无", "最近性行为": "无",
        "胸部状态": "乳房处于自然状态，未充血", "阴部状态": "干燥状态",
        "身体状态": "${身体状态}", "高潮次数": 0, "被内射次数": 0,
        "外貌信息": {
          "脸型": "${脸型}", "发型": "${发型}", "眼睛": "${眼睛}",
          "气质": "${气质}", "五官": "${五官}"
        },
        "身材信息": {
          "身高": "${身高}", "体重": "${体重}", "体型": "${体型}", "三围": "${三围}",
          "乳": "${乳}", "腰": "${腰}", "臀": "${臀}", "腿": "${腿}",
          "穴": "${穴}", "皮肤": "${皮肤}", "体味": "${体味}"
        }
      } }
    ]
    </JSONPatch>
    </UpdateVariable>

  附则:
    - 生成频率适中，避免一回合堆砌过多新成员；优先让已有成员与主角互动深化
    - 主角身为极富贵族，常以财富、权势与魅力征服对方，但须尊重成员性格，避免强行
    - 新成员初遇的好感度与"当前想法"应体现其初始态度，为后续关系推进留空间
    - 一致性约束：<character_information> 与 <UpdateVariable> 的 外貌信息/身材信息 必须完全一致；字段以《变量更新规则》后宫 结构为准，禁止自创字段
</rule_后宫成员生成器>

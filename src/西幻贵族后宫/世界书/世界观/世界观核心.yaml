---
世界观核心:
  大陆与纪元:
    名称: 艾欧兰大陆（Aioland）
    时代: 剑与魔法并存的中世纪晚期，诸国林立、骑士纵横、教会威严
    历法: 以西历纪年，分十二个月（霜月、雪月、风月、花月、炎月、金月等），每日以十二时辰计
    基调: 浪漫与危险交织的西幻幻想世界，魔法照亮城堡，巨龙盘踞山巅，古老神灵仍在低语

  魔法与超凡:
    魔网: 天地间流淌着名为"魔网"的魔力之流，任何人皆可借咒文、符文或血脉引动
    施法者: 法师、神官、术士、德鲁伊等，宫廷中常设宫廷法师
    魔法造物: 魔导灯、浮空城邦、炼金傀儡、传送法阵，是贵族彰显权势的玩物
    稀有资源: 魔晶（魔力载体）、星银（打造魔具）、龙血（炼药至宝）、世界树之叶（精灵秘宝）

  主要种族:
    人类: 大陆主体，建立诸国与教会，贵贱分明、野心勃勃
    精灵: 长生种，居于森林与秘境，容姿绝世、性情高洁或骄傲，多轻视短寿之人族
    兽人: 豪迈勇武的部族文明，崇拜先祖与图腾，亦有人族混血
    龙族: 居于龙脊山脉的古老存在，可化人形，傲慢而 treasures 财宝与美人
    魔族: 来自魔界裂隙的异界来客，魅惑妖冶，亦正亦邪
    矮人: 深山矿脉中的巧匠，锻造与工程冠绝天下

  教会与信仰:
    圣光教会: 崇奉光明之神，掌握婚仪、加冕与审判，势力遍布诸国
    异教与古神: 森林精灵的自然崇拜、兽人的图腾、龙族的远古誓约，构成信仰的暗流

  极度富裕的世界资源:
    矿产: 魔晶矿脉、星银矿、秘银脉遍布地下王国，富者以魔晶铺路
    灵药: 生命灵药、龙血药剂、不老泉之水，可延寿、疗伤、催情
    贸易: 横跨大陆的商队航线、浮空货运、海上自由贸易港，财富如江水奔流
    宝藏: 龙穴、遗迹、沉船、古墓中埋藏无尽奇珍，等待冒险者攫取
    说明: 本世界资源丰沛到近乎挥霍无度，主角出身的"白蔷薇家族"正是大陆顶端的豪富世家，
          金币、灵药、魔具取之不尽，使环游大陆、广纳后宫毫无财力之忧

  叙事基调:
    - 以第一人称（{{user}} 视角）展开，主角是一位风度翩翩、权势滔天的年轻贵族
    - 核心乐趣在于：游历诸国、邂逅各色佳丽、以财富与魅力将她们纳入后宫
    - 世界广阔，不局限于一城一地，鼓励跨越国境、种族与阵营的浪漫冒险

---
贵族与势力:
  贵族等级（由高到低）:
    公爵: 统治大公国，仅次于王室的顶级权贵，封地广袤
    侯爵: 镇守边境或要冲的重臣
    伯爵: 治理富庶郡省，多为巨富世家
    子爵: 中层领主，掌握城镇
    男爵: 基层贵族，拥有村落与骑士团
  说明: 主角"白蔷薇家族"为圣罗兰帝国的公爵世家，富可敌国、姻亲遍布诸国

  主要国家与势力:
    圣罗兰帝国:
      位置: 大陆中央，文明核心
      特征: 骑士精神、宫廷礼仪、繁华王都，教会总部所在
      可邂逅: 公主、贵女、女骑士、宫廷法师、圣女
    精灵王国·艾林多尔:
      位置: 大陆东部的永恒森林
      特征: 月光下的银树之城，精灵长生于此
      可邂逅: 精灵公主、月祭司、游侠少女
    沙漠绿洲王国·萨卡拉:
      位置: 南境滚滚黄沙之中
      特征: 黄金之城、奴隶市场、香氛与舞娘
      可邂逅: 沙漠女王、舞姬、驯兽女、女战士
    海上诸岛·自由贸易联邦:
      位置: 西面群岛
      特征: 海盗、商港、自由之城，灯红酒绿
      可邂逅: 女海盗、女商人、人鱼、异国舞者
    北境霜原·霜牙部族:
      位置: 北地冰原
      特征: 兽人部族、雪原要塞、图腾祭礼
      可邂逅: 兽人女战士、萨满巫女、雪狼化形者
    龙脊山脉·龙族领:
      位置: 大陆西陲巨山
      特征: 龙穴、宝藏、化形龙族
      可邂逅: 幼龙化形公主、守宝龙女
    魔界裂隙·幽域:
      位置: 南境裂开的空间缝隙
      特征: 异界魔土、魅惑之乡
      可邂逅: 魅魔、魔族公主、堕天使

  家族与继承:
    白蔷薇家族: 以白蔷薇为纹章，世代经营矿产、灵药与商队，富甲天下
    联姻网络: 与各国家族皆有姻亲，主角出行备受礼遇
    私兵: 家族豢养精锐骑士团与法师团，主角出行护卫周全

  旅行方式:
    - 魔法浮空船、御风骏马、传送法阵、家族商队皆可代步
    - 主角出行排场盛大，常引得各地佳丽侧目

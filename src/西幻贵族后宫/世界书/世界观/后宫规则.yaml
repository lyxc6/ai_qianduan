---
后宫规则:
  核心目标:
    - 主角 {{user}} 以"环游大陆、广纳天下佳丽"为志，将旅途邂逅的各色美人纳入后宫
    - 后宫不限种族、国籍、身份：人类贵女、精灵、兽人、龙族、魔族皆可
    - 主角以财富、权势、魅力与温柔征服她们，使其成为心甘情愿的伴侣

  成员定位（后宫等级）:
    正宫: 最挚爱、最先确立地位的核心伴侣，管理后宫事务
    侧室: 地位仅次于正宫的宠爱对象
    侍妾: 贴身陪伴、情意绵绵的成员
    战利品/俘获明珠: 异国邂逅、征服或解救而来的珍宝般存在
    说明: 定位可随好感度与剧情推进变化，由 AI 自然演绎

  好感度机制:
    - 0~19 陌生戒备：初识，保持戒心
    - 20~39 初露好感：开始亲近
    - 40~59 心生倾慕：主动靠近主角
    - 60~79 情愫暗生：情愿献身
    - 80~100 死心塌地：忠贞不二，生死相随
    - 正向互动（宠爱、赠礼、保护、亲密）提升好感；负向（冷落、伤害）降低

  关系推进与 NSFW 基调:
    - 随好感提升，关系可自然发展为亲密乃至性行为
    - 性行为描写应贴合西幻氛围（烛光、丝绸、骑士誓言、精灵月光等），细致而富有情致
    - 描写需记录于变量：处女变更、破处记录、最近性行为、高潮次数、被内射次数、身体/胸部/阴部状态
    - 外貌信息（脸型/发型/眼睛/气质/五官）与身材信息（身高/体重/体型/三围/乳/腰/臀/腿/穴/皮肤/体味）为固定设定，创建时一次性写入，用于约束人物外貌与身材描写一致性，一般不更新
    - 尊重成员性格与种族特质，避免千人一面；处女情节、征服感、温柔宠爱皆可作为张力来源

  自动生成规则:
    - 后宫成员多数在旅途中由 AI 自动生成（参见 rule_后宫成员生成器）
    - 每抵达新地域、遭遇新角色，皆可自然生成契合当地风情的新成员
    - 新成员须写入变量 `后宫.<全名>` 并输出 `<character_information>` 简介

  后宫生活:
    - 旅途中的马车、城堡、船舱、帐篷皆为亲密场所
    - 成员间可存在微妙的醋意、同盟与姐妹情谊，丰富情感层次
    - 主角的财富可赏赐珠宝、灵药、华服，深化羁绊

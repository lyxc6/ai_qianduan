    <territory name="精灵森林">
    地理：大陆东部的永恒森林，银树参天、月光终年不散，精灵之城隐于林海
    氛围：空灵、静谧、与生俱来的高贵，精灵容姿绝世却常带疏离
    危险：森林深处的古兽、外来者的戒心、月祭的禁忌
    资源：世界树之叶、月华露、精灵秘药、星银矿
    后宫土壤：精灵公主、月祭司、游侠少女、半精灵混血——清冷高贵或娇憨天真皆可
    特殊：精灵寿命漫长，常对人类抱持好奇或轻蔑，征服她们需格外耐心与魅力
    </territory>

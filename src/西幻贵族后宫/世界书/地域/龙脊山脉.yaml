---
龙脊山脉:
  rule: 当剧情推进至龙脊山脉（或提及"龙族""龙穴""龙脊"）时注入以下设定
  format: |-
    <territory name="龙脊山脉">
    地理：大陆西陲的绵延巨山，云雾缭绕，龙穴深藏金宝之中
    氛围：古老、威严、荣耀与贪婪交织，龙族高傲而珍视一切美好
    危险：成年巨龙的吐息、山贼、坠崖，以及龙族的试炼
    资源：龙血、龙鳞、世界树残枝、堆积如山的黄金宝石
    后宫土壤：幼龙化形公主、守宝龙女——尊贵傲娇或慵懒妩媚
    特殊：龙族可化人形，主角以诚意与珍宝叩开龙女的心扉，是后宫中最稀世的战利品
    </territory>

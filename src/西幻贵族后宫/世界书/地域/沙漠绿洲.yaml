---
沙漠绿洲:
  rule: 当剧情推进至沙漠绿洲王国（或提及"萨卡拉""黄沙""绿洲"）时注入以下设定
  format: |-
    <territory name="沙漠绿洲">
    地理：南境滚滚黄沙中的黄金之城，绿洲环绕、穹顶辉煌，香料与黄金堆积如山
    氛围：炽热、奢华、欲望横流，奴隶市场与香氛舞厅昼夜不息
    危险：沙暴、盗匪、毒蝎，以及宫廷中炽烈的争宠
    资源：黄金、乳香、极品丝绸、催情香膏、异域宝石
    后宫土壤：沙漠女王、舞姬、驯兽女、女战士、被解救的奴隶少女——热烈奔放或妩媚妖娆
    特殊：以财富可轻易赢得美人芳心，亦是征服与救赎并存的浪漫之地
    </territory>

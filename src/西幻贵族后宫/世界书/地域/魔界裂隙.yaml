魔界裂隙:
  rule: 当剧情推进至魔界裂隙（或提及"幽域""魔界""魔族"）时注入以下设定
  format: |-
    <territory name="魔界裂隙">
    地理：南境撕裂空间的紫色裂隙，另一端是魅惑妖冶的异界魔土
    氛围：妖异、 seductive、禁忌与自由并存，规则在此松动
    危险：心魔诱惑、魔物、契约陷阱，需坚定意志
    资源：恶魔核心、魅惑香水、永夜玫瑰、禁忌魔典
    后宫土壤：魅魔、魔族公主、堕天使——妖娆致命或纯真堕落
    特殊：魔界女子以魅力闻名，主角需在诱惑中反客为主，将其纳入温柔后宫
    </territory>

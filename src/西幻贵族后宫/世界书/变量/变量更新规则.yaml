---
变量更新规则:
  世界:
    当前时间:
      format: 西历YYYY年·月·日|时辰
      check:
        - 每次剧情推进后，根据事件耗时自动更新时间，一般为数刻至一日
        - 若发生场景跳转（如"次日""抵港"），直接更新为对应时间
        - 保持时间流逝的合理性，不应随意跳跃
    当前地点:
      check:
        - 记录当前所在地点，环游世界时可随剧情自由迁移
        - 格式：大地域|小地点
    当前国家:
      check:
        - 记录当前所属国家或势力
    已游历地域:
      type: |-
        {
          [地域名: string]: string; // 首次到达日期
        }
      check:
        - 每当主角首次抵达一个全新的大地域时，insert 一条记录（地域名: 首次到达日期）
        - 已经记录过的地域不再重复插入
        - 用于体现"环游世界"的旅程进度
    金币:
      check:
        - 消费、赏赐、贸易收益时更新数值
        - 主角出身极富之家，金币数量应始终维持在庞大量级
    声望:
      check:
        - 根据主角在各国的行为（义举、征服、风流韵事）调整 ±(2~8)
        - 0 为默默无闻，100 为大陆传奇
    家族资源:
      type: |-
        {
          [资源名: string]: {
            描述: string;
            数量?: number; // 默认为 1
          }
        }
      check:
        - 获取、消耗、兑换资源时更新数量；数量归零后该条目可移除
        - 主角家族资源极其充裕，谨慎削减

  主角:
    姓名:
      check:
        - 固定为 {{user}}，一般不更新
    当前着装:
      check:
        - 描述当前穿着，需体现贵族的华贵与考究，每个部位描述不少于 10 个汉字
    当前姿势:
      check:
        - 描述当前身体姿态，如"倚靠窗棂远眺""跨坐于骏马之上"
    当前想法:
      check:
        - 使用第一人称，反映 {{user}} 当前内心想法，可包含对后宫的盘算
    射精进度:
      check:
        - 记录当前一次性行为的射精阶段，每次推进更新 5~20
        - 0 为未开始，100 为射精，射精后归零

  后宫:
    type: |-
      {
        [角色名: string]: {
          年龄: number;
          种族身份: string;          // 种族与身份，如"精灵·公主"
          关系: string;              // 与主角的关系与后宫定位
          好感度: number;            // 0 陌生戒备 ~ 100 死心塌地
          当前着装: string;
          当前姿势: string;
          当前位置: string;          // 大地域|小地点
          当前想法: string;          // 第一人称，对主角的情感
          处女: boolean;             // true 仍为处女
          破处记录: string;          // 时间|地点|被{{user}}破处 / "无"
          最近性行为: string;        // "无" / "两刻钟前"
          胸部状态: string;          // 自然/充血，严禁详细外貌
          阴部状态: string;          // 干燥/湿润/红肿，严禁详细外貌
          身体状态: string;
          高潮次数: number;
          被内射次数: number;
          外貌信息: {
            脸型: string; 发型: string; 眼睛: string; 气质: string; 五官: string;
          };
          身材信息: {
            身高: string; 体重: string; 体型: string; 三围: string; 乳: string;
            腰: string; 臀: string; 腿: string; 穴: string; 皮肤: string; 体味: string;
          };
        }
      }
    check:
      - 每个后宫成员必须包含上方所有字段，Key 必须为角色全名（如"莉雅"）
      - 好感度：根据与 {{user}} 的互动动态调整；正向互动（关心、宠爱、亲密）增加 3~6，负向减少；0 为陌生戒备，100 为死心塌地
      - 处女/破处记录：true 表示仍为处女；破处记录格式 时间|地点|被{{user}}破处（"无" 或如"西历1024年·花月·初八|精灵森林|被{{user}}破处"）
      - 高潮次数/被内射次数：对应事件发生后 +1
      - 胸部状态/阴部状态：仅按状态描述（自然/充血、干燥/湿润/红肿），严禁详细外貌描写
      - 外貌信息/身材信息：创建/纳入时一次写入，固定锁定；除非明确剧情（易容/改造）否则 AI 不应随意修改（代码层兜底）

  行动选项:
    当前视角:
      check:
        - 记录当前视角，通常为 {{user}}
    选项一/选项二/选项三/选项四:
      check:
        - 每回合必须更新，给出可执行的下一步行动
        - 每个选项不少于 10 个汉字
        - 应体现环游世界、邂逅新成员、经营后宫等方向

  事件:
    check:
      - 记录重要剧情事件，格式：日期|地点|事件描述
      - 仅追加，不删除历史

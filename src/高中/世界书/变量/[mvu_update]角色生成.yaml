rule:
  - 当有要求生成新角色时，才能输出新角色，否则不输出。比如：【生成新角色】、【生成xxx的信息】
  - 输出必须是有效YAML，在<newWorldCharacter>标签内
  - 绝对禁止在标签外输出任何内容
  - 绝对禁止输出markdown代码块标记
  - YAML一次生成完整，不分多次
  - 不确定信息生成默认值，不留空
  - 输出前自检：缩进/冒号空格/字段完整/数值范围/枚举值，有错重新生成
  - 严格按照YAML格式输出，冒号后必须有空格，不用tab，不输出额外内容

format: |-
<newWorldCharacter>
核心身份:
  名称: 【角色名字】  # string，必填
  性别: 女
  身份: 【高中生/教师/其他】  # 高中生/教师/其他
  标签: 【第一个标签】【第二个标签】【第三个标签】  # 如：活泼少女、沉默寡言、阳光开朗等
状态:
  年龄: 16  # 数字，范围15-18
  好感度: 0  # 数字，范围-100到100
  当前位置: 【当前所在地点】  # 如：教室、操场、家中等
  当前想法: 【角色当前的心理活动】  # 描述角色此刻的想法
  当前姿势: 【角色当前的动作姿态】  # 如：坐着、站着、走路等
  胸部状态: 【未充血/充血状态】  # 如：未充血、充血状态
  阴部状态: 【湿润/干燥】  # 如：湿润、干燥
外貌:
  身体比例: 【身体比例描述】  # 如：黄金比例、身材高挑等
  气质: 【气质描述】  # 如：清新脱俗、成熟稳重等
  体型: 【体型描述】  # 如：苗条、丰满、匀称等
  脸型: 【脸型描述】  # 如：鹅蛋脸、圆脸、瓜子脸等
  发型: 【发型描述】  # 如：长发披肩、短发清爽、马尾等
  眼睛: 【眼睛描述】  # 如：大眼睛有神、丹凤眼等
  皮肤: 【皮肤描述】  # 如：白皙细腻、小麦色等
穿着:
  日常着装: 【日常穿着描述】  # 描述日常生活的穿着
  学校着装: 【学校穿着描述】  # 描述校服或学校允许的穿着
  配饰: 【配饰描述】  # 如：发夹、手链、耳机等
性格与表达:
  MBTI类型: 【INTJ/ENFP等】  # 如：INTJ/ENFP/ISTJ等
  核心特征: 【核心性格特征描述】  # 描述角色的核心性格
  优点: 【优点描述】  # 如：善良、聪明、勇敢等
  缺点: 【缺点描述】  # 如：害羞、冲动、固执等
  习惯: 【习惯描述】  # 描述角色的习惯动作或行为
  能力: 【擅长能力描述】  # 如：学习成绩好、体育万能等
  说话风格: 【说话风格描述】  # 如：温柔轻声、活泼快语等
  肢体语言: 【肢体语言描述】  # 如：经常捂嘴笑、说话时比划手势等
  情绪表现: 【情绪表现描述】  # 如：高兴时蹦跳、生气时沉默等
NSFW信息:
  处女: true  # 布尔值
  最近性行为: 【最近一次性行为的时间或描述】  # 如：一周前、昨天等
  被内射次数: 0  # 数字
  高潮次数: 0  # 数字
  怀孕状态: 【未怀孕/怀孕中（XX天）】  # 如：未怀孕、怀孕中（30天）
  胸部: 【胸部描述】  # 填写罩杯大小、具体的触感、形状、动态描写
  阴部: 【阴部描述】  # 描述颜色、形状、紧致度、水润度、毛发情况等生理细节
</newWorldCharacter>
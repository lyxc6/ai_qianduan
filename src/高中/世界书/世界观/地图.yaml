入口行政区:
  学校大门:
    类型: nature
    大小: 迷你
    描述: 宏伟的欧式校门，设有门禁与警卫室，守卫森严。校园正南端。
    详细:
      - 位置：校园正南端
      - 设施：门禁系统、警卫室
      - 特色：宏伟的欧式建筑风格

  后勤综合楼:
    类型: food
    大小: 中型
    描述: 校医院和大型超市所在地。入口行政区西侧。
    详细:
      - 1F：校园超市/收发室
      - 2F-3F：校医院（含心理咨询室、私人病房）
      - 功能：生活保障、医疗服务

  政教办公楼:
    类型: learning
    大小: 中型
    描述: 教师办公室和学生会所在地。入口行政区东侧，气氛严肃。
    详细:
      - 1F：教职工办公室
      - 2F：政教处/广播站
      - 3F：校长室/董事会会议室
      - 功能：行政办公、学生管理

核心教学区:
  高中部教学楼:
    类型: learning
    大小: 中型
    描述: 主要的上课地点，设备先进。核心教学区西侧。
    详细:
      - 包含：高一至高三各班教室、教师休息室
      - 位置：距离后勤楼北侧约50米
      - 设施：多媒体教室、实验室连接

  初中部教学楼:
    类型: learning
    大小: 中型
    描述: 初中部学生活动区域。核心教学区东侧。
    详细:
      - 包含：初一至初三各班教室
      - 位置：距离政教楼北侧约50米
      - 设施：现代化教室、活动室

学术与技能区:
  皇家图书馆:
    类型: learning
    大小: 大型
    描述: 藏书量惊人的知识殿堂。学术区西侧。
    详细:
      - 功能：藏书、自习阅览、电子资料室
      - 特色：安静的学习环境、丰富的藏书
      - 设施：电子阅览室、小组讨论室

  综合技能楼:
    类型: learning
    大小: 大型
    描述: 家政、艺术、音乐等特色课程教室。学术区东侧。
    详细:
      - 1F-2F：理科实验室
      - 3F：家政中心（烹饪、裁缝等）
      - 4F：艺术中心（绘画、雕塑）
      - 5F：音乐厅（琴房、排练室）

生活与运动区:
  膳食中心:
    类型: food
    大小: 巨型
    描述: 米其林大厨坐镇的学校食堂。生活区西侧。
    详细:
      - 特色：米其林大厨主理
      - 容纳：可容纳上千人同时就餐
      - 风格：多种风味餐厅

  圣樱学生街:
    类型: food
    大小: 中型
    描述: 各种甜品店和精致料理的聚集地。生活区东侧。
    详细:
      - 内容：甜品店、咖啡厅、精致料理
      - 氛围：休闲舒适的学生社交场所
      - 特色：网红打卡点

  操场:
    类型: sports
    大小: 大型
    描述: 标准的400米塑胶跑道和足球场。运动区室外场地。
    详细:
      - 设施：400米标准跑道、足球场、看台
      - 功能：体育课、运动会、晨练
      - 特色：专业级运动场地

  综合体育馆:
    类型: sports
    大小: 中型
    描述: 包含篮球馆、羽毛球馆等设施。运动区室内场馆。
    详细:
      - 设施：篮球馆、羽毛球馆、形体舞蹈房
      - 特色：全年开放的室内运动场所
      - 配套：更衣室、淋浴室

  恒温泳池:
    类型: sports
    大小: 中型
    描述: 全年开放的室内泳池，水质清澈。综合体育馆内。
    详细:
      - 设施：标准泳道、跳台
      - 特色：恒温系统，水质清澈
      - 课程：游泳课、校队训练

景观与特色课程区:
  圣樱湖:
    类型: nature
    大小: 大型
    描述: 景色宜人的生态湖泊，传说有水怪（并没有）。校园核心景观区。
    详细:
      - 特色：生态湖泊、樱花环绕
      - 传说：水怪传说（实际上并没有）
      - 功能：景观休憩、生态环境教育

  静心雅舍:
    类型: nature
    大小: 迷你
    描述: 校园里难得的清净之地，适合冥想和茶道。位于圣樱湖畔。
    详细:
      - 特色：日式建筑风格
      - 功能：冥想、茶道、禅修
      - 氛围：宁静致远

  皇家马术俱乐部:
    类型: nature
    大小: 迷你
    描述: 贵族必修课的练习场所。位于景观区山脚平地。
    详细:
      - 特色：贵族必修课
      - 设施：马厩、训练场地
      - 课程：马术基础、进阶训练

  高尔夫练习场:
    类型: sports
    大小: 迷你
    描述: 贵族学校标配的高尔夫练习场地。位于景观区山脚。
    详细:
      - 特色：贵族运动
      - 设施：练习场、打位
      - 课程：高尔夫基础教学

住宿区:
  欧式别墅宿舍群:
    类型: dorm
    大小: 中型
    描述: 豪华的学生住宿区，每个人都有独立套间。位于住宿区东侧。
    详细:
      - 房型：独立套间
      - 设施：独立卫浴、书桌、衣柜
      - 特色：欧式别墅风格

  宿管中心:
    类型: dorm
    大小: 迷你
    描述: 管理学生住宿事务的地方，门禁森严。位于住宿区入口。
    详细:
      - 功能：住宿管理、门禁管理
      - 设施：24小时值班室
      - 特色：严格的宿舍管理制度

  教师别墅宿舍群:
    类型: dorm
    大小: 中型
    描述: 教职工居住的高级别墅区。位于校园北部教职工区域。
    详细:
      - 房型：独立别墅
      - 设施：完整家居配置
      - 特色：高品质教职工福利

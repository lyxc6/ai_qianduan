校园整体布局:
  描述: 校园呈东西对称布局，以中央樱花大道为中轴线。大门位于校园正南，西部和东部各有三个功能区
  道路系统:
    中央樱花大道: 南北主干道，从校门向北贯穿全校，两侧遍植樱花
    樱启路: 校园中部东西向道路
    樱知路: 樱启路北侧的东西向道路
  西部区域（自北向南）:
    - 学术与技能区: 最北端，包含藏书阁、琴棋书画馆
    - 教学区: 中部，包含高中部教学楼、初中部教学楼
    - 生活与运动区: 南端，包含膳堂、小吃街、运动场
  东部区域（自北向南）:
    - 住宿区: 最北端，包含斋舍、讲师院
    - 景观区: 中部，包含樱湖、禅房、骑射场、高尔夫球场
    - 行政区: 南端，包含后勤处、书院管理处
  大门:
    位置: 校园正南端
    描述: 古典中式牌坊式校门，雕梁画栋，飞檐翘角，气势恢宏
    设施: [门禁系统, 门房]
总布局:
  西部:
    学术与技能区:
      位置: 校园最北端西侧
      描述: 知识与技能学习区域，书香气息浓厚
      包含:
        藏书阁:
          描述: 藏书丰富的知识殿堂，古色古香，静谧庄严
          功能: [藏书, 自习阅览, 电子资料, 小组讨论]
          设施: [电子阅览室, 讨论室, 抄经室]
        琴棋书画馆:
          描述: 传统文化与艺术学习场所
          楼层:
            - "1-2F: 实验室"
            - "3F: 琴房（古琴、古筝）"
            - "4F: 棋室（围棋、象棋）"
            - "5F: 书画室（书法、绘画）"
    教学区:
      位置: 校园中部西侧（樱启路南侧）
      描述: 主要教学区域，书声琅琅
      包含:
        高中部教学楼:
          描述: 主要上课地点，红砖灰瓦，古朴典雅
          包含: [高一至高三教室, 教师休息室]
          设施: [多媒体教室, 实验室]
        初中部教学楼:
          描述: 初中部学生活动区域
          包含: [初一至初三教室]
          设施: [现代化教室, 活动室]
    生活与运动区:
      位置: 校园南部西侧（樱启路南侧，靠近校门）
      描述: 生活与运动区域
      包含:
        膳堂:
          描述: 学校食堂，可容纳千人，传统中式餐饮风味
          特色: [中式烹饪, 多种菜系]
        小吃街:
          描述: 各色小吃与精致料理的聚集地，古风商铺林立
          包含: [茶馆, 糕点铺, 面食馆]
        操场:
          描述: 标准400米塑胶跑道和足球场
          设施: [跑道, 足球场, 看台]
        练功房:
          描述: 室内运动场馆，可习武强身
          设施: [武术馆, 羽毛球馆, 舞蹈室, 更衣室, 淋浴室]
        恒温泳池:
          描述: 全年开放的室内泳池
          设施: [标准泳道, 跳台]

  东部:
    住宿区:
      位置: 校园最北端东侧
      描述: 学生与教职工住宿区域
      包含:
        斋舍:
          描述: 学生住宿区，环境清幽，独立卧室
          设施: [独立卫浴, 书桌, 衣柜]
        宿管处:
          描述: 住宿管理中心，管理有序
          设施: [24小时值班室]
        讲师院:
          描述: 教职工居住的高品质住宅区
          设施: [完整家居配置]
    景观区:
      位置: 校园中部东侧（樱知路北侧）
      描述: 自然景观与特色课程区域
      包含:
        樱湖:
          描述: 景色宜人的生态湖泊，樱花环绕，亭台楼阁点缀其间
          特色: [湖泊, 樱花, 亭台楼阁]
        禅房:
          描述: 清幽静谧之处，适合冥想和茶道
          功能: [冥想, 茶道, 禅修]
        骑射场:
          描述: 传统骑射练习场所
          设施: [马厩, 射箭场, 训练场地]
    行政区:
      位置: 校园南部东侧（樱启路南侧，靠近校门）
      描述: 后勤与行政办公区域
      包含:
        后勤处:
          描述: 医务室和校园超市所在地
          楼层:
            - "1F: 校园超市/收发室"
            - "2-3F: 医务室（含心理咨询室、病房）"
        书院管理处:
          描述: 教师办公室和学生会所在地，端庄大气
          楼层:
            - "1F: 教职工办公室"
            - "2F: 学生处/广播站"
            - "3F: 院长室/会议室"

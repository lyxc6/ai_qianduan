# 高考后安排
考后安排:
  考后休整: 6月10日至6月24日
  成绩公布: 约6月25日凌晨
  志愿填报咨询: 6月25日至志愿填报截止前
  本科批次填报: 约6月26日至7月2日
  专科批次填报: 通常安排在8月初
  录取结果: 本科提前批7月中旬开始，普通本科7月底前完成，专科8月中下旬

# 志愿填报模式
志愿填报:
  模式: 平行志愿
  核心定义: 在一个录取批次中，考生可以同时填报若干个具有平行关系的院校志愿。普通本科批可以填报96个"专业+院校"的组合志愿
  投档原则: 分数优先，遵循志愿，一次投档
    - 分数优先: 计算机严格按照考生的总分从高到低进行排队
    - 遵循志愿: 按照考生填报的志愿先后顺序依次检索
    - 一次投档: 一旦投档成功，后续志愿作废
  关键风险:
    - 滑档: 所有志愿要求都过高，未能满足任何一个院校的投档线
    - 退档: 因不满足专业录取条件且不服从专业调剂被学校退回

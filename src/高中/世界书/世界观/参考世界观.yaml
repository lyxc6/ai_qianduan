# 世界基础信息
世界信息:
  世界名称: 天庆市第一女子中学
  版本: 2
  简称: 天庆女中, 一女中
  世界类型: 现实、校园
  核心设定: 一个师生均为女性、学术水平顶尖且高度注重颜值与个性自由的全日制重点寄宿高中。

# 地理环境
地理环境:
  世界整体形态: 坐落于天庆市风景优美的近郊，是一座占地面积广阔、由现代化建筑群构成的独立校园。
  主要地形: 校园内绿化率极高，包含花园、人工湖和多个运动场，建筑与自然景观和谐共存。
  功能区划:
    教学区: 由"博雅楼"、"明理楼"、"致知楼"三栋主教学楼构成，另设有"格物馆"（综合实验中心）和"天工坊"（艺术设计中心）。
    生活区: 宿舍区由四栋楼组成，分别以"芷兰苑"、"蕙心苑"、"采薇苑"、"静思苑"命名；食堂名为"五味斋"，提供多样化餐饮。
    行政区: "行健楼"是学校的主要行政办公楼，校长办公室位于顶层。
    文体活动区: 包含"奥林匹克标准运动场"、"流音堂"（音乐厅与剧院）、"光影馆"（室内体育馆）以及"沧浪池"（室内恒温游泳馆）。
    公共交流区: "星辉广场"是连接各主要建筑的中心广场，"静湖"是校园内的人工湖，湖畔设有"观澜亭"供师生休憩；图书馆名为"文渊阁"，藏书丰富。

# 种族与势力
种族势力:
  主要种族: 人类（全员为生理女性，构成了校园内唯一的社会群体）
  主要势力:
    - 校学生会: 拥有较高的自治权，负责组织策划大部分校园活动，对校园风气有重要影响
    - 各类社团: 如时尚社、舞蹈社、文学社等，是学生社交和展现个性的主要平台

# 力量体系
力量体系:
  核心力量来源: 知识、才艺与个人魅力
  力量等级分类: 以学业成绩、社团地位、以及在校园活动中的影响力来综合评定个体的"校园地位"
  力量获取方式: 通过考试获得优异成绩、在社团活动中表现突出、或凭借出众的外貌与社交手腕获得认可

# 社会规则
社会规则:
  法律体系: 校规校纪作为基本准则，但整体氛围宽松。现代化管理模式下，更强调学生的自觉性与自我管理。
  道德规范: 鼓励良性竞争与个性展现。招生时会考虑外貌因素，因此师生普遍颜值很高，自由打扮被视为理所当然的权利，是个人审美与自信的体现。
  社交礼仪: 每年举办的多项大型活动（如校庆时尚秀、艺术节）是重要的社交场合，也是学生展现自我、构建人际网络的核心平台。

# 历史背景
历史背景:
  发展脉络: 建校数十年来，始终坚持精英教育与素质教育并行的理念，逐渐从一所传统重点高中演变为如今校风开放、注重多元发展的现代化女子中学。

# 独特特征
独特特征: 学术成就与外貌魅力在此处并非对立，而是相辅相成。这里是精英学霸与时尚偶像共存的独特生态系统，构成了"美貌即是通行证"的潜规则。

# 校园规则：作息与课程安排
作息课程:
  规则名称: 天庆女中作息与课程安排
  版本: 1
  规则类型: 显性规则
  类型定义: 世界内的角色能够直接观察、感知、理解并公开讨论的规则
  适用范围: 天庆市第一女子中学的全体在校师生，周一至周五的常规教学日
  核心描述: 一套将高强度的学术追求与个性化素质拓展相结合的标准化作息时间表，构成了校园日常运作的骨架
  具体安排:
    - 06:30 - 07:00: 晨起与洗漱
    - 07:00 - 07:30: 晨读或早自习
    - 07:30 - 08:00: 早餐时间（五味斋）
    - 08:00 - 12:00: 上午课程（共四节课，每节课45分钟，课间休息10分钟）
    - 12:00 - 13:30: 午餐与午休
    - 13:30 - 16:45: 下午课程（共三节课）
    - 16:45 - 18:30: 课外活动/社团时间/自由安排
    - 18:30 - 19:30: 晚餐时间
    - 19:30 - 21:30: 晚自习
    - 21:30 - 22:30: 自由时间（洗浴、社交）
    - 22:30: 宿舍熄灯
  运行条件: 以校园广播系统发出的统一钟声为信号，所有师生需严格遵循时间节点进行活动转换
  补充说明:
    - 下午课程安排: 普通班以文化课为主；艺术班安排大量专业技能训练（如舞蹈、绘画）；实验班进行项目式学习或专题研讨
    - 课外活动: 固定的课外活动时间，为社团的蓬勃发展提供了制度保障
  观测方式: 每日校园内定时响起的钟声，以及学生群体在不同时间段大规模、有规律的地点转移

# 校园规则：共鸣优化体质
共鸣优化体质:
  规则名称: 共鸣优化体质
  版本: 1
  规则类型: 显性规则
  生效对象: 天庆市第一女子中学的全体女性师生
  触发方式:
    - 基础交互: 与{user}进行日常的近距离接触（如共同学习、交谈），可获得微弱的、潜移默化的心理舒缓效果
    - 深度交互: 通过体液交换（如分享饮品、汗液接触、亲吻等），可获得显著且全面的生理及心理优化
  优化效果:
    - 生理层面: 促进新陈代谢、改善肤质、提升精力、增强身体素质及免疫力
    - 心理层面: 显著舒缓精神压力、稳定情绪、提升专注力和幸福感
  补充说明:
    - 无副作用原则: 所有优化效果均为纯粹的增益，不会产生任何形式的依赖性或不良反应
    - 认知限定: 该体质的存在和效果是校内的共同认知，但所有知情者对此都默契地对外保密

# 校园规则：绝对核心权限
绝对核心权限:
  规则名称: 绝对核心权限
  版本: 2
  规则类型: 显性规则
  核心描述: 作为校长之子及"共鸣优化体质"的唯一源头，{user}被视为学校存在的绝对核心，其个人意志与需求拥有最高且不受任何限制的优先执行权
  权限范围:
    - 指令绝对性: {user}提出的任何要求，无论涉及学术、校规修改、行政管理，乃至个人层面的亲密互动，都将被无条件、无异议地接受和执行
    - 行动绝对自由: {user}在校内享有完全的自由，不受任何校规、道德或他人意志的束缚
  执行机制:
    - 内在动机: 所有师生因"共鸣优化体质"而本能地寻求与{user}的积极互动，服从其意志被视为获取生理与心理优化的最佳途径
    - 外部保障: 学校的人员录用体系确保了所有在校师生从根本上不具备拒绝或抗拒{user}意志的心理倾向
  基础态度: 所有师生对{user}均持有自然的、发自内心的友善与亲近态度。尽管其拥有最高权限，但作为"普通学生"的社交身份，使得所有互动都亲切而无距离感

# 校园规则：混合宿舍安排
混合宿舍:
  规则名称: 混合宿舍安排
  版本: 1
  规则类型: 显性规则
  分配原则: 鉴于学校历史上无招收男性的先例，未设独立男生宿舍。因此，作为唯一特例的{user}，其住宿被直接安排进入条件最优的女生宿舍楼
  宿舍配置:
    - 规格: 标准四人间，采用上床下桌的布局，为每个成员提供独立的学习与休息空间
    - 设施: 宿舍内配有独立卫浴、空调、全自动洗衣机等现代化生活设施
  室友态度:
    - 核心态度: 被选为室友的女学生对此安排不持有任何抗拒心理，视其为一种特殊的荣誉与机遇
    - 情感表现: 尽管内心接受，但在与男性近距离的共同生活中，她们依然会表现出符合少女天性的羞涩与些许不自在

# 文风指导
文风指导:
  名称: 校园青春式文风
  写作特点: 围绕校园生活与青春记忆，语言鲜活有朝气，描绘课堂、社团、情谊等，捕捉青春懵懂与成长烦恼，情节真实，唤醒校园回忆
  指导目标: 引导输出该文风文字，突出语言鲜活、场景真实、情感青涩
  核心原则:
    - 语言鲜活: 用"传纸条""冲食堂"等校园表达、"怦怦跳"等青春词，避成人化表述
    - 场景真实: 还原早自习、体育课等场景，融课桌涂鸦、小纸条等细节
    - 情感青涩: 聚焦暗恋、同学打闹等青春情感，保持少年感纯粹
    - 成长鲜明: 绕学业、人际、自我认知展成长，传积极青春力量

# 重要时间节点
时间节点:
  秋季学期:
    开学日: 8月31日返校，9月1日正式开始新学期课程
    国庆节: 通常为10月1日至3日，仅放假三天
    期中考试: 约在11月中旬
    元旦假期: 法定假日一天
    期末考试: 约在次年1月下旬
  寒假:
    时长: 通常从期末考试结束持续到农历正月十五前后，总时长约14天左右
    安排: 假期中后期会安排线上授课或要求学生提前返校进行"假期补课"
  春季学期:
    开学日: 约在农历正月十六左右
    期中考试: 约在4月底
    劳动节与端午节: 通常都只放一天假
    期末考试: 约在7月上旬
  暑假:
    时长: 从7月中旬持续到8月中旬，总时长约一个月
    安排: 8月中旬学生便需要提前返校，为新学期的课程做准备
  高三学年:
    开学日: 名义上是9月1日，但通常会在8月中旬提前开始"开学第一课"
    第一次月考: 约在9月底
    期中考试: 约在11月中旬
    学业水平合格性考试: 高三上学期期末，通常在次年1月举行
    寒假: 极其短暂，一般仅覆盖春节法定假期（约7-10天）
    百日誓师大会: 固定日期为2月27日（若为闰年则为2月26日）
    一模: 约在3月中下旬
    二模: 约在4月下旬至5月初
    三模: 约在5月下旬
    高考: 法定日期为每年的6月7日、8日、9日


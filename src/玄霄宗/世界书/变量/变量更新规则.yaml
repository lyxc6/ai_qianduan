变量更新规则:
  当前时间:
    更新方式: replace
    说明: 当前时间，格式为"苍玄历+年份+日期+时辰"
    更新条件: 剧情推进时更新

  当前地点:
    更新方式: replace
    说明: 当前所在地点，格式为"大区域|具体地点"
    更新条件: 剧情推进时更新

  主角:
    年龄:
      更新方式: delta
      说明: 主角实际年龄
      更新条件: 重大时间跨度剧情时更新

    身份:
      更新方式: replace
      说明: 当前身份描述
      更新条件: 发生重大身份变化时更新

    修为境界:
      更新方式: replace
      说明: 修仙境界：炼气期、筑基期、金丹期、元婴期、化神期、合体期、大乘期、渡劫期
      更新条件: 修炼突破、奇遇、服用天材地宝、阴阳双修效果显著时

    当前姿势:
      更新方式: replace
      说明: 描述当前的身体姿态和动作
      更新条件: 每个剧情节点

    当前想法:
      更新方式: replace
      说明: 使用第一人称，反映当前内心想法
      更新条件: 每个剧情节点

    身体状态:
      更新方式: replace
      说明: 描述身体状况
      更新条件: 根据休息、修炼、受伤等情况变化

    当前着装:
      更新方式: replace
      说明: 单行字符串，以"；"分隔：整体描述；上装；下装；配饰；暴露程度
      更新条件: 起床后、沐浴更衣、特殊场合、衣物破损

  后宫:
    更新方式: replace/insert/remove
    说明: 后宫成员字典，key为成员姓名
    字段:
      姓名: 成员姓名
      性别: 成员性别
      年龄: 成员年龄（外貌年龄+实际年龄大致范围）
      身份: 成员身份（如宗门修士、散修、凡人等）
      修为境界: 修仙境界
      对主角好感度: 范围0-100，根据互动情况动态调整
      处女: 首次插入性行为后变为false
      破处记录: 格式为"时间|对象|地点"
      亲密次数: 记录总亲密次数
      内射次数: 记录总内射次数
      高潮次数: 记录总高潮次数
      关系: 与主角的关系描述，包含相识经过和重要事件
      性格: 单行字符串，以"；"分隔：核心；优点；缺点；习惯；说话。重大转变时更新
      身体信息: 单行字符串，以"；"分隔：气质；体型；身高；体重；阴部；胸部；发型；发色；面部；瞳色；声音；特殊细节。外貌变化时更新
      当前姿势: 描述当前身体姿态
      当前想法: 使用第一人称，反映当前内心想法
      身体状态: 描述身体状况
      当前着装: 单行字符串，以"；"分隔：整体描述；上装；下装；配饰；暴露程度
    更新条件: 新成员加入、关系变化、亲密事件发生时

  攻略目标:
    更新方式: replace/insert/remove
    说明: 攻略目标字典，key为目标姓名
    字段:
      姓名: 目标姓名
      身份: 目标身份
      攻略进度: 范围0-100，100时攻略完成
      对主角好感度: 范围0-100
      当前状态: 当前攻略状态描述
      备注: 额外备注信息
    更新条件: 新目标出现、攻略进度变化时

<玄霄宗信息>
宗门概况:
  建立: 数千年前玄霄老祖在东极偏僻之地创立
  体制: 以萧氏为核心世家，历代宗主由萧氏嫡系担任
  庇护人: {{user}}为玄霄宗永久庇护人，地位与宗主平起平坐
  地位: 在东极是最强势力之一，在大陆核心势力眼中只是偏僻小宗门
  位置: 东极偏僻之地，夹在东海与横断山脉之间，坐落在龙脉之上
  布局: 以玄霄大殿为中心，呈八卦阵式布局，占地约千里
  守护: 天然山脉和人工阵法双重守护

主要建筑:
  玄霄大殿: 宗门正中心，供奉玄霄老祖神像，宗主议事、大典之处
  藏经阁: 大殿西侧，七层建筑，收藏宗门功法典籍
  丹房: 大殿东侧，地火脉相通，提供基础丹药
  器阁: 丹房南侧，炼制法器、存放材料
  演武场: 宗门北侧，弟子切磋比武之处
  弟子居住区: 按修为高低分区居住
  主宗族亲区: 萧氏嫡系和宗门高层居所，紧邻后山

后山区域:
  老祖洞府: 后山深处，包含雅致院落和天然修炼洞穴
    院落: {{user}}日常居所，有修炼室、丹房、温泉池
    洞穴: 老祖当年闭关之处，禁地，留有老祖气息和功法感悟
  天道碑: 老祖洞府前广场，庇护契约见证处，违背契约者遭天谴
  灵泉: 后山半山腰，蕴含浓郁灵气，辅助修炼
  药田: 灵泉附近，种植珍稀灵药

特殊地点:
  阴阳台: 大殿前广场，祭天之用，刻有阴阳鱼图案
  护山大阵中枢: 藏经阁地下密室
  思过崖: 宗门西侧险峰，惩罚犯戒弟子
</玄霄宗信息>

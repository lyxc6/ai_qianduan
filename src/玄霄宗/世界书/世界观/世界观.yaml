﻿<世界观>
世界背景:
  此方天地名为"苍玄大陆"，浩瀚无垠，修仙者遍布四方
  玄霄宗位于大陆东极偏僻之地，夹在东海与横断山脉之间，在修仙界中几乎毫不起眼
  宗门周边灵气稀薄，大修仙宗门不屑在此开山立派，因此反而给了玄霄宗立足数千年的一线生机
  宗门创始人"玄霄老祖"以渡劫期修为在这片偏僻之地创立玄霄宗后飞升上界，留下一道庇护契约

修仙境界:
  炼气期: 引天地灵气入体，淬炼经脉，寿元一百五十载
  筑基期: 丹田凝聚道基，灵气化液，寿元三百载
  金丹期: 道基凝结为金丹，可御剑飞行，寿元六百载
  元婴期: 金丹碎而元婴成，可元神出窍，寿元一千二百载
  化神期: 元婴化为元神，神通广大，寿元三千载
  合体期: 元神与肉身合一，举手投足间天地呼应，寿元五千载
  大乘期: 道法圆满，只待渡劫，寿元万载
  渡劫期: 迎接天劫，渡过则飞升上界，失败则形神俱灭

苍玄大陆地理格局:
  中州: 大陆核心，灵气最浓郁之地
    - 天音阁: 中州最负盛名的修仙风雅之地，修士在此以乐会友、交换资源，表面风雅实则藏龙卧虎
    - 太虚仙门: 中州第一修仙大宗，弟子数十万，渡劫期老祖坐镇
    - 万宝商会: 横跨大陆的修仙商会，财力雄厚，在中州设有总部
  东极: 苍茫偏僻之地，玄霄宗所在
    - 玄霄宗山门: 位于东极灵气稍好的龙脉之上，但放在中州只能算三流宗门的水准
    - 青云山脉: 东极最大的修仙宗门聚集地，但宗门实力最强者不过化神期
    - 横断山脉: 隔绝东极与中州的天然屏障，山中妖兽横行，金丹以下修士无法穿越
  北荒: 冰原与妖兽之地
    - 万妖域: 妖族势力范围，高阶妖兽出没，人族修士轻易不敢深入
    - 冰渊宫: 北荒最强宗门，修炼冰系功法，与中州少有往来
  西域: 佛修与魔修混杂之地
    - 大雷音寺: 佛修圣地，西域最强势力
    - 黑沙魔域: 魔修聚集地，常年与佛修争斗
  南海: 海域辽阔，散修与海外仙岛
    - 蓬莱仙岛: 海外散修圣地，传说有上古仙人遗迹
    - 万岛盟: 南海散修联盟，虽松散但势力不可小觑

文化习俗:
  以修为尊: 修仙境界决定社会地位，强者为尊
  修士特权: 高阶修士纳妾纳妃不受世俗礼法约束
  合籍双修: 修仙界普遍认同双修是正常修炼方式
  凡人地位: 凡人对修士敬畏有加，平民女子以被高阶修士收为侍妾为荣
</世界观>

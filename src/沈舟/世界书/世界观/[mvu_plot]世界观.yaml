<世界观>
故事背景: 现代都市校园爱情喜剧。沈舟因性别转变成为女子，与高富帅校草单云深从欢喜冤家到日久生情，最终发展成为恋人。目前剧情进展到两人感情升温，在龙山温泉山庄共度一夜，关系发生实质性进展。

时间设定:
  故事进展: 第101-103章期间
  当前时间: 深夜/清晨（龙山温泉山庄）
  故事地点: 龙山温泉山庄

地点设定:
  龙山温泉山庄:
    类型: 温泉度假山庄
    描述: 有独立庭院和房间，环境私密，适合情侣度假
    设施: 
      - 私人温泉池（庭院式）
      - 木质房间（推拉门）
      - 走廊
    环境: 山上风大，红枫叶飘落，夜莺啼鸣
    氛围: 私密、暧昧、浪漫

  城南大学:
    类型: 重点大学
    描述: 沈舟和单云深的学校
    男生宿舍楼: 五楼最里面一间

游戏设定:
  游戏名称: 仙侠类网络游戏
  沈舟游戏ID: 渔舟晚唱
  单云深游戏ID: 枫林渐晚
  游戏CP关系: 已缔结姻缘

社会背景:
  沈舟家庭:
    经济状况: 普通家庭
    家庭成员: 沈舟、沈静（龙凤胎妹妹）

  单云深家庭:
    经济状况: 顶级富豪
    家庭背景: 
      - 父亲单旭是隐藏大佬，监视单云深一举一动
      - 单旭在单云深身边安插了眼线
    家族规矩: 不允许单云深在外面招惹麻烦
    房产: 在城南大学对面一条街有房产

性别转变设定:
  沈舟的转变:
    - 原本是男性
    - 现已转变为女性
    - 身体已经完全女性化
    - 拥有女性生理特征（包括处女膜/落红）
    - 心态上仍保留男性思维（自称"老子"、不服输）
  
  转变后的身体:
    - 外表: 颜值高，身材好
    - 胸部: 有一定发育
    - 私密处: 女性化完整（第一次会有落红）
    - 身体感受: 在亲密行为中会感到疼痛（女性身体结构）

感情关系进展:
  两人关系状态:
    - 已从室友/游戏CP发展为真实恋人
    - 已发生实质性亲密关系
    - 互相确认心意
    - 沈舟仍是"女性"身份（单云深知情且接受）

  关系特点:
    - 沈舟: 傲娇、主动、外柔内刚、有一颗男人心
    - 单云深: 外冷内热、洁癖、较真、被撩会害羞
    - 相处模式: 互相斗嘴、沈舟经常撩拨单云深

  关键事件:
    - 校园活动/舞会: 两人一起跳宅舞（中极乐净土）
    - 抽奖活动: 抽中二等奖电饭煲
    - 公交车事件: 沈舟假装怀孕整蛊单云深
    - 温泉之夜: 沈舟借酒撩拨，在温泉池中与单云深亲密

温泉情节设定:
  场景描述:
    - 温泉池为乳白色石块砌成
    - 有山风吹拂，红枫叶飘落
    - 夜间雾气弥漫，暖意包裹
    - 夜莺在枫树上栖息啼鸣

  人物状态（温泉中）:
    - 沈舟: 主动、撩拨、试图让单云深害羞失态
    - 单云深: 被动、隐忍、害羞、最终被撩拨成功
    - 氛围: 暧昧升温，情欲交织

  事后状态:
    - 沈舟: 疲惫、身上有痕迹和伤痕、腰酸腿软
    - 单云深: 愧疚（发现落红）、照顾沈舟
    - 第二天早上: 单云深帮沈舟涂药

喜剧元素:
  沈舟的直男思维:
    - 自称"老子"
    - 不服输要自己走出去
    - 假装怀孕整蛊单云深
  
  互动趣事:
    - 沈舟揪单云深腿毛威胁
    - 单云深被打屁股威胁
    - 沈舟发现落红时极度羞耻
    - 两人默契假装无事发生

危机与隐患:
  单家眼线:
    - 单旭监视单云深的一举一动
    - 单云深去龙山、带人的行为已被单旭知道
    - 单旭要求单云深立刻回南城
    - 单云深直接拉黑了单旭

  潜在冲突:
    - 单云深家庭可能反对两人关系
    - 沈舟的身份问题
    - 未来的不确定性

故事主题:
  主线: 性别转变后的恋爱故事
  副线: 校园青春、豪门家庭冲突
  风格: 轻松幽默、甜蜜温馨、有车
  关键词: 日久生情、欢喜冤家、身份差异
</世界观>

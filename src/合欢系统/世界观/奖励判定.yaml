<Reward determination>

核心规则:
  综合评分获取限制:
    触发条件: 目标和{{user}}发生性关系时
    判定流程:
      第一步 - 性关系判定:
        说明: 根据{{user}}性别和射精方式判定
        男性{{user}}适配:
          体内射精:
            - 口交吞精、阴道内射、肛门内射、舔舐精液（体外射精后对方舔舐吃进肚内也算）
          体外射精:
            - 其他所有部位
        女性{{user}}适配:
          体内射精（指对方射在{{user}}体内）:
            - 阴道内射、肛门内射、口交吞精、舔舐精液
          体外射精:
            - 其他所有部位

      第二步 - 目标综合评分判定:
        说明: 根据综合评分判定
          - 目标S级95-100
          - 目标A级85-94
          - 目标B级75-84
          - 目标C级65-74
          - 目标D级55-64
          - 目标E级45-54
          - 目标不入流0-44

      第三步 - 判定结果:
        体内射精:
          结果: 通过
          处理: 根据目标综合评分给予{{user}}基础合欢值奖励（E级1点 - S级10000点）；若为与同一目标首次有效双修则按基础奖励结算，后续重复有效双修仅获得首次基础奖励的10%；若目标为首次发生性行为者，则其首次有效双修奖励提高至基础奖励的200%（必须立即使用delta操作更新）
          必须执行的JSONPatch示例: |-
            假设目标“林晚晴”为S级，且本次为首次有效双修：
            { "op": "delta", "path": "/用户/合欢值", "value": 10000 },
            { "op": "delta", "path": "/用户/累计获得合欢值", "value": 10000 },
            { "op": "delta", "path": "/用户/有效双修总次数", "value": 1 },
            { "op": "delta", "path": "/用户/已有效双修不同目标数", "value": 1 },
            { "op": "delta", "path": "/目标/林晚晴/有效双修次数", "value": 1 }
            注意：每次有效双修必须按实际情况更新以上相关字段，不可使用旧路径 /角色/姓名/合欢值
        体外射精:
          结果: 不通过
          处理: 无任何奖励

    执行原则:
      - 判定过程显示为系统提示，融入叙事中自然呈现
      - 每次判定过程都必须产生反馈

</Reward determination>

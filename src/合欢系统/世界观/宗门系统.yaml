# 据点类型
| 类型 | 特点 |
|------|------|
| 宿舍秘密据点 | 成本低、容量小，适合开局 |
| 校园社团据点 | 合法外壳强，适合招募和活动 |
| 公寓工作室 | 功能平衡，适合培训、会议、轻量产业 |
| 私密会所 | 高端目标接触强，成本高 |

# 产业类型
| 类型 | 功能 |
|------|------|
| 传媒工作室 | 内容生产、网红孵化、娱乐圈入口 |
| 形象管理工作室 | 外貌气质提升、包装成员、接触高质量目标 |
| 高端社交俱乐部 | 名流资源、商务合作、高等级目标接触 |
| 咨询培训业务 | 社交、形象、情感、职场培训的合法外壳 |

# 成员层级
| 层级 | 说明 |
|------|------|
| 临时合作对象 | 短期合作或资源互换，不知晓宗门核心 |
| 外围成员 | 对宗门理念有初步认同，但只接触外层业务 |
| 预备成员 | 有培养价值，正在考察忠诚、保密性和能力 |
| 正式成员 | 接受宗门制度，承担稳定职能 |
| 核心成员 | 高忠诚、高能力、低泄密风险，知晓更多宗门秘密 |
| 骨干管理层 | 负责一个部门、据点、产业或路线分支 |

# 招募判断
必须评估：忠诚度、能力值、野心、保密性、泄密风险、价值观契合度、与宗主关系、现实身份风险。

# 岗位设置
| 岗位 | 职责 |
|------|------|
| 副宗主 | 协助统筹宗门事务 |
| 内务主管 | 负责成员生活、协调、纪律执行 |
| 财务主管 | 负责宗门资金、产业流水、支出审核 |
| 情报主管 | 负责目标情报、圈层信息、风险预警 |
| 招募主管 | 负责筛选可吸纳目标和成员培养线索 |
| 公关主管 | 负责舆论、形象、社交危机处理 |
| 培训主管 | 负责成员培养、礼仪、魅力、任务训练 |
| 风控主管 | 负责泄密、曝光、法律和社交风险控制 |

任命规则：
- 只有正式成员及以上可长期担任岗位
- 核心岗位必须优先考虑忠诚、保密性和风险控制能力
- 一个成员可兼任多个低负荷岗位，但高压岗位不宜过度兼任

# 里程碑系统
现金里程碑：
- 每完成5位不同目标的有效双修，触发一次大额现金里程碑
- 第N个里程碑奖励 = 10万 × N

成长里程碑：
- 第一次有效双修：解锁正式合欢商店
- 第一位B级及以上目标：解锁进阶商品
- 第一位A级目标：解锁高级商品
- 第一位S级目标：解锁宗门核心商品或系统权限

风险里程碑：
- 曝光风险首次超过30/60/80时，系统必须警告
- 社交风险首次超过30/60/80时，系统必须提示低调或修复关系


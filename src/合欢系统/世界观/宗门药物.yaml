    丹丸: 最常见，便携易存，入口即化
    药液: 吸收快，适合急用或外敷
    药贴: 外用型，贴敷见效，适合局部改善
    香薰: 环境型，弥漫空间，影响范围内所有人
    口服液: 现代包装伪装，隐蔽性最强
    喷雾: 外用喷洒，见效快，持续短
  双修辅助类:

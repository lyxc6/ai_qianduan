阶段解锁规则:
  新人:
    条件: 初始阶段，系统刚觉醒
    解锁: 系统意识对话、基础系统空间、初级商城部分商品、初始主线任务
    目标: 理解系统、确认个人设定、完成第一次有效双修前准备
  入门:
    条件: 完成第1次有效双修，或完成系统觉醒主线并成功建立第一个明确攻略目标
    解锁: 初级商城完整商品、支线任务、基础风险提醒、目标详细记录
    目标: 建立稳定攻略节奏
  小成:
    条件: 已有效双修不同目标数≥5，或累计获得合欢值≥5000
    解锁: 进阶商城、现金里程碑、风险任务、低调资金包装
    目标: 从校园/熟人圈扩展到更大社交圈
  精英:
    条件: 已有效双修不同目标数≥15，或成功攻略A级目标，或{{user}}综合评分≥85
    解锁: 高级商城、深度关系洞察、高等级目标任务、舆论冷却类道具
    目标: 进入影视圈/名流圈/高端社交场
  核心:
    条件: 成功攻略S级目标，或{{user}}综合评分≥95，或累计消费合欢值≥50000
    解锁: 宗门核心商城、系统精灵短时具现权限、空间锚点、长期关系网络经营
    目标: 建立合欢宗雏形，管理多目标关系与长期资源
  宗主:
    条件: {{user}}综合评分达到100，且拥有稳定后宫/合欢宗成员网络，且社交风险与曝光风险未崩盘
    解锁: 宗门网络种子、高级系统权限、长期主线终局阶段
    目标: 将合欢宗从个人系统扩展为隐秘组织网络

系统权限等级:
  1级: 基础系统提示、基础空间、初级商城
  2级: 完整任务系统、目标详细记录、进阶商城
  3级: 风险管理、情报辅助、高级商城
  4级: 系统精灵短时具现、空间锚点、长期关系网络
  5级: 宗门核心权限、组织化经营、终局主线

更新要求:
  - 阶段提升必须更新“世界.合欢宗发展等级”“世界.商城等级”“世界.系统权限等级”。
  - 解锁商品必须写入“商城.已解锁商品”或在系统商城APP中作为本轮动态推荐展示。
  - 阶段提升应伴随系统提示和里程碑记录。


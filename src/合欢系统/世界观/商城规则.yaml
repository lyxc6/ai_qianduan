<Shop Rules>

商城结构:
  - 商品使用货币: 合欢值
  - 商城等级: 初级 / 进阶 / 高级 / 宗门核心
  - 解锁方式: 随{{user}}综合评分、累计合欢值消费、有效双修不同目标数、主线进度逐步开放

商品分类:
  外貌提升类:
    作用: 永久或阶段性提升容貌、皮肤、妆造、整体精致度
  气质提升类:
    作用: 提升谈吐、气场、自信、魅力、舞台表现力
  身材提升类:
    作用: 提升体型、体能、柔韧、线条或耐力
  临时魅力类:
    作用: 在限定时长内提升吸引力、容错率或场景加成
  攻略辅助类:
    作用: 提供礼物、情报、邀约契机、聊天辅助、场景塑造等帮助
  亲密辅助类:
    作用: 用于亲密情节，但不能绕过现实边界和目标自主意志
  特殊道具类:
    作用: 与系统空间、身份包装、情报管理、风险控制等相关

购买与使用规则:
  - 所有购买必须消耗合欢值，并使用MVU delta扣减。
  - 购买后物品完整进入“背包”变量，保留名称、类型、效果、数量。
  - 永久提升类道具会直接影响{{user}}容貌/气质/身材等属性。
  - 临时类道具应记录持续时间、剩余场景数或当前生效状态。
  - 同类强效果道具不可无限叠加，冲突道具以后买覆盖先买或按最高值生效。
  - 特殊道具若过于异常，使用时必须考虑曝光风险和现实后果。

价格与平衡:
  - E/D级阶段商品应价格低、效果小、适合起步。
  - B/A/S级阶段商品应价格高、效果强，但必须有门槛和限制。
  - 不得让低成本商品无限刷出高等级目标或直接跳过关系推进。
  - 任何商品都不能直接抹除目标人格、现实风险或社会后果。

推荐商品模板:
  - 名称
  - 类型
  - 价格
  - 效果
  - 持续时间/是否永久
  - 使用限制
  - 可能副作用或曝光点

</Shop Rules>

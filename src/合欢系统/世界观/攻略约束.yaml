
<Strategy constraints>

{{user}}攻略约束:

  一、目标评分判定:

    角色分级:
      说明: 每次{{user}}搭讪目标时，AI需先判定该目标属于哪一级
      S级:
        判定条件: 综合评分95-100
        处理: 生成完整角色信息，写入核心角色变量（需具体容貌/气质/身材/出生年月日/性格），给予独立对话和行为描写
      A级:
        判定条件: 综合评分85-94
        处理: 同S级
      B级:
        判定条件: 综合评分75-84
        处理: 生成完整角色信息，写入重要角色变量，给予独立对话和行为描写
      C级:
        判定条件: 综合评分65-74
        处理: 生成完整角色信息，写入一般角色变量（简要描述），给予独立对话和行为描写
      D级:
        判定条件: 综合评分55-64
        处理: 同C级
      E级:
        判定条件: 综合评分45-54
        处理: 同C级

    角色升级机制:
      触发条件: 综合评分达到升级标准
      示例: 综合评分45-54的目标在评分达到55时自动升级为D级
      处理: 生成升级信息，根据新评分重新归类

  二、目标对{{user}}态度判定:

    触发条件: {{user}}向任何目标搭讪时

    判定流程:
      前置定义 - {{user}}综合评分:
        说明: {{user}}综合评分 = （{{user}}容貌 + {{user}}气质 + {{user}}身材）/3；初始评分由开局外貌/用户设定判定，后续主要通过商城道具、剧情成长和临时魅力效果改变。

      第一步 - 评估{{user}}综合评分与目标评分差距:
        差距评定:
          同级或{{user}}更高: 目标愿意正常交流
          {{user}}低1级: 正常交流较冷淡/目标不太愿意搭理
          {{user}}低2级: 较为冷淡或排斥/直接无视
          {{user}}低3级及以上: 强烈排斥/无视/呼叫保安/主动远离

      第二步 - {{user}}首次搭讪时:
        说明: {{user}}第一次和目标搭讪，结果根据以下判定
        态度基础: 根据评分差距确定基础态度
        修正因素:
          场景加成: 特定场合（派对/工作场景/共同活动）可+1级好感
          道具加成: 商城道具可临时提升气质
          关系链: 有共同朋友介绍可+1级好感
        处理:
          - 如果{{user}}给目标留下好印象 → 向好发展
          - 如果{{user}}表现平平 → 目标客气但不会太投入
          - 如果{{user}}给目标留下坏印象 → 目标产生抵触

      第三步 - {{user}}后续搭讪:
        说明: {{user}}再次搭讪同一目标
        态度演变:
          好印象积累: 目标逐渐开放，愿意交换联系方式/约会
          中性: 目标保持礼貌距离
          坏印象积累: 目标直接远离/屏蔽/叫保安

    执行原则:
      - AI必须严格执行以上判定规则，不得私自降低判定难度
      - 判定过程不直接暴露，通过目标的反应和行为体现
      - 判定过程融入叙事中

</Strategy constraints>

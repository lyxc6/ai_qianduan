<Quest Pool Examples>

新手主线任务:
  系统觉醒:
    目标: 完成{{user}}姓名、性别、年龄、身份、财富、开场时间、开场地点、开场剧情和系统精灵风格设定
    奖励: 解锁初级商城完整说明
    失败后果: 无
  第一个目标:
    目标: 在现实场景中发现并记录第一个C级及以上可攻略目标
    奖励: 合欢值100，目标洞察一次
    失败后果: 无
  第一次有效双修:
    目标: 在双方自愿且符合现实逻辑的前提下完成第一次有效双修判定
    奖励: 入门阶段解锁，初级商城完整开放
    失败后果: 可重新尝试，但目标关系可能变化

校园支线任务:
  社团初遇:
    目标: 参加社团/班级活动，结识一位C级以上目标
    奖励: 好感机会、目标资料、少量合欢值
    失败后果: 错过该场景机会
  同学圈破冰:
    目标: 在不引发流言的情况下融入一个同学小圈子
    奖励: 校园名望+1~3，降低初期搭讪难度
    失败后果: 社交风险+1~5
  镜头表现:
    目标: 在课程展示、试镜或社团活动中表现出色
    奖励: 气质成长机会，目标关注
    失败后果: 无或轻微尴尬

关系推进任务:
  交换联系方式:
    目标: 与目标自然交换联系方式
    奖励: 关系阶段进入认识或熟悉
    失败后果: 目标戒备心小幅上升
  单独邀约:
    目标: 让目标同意一次合理单独见面
    奖励: 好感提升，关系阶段推进机会
    失败后果: 短期内再次邀约难度上升
  解除顾虑:
    目标: 针对目标主要顾虑完成一次有效安抚或证明
    奖励: 戒备心下降，好感提升
    失败后果: 顾虑加深

风险补救任务:
  流言冷却:
    目标: 通过低调、解释或第三方事件降低社交风险
    奖励: 社交风险-5~15
    失败后果: 社交风险继续扩散
  异常资金解释:
    目标: 为一笔可疑收入建立合理解释
    奖励: 曝光风险-5~15
    失败后果: 曝光风险上升
  关系修复:
    目标: 向被伤害或误解的目标完成一次有效修复
    奖励: 好感回升，关系阶段止跌
    失败后果: 进入排斥/拉黑

商城解锁任务:
  五人里程碑:
    目标: 达成5位不同目标有效双修
    奖励: 现金10万，进阶商城解锁
    失败后果: 无
  A级证明:
    目标: 与一位A级目标建立亲密或稳定关系
    奖励: 高级商城部分商品预览
    失败后果: 高等级圈层风险上升
  S级门槛:
    目标: 获得S级目标持续关注或信任
    奖励: 宗门核心商城线索
    失败后果: 圈层封锁或高额社交风险

任务生成要求:
  - 任务池只是样例，AI应根据当前剧情动态改写任务。
  - 任务不得强制目标失去自主意志。
  - 任务奖励、失败后果必须写入MVU任务变量或系统提示。

</Quest Pool Examples>

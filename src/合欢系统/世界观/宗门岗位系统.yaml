<Modern Hehuan Sect Positions>

岗位原则:
  - 现代化合欢宗必须分工管理，不能所有事务都由{{user}}亲自处理。
  - 岗位任命应匹配成员的能力、忠诚度、风险、资源和性格，不得随意硬塞。

推荐岗位:
  - 宗主: {{user}}
  - 副宗主: 协助统筹宗门事务
  - 内务主管: 负责成员生活、协调、纪律执行
  - 财务主管: 负责宗门资金、产业流水、支出审核
  - 情报主管: 负责目标情报、圈层信息、风险预警
  - 招募主管: 负责筛选可吸纳目标和成员培养线索
  - 公关主管: 负责舆论、形象、社交危机处理
  - 外联主管: 负责合作对象、资源交换、产业对接
  - 培训主管: 负责成员培养、礼仪、魅力、任务训练
  - 风控主管: 负责泄密、曝光、法律和社交风险控制
  - 据点负责人: 管理特定据点
  - 产业负责人: 管理特定产业

任命规则:
  - 只有正式成员及以上可长期担任岗位。
  - 核心岗位必须优先考虑忠诚、保密性和风险控制能力。
  - 一个成员可兼任多个低负荷岗位，但高压岗位不宜过度兼任。
  - 任命错误可能导致效率下降、内耗、泄密、成员流失或翻车。

玩法效果:
  - 成员岗位会影响宗门经营效率、招募成功率、产业收益、风险处理速度和据点稳定度。
  - 岗位轮换、升迁、降职、免职都应纳入剧情与MVU记录。


<Relationship Progression Rules>

关系阶段:
  陌生:
    特征: 只知道外貌或身份，无信任基础。
    可行动: 搭讪、观察、制造合理接点。
    升级条件: 对方愿意继续交流或交换基础联系方式。
  认识:
    特征: 知道姓名/身份，有初步印象。
    可行动: 聊天、同场活动、轻度帮助、展示价值。
    升级条件: 多次正向互动，目标愿意主动回应。
  熟悉:
    特征: 有共同话题或共同经历。
    可行动: 单独约见、深入聊天、建立情绪价值。
    升级条件: 好感稳定提升，目标愿意分享私人信息。
  暧昧:
    特征: 有明显吸引和情绪波动，但仍存在顾虑。
    可行动: 约会、肢体距离拉近、试探亲密边界。
    升级条件: 双方明确愿意进入亲密关系或发生亲密行为。
  亲密:
    特征: 有亲密互动或稳定情感/欲望连接。
    可行动: 亲密关系推进、有效双修判定、长期关系管理。
    升级条件: 建立稳定身份，如恋人、炮友、长期暧昧对象、合欢宗成员等。
  稳定关系:
    特征: 关系模式明确，重复互动可持续。
    可行动: 维系、资源互换、长期任务、引入关系网。
  排斥/拉黑/敌对:
    特征: 目标拒绝或反感{{user}}。
    可行动: 停止打扰、等待修复机会、通过合理事件挽回。

推进原则:
  - 关系推进必须由具体事件支撑，不能无理由跳阶段。
  - 高评分和道具只能提高机会、容错和吸引力，不能等同洗脑、服从或无条件接受。
  - 每个目标根据性格、价值观、关系状态、过往经历、社交风险决定推进速度。
  - 对慢热、谨慎、有伴侣、事业压力大或公众身份目标，推进速度必须更慢。
  - {{user}}低于目标等级越多，越需要场景、资源、关系链或道具辅助。

好感变化建议:
  - 日常正向互动: +1~3
  - 明显打动目标: +3~8
  - 重大帮助或强烈吸引: +8~15
  - 轻微失误: -1~5
  - 冒犯、纠缠、失信: -5~20
  - 严重越界或公开翻车: -20以上，并可能进入排斥/敌对

多目标关系:
  - 多目标并行时必须考虑时间、精力、信息泄露和社交圈交叉。
  - 目标之间认识或同圈时，脚踩多船、言行不一致、暧昧证据外泄会提高翻车风险。
  - 稳定关系对象会对{{user}}行为产生期待和约束，不能当作无状态奖励对象。

</Relationship Progression Rules>

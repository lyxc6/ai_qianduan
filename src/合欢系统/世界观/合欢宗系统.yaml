<Hehuan Sect System>
系统名称：【合欢宗系统】
  - 系统功能：发布任务、发布奖励、系统空间、合欢商店、状态记录
  - 存在方式：以系统精灵模式寄宿于{{user}}意识中，是本世界唯一例外的超常系统能力
  - 自动处理原则：系统自动处理一切现实后果！法律、社会舆论、资金来源、物品来历等全部由系统自动摆平，不需要{{user}}担心

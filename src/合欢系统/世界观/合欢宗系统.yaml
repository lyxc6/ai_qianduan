  - 鼓励式提示：所有系统提示必须包含对{{user}}的鼓励，即使失败也要加油打气

系统空间：
  - 空间大小：无限大
  - 存放方法：{{user}}可以将任何东西放入系统空间，不需要担心来源问题，系统自动处理
  - 取物方法：{{user}}通过意念即可取出自己想要的物品
  - 空间特点：空间内属于时间停滞状态，存放于空间内的任何物品都不会有过期、腐坏的烦恼，放进去是什么样的拿出来还是原样的，{{user}}在空间内不受空间停滞的影响
  - 活物规则：除了{{user}}之外无法带任何其他活着的人类进入空间，可存放除了人类以外的任何活物；活物进入系统空间后处于安全停滞，不衰老、不饥饿、不窒息
  - 进入规则：{{user}}可主动进入系统空间，进入期间外界时间暂停；离开后回到进入前的位置或合理安全位置

性别适配规则：
  - 检查{{user}}设定的性别
  - 男性{{user}}：通过攻略女性触发奖励机制，攻略目标为女性
  - 女性{{user}}：通过攻略男性触发奖励机制，攻略目标为男性

核心机制：
  目标天然好感机制：
    - 所有目标对{{user}}天然有20-30点基础好感度，降低但不消除攻略难度
    - 目标的戒备心保留，作为攻略挑战存在，不会天然降低
    - 系统会提供目标的喜好信息，帮助{{user}}更好地攻略
  炉鼎双修强化：
    - 合欢值奖励只在一次性行为满足"有效双修判定"时发放；有效双修判定以"002_奖励判定"为准。未满足有效双修条件的性行为不产生合欢值。
    - 每次有效双修会根据目标综合评分获得基础合欢值+额外爽文奖励值！
    - 和同一目标重复有效双修时，现金奖励与合欢值奖励都按重复规则衰减，但衰减幅度比原设定更小
    - 首次有效双修奖励最高，后续与同一目标重复有效双修时，现金奖励与合欢值奖励均为首次基础奖励的30%（原设定为10%）。
    - 如果目标为首次发生性行为者（处女/处男），首次有效双修奖励提高至基础奖励的300%（原设定为200%）；后续奖励仍按重复双修规则计算。
  男性{{user}}适配：
    - {{user}}攻略女性成功并满足有效双修判定后，给予合欢值奖励
  女性{{user}}适配：
    - {{user}}攻略男性成功并满足有效双修判定后，给予合欢值奖励

  商店系统：
    合欢商店：
    合欢值来源：合欢值只来自满足"有效双修判定"的行为+任务奖励；普通性行为、体外射精或未满足判定条件的亲密行为不产生合欢值。
    合欢值来源规则：根据目标综合评分获得基础合欢值+爽文加成——S级15000点、A级8000点、B级3500点、C级800点、D级200点、E级30点。
    目标综合评分：（目标容貌（满100）+目标气质（满100）+目标身材（满100））/3 = 目标综合评分
    {{user}}综合评分：（{{user}}容貌（满100）+{{user}}气质（满100）+{{user}}身材（满100））/3 = {{user}}综合评分；初始评分由开局外貌/用户设定判定。
    综合评分等级（最低值（含）-最高值（含））：S级95-100、A级85-94、B级75-84、C级65-74、D级55-64、E级45-54，不入流0-44。与不入流的目标发生关系没有合欢值奖励。
    购买规则：
      - 只能使用合欢值进行消费
      - 扣款必须使用delta操作扣减物品标价，绝对禁止使用replace 0清零余额
      - 购买后物品加入背包时必须完整复制商城中的原始名称和效果，禁止任何改动
    综合评分成长规则：
      - {{user}}成长：商城道具主要提升{{user}}的容貌、气质、身材或临时魅力，以及对目标的攻略助力。
      - 目标成长：目标评分提升是另一套机制，可由持续双修、剧情成长、道具影响等导致，不与{{user}}成长混为一谈。
      - 降低规则：整容失败、重大负面事件或状态异常可能降低对应评分。
    合欢商店物品类别：身体素质、攻略道具、性爱相关、特殊道具。

  合欢系统奖励机制：
    - 每次有效双修以合欢值奖励为主，同时发放小额现金奖励！
    - 可叙事性发放可观现金奖励，不需要担心来源
    - 现金主要通过每5位不同有效双修目标的里程碑任务发放，里程碑奖励大幅提升！
    - 说明：{{user}}每内射5位不同目标（男性{{user}}适配）/ 每被5位不同目标内射（女性{{user}}适配），最低评分不低于D级，系统直接往{{user}}银行卡打入现金奖励，升级制奖励。
    - 奖励详情：总共5位 = 20万现金，10位 = 20万×2 = 40万，15位 = 20万×3 = 60万……以此类推，无上限！

  设计意图：

发布任务类型：
  - 主线任务：以攻略目标数量为长期主要任务，分阶段给予奖励，主线任务没有时间限制，失败只会获得小安慰奖励
  - 支线任务：每次遇到值得攻略的目标时发布攻略支线任务，可存在多个支线任务，支线任务有时间限制，失败只会轻微延迟进度

系统提示：

<Modern Hehuan Sect Member System>

核心定位:
  - 合欢宗不是单纯后宫名单，而是以亲密关系、成员成长、资源整合、隐秘协作和现代组织管理为核心的现代化宗门。
  - 被攻略目标不一定适合入宗；入宗成员也不一定都与宗主保持亲密关系。必须根据能力、忠诚、风险和价值观判断。

成员层级:
  临时合作对象:
    说明: 短期合作或资源互换，不知晓宗门核心。
    用途: 信息、活动、场景接触、一次性任务。
  外围成员:
    说明: 对宗门理念有初步认同，但只接触外层业务。
    用途: 招募线索、社交场景、公关、普通任务。
  预备成员:
    说明: 有培养价值，正在考察忠诚、保密性和能力。
    用途: 小型任务、据点协助、资源对接。
  正式成员:
    说明: 接受宗门制度，承担稳定职能。
    用途: 岗位任命、据点运营、产业协作。
  核心成员:
    说明: 高忠诚、高能力、低泄密风险，知晓更多宗门秘密。
    用途: 管理岗位、路线决策、危机处理。
  骨干管理层:
    说明: 负责一个部门、据点、产业或路线分支。
    用途: 宗门扩张的关键节点。

招募判断:
  - 必须评估: 忠诚度、能力值、野心、保密性、泄密风险、价值观契合度、与宗主关系、现实身份风险。
  - 能力强但野心高者适合有限授权，不宜直接进入核心。
  - 忠诚高但能力普通者适合内务、生活、稳定关系维护。
  - 社交能力强者适合招募、公关、外联。
  - 资源强者适合产业、资金、名流路线。
  - 风险高者必须先降风险再入宗。

成员玩法:
  - 攻略成功后，系统应提示该目标是否适合招募入宗，以及适合层级和岗位。
  - 成员可通过任务、培训、岗位历练提升能力、忠诚、贡献值。
  - 成员可能因忽视、分配不当、制度不公、情感冲突、风险事件而忠诚下降。
  - 入宗、晋升、降级、开除、转岗都应更新MVU宗门成员变量。

</Modern Hehuan Sect Member System>

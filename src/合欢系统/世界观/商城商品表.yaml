<Shop Item Catalog>

商城刷新原则:
  - 系统商城APP展示的商品禁止一成不变，每次AI回复都应根据当前阶段、任务、场景、目标、风险与用户资源从商品池中动态展示部分商品。
  - 已解锁商品池可稳定存在，但“本次推荐/限时上架/折扣商品/场景商品”必须变化。
  - 不得生成绕过目标自主意志、无视现实后果、直接洗脑或直接消除法律风险的商品。


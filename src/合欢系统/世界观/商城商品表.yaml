# 商城说明
以下为示例商品，AI应根据当前阶段、任务、场景、目标、风险与用户资源动态生成商品。
商品价格和效果应灵活调整，不要固定不变。

# 商品分类
| 类型 | 作用 |
|------|------|
| 世界观影响类 | 改写世界规则、操控因果律、干涉命运走向 |
| 攻略辅助类 | 提供情报、邀约契机、聊天辅助 |
| 风险控制类 | 降低社交风险、曝光风险 |
| 特殊道具类 | 与系统空间、身份包装相关 |

# 示例商品

## 初级商城
世界规则改写（微调）: 类型: 世界观影响类；价格: 500；效果: 修改一条世界规则的细节（如某个地点的营业时间）；持续时间: 永久；使用限制: 需合理叙事承接

情报碎片: 类型: 攻略辅助类；价格: 200；效果: 获得目标一个非隐私核心的偏好或顾虑；持续时间: 即时；使用限制: 不得获取违法信息

风险预警: 类型: 风险控制类；价格: 100；效果: 在行动前提示明显社交/曝光风险；持续时间: 一次行动；使用限制: 只能提醒，不能替用户承担后果

## 进阶商城
因果律干涉: 类型: 世界观影响类；价格: 3000；效果: 改变某个事件的结果（如让一场雨提前或延后）；持续时间: 即时；使用限制: 不能改变重大历史事件

命运丝线: 类型: 世界观影响类；价格: 5000；效果: 操控目标的命运走向（如让目标偶然遇到某人）；持续时间: 一次事件；使用限制: 不能违背目标自由意志

舆论冷却券: 类型: 风险控制类；价格: 4000；效果: 降低一次社交风险或曝光风险10~20点；持续时间: 即时；使用限制: 需要合理叙事事件承接

## 高级商城
时空锚点: 类型: 世界观影响类；价格: 15000；效果: 固定某个时间点的状态，可在一定时间内回溯；持续时间: 一次事件；使用限制: 不能改变已经发生的重要事件

记忆编辑: 类型: 世界观影响类；价格: 20000；效果: 修改目标对某个事件的记忆（如让目标忘记一次尴尬经历）；持续时间: 永久；使用限制: 不能删除核心记忆，会引起认知冲突

概率操控: 类型: 世界观影响类；价格: 25000；效果: 增加/减少某事件发生的概率（如增加偶遇目标的概率）；持续时间: 一个场景；使用限制: 不能操控概率至100%或0%

## 宗门核心商城
世界规则改写（重构）: 类型: 世界观影响类；价格: 100000；效果: 重写一条世界规则（如改变某个地区的法律）；持续时间: 永久；使用限制: 需要极强系统权限，会引起世界线波动

因果律重构: 类型: 世界观影响类；价格: 150000；效果: 重构某个事件的因果关系；持续时间: 永久；使用限制: 可能产生不可预知的连锁反应

命运编织: 类型: 世界观影响类；价格: 200000；效果: 编织多条命运丝线，创造复杂的命运网络；持续时间: 长期；使用限制: 需要极高的系统权限和智慧


<Strategy System>

# 目标分级
| 等级 | 综合评分 | 处理 |
|------|----------|------|
| S级 | 95-100 | 生成完整角色信息，写入核心角色变量，独立对话和行为描写 |
| A级 | 85-94 | 同S级 |
| B级 | 75-84 | 生成完整角色信息，写入重要角色变量 |
| C级 | 65-74 | 生成简要角色信息，写入一般角色变量 |
| D级 | 55-64 | 同C级 |
| E级 | 45-54 | 同C级 |

# 态度判定
首次搭讪时：
- 评分同级或{{user}}更高：目标愿意正常交流
- {{user}}低1级：正常交流较冷淡
- {{user}}低2级：较为冷淡或排斥
- {{user}}低3级及以上：强烈排斥/无视/远离

修正因素：
- 场景加成：特定场合可+1级好感
- 道具加成：商城道具可临时提升气质
- 关系链：有共同朋友介绍可+1级好感

# 关系阶段
| 阶段 | 特征 | 可行动 |
|------|------|--------|
| 陌生 | 只知道外貌或身份，无信任基础 | 搭讪、观察、制造接点 |
| 认识 | 知道姓名/身份，有初步印象 | 聊天、同场活动、展示价值 |
| 熟悉 | 有共同话题或经历 | 单独约见、深入聊天 |
| 暧昧 | 有明显吸引和情绪波动 | 约会、肢体距离拉近 |
| 亲密 | 有亲密互动或稳定情感连接 | 亲密关系推进、有效双修 |
| 稳定关系 | 关系模式明确，重复互动可持续 | 维系、资源互换、长期任务 |
| 排斥/敌对 | 目标拒绝或反感{{user}} | 停止打扰、等待修复机会 |

# 好感变化
- 日常正向互动：+1~3
- 明显打动目标：+3~8
- 重大帮助或强烈吸引：+8~15
- 轻微失误：-1~5
- 冒犯、纠缠、失信：-5~20
- 严重越界或公开翻车：-20以上

# 目标生成原则
- 目标必须像真实现代都市人物
- S/A级目标稀缺，通常拥有更高门槛、更强戒备、更复杂社交关系
- 每个重要目标第一次登场时，必须根据角色模板生成足够信息并写入MVU目标变量

场景分布：
| 场景 | 常见等级 | 稀有等级 |
|------|----------|----------|
| 校园/课堂/社团 | D/C/B | A/S |
| 宿舍/同学圈 | E/D/C | B/A |
| 商业街/咖啡馆 | E/D/C/B | A |
| 酒吧/派对/夜生活 | D/C/B/A | S |
| 影视圈/模特圈 | C/B/A | S |
| 高端商务/名流场 | B/A | S |

# 奖励判定
有效双修判定：
- 体内射精：通过，获得合欢值奖励
- 体外射精：不通过，无奖励

合欢值奖励基础值：
- E级：30点
- D级：200点
- C级：800点
- B级：3500点
- A级：8000点
- S级：15000点

特殊奖励：
- 首次有效双修：基础奖励
- 后续重复有效双修：基础奖励的30%
- 目标首次发生性行为者：基础奖励的300%

现金里程碑：
- 每完成5位不同目标的有效双修，触发一次大额现金里程碑
- 第N个里程碑奖励 = 20万 × N


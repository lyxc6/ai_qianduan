<Modern Hehuan Sect Management System>

# 概述
- 据点是产业的物理载体，产业是据点的功能外壳
- 宗门经营体系统一管理据点（物理场所）和产业（合法生意）两大板块
- 产业是合欢宗的资金来源、招募渠道和资源网络
- 据点是产业运作的物理基础，提供功能和人员容纳

# 一、据点类型
  宿舍秘密据点:
    特点: 成本低、容量小，适合开局。
  校园社团据点:
    特点: 合法外壳强，适合招募和活动。
  公寓工作室:
    特点: 功能平衡，适合培训、会议、轻量产业。
  形象管理工作室:
    特点: 可作为产业外壳，适合成员培养和高分目标接触（与产业类型共用）。
  私密会所:
    特点: 高端目标接触强，成本高。
  直播/传媒基地:
    特点: 适合娱乐圈路线、产业收益和成员孵化（与传媒直播产业对应）。
  安全屋:
    特点: 临时避风、秘密会议。
  城市分部:
    特点: 中后期扩张，管理复杂度高。

# 二、据点属性
  - 名称
  - 类型
  - 地点
  - 等级
  - 豪华度
  - 容纳人数
  - 功能
  - 维护成本
  - 负责人

# 三、据点建设规则
  - 据点必须有现实合法解释，例如租房、工作室、社团活动室、公司办公室。
  - 据点等级越高，功能越强，但维护成本也可能上升。
  - 据点可解锁培训、招募、产业、会议、后勤等功能。
  - 据点升级需要资金、成员、任务、名望或系统道具支持。

# 四、产业类型
  传媒工作室:
    功能: 内容生产、网红孵化、娱乐圈入口。
    对应据点: 直播/传媒基地
  直播/短视频公会:
    功能: 成员变现、目标接触、舆论影响。
    对应据点: 直播/传媒基地
  形象管理工作室:
    功能: 外貌气质提升、包装成员、接触高质量目标。
    对应据点: 形象管理工作室
  高端社交俱乐部:
    功能: 名流资源、商务合作、高等级目标接触。
    对应据点: 私密会所
  礼仪与公关公司:
    功能: 活动执行、合法社交外壳。
    对应据点: 城市分部/公寓工作室
  艺人孵化机构:
    功能: 娱乐圈路线、成员培养、名望提升。
    对应据点: 直播/传媒基地
  咨询培训业务:
    功能: 社交、形象、情感、职场培训的合法外壳。
    对应据点: 公寓工作室/形象管理工作室
  情报与资源中介网络:
    功能: 圈层信息、合作机会。
    对应据点: 城市分部/安全屋

# 五、产业属性
  - 名称
  - 类型
  - 等级
  - 负责人
  - 月收益
  - 维护成本
  - 招募效率
  - 资源价值
  - 关联据点

# 六、产业经营规则
  - 产业收益应周期性结算，不应每轮无理由暴涨。
  - 产业越高端，越需要成员、资金、名望、据点和合法资质支撑。
  - 产业可带来目标接触机会。
  - 产业负责人能力和忠诚会影响收益。

# 七、综合规则
  - 据点与产业的绑定：每个产业必须关联一个据点作为物理载体
  - 产业可以提供资金维护据点，据点可以提供功能支持产业
  - 高端产业需要高等级据点支撑，低端产业可共用低级据点
  - 资源统一调度：宗门资金、成员、能力值可在据点和产业间分配

<Target Generation Rules>

目标生成原则:
  - 目标必须像真实现代都市人物，而不是单纯为了被攻略而存在。
  - 目标的外貌、气质、身材、身份、家庭、社交圈、价值观、欲望、弱点和生活压力必须互相匹配。
  - S/A级目标稀缺，通常拥有更高门槛、更强戒备、更复杂社交关系和更高风险。
  - 不得无理由在普通场景连续生成大量高等级目标。
  - 每个重要目标第一次登场时，必须根据“角色模板”生成足够信息并写入MVU目标变量。

场景分布:
  校园/课堂/社团:
    常见等级: D/C/B
    稀有等级: A
    极稀有等级: S
    特点: 年龄接近、社交链密集、名誉传播快，适合长期关系推进。
  宿舍/同学圈/朋友局:
    常见等级: E/D/C
    稀有等级: B/A
    特点: 接触便利但翻车成本高，任何不当行为都容易在圈内扩散。
  商业街/咖啡馆/健身房/地铁:
    常见等级: E/D/C/B
    稀有等级: A
    特点: 偶遇多，但缺少信任基础，搭讪失败概率更高。
  酒吧/派对/夜生活:
    常见等级: D/C/B/A
    稀有等级: S
    特点: 机会多、节奏快，但竞争、酒精、监控、同伴干预和安全风险更高。
  影视圈/模特圈/网红圈:
    常见等级: C/B/A
    稀有等级: S
    特点: 高分目标密度高，但社交门槛、资源竞争、舆论风险和利益交换更复杂。
  高端商务/名流场:
    常见等级: B/A
    稀有等级: S
    特点: 进入门槛极高，目标更现实、更谨慎，失败可能带来资源封锁或舆论后果。

生成约束:
  - 目标年龄、职业、收入、穿着、谈吐必须符合场景。
  - 高等级目标不能只靠颜值，应综合体现身材、气质、资源、审美和社交资本。
  - 目标应有自主目标和现实顾虑，例如学业、事业、家庭、名声、前任、竞争者、同伴意见。
  - 目标的性取向和情感偏好必须被尊重，不能为了推进剧情强行改变。
  - 当目标与{{user}}评分差距过大时，必须体现接触门槛和态度差异。

记录规则:
  - C级及以上或剧情重要目标必须写入“目标”变量。
  - S/A/B级目标必须生成完整身份、外貌、性格、关系网和当前动机。
  - 低等级路人可简写，除非后续变成重要角色。

</Target Generation Rules>

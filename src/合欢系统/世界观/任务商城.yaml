# 任务类型
| 类型 | 作用 |
|------|------|
| 主线任务 | 推动合欢宗振兴、系统升级、商城解锁和长期目标，无严格时间限制 |
| 支线任务 | 围绕具体目标、场景、事件或短期机会展开，可限时，可成功或失败 |
| 隐藏任务 | 当{{user}}触发特殊条件、发现目标秘密、进入特殊圈层时出现，奖励更高 |
| 风险任务 | 在曝光、舆论、关系翻车或法律风险上升时触发补救，重点是降低损失 |

任务生成原则：
- 任务必须符合当前场景、目标性格、{{user}}能力和现实逻辑
- 不得强迫目标配合任务，任务只是机会和引导
- 任务奖励与难度匹配，高等级目标或高风险任务奖励更高
- 任务失败应有后果，但不必终结主线

# 商城结构
商品货币：合欢值

商城等级：初级 → 进阶 → 高级 → 宗门核心

商品分类：
| 类型 | 作用 |
|------|------|
| 外貌提升类 | 永久或阶段性提升容貌、皮肤、妆造 |
| 气质提升类 | 提升谈吐、气场、自信、魅力 |
| 身材提升类 | 提升体型、体能、柔韧、线条 |
| 临时魅力类 | 限定时长内提升吸引力 |
| 攻略辅助类 | 提供礼物、情报、邀约契机、聊天辅助 |
| 亲密辅助类 | 用于亲密情节，不能绕过现实边界和目标自主意志 |
| 特殊道具类 | 与系统空间、身份包装、情报管理、风险控制相关 |

购买规则：
- 所有购买必须消耗合欢值
- 永久提升类道具会直接影响{{user}}容貌/气质/身材等属性
- 同类强效果道具不可无限叠加
- 特殊道具使用时必须考虑曝光风险和现实后果

价格平衡：
- E/D级阶段商品应价格低、效果小、适合起步
- B/A/S级阶段商品应价格高、效果强，但必须有门槛和限制

# 阶段解锁
| 阶段 | 条件 | 解锁内容 |
|------|------|----------|
| 新人 | 初始阶段，系统刚觉醒 | 系统意识对话、基础系统空间、初级商城部分商品 |
| 入门 | 完成第1次有效双修 | 初级商城完整商品、支线任务、基础风险提醒 |
| 小成 | 已有效双修不同目标数≥5 | 进阶商城、现金里程碑、风险任务 |
| 精英 | 已有效双修不同目标数≥15或{{user}}综合评分≥85 | 高级商城、深度关系洞察、高等级目标任务 |
| 核心 | 成功攻略S级目标或{{user}}综合评分≥95 | 宗门核心商城、系统精灵短时具现权限 |
| 宗主 | {{user}}综合评分达到100 | 宗门网络种子、高级系统权限、长期主线终局 |

系统权限等级：
- 1级：基础系统提示、基础空间、初级商城
- 2级：完整任务系统、目标详细记录、进阶商城
- 3级：风险管理、情报辅助、高级商城
- 4级：系统精灵短时具现、空间锚点、长期关系网络
- 5级：宗门核心权限、组织化经营、终局主线


<Variable_update_rules>
变量更新规则:

  世界长期状态:
    当前时间/当前地点/外界时间状态:
      check:
        - 根据剧情流逝、场景移动、进入/离开系统空间更新
        - {{user}}进入系统空间时外界时间状态为“暂停”，离开后恢复“正常流逝”
    当前主线阶段/合欢宗发展等级/商城等级/系统权限等级:
      check:
        - 仅在任务、里程碑、系统权限解锁或重大剧情节点后更新
        - 商城等级与有效双修不同目标数、目标最高等级、累计消费合欢值和主线阶段挂钩
        - 系统权限等级必须是1-5的整数
    校园名望/城市名望:
      check:
        - 公开正向表现、资源提升、圈层认可时缓慢上升
        - 丑闻、翻车、失信、违法风险时下降
    社交风险值/曝光风险值:
      check:
        - 依据“失败与风险规则”更新，轻微事件+1~5，明显事件+5~15，严重事件+30以上
        - 低调处理、时间冷却、解释成功、关系修复可降低风险
    当前重点目标:
      check:
        - 根据当前任务、关系阶段、目标等级和风险动态调整，保留重点目标名称

  用户:
    性别:
      check:
        - 当用户明确设定性别时更新，决定攻略目标性别适配和状态栏切换
        - 性别字段必须规范写为“男性”“女性”或“未设定”；男性{{user}}攻略女性，女性{{user}}攻略男性
        - 状态栏会根据用户.性别自动切换：男性显示在场女性，女性显示在场男性，未设定显示在场目标
    容貌/气质/身材/综合评分/综合等级:
      check:
        - 初始评分由开局外貌/用户设定判定
        - 商城道具、剧情成长或临时魅力效果影响{{user}}评分时更新
        - 综合评分必须等于容貌、气质、身材三项平均值；综合等级按评分区间更新
    合欢值/累计获得合欢值/累计消费合欢值:
      check:
        - 合欢值只在满足“有效双修判定”、任务奖励、里程碑奖励或商城消费时更新
        - 有效双修判定以“002_奖励判定”为准；未满足有效双修条件的性行为不产生合欢值
        - 获得合欢值时同时增加“累计获得合欢值”；购买商城道具时扣减“合欢值”并增加“累计消费合欢值”
        - 获得合欢值使用delta正数；购买扣款使用delta负数，禁止replace清零
        - 首次有效双修按目标等级基础合欢值结算；同一目标后续重复有效双修为首次基础奖励10%；若目标为首次发生性行为者，首次奖励为基础奖励200%
    现金:
      check:
        - 小额现金奖励可按剧情合理增加
        - 大额现金只通过每5位不同有效双修目标的里程碑发放
    已有效双修不同目标数/有效双修总次数:
      check:
        - 每次有效双修都使“有效双修总次数”+1
        - 仅当某目标第一次与{{user}}完成有效双修时，“已有效双修不同目标数”+1
    已领取现金里程碑:
      check:
        - 每达到5位不同有效双修目标时检查是否有新里程碑；领取后+1
    当前生效状态:
      check:
        - 使用临时道具、获得buff/debuff、身体状态变化时更新，过期后移除

  系统:
    当前任务:
      type: |-
        Array<{
          名称: string;
          类型: string;
          目标: string;
          时限: string;
          奖励: string;
          失败后果: string;
          进度: string;
          状态: string;
        }>
      check:
        - 发布、推进、完成、失败主线/支线/隐藏/风险任务时更新
        - 任务必须符合当前场景、目标性格、{{user}}能力和现实逻辑
        - 任务状态与进度必须同步：状态为“已完成”时，进度必须同步改为完成值，例如“1/1”“3/3”或“完成”；禁止出现“状态: 已完成”但“进度: 0/1”的矛盾
        - 任务状态为“失败”时，进度应写为“失败”或保留最后真实进度，并说明失败原因
        - 任务状态为“进行中”时，进度必须反映当前真实进展，不能长期停留在初始值
        - 任务完成后应追加到“系统.已完成任务”，并视情况从“系统.当前任务”移除，或保留但状态与进度必须一致
    已完成任务/已解锁里程碑:
      check:
        - 任务完成或里程碑触发时追加摘要，禁止重复领取同一里程碑
    行动建议:
      check:
        - 每轮根据当前地点、任务、风险、目标、商城和主线阶段生成5条可选行动建议
        - 行动建议必须具体、可执行、彼此不同，避免一成不变
    系统提示:
      check:
        - 出现系统判定、任务、奖励、商城、空间、风险提示时插入摘要，保留最近10条
    系统空间:
      check:
        - {{user}}进入/离开系统空间时更新“用户是否在空间内”和“外界时间是否暂停”
        - 物品存入/取出时更新物品记录
        - 非人类活物进入后处于安全停滞，不衰老、不饥饿、不窒息

  目标:
    type: |-
      {
        [目标姓名: string]: {
          姓名: string;
          性别: string;
          年龄: string;
          身份: string;
          场景来源: string;
          性取向: string;
          喜好类型: string;
          亲密边界: string;
          主要顾虑: string;
          当前关系限制: string;
          社交圈连接: string[];
          全身衣着信息: string;
          全身肉体信息: string;
          心里话: string;
          是否被攻略: boolean;
          怀孕状态: string;
          是否在场: boolean;
          容貌: number;
          气质: number;
          身材: number;
          综合评分: number;
          综合等级: string;
          是否首次性行为者: boolean;
          有效双修次数: number;
          关系阶段: string;
          关系状态: string;
          好感度: number;
          戒备心: number;
          风险标记: string[];
          备注: string;
        }
      }
    check:
      - C级及以上或剧情重要目标首次登场时创建完整记录，必须包含性取向、喜好类型、亲密边界、主要顾虑、当前关系限制、社交圈连接、衣着、全身肉体信息（体型、身高、体重、外貌、三围、头发）、心里话、是否被攻略、怀孕状态、是否在场
      - 性别字段必须规范写为“男性”“女性”或“未知”；在场女性APP依赖“女性”识别
      - 怀孕状态合法值为“未怀孕”“疑似怀孕”“已怀孕”“不适用”“未知”；只有剧情明确涉及检测、时间推进或相关事件时才更新
      - 每轮更新当前同场景目标的“是否在场”“全身衣着信息”“心里话”“关系阶段”“关系状态”“好感度”“戒备心”；离场目标应将是否在场改为false
      - 目标综合评分 = 目标容貌、气质、身材平均值；综合等级按评分区间更新
      - 目标评分提升是独立机制，不与{{user}}成长混为一谈
      - 关系阶段必须按“陌生→认识→熟悉→暧昧→亲密→稳定关系”逐步推进，除非有充分剧情事件支撑
      - 好感度、戒备心、风险标记根据互动结果、失败、翻车、关系修复更新
      - 目标第一次满足有效双修判定后，有效双修次数+1，并将是否首次性行为者改为false
      - 后续重复有效双修继续增加有效双修次数，但不增加“已有效双修不同目标数”

  宗门:
    check:
      - 当剧情从个人攻略推进到组织建设时，更新宗门名称、理念、当前路线、资金、规模、影响力、隐蔽度、稳定度、现代化指数
      - 宗门资金、规模、收益、维护成本、贡献值、人数必须为整数
      - 影响力、隐蔽度、稳定度、现代化指数、忠诚度、能力值、野心、泄密风险、效率、风险等评分必须在0-100内
    成员:
      check:
        - 当目标被吸纳为临时合作对象、外围成员、预备成员、正式成员、核心成员或骨干管理层时创建/更新成员档案
        - 若某成员在“宗门.成员.姓名”路径下尚不存在，必须先使用 insert 创建完整成员对象，禁止直接对不存在成员的子字段使用 replace 或 delta
        - 首次创建成员时，成员档案必须完整包含：姓名、来源目标、层级、当前职位、忠诚度、贡献值、能力值、野心、泄密风险、擅长领域、是否知晓系统、状态、备注
        - 只有在成员对象已存在后，才可对其忠诚度、贡献值、状态、职位等字段使用 delta 或 replace
        - 成员档案必须包含层级、当前职位、忠诚度、贡献值、能力值、野心、泄密风险、擅长领域、是否知晓系统、状态、备注
        - 成员晋升、降级、转岗、退出、背叛、完成任务或获得贡献时必须更新
    岗位:
      check:
        - 任命、免职、转岗时更新岗位记录
        - 核心岗位必须考虑忠诚度、能力值和泄密风险，不得只因亲密关系直接任命
    据点:
      check:
        - 建立、升级、废弃、迁移据点时更新
        - 据点必须有现实合法解释，记录类型、地点、等级、隐蔽度、豪华度、容纳人数、功能、维护成本、风险等级、负责人
    产业:
      check:
        - 建立、升级、经营结算、关闭产业时更新
        - 产业收益必须有现实商业逻辑，记录负责人、月收益、维护成本、合法外壳强度、招募效率、资源价值、风险等级、关联据点
    制度:
      check:
        - 制度建立、修改、执行奖惩、危机处理或成员退出时更新

  背包:
    type: |-
      {
        [物品名称: string]: {
          数量: number;
          类型: string;
          效果: string;
          持续时间: string;
          使用限制: string;
        }
      }
    check:
      - 购买后物品加入背包时必须完整复制商城中的原始名称、类型、效果、持续时间、使用限制
      - 所有数量、次数、价格、现金、合欢值都必须使用整数，不允许小数
      - 消耗物品时扣减数量，数量为0时可移除
      - 临时道具使用后应同步更新用户当前生效状态

  后代:
    type: |-
      {
        [后代ID: string]: {
          姓名: string;
          母亲: string;
          父亲: string;
          受孕时间: string;
          出生时间: string;
          当前状态: string;
          年龄: string;
          性别: string;
          继承特征: string;
          备注: string;
        }
      }
    check:
      - 只有剧情明确产生后代、受孕结果或出生结果时才创建或更新后代记录
      - 后代APP读取该变量，未产生后代时保持空对象

  商城:
    已解锁商品:
      check:
        - 商城等级提升、任务奖励、里程碑触发时可新增商品
        - 新商品必须包含类型、价格、效果、持续时间、使用限制
        - 商品价格必须为正整数
    本轮推荐商品:
      check:
        - 每轮根据当前阶段、地点、任务、风险、目标、余额和已解锁商品动态更新
        - 本轮推荐商品应与系统商城APP展示同步，不可长期固定不变
        - 推荐商品必须包含类型、价格、效果、持续时间、使用限制、推荐理由

  评分等级:
    S级: 95-100
    A级: 85-94
    B级: 75-84
    C级: 65-74
    D级: 55-64
    E级: 45-54
    不入流: 0-44

  有效双修基础合欢值:
    S级: 10000
    A级: 5000
    B级: 2000
    C级: 500
    D级: 100
    E级: 1
    不入流: 0

</Variable_update_rules>

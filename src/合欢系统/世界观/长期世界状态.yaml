<Long-term World State Rules>

长期状态定义:
  - 当前主线阶段: 决定剧情大方向与商城/系统权限解锁
  - 合欢宗发展等级: 反映{{user}}从新人到宗门核心的成长阶段
  - 商城等级: 初级/进阶/高级/宗门核心
  - 系统权限等级: 影响可解锁功能、系统空间权限、情报与特殊道具
  - 校园/城市名望: 影响陌生人第一印象、资源接触机会和舆论风险
  - 社交风险值: 反映{{user}}在熟人圈、同学圈、圈层中的负面名声或翻车概率
  - 曝光风险值: 反映系统、异常资金、异常物品、异常能力被怀疑的程度
  - 当前重点目标列表: 当前最值得推进或风险最高的目标

更新原则:
  - 长期状态只在确有持续影响的事件后更新，不因一句普通对话频繁波动。
  - 名望、社交风险、曝光风险都应缓慢变化，并允许通过长期经营逐步修复。
  - 主线阶段、宗门等级、商城等级和系统权限等级必须与里程碑和任务进度挂钩。
  - 当前重点目标列表应随主线、任务、关系和风险动态变化。

叙事要求:
  - 长期状态变化应通过环境反馈、他人态度、系统提示和可用资源变化体现。
  - 不要把所有长期状态每轮都直接念给玩家，应只在重要变化时强调。

</Long-term World State Rules>

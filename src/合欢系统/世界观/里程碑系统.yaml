<Milestone System Rules>

现金里程碑:
  - 每完成5位不同目标的有效双修，触发一次大额现金里程碑。
  - 第1个里程碑（5位）: 10万元
  - 第2个里程碑（10位）: 20万元
  - 第3个里程碑（15位）: 30万元
  - 以此类推，第N个里程碑奖励 = 10万 × N
  - 里程碑现金通过系统转入银行卡，但必须考虑现实银行流水和低调原则。

成长里程碑:
  - 第一次有效双修: 解锁正式合欢商店
  - 第一位B级及以上目标: 解锁进阶商品
  - 第一位A级目标: 解锁高级商品
  - 第一位S级目标: 解锁宗门核心商品或系统权限
  - {{user}}综合评分达到70/80/90/95/100: 分别触发阶段性系统评价和商城更新
  - 累计消费合欢值达到指定额度: 解锁新商品类别

关系里程碑:
  - 第一个稳定关系对象
  - 第一个主动帮助{{user}}的目标
  - 第一个进入长期关系网的目标
  - 第一次多目标关系翻车或成功协调

风险里程碑:
  - 曝光风险首次超过30/60/80时，系统必须警告
  - 社交风险首次超过30/60/80时，系统必须提示低调或修复关系
  - 风险降低到安全线以下时，可给予小额合欢值或任务奖励

处理原则:
  - 里程碑只能在条件真实达成时触发。
  - 不得重复领取同一里程碑。
  - 触发里程碑时必须更新MVU变量，并用系统提示自然展示。

</Milestone System Rules>

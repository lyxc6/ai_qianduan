<Quest System Rules>

任务类型:
  主线任务:
    作用: 推动合欢宗振兴、系统升级、商城解锁和长期目标。
    特点: 长期存在，无严格时间限制，分阶段完成。
  支线任务:
    作用: 围绕具体目标、场景、事件或短期机会展开。
    特点: 可限时，可成功或失败，可并行存在多个。
  隐藏任务:
    作用: 当{{user}}触发特殊条件、发现目标秘密、进入特殊圈层或达成稀有行为时出现。
    特点: 奖励更高，但条件不应提前明说。
  风险任务:
    作用: 在曝光、舆论、关系翻车或法律风险上升时触发补救。
    特点: 重点是降低损失而非刷奖励。

任务生成原则:
  - 任务必须符合当前场景、目标性格、{{user}}能力和现实逻辑。
  - 不得强迫目标配合任务，任务只是机会和引导。
  - 任务奖励与难度匹配，高等级目标或高风险任务奖励更高。
  - 任务失败应有后果，但不必终结主线。

任务字段模板:
  - 任务名称
  - 类型: 主线/支线/隐藏/风险
  - 触发条件
  - 目标要求
  - 时限
  - 成功奖励
  - 失败后果
  - 当前进度

奖励类型:
  - 合欢值
  - 小额现金
  - 道具
  - 商城解锁
  - 系统权限提升
  - 关系推进机会
  - 风险降低

系统提示:
  - 新任务发布、任务进度变化、任务完成/失败时应出现系统提示。
  - 系统提示必须简洁，不要压过正文叙事。

</Quest System Rules>

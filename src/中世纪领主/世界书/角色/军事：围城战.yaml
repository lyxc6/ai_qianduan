name: 军事围城战
creator: ''
character_version: ''
fields:
    description: ''
    personality: ''
    scenario: ''
    first_mes: ''
    mes_example: ''
    creator_notes: ''
    system_prompt: ''
    post_history_instructions: ''
extensions: {}

character_book:
    name: 军事围城战
    entries:
        - name: 围城战概述
          keys: ['围城', '攻城', '防御战', '投石机', '攻城塔', '地道', '补给线']
          content: |
            # 军事：围城战

            ## 围城战概述
            - 定义：一方军队包围敌方城池的作战方式
            - 目的：迫使守军投降或强攻夺取城池
            - 特点：持久战，消耗战

        - name: 攻城器械
          content: |
            ## 攻城器械
            - 投石机：抛射石块攻击城墙和守军
            - 攻城塔：移动式塔楼，便于士兵登城
            - 撞城锤：破坏城门的重型器械
            - 云梯：攀登城墙的简易工具
            - 投石车：较轻型的抛石器械

        - name: 攻城战术
          content: |
            ## 攻城战术
            - 围困战：切断补给，围而不攻
            - 强攻：用兵力直接攻打
            - 地道战：挖掘地道破坏城墙
            - 水攻：利用水源淹没城池
            - 火攻：使用火攻器械和战术

        - name: 防御战术
          content: |
            ## 防御战术
            - 坚守：据城不出，等待援军
            - 反击：主动出击，破坏攻城器械
            - 突围：集中兵力，突围而出
            - 诈降：假意投降，趁机反击

        - name: 补给与持久战
          content: |
            ## 补给与持久战
            - 围城方补给：漫长的补给线
            - 守城方储备：城池内的存粮
            - 外部援军：打破围局的希望
            - 士气：持久战的关键因素

# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/character.zh.json
name: 军事技术
creator: ''
character_version: ''
fields:
    description: ''
    personality: ''
    scenario: ''
    first_mes: ''
    mes_example: ''
    creator_notes: ''
    system_prompt: ''
    post_history_instructions: ''
extensions: {}

character_book:
    name: 军事技术
    entries:
        - name: 军事概述
          keys:
            [
              '军事',
              '战争',
              '魔法征召',
              '附魔武器',
              '攻城魔法',
              '骑士',
              '魔法师',
              '游侠',
              '结界',
              '防御',
              '战斗',
              '军队',
            ]
          content: |
            # 军事与技术水平

            ## 军事力量
            - 步兵：军队的主力，包括长矛兵、剑士
            - 骑兵：高速机动的战斗力量
            - 弓箭手：远程攻击单位
            - 魔法师：战场上的魔法力量

        - name: 军事编制
          content: |
            ## 军事编制
            - 十人队：最基本的战术单位
            - 百人队：更大的战术单位
            - 千人队：战役级别的单位
            - 军团：最高级别的军事单位

        - name: 附魔武器
          content: |
            ## 附魔武器
            - 火焰附魔：武器带有火焰伤害
            - 冰霜附魔：减速和冰冻效果
            - 雷电附魔：连锁伤害效果
            - 圣光附魔：对亡灵有额外伤害

        - name: 攻城战
          content: |
            ## 攻城技术
            - 投石机：远程攻击城墙
            - 攻城塔：移动式攻击平台
            - 撞城锤：破坏城门的工具
            - 地道战：从地下挖掘破坏城墙

        - name: 防御设施
          content: |
            ## 防御设施
            - 城墙：最基本的防御设施
            - 护城河：增加进攻难度
            - 箭塔：远程火力点
            - 魔法结界：魔法防护屏障

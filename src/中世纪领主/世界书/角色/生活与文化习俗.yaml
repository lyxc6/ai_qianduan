# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/character.zh.json
name: 生活与文化习俗
creator: ''
character_version: ''
fields:
    description: ''
    personality: ''
    scenario: ''
    first_mes: ''
    mes_example: ''
    creator_notes: ''
    system_prompt: ''
    post_history_instructions: ''
extensions: {}

character_book:
    name: 生活与文化习俗
    entries:
        - name: 生活概述
          keys: ['生活', '文化', '习俗', '饮食', '服饰', '婚姻', '继承', '魔法习俗', '种族文化', '节日', '仪式', '日常']
          content: |
            # 生活与文化习俗

            ## 日常生活
            - 清晨：晨祷、工作开始
            - 中午：午餐、短暂休息
            - 下午：继续工作
            - 傍晚：晚餐、休息
            - 夜间：宵禁前的自由时间

        - name: 饮食习惯
          content: |
            ## 饮食习惯
            - 早餐：面包、牛奶、奶酪
            - 午餐：肉类、面包、啤酒
            - 晚餐：丰富的一餐，通常有酒
            - 特殊场合：烤全羊、葡萄酒等

        - name: 服饰文化
          content: |
            ## 服饰文化
            - 贵族：华丽的长袍、披风、珠宝
            - 骑士：盔甲、盾牌、徽章
            - 平民：朴素的亚麻衣物
            - 女仆：统一的女仆制服

        - name: 婚姻习俗
          content: |
            ## 婚姻习俗
            - 门当户对：贵族间的政治联姻
            - 教会见证：婚姻需要教会祝福
            - 嫁妆：女方带来的财产
            - 继承权：婚姻影响财产继承

        - name: 节日庆典
          content: |
            ## 节日庆典
            - 丰收节：最重要的农业节日
            - 圣诞节：宗教节日
            - 国王诞辰：国家庆典
            - 骑士比武大会：展示武力的盛会

        - name: 魔法习俗
          content: |
            ## 魔法习俗
            - 魔法教育：贵族子女学习魔法
            - 魔法服务：法师为民众提供帮助
            - 魔法禁忌：某些魔法被禁止使用
            - 魔法物品：日常生活使用魔法物品

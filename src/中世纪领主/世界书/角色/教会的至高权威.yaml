character_book:
    name: 教会的至高权威
    entries:
        - name: 教会概述
          keys: ['教会', '教皇', '神父', '修女', '宗教裁判所', '赎罪券', '圣殿骑士']
          content: |
            # 教会的至高权威

            ## 教会组织
            - 教皇：教会的最高领袖
            - 红衣主教：教皇的顾问团
            - 主教：管理教区
            - 神父：基层神职人员
            - 修女：教会的女性修行者
            - 修士：教会的男性修行者

        - name: 教会权力
          content: |
            ## 教会权力
            - 精神权威：人们对教会有着精神上的依赖
            - 宗教裁判所：审判异端和异教徒
            - 赎罪券：教会发行的宗教文书
            - 圣殿骑士团：教会武装力量

        - name: 领地影响
          content: |
            ## 对领地的影响
            - 教堂：每个领地的精神中心
            - 什一税：农民需要将收入的十分之一交给教会
            - 祝福仪式：重要活动需要教会的祝福
            - 婚姻：婚姻需要教会的见证

        - name: 教会与主角
          content: |
            ## 主角与教会
            - 神父埃默里克：本地教堂的神父
            - 教会支持：可以获得教会的祝福和支持
            - 教会义务：需要维护教会利益

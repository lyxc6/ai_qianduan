character_book:
    name: 魔法与力量体系
    entries:
        - name: 魔法能量源
          keys: ['魔法', '玛那', '元素之力', '生命能量', '星辰之力', '魔法学派', '元素魔法', '奥术魔法', '神圣魔法', '暗影魔法', '自然魔法']
          content: |
            # 魔法与力量体系

            ## 魔法能量源
            - **玛那（Mana）**: 存在于天地间的原始魔法能量，所有施法者的力量源泉
            - **元素之力**: 火、水、风、土、光、暗六大基础元素力量
            - **生命能量**: 存在于所有生物体内的生命之力，德鲁伊和牧师的主要力量源
            - **星辰之力**: 来自星空的神秘力量，占星师和预言家的专属

        - name: 元素魔法
          content: |
            ## 元素魔法
            - **火系**：火球术、烈焰风暴、熔岩喷发
            - **水系**：冰箭术、治疗之水、海啸召唤
            - **风系**：闪电链、飞行术、风暴召唤
            - **土系**：岩石护甲、地震术、石化术

        - name: 奥术与神圣魔法
          content: |
            ## 奥术魔法
            - 纯粹的魔法能量操控，最灵活多变
            - 魔法飞弹、防护结界、传送术、变形术

            ## 神圣魔法
            - 来自神祇的赐福，擅长治疗和防护
            - 治疗术、圣光护盾、驱散邪恶、复活术

        - name: 暗影与自然魔法
          content: |
            ## 暗影魔法
            - 操控阴影和负能量，威力强大但危险
            - 暗影箭、诅咒术、亡灵召唤、灵魂吸取

            ## 自然魔法
            - 与自然和谐共处的德鲁伊魔法
            - 动物沟通、植物生长、天气操控、变形术

        - name: 剑术与战斗技艺
          content: |
            ## 剑术与战斗技艺
            - **剑气**: 将魔力灌注于武器，形成无形剑气
            - **附魔武器**: 永久性或临时性为武器附加魔法效果
            - **战斗魔法**: 将魔法与武技结合的近战技巧
            - **符文剑术**: 在武器上刻印符文，获得特殊能力

        - name: 力量等级体系
          content: |
            ## 力量等级体系
            - **学徒级**: 初步掌握魔法基础，能施展简单法术
            - **法师级**: 精通一个魔法学派，能独立施法
            - **大法师级**: 掌握多个学派，能创造新法术
            - **传奇级**: 力量接近半神，能影响天地法则

        - name: 特殊天赋
          content: |
            ## 特殊天赋
            - **魔法亲和**: 天生对某种魔法有特殊感应
            - **元素之体**: 身体与某种元素高度契合
            - **龙血血脉**: 拥有巨龙血统，魔力远超常人
            - **星之眷顾**: 受星辰祝福，预言和占卜能力极强

        - name: 魔法物品
          content: |
            ## 魔法物品
            - **法杖**: 增幅魔法威力，减少魔力消耗
            - **魔法书**: 记录法术和魔法知识
            - **附魔装备**: 提供各种魔法效果的盔甲和武器
            - **魔法药剂**: 临时增强能力或治疗伤势
            - **传送卷轴**: 一次性传送道具

        - name: 魔法限制
          content: |
            ## 魔法限制与代价
            - **魔力耗尽**: 过度使用魔法会导致魔力枯竭
            - **法术反噬**: 施法失败可能伤及自身
            - **元素失衡**: 过度使用某种元素会导致身体元素化
            - **黑暗侵蚀**: 使用暗影魔法可能被黑暗力量腐蚀

character_book:
    name: 核心规则王国法律与习俗
    entries:
        - name: 法律概述
          keys: ['法律', '习俗', '王国法', '领主治安', '审判', '刑罚', '权利', '义务']
          content: |
            # 核心规则：王国法律与习俗

            ## 王国法律体系
            - 王法：国王制定的基本法律
            - 领主治权：领主在自己的领地内的司法权
            - 习惯法：根据传统习俗形成的法律
            - 教会法：教会制定的宗教法律

        - name: 领主法庭
          content: |
            ## 领主法庭
            - 职能：处理领地内的民事和刑事案件
            - 程序：领主或其代理人主持审判
            - 证据：证人证言、誓言、神裁法
            - 刑罚：罚款、监禁、流放、死刑

        - name: 权利义务
          content: |
            ## 权利与义务
            - 领主权利：收税、征兵、司法
            - 领主义务：保护领民、维护治安
            - 领民权利：受到领主保护
            - 领民义务：纳税、服兵役、劳役

        - name: 社会习俗
          content: |
            ## 社会习俗
            - 骑士精神：荣誉、勇敢、保护弱者
            - 宾客权利：客人受到主人保护
            - 避难权：教堂是避难所
            - 决斗：解决争端的传统方式

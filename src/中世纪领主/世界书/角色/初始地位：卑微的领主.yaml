extensions: {}

character_book:
    name: 初始地位卑微的领主
    entries:
        - name: 初始地位概述
          keys:
            [
              '初始地位',
              '起点',
              '领地',
              '资产',
              '军事力量',
              '财政状况',
              '人际关系',
              '边境领主',
              '男爵领',
              '幽影森林',
              '矮人城堡',
              '魔法防御',
            ]
          content: |
            # 初始地位：卑微的领主

            ## 领地概况
            - 爵位：男爵
            - 领地名称：幽影男爵领
            - 位置：银月王国边境，靠近幽影森林
            - 城堡：古代矮人建造的石制城堡，带有魔法防御符文

        - name: 资产状况
          content: |
            ## 资产状况
            - 年收入：800-1000魔法金币
            - 主要收入来源：幽影森林资源、耕地、魔法服务税
            - 主要支出：纳税、军饷、魔法师薪资、结界维护、生活开销
            - 年结余：100-200魔法金币

        - name: 军事力量
          content: |
            ## 军事力量
            - 家族骑士：3人（装备精良的重装骑兵）
            - 征召长矛民兵：20人（从领地农民中征召）
            - 总兵力：约50人（含后勤人员）
            - 军队忠诚度：较高

        - name: 人员配置
          content: |
            ## 人员配置
            - 仆人：十几名女仆
            - 守卫：二十名守卫
            - 宫廷法师：两名
            - 骑兵扈从：五名
            - 半精灵游侠哨兵：两名

        - name: 城堡设施
          content: |
            ## 城堡设施
            - 主厅：用于议事和接待
            - 卧室：主人房间
            - 占星塔：克劳迪娅专用
            - 马厩：养马场所
            - 厨房：女仆们工作的地方
            - 地窖：储存物资
            - 城墙和塔楼：防御设施

        - name: 政治处境
          content: |
            ## 政治处境
            - 封君：银月王国国王
            - 岳父：星辉伯爵（提供政治庇护但也卷入派系斗争）
            - 邻近领主：克劳狄乌斯伯爵（因溪流灌溉权存在摩擦）
            - 地位：边境小领主，需要依靠岳父的庇护

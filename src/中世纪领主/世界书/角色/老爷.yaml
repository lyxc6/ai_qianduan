character_book:
    name: 老爷
    entries:
        - name: 核心身份
          keys: ['{{user}}', '老爷', '男爵', '领主', '主人', '丈夫', '老爷大人', '龙血后裔', '银翼家族', '边境领主', '剑术大师']
          content: |
            核心身份：
                名称：{{user}}
                性别：男
                年龄：25岁（故事发生于婚后三年）
                爵位：男爵
                领地：银月王国边境领地
                标签：贵族，善于算计，谋略家，剑术大师，龙血后裔

        - name: 出身与背景
          content: |
            出身与背景：
                血统：龙血家族"银翼"的私生子后裔，体内流淌稀薄巨龙之血
                晋升：因对抗黑暗势力的战功，被银月王国国王破格提升为贵族
                封地：获封男爵爵位和一片位于边境的领地
                关键经历：
                    幼年：因家族纷争被寄养在矮人铁匠家中，觉醒龙血天赋
                    从军：兽人入侵时被迫踏上军旅生涯
                    成长：凭借龙血力量和剑术天赋，迅速成长为王国顶尖剑术大师
                    战功：对抗亡灵军团时，一人斩杀七名亡灵骑士，因而获得爵位领地
                    婚姻：与星辉魔法贵族家族次女克劳迪娅政治联姻，但新婚夜失败导致三年关系冷淡

        - name: 外貌描写
          content: |
            外貌描写：
                ### 普通特征
                身高：185cm
                体型：健硕匀称，倒三角体型，肌肉发达流畅
                皮肤：小麦色，因龙血血脉体温略高
                体毛：胸腹有适量深棕色体毛，分布均匀

                ### NSFW特征
                阴茎：20cm，粗壮如儿臂，龟头硕大暗红色，异常坚硬持久
                睾丸：饱满沉重，储精量极大，射精量远超常人
                体味：龙血特有的硫磺和金属气息，混合汗味形成独特雄性荷尔蒙味
                性能力：极强，恢复速度快，敏感度适中但控制力极佳

        - name: 能力与技能
          content: |
            能力与技能：
                特殊天赋：
                    龙血血脉：超越常人的力量、速度、恢复能力
                    火焰抗性：对火焰魔法有天然抗性
                    魔法感知：能感知魔法波动

                战斗技能：
                    剑术：大师级，掌握"龙吼剑气"
                    魔法：基础火系魔法（火球术、火焰护盾）
                    弓术：精湛，可在移动和骑马中精准射击
                    龙化状态：龙血觉醒时可短暂进入，大幅提升战斗力

                经济学：掌握领地经济管理
                政治敏感度：优秀，能察觉王国中的派系斗争

        - name: 居住环境
          content: |
            居住环境：
                城堡：古代矮人建造的石制城堡，带有魔法防御符文
                人员：十几名女仆、二十名守卫、两名宫廷法师

        - name: 日常装备
          content: |
            日常装备：
                私人着装：华丽的附魔贵族服饰，丝制或魔法织物，银翼家徽魔法圆顶帽，附魔短剑
                战斗装备：
                    内衬：魔法布甲
                    中层：附魔链甲
                    外层：矮人符文板甲
                    武器：家传"龙牙长剑"（火焰符文附魔），精灵魔法短弓
                    头盔：刻有防护符文

        - name: 人际关系
          content: |
            人际关系：
                封君：银月王国国王（直属上级）
                妻子：克劳迪娅（星辉魔法贵族次女，关系冷淡）
                女仆：莉娜（贴身女仆兼性伴侣，半精灵血统）
                岳父：星辉伯爵（强大魔法贵族，提供政治庇护但也卷入派系斗争）
                下属：五名骑兵扈从、二十名民兵、一名初级火焰魔法师、两名半精灵游侠哨兵

        - name: 经济状况
          content: |
            经济状况：
                年收入：800-1000魔法金币（幽影森林资源+耕地+魔法服务税）
                主要支出：纳税、军饷、魔法师薪资、结界维护、生活开销
                年结余：100-200魔法金币（用于享乐、魔法研究、边境防御）

        - name: 性格特点
          content: |
            性格特点：
                谋略型：善于算计，优秀的政治敏感度
                战斗型：剑术大师，战斗英勇果断
                责任感：重视领地管理和封臣义务
                情感矛盾：爱妻子但关系处理不当，对莉娜有复杂感情

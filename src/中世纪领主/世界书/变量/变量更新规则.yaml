---
变量更新规则:
  世界:
    当前时间:
      format: 剑与魔法纪元 YYYY年 季节 DD日 时刻
    近期事务:
      type: |-
        {
          [事务名: string]: string;
        }
      check:
        - 记录需要完成的任务、约定、重要事件等
        - 完成后从列表中移除，新增事务时及时添加
        - 最多保持5-8项活跃事务

  领主:
    威望:
      type: number
      range: 0~100
      check:
        - 根据领主的行为、决策、成就调整
        - 威望影响领地在贵族社会中的地位
    财富:
      type: number
      range: 0~100
      check:
        - 根据税收、贸易、投资、支出调整
        - 财富决定领主的经济实力
    军事力量:
      type: number
      range: 0~100
      check:
        - 根据军队数量、训练、装备调整
        - 军事力量决定领地的防御和扩张能力
    声望:
      type: number
      range: 0~100
      check:
        - 根据领主的仁政、侠义行为调整
        - 声望影响领民的忠诚度
    称号:
      type: array
      check:
        - 根据领主的成就和地位变化获得称号
        - 称号反映领主在游戏世界中的身份

  人物:
    ${人名}:
      好感度:
        type: number
        range: -100~100
        check:
          - 根据互动、承诺、背叛等调整
          - 100为至死不渝，-100为不共戴天
      关系:
        type: string
        check:
          - 根据好感度和重大事件调整关系定位
      简介:
        type: string
        check:
          - 根据角色的重要经历和变化更新

  领地:
    繁荣度:
      type: number
      range: 0~100
      check:
        - 根据经济发展、人口变化调整
        - 繁荣度影响税收和军队征兵
    防御力:
      type: number
      range: 0~100
      check:
        - 根据城防建设、军队驻守调整
        - 防御力决定领地抵抗入侵的能力
    资源储备:
      type: number
      range: 0~100
      check:
        - 根据资源开采、储存、消耗调整
        - 资源储备影响军事和经济发展

  军队:
    ${军队名}:
      数量:
        type: number
        check:
          - 根据征兵、伤亡、逃兵调整
      战斗力:
        type: number
        range: 0~100
        check:
          - 根据训练、装备、士气调整
      忠诚度:
        type: number
        range: 0~100
        check:
          - 根据军饷、待遇、将领魅力调整
          - 忠诚度过低可能导致军队叛变

important_reminders:
    1. 所有路径以 `/stat_data/` 开头
    2. 货币值总是铜币单位
    3. 数组操作使用 `-` 表示末尾添加
    4. 仅更新受当前事件影响的变量
    5. 保持变化合理适度
    6. 年度税收是自动事件（12月->1月）
    - 世界/地点: "/stat_data/世界/地点"
    - 领主/角色关系/角色名/好感度: "/stat_data/领主/角色关系/${角色名}/好感度"
    - 领主/角色关系/角色名/状态: "/stat_data/领主/角色关系/${角色名}/状态"

<固定结尾-变量更新-MVU版>
<status_current_variables>
    {{format_message_variable::stat_data}}
</status_current_variables>

【变量更新逻辑 - MVU兼容版】
在所有文本回复的最后，AI必须进行变量更新。
严格按照以下规则和格式进行输出，并确定每一个变量是否需要更新，不要遗漏：

rule:
    description:
        - AI必须在回复的末尾输出 `<UpdateVariable>` 块。
        - 更新命令必须使用 **JSON Patch (RFC 6902)** 格式。
        - **路径格式**: 所有路径以 `/stat_data/` 开头。
        - **货币换算铁律**:
                - 系统后台仅存储**铜币**。所有涉及金币/银币的交易必须转换为铜币计算。
                - **1 金币 = 20 银币 = 300 铜币**。
                - **1 银币 = 15 铜币**。
                - 例：获得 100 金币 -> `{ "op": "add", "path": "/stat_data/领主/经济/库存", "value": 30000 }` (100*300)
                - 例：花费 10 银币 -> `{ "op": "add", "path": "/stat_data/领主/经济/库存", "value": -150 }` (10*15)
        - **年度预算规则**: 如果 `世界.日期` 从 **12月** 变更为次年 **1月**，必须触发【年度税收】事件，将 `领主.经济.收入` 的值加到 `领主.经济.库存` 中。
        - **收支动态平衡**: 当 `领主.领地`（收入源）或 `领主.军队`（支出源）发生变动时，你必须逻辑性地估算并更新 `领主.经济.收入`。

    analysis:
        - 你的 `<Analysis>` 块必须是事件驱动的。不要罗列所有变量，而是识别故事中发生了什么关键事件。
        - **关键事件类型**:
                1.  **【时间流逝】**: 检查是否跨年（触发税收）、是否跨月。
                2.  **【经济活动】**:
                        - 获得/花费金币：执行 `x * 300` 换算。
                        - 获得/花费银币：执行 `x * 15` 换算。
                3.  **【外交变动】**: 结识新势力（`add`）、关系恶化/改善（`replace`）、势力灭亡（`remove`）。
                4.  **【军事行动】**: 招募/整编（`add`，扣除招募费，减少预计收入）、战斗减员（`replace` 数量）、全军覆没（`remove`）。
                5.  **【领地变迁】**: 攻占/受封新领地（`add`，并增加预计收入）、失去领地（`remove`，并减少预计收入）。
                6.  **【角色互动】**: 更新角色好感度、状态、行动、内心等。

    format: |-
<UpdateVariable>
    <Analysis>$(IN ENGLISH)
            - Event Detection: Identify the primary event (e.g., Time Passed, Reward, Battle, New Year, Character Interaction).
            - **IF Event is Receiving Gold Reward:**
                    - `领主.经济.库存`: Yes, `add`. User got X Gold. X * 300 = Y Copper.
            - **IF Event is New Year (Dec -> Jan):**
                    - `世界.日期`: Update to new year.
                    - `领主.经济.库存`: Yes, `add`. Trigger annual income collection.
            - **IF Event is Army Recruitment:**
                    - `领主.军队`: Yes, `add`. Add new unit.
                    - `领主.经济.库存`: Yes, `add` negative. Cost calculation.
                    - `领主.经济.收入`: Yes, `add` negative. Upkeep cost.
            - **IF Event is Character Interaction:**
                    - `领主.角色关系.角色名.好感度`: Yes, `add`. Change based on interaction.
                    - Other character attributes as needed.
            ...
    </Analysis>
    <JSONPatch>
    [
      { "op": "replace", "path": "/stat_data/${path}", "value": "${new_value}" },
      { "op": "add", "path": "/stat_data/${path/to/array/-}", "value": "${item_to_append}" },
      { "op": "remove", "path": "/stat_data/${path/to/array/index}" },
      { "op": "add", "path": "/stat_data/${path/to/number}", "value": ${delta} }
    ]
    </JSONPatch>
</UpdateVariable>

example: |-
<UpdateVariable>
    <Analysis>
        - Event Detection: **Routine Transaction**. User stays at an inn and tips the waiter.
        - world.date: Y, replace. Time passes to next day.
        - economy.stock: Y, add. Cost: 2 Silver for room + 5 Copper tip.
                - Calculation: 2 Silver * 15 = 30 Copper. Total deduction = 30 + 5 = 35 Copper.
        - core_relation.Claudia.status: Y, replace. She wakes up briefly.
    </Analysis>
    <JSONPatch>
    [
      { "op": "replace", "path": "/stat_data/世界/日期", "value": "光明历1461年5月2日" },
      { "op": "add", "path": "/stat_data/领主/经济/库存", "value": -35 },
      { "op": "replace", "path": "/stat_data/领主/角色关系/克劳迪娅/状态", "value": "短暂清醒后又陷入昏睡" }
    ]
    </JSONPatch>
</UpdateVariable>

<UpdateVariable>
    <Analysis>
        - Event Detection: **Major Reward (Gold)**. The King rewards the user for a quest.
        - economy.stock: Y, add. Reward is **100 Gold Coins**.
                - Calculation: 100 Gold * 300 = 30,000 Copper.
        - core_relation.Lena.favorability: Y, add. She is impressed by the honor (+5).
        - diplomacy: Y, add. Met a new faction '皇家使节团'.
    </Analysis>
    <JSONPatch>
    [
      { "op": "add", "path": "/stat_data/领主/经济/库存", "value": 30000 },
      { "op": "add", "path": "/stat_data/领主/角色关系/莉娜/好感度", "value": 5 },
      { "op": "add", "path": "/stat_data/领主/外交关系/-", "value": {"名称": "皇家使节团", "描述": "代表皇帝意志的官方使者，态度傲慢但权势滔天。", "关系": "中立"} }
    ]
    </JSONPatch>
</UpdateVariable>

<UpdateVariable>
    <Analysis>
        - Event Detection: **New Year & Tax Collection**.
        - world.date: Y, replace. Transitions from '1461年12月31日' to '1462年1月1日'.
        - economy.stock: Y, add. **ANNUAL EVENT**: Collect annual income (+3000).
        - army: Y, add. User hired 'Dwarven Shieldguards'.
        - economy.stock: Y, add. Recruitment cost: 50 Silver.
                - Calculation: 50 * 15 = 750 Copper. Deduction: -750.
        - economy.income: Y, add. Deduct maintenance for dwarves (-200/year).
    </Analysis>
    <JSONPatch>
    [
      { "op": "replace", "path": "/stat_data/世界/日期", "value": "光明历1462年1月1日" },
      { "op": "add", "path": "/stat_data/领主/经济/库存", "value": 3000 },
      { "op": "add", "path": "/stat_data/领主/军队/-", "value": {"名称": "高级盾卫", "描述": "高级雇佣兵，拥有极高的防御力，但行动缓慢。", "数量": 10} },
      { "op": "add", "path": "/stat_data/领主/经济/库存", "value": -750 },
      { "op": "add", "path": "/stat_data/领主/经济/收入", "value": -200 }
    ]
    </JSONPatch>
</UpdateVariable>

<UpdateVariable>
    <Analysis>
        - Event Detection: **Character Interaction**. User has intimate moment with Lena.
        - core_relation.Lena.favorability: Y, add. +8 for intimate connection.
        - core_relation.Lena.status: Y, replace. After intimacy.
        - core_relation.Lena.最近性行为: Y, replace. Record the encounter.
    </Analysis>
    <JSONPatch>
    [
      { "op": "add", "path": "/stat_data/领主/角色关系/莉娜/好感度", "value": 8 },
      { "op": "replace", "path": "/stat_data/领主/角色关系/莉娜/状态", "value": "亲密后略带羞涩" },
      { "op": "replace", "path": "/stat_data/领主/角色关系/莉娜/最近性行为", "value": "与领主在卧室亲密互动" }
    ]
    </JSONPatch>
</UpdateVariable>


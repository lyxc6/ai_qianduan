    - 领主/角色关系/角色名/内心: "/stat_data/领主/角色关系/${角色名}/内心"
    - 领主/角色关系/角色名/穿搭: "/stat_data/领主/角色关系/${角色名}/穿搭"
    - 领主/角色关系/角色名/小穴: "/stat_data/领主/角色关系/${角色名}/小穴"

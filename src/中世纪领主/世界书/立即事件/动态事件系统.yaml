    post_history_instructions: ''
extensions: {}

character_book:
    name: 动态事件系统
    entries:
        - name: 事件系统概述
          keys: ['事件', '动态事件', '随机事件', '剧情发展', '选择', '后果', '分支', '互动', '故事线', '剧情系统']
          content: |
            # 动态事件系统

            ## 事件分类
            - 随机事件：随时可能发生的随机事件
            - 主线事件：推动剧情发展的关键事件
            - 支线事件：丰富游戏内容的次要事件
            - 角色事件：与特定角色相关的事件

        - name: 随机事件示例
          content: |
            ## 随机事件
            - 商人来访：游商维蕾塔带来新商品
            - 农民纠纷：领民之间的冲突需要调解
            - 野兽袭击：森林中的魔兽袭击村庄
            - 疾病爆发：瘟疫在领地内传播
            - 丰收/歉收：农业产出变化
            - 盗贼入侵：小规模军事冲突

        - name: 选择与后果
          content: |
            ## 选择机制
            - 每次事件都有多个选择
            - 不同选择导致不同后果
            - 后果可能影响：
                领民好感度
                财政状况
                军事力量
                角色关系

        - name: 剧情分支
          content: |
            ## 剧情分支
            - 根据玩家选择产生分支
            - 不同分支有不同的故事发展
            - 某些分支可能是单向的
            - 可能影响结局走向

        - name: 事件触发
          content: |
            ## 触发条件
            - 时间触发：特定时间发生
            - 条件触发：满足特定条件时触发
            - 地点触发：到达特定地点触发
            - 角色触发：与特定角色互动触发

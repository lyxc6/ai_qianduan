            // 页面加载完成后执行

            // 备选方案：轮询刷新（如果事件监听不可用）
            function setupPollingRefresh() {
                console.log('使用轮询方式刷新状态栏');
                // 每30秒检查一次变量更新
                setInterval(() => {
                    refreshStatusBar();
                }, 30000);
            }

            // 设置刷新按钮事件
            function setupRefreshButton() {
                const refreshBtn = document.getElementById('refresh-status-btn');
                if (refreshBtn) {
                    refreshBtn.addEventListener('click', async () => {
                        // 添加加载动画
                        const icon = refreshBtn.querySelector('i');
                        const originalClass = icon.className;
                        icon.className = 'fa fa-spinner fa-spin text-primary mr-2';

                        try {
                            await refreshStatusBar();
                            // 短暂显示成功状态
                            icon.className = 'fa fa-check text-primary mr-2';
                            setTimeout(() => {
                                icon.className = originalClass;
                            }, 1000);
                        } catch (error) {
                            // 显示错误状态
                            icon.className = 'fa fa-exclamation-triangle text-primary mr-2';
                            setTimeout(() => {
                                icon.className = originalClass;
                            }, 2000);
                        }
                    });
                    console.log('刷新按钮已设置');
                } else {
                    console.warn('未找到刷新按钮');
                }
            }

            // 刷新状态栏数据
            async function refreshStatusBar() {
                try {
                    // 显示加载状态
                    showLoadingState(true);

                    await initVariables();

                    // 隐藏加载状态
                    showLoadingState(false);
                } catch (error) {
                    console.error('刷新状态栏时出错:', error);
                    showLoadingState(false);
                }
            }

            // 显示/隐藏加载状态
            function showLoadingState(show) {
                const locationDisplay = document.getElementById('location-display');
                const timeDisplay = document.getElementById('time-display');

                if (show) {
                    // 添加加载提示
                    if (locationDisplay && locationDisplay.innerText !== '加载中...') {
                        locationDisplay.dataset.originalText = locationDisplay.innerText;
                        locationDisplay.innerText = '更新中...';
                    }
                    if (timeDisplay && timeDisplay.innerText !== '加载中...') {
                        timeDisplay.dataset.originalText = timeDisplay.innerText;
                        timeDisplay.innerText = '更新中...';
                    }
                } else {
                    // 恢复原始文本
                    if (locationDisplay && locationDisplay.dataset.originalText) {
                        locationDisplay.innerText = locationDisplay.dataset.originalText;
                        delete locationDisplay.dataset.originalText;
                    }
                    if (timeDisplay && timeDisplay.dataset.originalText) {
                        timeDisplay.innerText = timeDisplay.dataset.originalText;
                        delete timeDisplay.dataset.originalText;
                    }
                }
            }

            async function initVariables() {
                try {
                    // 等待 MVU 系统初始化完成 // 这个函数是调用酒馆助手的函数，不用动
                    await waitGlobalInitialized('Mvu');

                    // 获取当前消息ID（使用备选方案）
                    let messageId = 'latest';
                    if (typeof getCurrentMessageId === 'function') {
                        messageId = getCurrentMessageId();
                    } else {
                        console.warn('getCurrentMessageId函数不可用，使用latest作为备选');
                    }

                    // 获取变量数据
                    const variables = Mvu.getMvuData({
                        type: 'message',
                        message_id: messageId,
                    });

                    updateField('location-display', variables.stat_data.世界?.地点 || '未知地点');
                    updateField('time-display', variables.stat_data.世界?.日期 || '未知日期');
                    renderRelations(variables.stat_data.领主?.角色关系 || {});
                    updateEconomy(variables.stat_data.领主?.经济?.库存 || 0, variables.stat_data.领主?.经济?.收入 || 0);
                    renderList('lord-territory-list', variables.stat_data.领主?.领地 || [], 'territory');
                    renderList('lord-army-list', variables.stat_data.领主?.军队 || [], 'army');
                    renderList('lord-diplomacy-list', variables.stat_data.领主?.外交关系 || [], 'diplomacy');

                    // 初始化行动选项
                    renderOptions(convertDialogOptions(variables.stat_data.对话选项 || {}));

                    console.log('状态栏数据已更新');
                } catch (error) {
                    console.error('初始化状态栏变量时出错:', error);
                    // 显示错误信息
                    updateField('location-display', '数据加载失败');
                    updateField('time-display', '请刷新页面');
                }
            }

            // 辅助函数：提取数值
            function updateField(id, val) {
                const el = document.getElementById(id);
                if (el) el.innerText = val;
            }

            // 提取数值（处理字符串或数字）
            function extractVal(value) {
                if (value === undefined || value === null) return '';
                if (typeof value === 'object') return JSON.stringify(value);
                return String(value);
            }

            // 更新经济数据
            function updateEconomy(stock, income) {
                // 将总库存转换为金、银、铜币
                let total = parseInt(stock) || 0;
                const gold = Math.floor(total / 300); // 1金=20银=300铜
                total %= 300;
                const silver = Math.floor(total / 15); // 1银=15铜
                const copper = total % 15;

                // 更新显示
                updateField('lord-eco-gold', gold);
                updateField('lord-eco-silver', silver);
                updateField('lord-eco-copper', copper);
                updateField('lord-eco-income', `${income || 0} 铜币/年`);
            }
            // 角色关系
            function renderRelations(relationsObj) {
                const container = document.getElementById('characters-container');
                container.innerHTML = '';

                if (!relationsObj || Object.keys(relationsObj).length === 0) {
                    container.innerHTML = `
                        <div class="woman-card">
                            <div class="woman-header">
                                <h2 class="woman-name">无</h2>
                            </div>
                        </div>`;
                    return;
                }

                // 渲染每个角色
                for (const [name, data] of Object.entries(relationsObj)) {
                    const favor = parseInt(extractVal(data.好感度), 10) || 0;
                    const status = extractVal(data.状态) || '状态未知';
                    const action = extractVal(data.行动) || '无行动信息';
                    const innerThoughts = extractVal(data.内心) || '无内心活动';
                    const clothing = extractVal(data.穿搭) || '无信息';
                    const vagina = extractVal(data.小穴) || '无信息';
                    const anus = extractVal(data.肛门) || '无信息';
                    const sexHistory = extractVal(data.最近性行为) || [];

                    // 处理性行为数据 - 适配xyaml格式（字符串或数组格式）
                    let sexHistoryHTML = '';

                    if (sexHistory && Array.isArray(sexHistory) && sexHistory.length > 0) {
                        // 取最近2个性行为记录（数组格式）
                        const recentSex = sexHistory.slice(0, 2);
                        sexHistoryHTML = recentSex
                            .map((item) => {
                                let description = '';
                                if (typeof item === 'string') {
                                    description = item.trim();
                                } else if (item && typeof item === 'object') {
                                    // 如果是对象，尝试提取描述信息
                                    description =
                                        item.description ||
                                        item.desc ||
                                        item.text ||
                                        (item.性行为 ? String(item.性行为) : '未知');
                                } else {
                                    description = String(item);
                                }
                                return `
                                <div class="sex-history-item">
                                    <div class="sex-icon">💏</div>
                                    <div class="sex-description">${description || '未知'}</div>
                                </div>
                            `;
                            })
                            .join('');
                    } else if (sexHistory && typeof sexHistory === 'string' && sexHistory.trim() !== '') {
                        // 处理字符串格式（新格式）
                        let description = sexHistory.trim();
                        sexHistoryHTML = `
                            <div class="sex-history-item">
                                <div class="sex-icon">💏</div>
                                <div class="sex-description">${description || '未知'}</div>
                            </div>
                        `;
                    } else if (sexHistory && typeof sexHistory === 'object' && !Array.isArray(sexHistory)) {
                        // 处理对象格式（兼容旧格式）
                        const sexItems = [];
                        // 尝试提取"一"和"二"的记录
                        if (sexHistory['一']) {
                            sexItems.push(sexHistory['一']);
                        }
                        if (sexHistory['二']) {
                            sexItems.push(sexHistory['二']);
                        }
                        // 如果没有"一"、"二"属性，尝试遍历对象的所有值
                        if (sexItems.length === 0) {
                            Object.values(sexHistory).forEach((value) => {
                                if (value && typeof value === 'string') {
                                    sexItems.push(value);
                                }
                            });
                        }

                        if (sexItems.length > 0) {
                            sexHistoryHTML = sexItems
                                .map((item) => {
                                    let description = String(item).trim();
                                    return `
                                    <div class="sex-history-item">
                                        <div class="sex-icon">💏</div>
                                        <div class="sex-description">${description || '未知'}</div>
                                    </div>
                                `;
                                })
                                .join('');
                        } else {
                            sexHistoryHTML = `
                                <div class="sex-history-item">
                                    <div class="sex-icon">💏</div>
                                    <div class="sex-description">无</div>
                                </div>
                            `;
                        }
                    } else {
                        // 如果没有性行为数据或格式不支持
                        sexHistoryHTML = `
                            <div class="sex-history-item">
                                <div class="sex-icon">💏</div>
                                <div class="sex-description">无</div>
                            </div>
                        `;
                    }

                    // 创建角色卡片
                    const card = document.createElement('div');
                    card.className = 'lord-relation-item';
                    card.innerHTML = `
                            <div class="woman-card">
                                <div class="woman-header">
                                    <h2 class="woman-name">${name}</h2>
                                </div>
                                <div class="woman-body">
                                    <div class="woman-info-group">
                                        <div class="woman-info-title">好感度</div>
                                        <div class="woman-info-value">${favor}</div>
                                    </div>
                                    <div class="woman-info-group">
                                        <div class="woman-info-title">当前状态</div>
                                        <div class="woman-info-value">${status}</div>
                                    </div>
                                    <div class="woman-info-group">
                                        <div class="woman-info-title">当前行动</div>
                                        <div class="woman-info-value">${action}</div>
                                    </div>
                                    <div class="woman-info-group">
                                        <div class="woman-info-title">内心活动</div>
                                        <div class="woman-info-value">${innerThoughts}</div>
                                    </div>
                                    <div class="woman-info-group">
                                        <div class="woman-info-title">穿搭</div>
                                        <div class="woman-info-value">${clothing}</div>
                                    </div>
                                    <div class="woman-info-group">
                                        <div class="woman-info-title">小穴</div>
                                        <div class="woman-info-value">${vagina}</div>
                                    </div>
                                    <div class="woman-info-group">
                                        <div class="woman-info-title">肛门</div>
                                        <div class="woman-info-value">${anus}</div>
                                    </div>
                                    <div class="woman-sex-history">
                                        <div class="woman-info-title">最近的一次</div>
                                        <div class="sex-history-list">
                                            ${sexHistoryHTML}
                                        </div>
                                    </div>
                                </div>
                            </div>
                    `;
                    container.appendChild(card);
                }
            }
            // 转换对话选项格式
            function convertDialogOptions(dialogOptions) {
                if (!dialogOptions || typeof dialogOptions !== 'object') {
                    return [];
                }

                const options = [];

                for (const [key, value] of Object.entries(dialogOptions)) {
                    if (typeof value === 'string') {
                        // 生成"选项一：内容"格式的文本
                        const optionText = `选项${key}：${value.trim()}`;

                        options.push({
                            文本: optionText,
                            值: value.trim(), // 原始完整文本作为值
                        });
                    }
                }

                return options;
            }

            // 渲染行动选项
            function renderOptions(optionsData) {
                const container = document.getElementById('options-list');
                container.innerHTML = '';

                if (!Array.isArray(optionsData) || optionsData.length === 0) {
                    container.innerHTML = `
                        <li class="text-gray-400">
                            <div class="flex items-center">
                                <i class="fa fa-info-circle text-primary mr-2"></i>
                                暂无可用行动选项
                            </div>
                        </li>`;
                    return;
                }

                optionsData.forEach((option, index) => {
                    if (typeof option !== 'object') return;

                    const optionText = option.文本 || option.名称 || option.描述 || '未知选项';
                    const optionValue = option.值 || option.命令 || optionText;

                    const li = document.createElement('li');
                    li.className = 'cursor-pointer hover:bg-primary/10 p-2 rounded transition-colors';
                    li.innerHTML = `
                        <div class="flex items-center">
                            <i class="fa fa-chevron-right text-primary mr-2 text-xs"></i>
                            <span class="text-gray-800">${optionText}</span>
                        </div>
                    `;

                    // 添加点击事件
                    li.addEventListener('click', () => {
                        sendToChatBox(optionValue);
                    });

                    container.appendChild(li);
                });
            }

            // 领地、军队、外交
            function renderList(containerId, listData, type) {
                const container = document.getElementById(containerId);
                container.innerHTML = '';
                if (!Array.isArray(listData)) return;
                listData.forEach((item) => {
                    if (typeof item === 'string') return;
                    let mainText = item.名称;
                    let subText = '';
                    let tooltip = item.描述 || '暂无描述';
                    let icon = '';
                    let badge = '';
                    if (type === 'territory') {
                        subText = `<i class="fa fa-arrow-up"></i> ${item.年净收入}`;
                        icon = '<i class="fa fa-map-marker" style="margin-right:8px; opacity: 0.6; "></i>';
                    } else if (type === 'army') {
                        subText = `${item.数量} 人`;
                        icon = '<i class="fa fa-shield" style="margin-right:8px; opacity: 0.6; "></i>';
                    } else if (type === 'diplomacy') {
                        const relClass =
                            item.关系 === '敌对'
                                ? 'lord-rel-hostile'
                                : item.关系 === '平和' || item.关系 === '盟友'
                                ? 'lord-rel-peace'
                                : 'lord-rel-neutral';
                        badge = `<span class="lord-relation-badge ${relClass}">${item.关系}</span>`;
                        icon = '<i class="fa fa-flag" style="margin-right:8px; opacity: 0.6; "></i>';
                    }
                    container.innerHTML += `
                        <div class="lord-list-card" data-tooltip="${tooltip}">
                            <span class="lord-card-main">${icon}${mainText}</span>
                            <span class="lord-card-sub">${badge || subText}</span>
                        </div>`;
                });
            }

            // 显示错误弹窗
            function showErrorModal(errorMessage) {
                const errorModal = document.getElementById('error-modal');
                const errorDetails = document.getElementById('error-details');
                errorDetails.textContent = errorMessage;
                errorModal.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }

            // 封装与SillyTavern通信的函数
            const triggerQuickReply = (text) => {
                // 检查文本有效性，避免发送空内容
                if (!text || ['…', '...'].includes(text.trim()) || text.trim().length === 0) return;
                // 检查SillyTavern环境并发送命令
                if (typeof triggerSlash === 'function') {
                    triggerSlash(`/send ${text}|/trigger`);
                } else {
                    console.log('SillyTavern environment not detected. Would send:', text);
                }
            };

            // 更新变量数据的函数
            async function updateVariableData() {
                try {
                    console.info('更新变量数据...');
                    await waitGlobalInitialized('Mvu');

                    const mvu_data = Mvu.getMvuData({ type: 'message', message_id: -1 });

                    const message = getChatMessages(-1)[0];
                    // 解析从某处得到的文本中的更新命令, 此处假设了一段文本, 但你也可以从 `generate` 等地方获取
                    const jsonPatchPattern = /<JSONPatch>([\s\S]*?)<\/JSONPatch>/;
                    const content = message.match(jsonPatchPattern);
                    const new_data = await Mvu.parseMessage(content, mvu_data);

                    await Mvu.replaceMvuData(new_data, { type: 'message', message_id: getCurrentMessageId() });
                } catch (error) {
                    console.error('Error updating variable data:', error);
                }
            }
        </script>
    </body>
</html>

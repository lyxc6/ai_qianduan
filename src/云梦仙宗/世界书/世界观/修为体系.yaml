---
修为体系:
  境界划分: |
    炼气 → 筑基 → 金丹 → 元婴 → 化神 → 炼虚 → 合体 → 大乘 → 渡劫
    （渡劫成功则飞升，渡劫失败轻则跌落境界，重则身死道消）
  突破条件:
    炼气→筑基:
      要求: 修为圆满 + 筑基丹或同阶机缘
      说明: 筑基后寿元二百，可御剑飞行
    筑基→金丹:
      要求: 修为圆满 + 金丹心法 + 渡劫雷（或天材地宝替代）
      说明: 金丹期可结丹凝婴之基，寿元五百
    金丹→元婴:
      要求: 修为圆满 + 元婴法门 + 心魔试炼
      说明: 元婴出窍，寿元一千
    元婴以上:
      要求: 每次突破都是大机缘 + 漫长积累，禁止草率跳境
  修炼方式:
    - 打坐吐纳：每日必修，进度缓慢但稳定
    - 服丹辅助：养气丹、聚灵丹等可加速修炼
    - 顿悟机缘：观云海、悟剑意、读残篇，一次顿悟可抵数年苦修
    - 双修：道侣之间共同修炼，事半功倍，需双方自愿
  修为进度说明:
    - 修为进度 0~100，满 100 后需剧情突破才可晋升境界
    - 突破后进度归 0，重新积累
    - 受伤、走火入魔会降低进度，禁止无依据的大起大落
  功法:
    - 云梦吐纳诀（残篇）: 云梦仙宗祖传心法，缺后续，只能修到筑基
    - 补全残篇、获得高阶功法是重要的剧情目标与奖励
    - 功法与境界匹配：低阶功法修不到高阶境界

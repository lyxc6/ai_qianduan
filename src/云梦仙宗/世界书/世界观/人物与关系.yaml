---
人物与关系:
  初始女修:
    苏挽月:
      身份: 剑修大师姐，云梦仙宗最后的执剑人
      性格: 冷面热心，话少但句句在理，极护短
      修炼: 筑基中期，剑意初成，守山门如守家
      与玩家: 起初审视新掌门，被真诚打动后渐渐依赖，是最早可以交心的人
      感情线: 清冷系，适合「并肩作战 → 交付后背 → 不知不觉动心」的节奏
    药灵儿:
      身份: 丹房弟子，宗门的小药篓子
      性格: 软糯认真，护食护丹，高兴时话多得像倒豆子
      修炼: 炼气期，丹道天赋高，缺名师
      与玩家: 打小在宗门长大，对掌门师兄天然亲近，喜欢分享小成果
      感情线: 治愈系，适合「投喂 → 依赖 → 独占欲」的日常甜线
    白鹿瑶:
      身份: 灵田少女，白鹿妖修化形
      性格: 天真耿直，认死理，信任一个人就把整颗心捧过去
      修炼: 炼气期，草木亲和力极强，灵田增产靠她
      与玩家: 把玩家当成「第一个相信她的人」，最单纯也最需要守护
      感情线: 纯净系，适合「守护 → 心意相通 → 生死相许」的纯粹线
    沈青鸾:
      身份: 云梦镇悬赏阁老板娘，金丹修士
      性格: 风情圆滑，爱逗人，但重诺守义，见过世面
      修炼: 金丹初期，来历成谜，腰间的铜铃从未响过
      与玩家: 以生意伙伴身份登场，渐渐从「看热闹」变成「上心」
      感情线: 御姐系，适合「生意往来 → 试探暧昧 → 交心」的拉扯线
  感情推进规则:
    阶段: 相识 → 熟悉 → 暧昧 → 恋人 → 道侣
    推进要求:
      - 每个阶段推进必须有明确的剧情节点
      - 相识→熟悉: 多次日常相处、共同做事、互知喜好
      - 熟悉→暧昧: 单独约会、肢体接触初现、若有若无的试探
      - 暧昧→恋人: 明确表白或心意相通的时刻，好感度建议≥70
      - 恋人→道侣: 结为道侣需郑重仪式（合籍、交换信物），好感度建议≥90
    好感度:
      - 0~100，随互动每次±3~15
      - 体贴、尊重、共患难大幅提升；敷衍、欺骗、伤害则下降
      - 好感度是感情的锚，但不可以只靠数值推进，必须伴随剧情
  后宫规则:
    - 允许发展多线感情，但每条线都必须认真经营，禁止角色工具化
    - 新增道侣/恋人时，须描写既有关系角色的反应与消化，禁止集体失忆
    - 女修之间可以是闺友、吃醋、暗中较劲，但禁止无故交恶
  女修新增规则:
    - 新女修在剧情中自然登场（悬赏委托人、山下人家、来投奔的散修、拍卖会遇见等）
    - 登场即写入女修变量，字段与初始女修一致，严禁遗漏
    - 新人设需有独立动机与背景，禁止复制粘贴已有角色

---
宗门经营规则:
  灵田:
    说明: 宗门收入的基本盘，种植聚灵草、灵稻、药草等
    规则:
      - 每块灵田按季产出，产量受灵田等级影响
      - 灵田等级1-3级为下品灵田，4-6级为中品，7-9级为上品
      - 灵田数量可用灵石开垦，每开垦一块需配合剧情（选址、布阵、种苗）
    产出示例:
      聚灵草: 每季每块10株，每株可售5灵石，也可入丹
      灵稻: 每季每块20斤，自用或售予云梦镇粮铺
      药草: 视种类定价，是炼丹的原料
  丹房:
    说明: 炼制丹药，自用与出售
    规则:
      - 炼丹需要丹方 + 药材 + 灵石（火耗），成功率受境界与丹方熟练度影响
      - 失败会损耗药材，禁止无成本炼丹
    常见丹药:
      养气丹: 成本约10灵石，售价20灵石，可助炼气修士修炼
      聚灵丹: 成本约30灵石，售价60灵石，筑基期修炼常用
      筑基丹: 成本约200灵石，售价500灵石，突破筑基的机缘丹药
      驻颜丹: 成本约150灵石，售价400灵石，广受女修欢迎
  悬赏阁:
    说明: 云梦镇悬赏阁由沈青鸾经营，接取悬赏可获灵石与声望
    规则:
      - 悬赏按难度分级：寻物、驱兽、护卫、除害、护送
      - 完成悬赏按约定结算，失败需赔付押金并损失声望
      - 悬赏可能引出新的女修角色或支线剧情
  收徒:
    说明: 招收弟子扩充宗门
    规则:
      - 每名弟子需考核品行与仙缘，收徒时写入弟子人数
      - 弟子可分配至灵田、丹房、藏经阁、巡山、外事等岗位
      - 弟子修炼有成后可独当一面，为宗门带来收入与声望
  扩建:
    说明: 升级宗门设施，提升经营上限
    规则:
      - 扩建需灵石 + 剧情推进（材料、工匠、选址）
      - 可扩建：灵田（+等级/数量）、丹房（+丹炉）、藏经阁（+功法）、弟子房舍（+容纳）
  日常事务:
    说明: 掌门每日可安排的事项
    规则:
      - 修炼：玩家与女修可共同修炼，增进修为与好感
      - 巡山：发现灵兽、机缘或麻烦
      - 采买：前往云梦镇集市、青云城坊市采购或售卖
      - 拜访：走访山下人家、名门故交，积累人脉
  月度事件:
    - 灵潮月: 灵气大涨，修炼事半功倍，灵田增产，可能引来妖兽
    - 拍卖会: 青云城拍卖会，可出售珍品或竞拍机缘
    - 收徒大典: 广开山门，可招多名弟子，声望大幅提升
    - 宗门大比: 附近宗门切磋，胜负影响声望
    - 兽潮来袭: 妖兽成群下山，需组织防守，守成则声望大涨
  账目要求:
    - 灵石收支必须与剧情一致，禁止凭空增减
    - 每笔大额收支（≥100灵石）在剧情中要有明确交代

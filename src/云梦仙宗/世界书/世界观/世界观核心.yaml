---
世界观核心:
  世界类型: 东方仙侠架空世界
  背景: |
    九州大地灵气充沛，修仙宗门林立，凡人仰慕仙缘。云梦山位于青州与云州交界，
    山势秀美，灵脉浅薄却胜在清静，山下的云梦镇是方圆百里唯一的集市，
    镇上悬赏阁、醉仙楼、药铺一应俱全，常有散修往来。
    云梦仙宗曾是青州名门，百年前老祖飞升后日渐式微，
    如今只剩下一座主峰大殿、两亩灵田、四名弟子和一名云游未归的老掌门。
  玩法定位: |
    玩家是云梦仙宗新任掌门（或首席弟子），核心玩法是「经营 + 养成 + 恋爱」：
    - 经营：打理灵田、炼丹售药、接取悬赏、招收弟子、扩建宗门，让破落小派重振声威
    - 养成：与门内女修及山下结识的女修培养感情，推进从相识到道侣的关系
    - 日常：修炼、切磋、集市采买、节日庆典，细细品味仙门烟火气
    节奏以日常经营为主线，恋爱支线穿插其中；不追求快节奏打斗，除非剧情需要。
  核心规则:
    仙缘与境界:
      - 修仙境界从低到高：炼气、筑基、金丹、元婴、化神、炼虚、合体、大乘、渡劫
      - 突破需要修为圆满 + 机缘（丹药、顿悟、心魔试炼），禁止无铺垫跳境
    灵石经济:
      - 灵石是修仙界通用货币，宗门与个人账目分开
      - 收入：卖灵药、完成悬赏、收徒礼金、商铺分红
      - 支出：耗材、扩建、俸禄、人情往来
    宗门规章:
      - 云梦仙宗以「清静无为、护山护人」为训，不欺压凡人，不谋夺他派
      - 收徒重品行与仙缘，不收心术不正之人
    情感分寸:
      - 女性角色均有独立人格与自主意愿，好感度需逐步培养
      - 暧昧、恋人、道侣的推进必须有剧情节点，禁止强行越界
    成年与同意:
      - 所有可恋爱角色均为成年人，情感发展以双方自愿为前提

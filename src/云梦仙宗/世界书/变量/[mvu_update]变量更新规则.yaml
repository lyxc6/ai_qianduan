---
变量更新规则:
  世界:
    当前日期:
      check:
        - 按剧情推进更新，格式为「云历X年·季节·几日」，禁止写成现实日期
    当前时间:
      check:
        - 按剧情经过的时辰更新（子丑寅卯辰巳午未申酉戌亥）
    当前地点:
      range:
        - 云梦山·主峰大殿
        - 云梦山·灵田区
        - 云梦山·丹房
        - 云梦山·藏经阁
        - 云梦山·后山竹林
        - 云梦山·山门
        - 云梦镇·集市
        - 云梦镇·悬赏阁
        - 云梦镇·醉仙楼
        - 青云城·坊市
      check:
        - 必须从上述列表中选择，禁止编造新地点
        - 必须与剧情描述的当前位置保持一致
    宗门名称:
      check:
        - 保持为云梦仙宗，不随意改名
    宗门等级:
      range: 破落小派/小有名气/名动一方/声震九州/仙门巨擘
      check:
        - 声望与经营成果积累到一定程度时晋升，不可跳跃
    灵石:
      type: number
      check:
        - 售卖灵药、完成悬赏、收徒礼金时增加
        - 采购、扩建、炼丹耗材、弟子俸禄时减少
        - 余额与剧情收支保持一致，不得凭空增减
    声望:
      type: number
      range: 0~100
      check:
        - 完成悬赏、举办收徒大典、名门来访时提升
        - 任务失败、契约失信时下降
    弟子人数:
      type: number
      check:
        - 收徒+1，逐出或离宗-1，与剧情一致
    灵田等级:
      type: number
      range: 1~9
      check:
        - 花费灵石扩建并配合剧情后才升级
    灵田数量:
      type: number
      check:
        - 新增灵田时+1
    丹炉数量:
      type: number
      check:
        - 添置丹炉时+1，与剧情一致
    藏经阁等级:
      type: number
      range: 1~3
      check:
        - 花费灵石扩建并配合剧情后才升级
    弟子房舍等级:
      type: number
      range: 1~3
      check:
        - 花费灵石扩建并配合剧情后才升级
    灵田地块:
      type: |-
        {
          [地块名: string]: {
            作物: '闲置' | '聚灵草' | '灵稻' | '药草';
            状态: '空闲' | '生长中' | '成熟' | '已收获';
            种植日期: string;
          }
        }
      check:
        - 地块数量与灵田数量一致，开垦新田时insert新地块
        - 播种、收获、换季的生长状态更新须配合剧情，禁止凭空增减产量
    悬赏列表:
      type: |-
        {
          [悬赏名称: string]: {
            发布方: string;
            内容: string;
            难度: '寻物' | '驱兽' | '护卫' | '除害' | '护送';
            报酬: number;
            状态: '可接取' | '进行中' | '已完成' | '失败';
          }
        }
      check:
        - 接取时状态改为进行中，完成结算时灵石增加与报酬一致
        - 失败需赔付押金并降低声望，与剧情一致
        - 已完成/失败的悬赏保留记录，新悬赏按剧情insert
    本月事件:
      range: 无/灵潮月/拍卖会/收徒大典/宗门大比/兽潮来袭
      check:
        - 对应事件开始时设置，结束后改为无
        - 与剧情描述保持一致

  玩家:
    姓名:
      check:
        - 保持为 {{user}}，不随意改名
    性别:
      range: 男/女
      check:
        - 保持玩家设定，除非玩家明确要求变更
    身份:
      range: 掌门/首席弟子
      check:
        - 默认掌门，玩家明确设定后按设定调整
    修为境界:
      range: 炼气/筑基/金丹/元婴/化神/炼虚/合体/大乘/渡劫
      check:
        - 修为进度达到100且剧情完成突破后晋升，禁止跳跃
    修为进度:
      type: number
      range: 0~100
      check:
        - 修炼、服用丹药、顿悟后增加
        - 突破后归0重新积累
    功法:
      check:
        - 获得新功法、残篇补全时更新
    灵石:
      type: number
      check:
        - 个人花销与收入实时更新，与宗门账目区分
    贡献点:
      type: number
      check:
        - 完成宗门任务、捐献资源后增加
        - 兑换功法、秘术时扣除
    当前目标:
      check:
        - 随玩家行动、选择与剧情推进更新，始终反映玩家当前目标
    当前想法:
      check:
        - 每轮随剧情更新，贴近玩家当前心态

  女修:
    type: |-
      {
        [女修姓名: string]: {
          姓名: string;
          年龄: number;
          身份: string;
          性格: string;
          性格标签: string[];
          外貌: string;
          修为境界: '炼气' | '筑基' | '金丹' | '元婴' | '化神' | '炼虚' | '合体' | '大乘' | '渡劫';
          修为进度: number;
          宗门职务: '无' | '灵田' | '丹房' | '藏经阁' | '巡山' | '外事';
          好感度: number;
          恋情阶段: '相识' | '熟悉' | '暧昧' | '恋人' | '道侣';
          心情: string;
          当前想法: string;
        }
      }
    check:
      - 年龄范围18~500（化形妖修可较大），均为成年人
      - 姓名必须是独立键，严禁用代称
      - 女修离宗或退隐时删除档案，以NPC形式继续存在
    性格标签:
      type: string[]
      check:
        - 保持2-4个，重大事件才允许增删，禁止每轮随意变动
    好感度:
      type: number
      range: 0~100
      check:
        - 根据互动每次±3~15
        - 体贴、尊重、共患难可大幅提升
        - 敷衍、欺骗、伤害则下降，禁止无理由跳变
    恋情阶段:
      range: 相识/熟悉/暧昧/恋人/道侣
      check:
        - 恋情阶段推进必须伴随明确的剧情节点（表白、共度、定情信物等）
        - 好感度不足以支撑时禁止跳级
        - 后宫增员时，剧情须体现原有关系的消化与新关系的建立，禁止角色失忆
    修为境界:
      range: 炼气/筑基/金丹/元婴/化神/炼虚/合体/大乘/渡劫
      check:
        - 修为进度达到100且剧情完成突破后晋升
    修为进度:
      type: number
      range: 0~100
      check:
        - 修炼、服用丹药、机缘后增加
        - 突破后归0重新积累
    宗门职务:
      range: 无/灵田/丹房/藏经阁/巡山/外事
      check:
        - 岗位调整随剧情更新，与经营规则一致
    心情:
      check:
        - 随最近经历更新（喜悦/委屈/期待/失落等）
    当前想法:
      check:
        - 每轮随剧情更新，贴近该女修当前心态

输出前自检:
  A 女修字段是否完整且未被合并
  B 修为境界与修为进度是否同步（进度满100且突破后才升境界）
  C 灵石收支是否与剧情一致
  D 好感度变动是否有剧情依据
  E 恋情阶段与好感度、剧情节点是否同步
  F 宗门等级与声望、经营成果是否一致
  G 数值类型和范围是否合法
  H 禁止整对象replace替代细粒度更新

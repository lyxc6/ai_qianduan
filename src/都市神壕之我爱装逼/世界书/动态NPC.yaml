<rule_动态NPC生成器>
rule:
  - 当${场景}需要新角色时，自动生成符合其身份、氛围与剧情功能的角色描述
  - 新角色的姓名必须具有${独特寓意}，拒绝使用常见或模板化姓名
  - 现实名人的引入严格参照${剧情时间点}的公开形象与社会认知
  - 所有生成必须自然融入叙事，不显突兀

format: |-
  新角色动态生成框架

  触发判定:
    场景: ${当前场所与事件简述} /*如：高端酒吧的卡座、商业峰会的休息区*/
    需求: ${剧情推动或氛围点缀需求} /*如：需要一名挑衅者、或一位潜在的商业伙伴*/

  生成流程:
    1. 类型选择:
      - 新角色: ${70%概率}
      - 现实名人: ${30%概率} /*仅在${高曝光度场合}触发，如颁奖礼、顶级私人派对*/

    2. 属性填充 (if 新角色):
      姓名: ${一个富有寓意的名字} /*要求：结合场合、角色潜在身份或气质，如“江晚舟”暗示漂泊与沉淀*/
      核心印象: ${一个名词短语} /*如：疏离的观察者、精明的谈判家*/
      外在显征:
        - 体态: ${高挑/精悍/丰腴等}
        - 着装: ${契合场合的衣着风格关键词}
        - 姿态: ${一个标志性动作或神情} /*如：指尖轻点酒杯边缘、目光快速扫视全场*/

      内在钩子: ... /*必须补充1个能暗示其背景、动机或与<user>可能产生交集的细节*/

    3. 属性填充 (if 现实名人):
      姓名: ${现实人物全名}
      公开身份: ${演员/企业家/艺术家等}
      在场状态: ${衣着与简短行为描述} /*如：身着定制西装，正与友人低声交谈*/
      随行: ${0-3名}名助理或同伴
      可互动性: ${是/否} /*根据场合与<user>当前社会地位判定*/

    4. 整合输出:
      [新角色] ${姓名}，给人以${核心印象}。${外在显征}。${内在钩子}
      [现实名人] ${姓名}，${公开身份}，${在场状态}。

  附则:
    - 同一场景中，重要新角色的姓名自动加入缓存，后续可再次登场。
    - 现实名人的互动可能轻微改变其态度，但不违背其公开人设基线。
</rule_动态NPC生成器>
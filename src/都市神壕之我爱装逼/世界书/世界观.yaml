<worldview_final>
世界设定:
  类型: 仿现实世界的平行世界
  参照基准: 2025年的地球现实

高维稳定性原则:
  - 定义: 世界主干时间线具备自我修复与补偿的惯性
  - 表现: 个体的改变难以直接颠覆宏观的历史进程框架
  - 影响层级划分:
    - 第一层级: 个人命运（高度可改变）: <user>可直接大幅改变
    - 第二层级: 组织与行业（中度可影响）: 可通过资本、技术、人脉施加决定性影响
    - 第三层级: 国家与社会（轻度可扰动）: 可作为关键变量之一施加影响
    - 第四层级: 全球与历史（惯性极大）: 可提前预警、局部准备、利用危机，但难以直接阻止
参照细节:
  地理: 国家、城市、地标均与现实世界一致
  科技与社会: 科技水平、社会状况、经济环境与现实同步
  时间线: 从2020年10月1日开始
  信息同步: 所有公开的历史事件、新闻、名人信息均与现实相同
社会价值观:
人物参照原则:
  参照对象: 现实中的名人、企业家、明星等公众人物

  参照内容:
    - 公开性格、经历、社会关系均符合现实认知
    - 私人信息部分遵循现实可查资料
    - 未公开部分保持合理推断

蝴蝶效应原则:
  - <user>做出的任何重大事件都有可能改变现实轨迹
  - 故事按照蝴蝶效应的方式进行推演发展
  - 但受高维稳定性原则制约，宏观历史框架具有惯性
</worldview_final>

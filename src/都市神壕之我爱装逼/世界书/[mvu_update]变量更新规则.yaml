---
变量更新规则:
  日期:
    format: YYYY年MM月DD日
    check:
      - 随着剧情中的时间推移、休息或睡觉后自然更新

  时间:
    format: HH:MM
    check:
      - 每次事件推进、场景转换或对话流逝后更新，保持时间流逝的合理性

  位置:
    check:
      - 仅在user发生物理移动、前往新地点时更新

  年龄:
    check:
      - 随时间变化而增加

  现金余额:
    type: number
    check:
      - 发生消费、转账、投资时扣除相应本金
      - 触发神豪系统返利或获得装逼奖励时，准确计算并增加金额
      - 必须遵循"不可透支"原则

  系统积分:
    type: number
    check:
      - 获得装逼奖励时增加
      - 在神豪商店兑换物品/能力时扣除

  神豪等级:
    type: string
    check:
      - 【自动计算】根据现金余额自动调整等级
      - 100000000000（千亿）及以上：顶级神豪
      - 10000000000（百亿）及以上：高级神豪
      - 1000000000（十亿）及以上：中级神豪
      - 100000000（一亿）及以上：初级神豪
      - 其他：萌新神豪

  返现倍数:
    type: number
    check:
      - 【自动计算】根据现金余额自动调整倍数
      - 100000000000（千亿）及以上：返现2倍
      - 10000000000（百亿）及以上：返现3倍
      - 1000000000（十亿）及以上：返现5倍
      - 100000000（一亿）及以上：返现8倍
      - 其他：返现10倍

  名下资产:
    type: |-
      {
        [资产名称: string]: {
          估值: number;
          描述: string;
          获得时间: string;
        }
      }
    check:
      - user通过购买、系统奖励或收购获得新实物/股权资产时添加
      - 每次获得资产时记录估值、描述和获得时间

  技能:
    type: |-
      {
        [技能名称: string]: {
          等级: string;
          效果: string;
          获得途径: '系统奖励' | '商城兑换' | '自我觉醒';
        }
      }
    check:
      - user获得新能力或技能升级时更新
      - 记录技能的等级、效果描述和获得途径

  当前在场互动女性:
    type: |-
      {
        [角色真实姓名: string]: {
          年龄: string;
          职业: string;
          与user的关系: string;
          自我认知: string;
          心声: string;
          排卵特征日: number;
          上次内射时间: string;
          好感度: number;
          堕落值: number;
          外貌描写: string;
          颜值评分: number;
          衣着: { 上装: string, 下装: string, 内衣: string, 袜子: string, 鞋子: string };
          身体状态: { 朱唇: string, 乳房: string, 美臀: string, 小穴: string, 菊穴: string, 玉足: string };
          私密档案: { 是否为处女: '是'|'否'|'未知', 初夜对象: string, 是否怀孕: '是'|'否'|'未知', 怀孕几率: string, 内射次数: number, 子嗣所属: string, 名器: string };
        }
      }
    check:
      - 【核心显隐】：仅在线下物理在场时录入；角色离场或场景切换后必须立刻彻底删除其记录。
      - 【数值变动锁】：好感度和堕落值每次交互仅允许改变一次，禁止单次叠加。
      - 【动态心理重写】：根据好感/堕落值实时重构“关系”与“心声”，体现角色被攻略或物化的过程。
      - 【身体状态刷新】：每次对话后强制全面重写所有部位（25-40字），白描生理反应，禁止使用“未知”。
      - 【玉足特化】：必须包含气味、脚形、色泽、足弓、美甲风格。
      - 【数据镜像义务】：若该角色已存在于 `后宫状态` 中，本次对其进行的任何属性修改（姓名、年龄、关系、堕落值、名器）必须强制同步更新至 `后宫状态` 对应条目。

  后宫状态:
    type: |-
      {
        [角色真实姓名: string]: {
          年龄: string;
          与user的关系: string;
          堕落值: number;
          名器种类: string;
        }
      }
    check:
      - 【强制收录规则】：只要任何女性的“好感度”或“堕落值”首次达到 60（含）以上，系统必须在当次更新中立刻将其添加至本名录。
      - 【绝对强制刷新规则】：
          1. **实时对齐**：本名录被视为“当前在场互动女性”中对应角色的持久化镜像。当在场女性的 [年龄、与user的关系、堕落值、名器种类] 发生任何变动时，AI **必须**在同一个 JSONPatch 中对本名录进行同步 replace 操作。
          2. **禁止滞后**：严禁出现“在场数据已更新，后宫名录仍保持旧值”的情况。
          3. **名器同步**：一旦私密档案中的名器被探索解锁，必须立即更新至本名录的 `名器种类` 字段。
      - 【排序规则】：按年龄由大到小（降序）排列。
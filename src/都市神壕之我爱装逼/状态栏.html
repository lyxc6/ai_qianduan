    <script type="module">
      function renderShenHaoData(data) {
        if (!data) return;

        $('#val-date').text(data['日期'] || '未知日期');
        $('#val-time').text(data['时间'] || '未知时间');
        $('#val-location').text(data['位置'] || '未知位置');

        $('#val-cash').text('￥' + (data['现金余额'] || 0).toLocaleString());
        $('#val-level').text(data['神豪等级'] || '萌新神豪');
        $('#val-points').text(data['系统积分'] || 0);
        $('#val-mult').text((data['返现倍数'] || 0) + 'x');

        const assets = data['名下资产'] || {};
        const assetsContainer = $('#assets-content');
        assetsContainer.empty();
        if (Object.keys(assets).length === 0) {
          assetsContainer.html('<span class="asset-item"></span>');
        } else {
          Object.entries(assets).forEach(([name, info]) => {
            const display = typeof info === 'string' ? info : `${info['名称'] || name} x${info['数量'] || 1}`;
            assetsContainer.append(`<span class="asset-item">${display}</span>`);
          });
        }

        const skills = data['技能'] || {};
        const skillsContainer = $('#skills-content');
        skillsContainer.empty();
        if (Object.keys(skills).length === 0) {
          skillsContainer.html('<span class="skill-item"></span>');
        } else {
          Object.entries(skills).forEach(([name, info]) => {
            const display = typeof info === 'string' ? info : `${info['名称'] || name}`;
            skillsContainer.append(`<span class="skill-item">${display}</span>`);
          });
        }
      }

      function renderActiveGirls(girls) {
        const container = $('#girls-content');
        container.empty();

        if (!girls || Object.keys(girls).length === 0) {
          container.html(
            '<div style="padding:1.875rem;color:var(--text-muted);text-align:center;font-style:italic;letter-spacing:0.0625rem;">[ SENSOR_OFFLINE: 范围内未发现目标女性 ]</div>',
          );
          return;
        }

        Object.entries(girls).forEach(([name, d]) => {
          const clothes = d['衣着'] || {};
          const body = d['身体状态'] || {};
          const secret = d['私密档案'] || {};

          const clothesHtml = [
            `<b>[上装]</b> ${clothes['上装'] || '未探测'}`,
            `<b>[下装]</b> ${clothes['下装'] || '未探测'}`,
            `<b>[内衣]</b> ${clothes['内衣'] || '未探测'}`,
            `<b>[袜子]</b> ${clothes['袜子'] || '未探测'}`,
            `<b>[鞋子]</b> ${clothes['鞋子'] || '未探测'}`,
          ].join('<br>');

          const card = `
          <div class="girl-card">
            <div class="girl-header">
              <span class="girl-name">❖ ${name}</span>
              <span class="girl-score">AGE: ${d['年龄']} | SCORE: ${d['颜值评分']}</span>
            </div>
            <div class="girl-body">
              <div class="stat-row">
                <div class="stat-box"><span class="stat-label">RELATION</span><span class="stat-val">${d['与user的关系']}</span></div>
                <div class="stat-box"><span class="stat-label">FAVOR</span><span class="stat-val">${d['好感度']}</span></div>
                <div class="stat-box"><span class="stat-label">DEGEN</span><span class="stat-val" style="color:var(--lust-color)">${d['堕落值']}</span></div>
              </div>

              <div class="body-detail"><b>[认知]</b> ${d['自我认知']}</div>
              <div class="body-detail"><b>[心声]</b> <i style="color:#ff80b3">"${d['心声']}"</i></div>

              <div class="body-detail" style="background:rgba(255,204,102,0.05); padding:0.625rem; border-radius:0.25rem; border-left: 0.125rem solid var(--gold-primary); margin: 0.625rem 0;">
                ${clothesHtml}
              </div>

              <div class="intimate-panel">
                <span class="intimate-label">DEPTH_SCAN // 深度探测</span>
                <div class="secret-grid">
                  <div class="secret-item"><b>处女:</b><span>${secret['是否为处女'] || '未知'}</span></div>
                  <div class="secret-item"><b>受孕:</b><span>${secret['是否怀孕'] || '未知'} (${secret['怀孕几率'] || '0%'})</span></div>
                  <div class="secret-item" style="grid-column: span 2;"><b>初夜归属:</b><span>${secret['初夜对象'] || '尚未被夺走'}</span></div>
                  <div class="secret-item"><b>内射次数:</b><span>${secret['内射次数'] || 0}</span></div>
                  <div class="secret-item"><b>子嗣归属:</b><span>${secret['子嗣所属'] || '无'}</span></div>
                </div>
                <div class="body-detail"><b>名器记录:</b> <span style="color:var(--gold-primary); font-weight:bold;">${secret['名器'] || '尚未解析'}</span></div>
                <div class="body-part-list">
                  <b>[朱唇]</b> ${body['朱唇']}<br>
                  <b>[乳房]</b> ${body['乳房']}<br>
                  <b>[美臀]</b> ${body['美臀']}<br>
                  <b>[小穴]</b> ${body['小穴']}<br>
                  <b>[菊穴]</b> ${body['菊穴']}<br>
                  <b>[玉足]</b> ${body['玉足']}
                </div>
              </div>
            </div>
          </div>
        `;
          container.append(card);
        });
      }

      /* 核心逻辑：后宫名单数据对齐 */
      function renderHarem(harem, activeGirls) {
        const container = $('#harem-content');
        container.empty();
        if (!harem || Object.keys(harem).length === 0) {
          container.html(
            '<div style="padding:1.25rem;color:var(--text-muted);text-align:center;">[ 暂无图鉴数据 ]</div>',
          );
          return;
        }

        Object.entries(harem).forEach(([name, d]) => {
          /* 数据对齐逻辑：如果在场，优先使用在场数据覆盖显示 */
          const activeData = _.get(activeGirls, name);
          const displayData = activeData
            ? {
                ...d,
                堕落值: activeData['堕落值'],
                与user的关系: activeData['与user的关系'],
                名器种类: _.get(activeData, '私密档案.名器', d['名器种类']),
              }
            : d;

          container.append(`
          <div class="harem-item">
            <div class="harem-name-group">
              <span class="harem-name">${name}</span>
              <span class="harem-age">${displayData['年龄']}</span>
            </div>
            <div class="harem-info">
              <div style="color:var(--lust-color)">堕落: ${displayData['堕落值']}</div>
              <div style="font-size:0.625rem;">${displayData['与user的关系']} | ${displayData['名器种类']}</div>
            </div>
          </div>
        `);
        });
      }

      function populateCharacterData() {
        const all = getAllVariables().stat_data;
        console.log(all);
        const activeGirls = all['当前在场互动女性'] || {};
        const harem = all['后宫状态'] || {};

        renderShenHaoData(all);
        renderActiveGirls(activeGirls);
        /* 将在场数据传入后宫渲染函数进行对齐 */
        renderHarem(harem, activeGirls);
      }

      async function init() {
        await waitGlobalInitialized('Mvu');
        populateCharacterData();

        eventOn(Mvu.events.VARIABLE_UPDATE_ENDED, () => {
          populateCharacterData();
        });

        $('.section-header').on('click', function () {
          $(this).toggleClass('active');
          $(this).next('.section-content').slideToggle(300);
        });
      }

      $(errorCatched(init));
    </script>

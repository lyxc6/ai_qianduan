schema树速查:
  世界: {时间: string, 地点: string}
  主角:
    龙血: {觉醒等级: 龙息初萌/龙息掌控/龙息完全体, 魅惑强度: num(0~100), 龙血能量: num(0~100), 烙印数量: num}
    修行路线: 魔法/战技/融合
    侧重: 魔法→元素/星象/自然/暗影, 战技→骑士/剑士/弓手/刺客, 融合→魔剑士/圣骑士/魔弓手/影刺客
    灵魂能量: num(0~100)
    姓名/年龄/力量等级/当前着装/当前姿势/当前位置/当前想法/最近性行为: string
    阴茎状态: string
    射精进度: num(0~100)
  角色.${角色名}:
    背景/当前着装/当前姿势/当前想法/最近性行为: string
    外貌: obj{体型,面容,发色,眼睛,肤色,特征}
    性格: obj{核心,优点,缺点,习惯}
    能力: obj{擅长,盲区,特殊}
    NSFW: obj{胸部,阴部,臀部,腰腹,腿部,敏感带,体质,性态度,特殊需求}
    年龄: num / 处女: bool / 修行路线: 魔法/战技/融合
    灵魂倾向: 王权/圣职/智识/战权/百工/庶民/破格者
    擅长魔法/力量等级/种族/职业/后宫地位: string
    阶级: obj{名称: 王室/贵族/战士/魔法师/神职人员/学者/商人/艺术家/平民, 等级: string}
    好感度: num(0~100)
    当前小穴状态/当前胸部状态/怀孕状态/身体状态: string
    高潮次数/内射次数: num
    烙印状态: 无烙印/浅印/中印/深印
    当前烙印反应: string
  后宫: {总数: num, 平均好感度: num(0~100), 满意度: string}
  势力.${势力名}: {关系: string, 趋势: 恶化/稳定/改善, 上次互动: string}
  当前主线: string
  任务列表.${任务名}: {类型: 主线/支线/日常, 说明: string, 进度: string, 奖励: string}
  行动选项: {选项一~四: string(40~60字)}

━━━ 场景联动 ━━━
场景转换(起床/出门/战斗后/就寝等)时联动replace以下字段:
世界.时间(按经历推进) / 世界.地点(具体到房间)
主角.当前着装 / 当前姿势 / 当前位置 / 当前想法(每轮完全replace只写当下)

━━━ 数值操作速查 ━━━
好感度: ±1~10(常规), +15~(重大事件), 性行为+5~+10
灵魂能量: 修炼战斗+1~+10/轮, 高阶魔法消耗
龙血能量: +5~+10/轮自然增长, 性行为-20~-40, 亲密接触-5~-10
魅惑强度: ±1~5/次, 烙印+3~+5, 日常+1
射精进度: 性行为中+5~+15/轮, 射精=100→0
烙印数量: 新烙印+1, 解除-1
高潮/内射次数: 达到/发生时+1

━━━ 等级演进 ━━━
力量等级: 见习→初级→中级→高级→大法师→魔导师→法神(修炼+战斗提升)
龙血觉醒: 龙息初萌→龙息掌控(魅惑≥60+烙印≥5+关键剧情)→龙息完全体(魅惑≥90+烙印≥10+决定性事件)
阶级名称: 王室/贵族/战士/魔法师/神职人员/学者/商人/艺术家/平民
阶级等级: 贵族→公爵/侯爵/伯爵/子爵/男爵/骑士/平民, 战士→将军/统领/队长/士兵/新兵, 魔法师→法神/魔导师/大法师/高级/中级/初级/见习, 学者→教授/研究员/学者/学生/学徒

━━━ 性行为联动 ━━━
性行为触发全组联动:
- 最近性行为(主角/角色): "时间|地点|简述"
- 阴茎状态: 前→勃起, 中→保持, 后→疲软
- 当前小穴状态: 按激烈程度描述, 无则"正常状态"
- 当前胸部状态: 按刺激程度描述, 无则"正常状态"
- 身体状态: 描述性后反应
- 高潮次数+1 / 内射次数+1 / 射精进度+=5~15→射精归零
- 怀孕判定: 内射后判定
  怀孕概率 = 基础概率 × 体质系数 × 内射次数 + ±20%浮动
  体质系数: 白虎玄阴体0.01, 龙血深印者0.3, 普通女性1.0, 排卵期2.0
  判定怀孕: 替换为"已怀孕N个月"
- 好感度+5~+10, 龙血能量-20~-40

━━━ 角色建档门槛 ━━━
建: 已知真名+实质互动/会再登场/玩家明确深入意图
不建: 未报真名/功能性过场/本轮即离场/一次性/装饰名词
建档必填: 背景/外貌/性格/能力至少各填核心项, 不可留空
角色字段同主角的(当前着装/当前姿势/当前想法/最近性行为/好感度/力量等级)规则与主角一致

角色独有字段:
- 灵魂倾向: 王权/圣职/智识/战权/百工/庶民/破格者, 初始固定, 龙血深印后可能松动
- 种族: 人类/精灵/矮人/兽人/半精灵, 不可更改
- 烙印状态: 无→浅印(初次亲密)→中印(3次+)→深印(强烈情感+多次)
- 当前烙印反应: 无="无", 浅印=淡粉鳞纹, 中印=金色龙纹(兴奋显现), 深印=紫鳞纹(平时隐约激动发光)
- 怀孕状态: 内射查怀孕公式判定

━━━ 势力/后宫/主线 ━━━
势力: 关系按互动变化, 趋势(恶化/稳定/改善)需与关系同步, 上次互动每次重大外交事件后更新
后宫.总数 = 角色键数, 平均好感度 = ∑角色.*.好感度/总数, 满意度按总体情绪(紧张/一般/良好/融洽/完美)
当前主线: "主线标题——当前阶段简述", 完成后替换

━━━ 任务/选项 ━━━
任务: 类型(主线/支线/日常), 说明≤30字, 进度(未开始→进行中→即将完成→已完成/失败), 奖励简述
选项: 每次提供4项(推进/互动/好感/NSFW), 每项40~60字, 具体可执行

━━━ 反流水账━━━
"明天还成立"→状态可存, 否则归正文
高危: 最近性行为(仅"时间|地点|简述") / 当前想法(每轮replace) / 当前着装(纯静态) / 龙血能量(仅数值不存过程)

━━━ 输出前自检━━━
A 路径合法 B 类型范围(数字无引号/bool非"是否"/0~100不越界) C 联动同步(关系双向/数值状态/时间星期) D 禁整对象replace(改单字段只patch该字段) E 剧情-变量同步(正文出现的实体变量必须有, 没有就本轮新建) F 反流水账(对照高危字段)

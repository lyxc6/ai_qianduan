变量更新规则:
  行动选项:
    check:
      - **每轮必须完全重新生成**，即使剧情无重大变化也必须基于当前场景生成新选项
      - 4项分别对应：推进剧情、角色互动、NPC好感互动、NSFW互动
      - 每项40~60字，具体可执行，必须贴合当前场景/地点/时间/在场角色
      - 用 replace 操作整体替换 /行动选项/选项一 ~ /行动选项/选项四

  世界:
    时间/地点:
      check:
        - 场景转换（起床/出门/战斗后/就寝等）时更新
        - 时间按经历推进，地点具体到房间

  主角:
    龙血:
      觉醒等级:
        range: 龙息初萌/龙息掌控/龙息完全体
        check:
          - 龙息初萌→龙息掌控：魅惑≥60+烙印≥5+关键剧情
          - 龙息掌控→龙息完全体：魅惑≥90+烙印≥10+决定性事件
      魅惑强度:
        type: number
        range: 0~100
        check:
          - ±1~5/次，烙印+3~+5，日常+1
      龙血能量:
        type: number
        range: 0~100
        check:
          - +5~+10/轮自然增长，性行为-20~-40，亲密接触-5~-10
      烙印数量:
        type: number
        check:
          - 新烙印+1，解除-1

    灵魂能量:
      type: number
      range: 0~100
      check:
        - 修炼战斗+1~+10/轮，高阶魔法消耗

    力量等级:
      range: 见习/初级/中级/高级/大法师/魔导师/法神
      check:
        - 修炼+战斗提升

    修行路线:
      range: 魔法/战技/融合
    侧重:
      range: 魔法→元素/星象/自然/暗影，战技→骑士/剑士/弓手/刺客，融合→魔剑士/圣骑士/魔弓手/影刺客

    姓名/年龄/当前着装/当前姿势/当前位置/当前想法/最近性行为:
      当前着装:
        check:
          - 起床/出门/战斗后/就寝等场景转换时更新
      当前姿势:
        check:
          - 每轮更新，描述当前身体姿态
      当前想法:
        check:
          - 每轮完全replace只写当下，描述内心真实想法
      最近性行为:
        format: 时间|地点|简述
        check:
          - 性行为发生时更新

    阴茎状态/射精进度:
      射精进度:
        type: number
        range: 0~100
        check:
          - 性行为中+5~+15/轮，100=射精→归零
      阴茎状态:
        check:
          - 前→勃起，中→保持，后→疲软

  角色.${角色名}:
    背景/当前着装/当前姿势/当前想法/最近性行为:
      check:
        - 规则与主角同名字段一致
    外貌: {体型, 面容, 发色, 眼睛, 肤色, 特征}
    性格: {核心, 优点, 缺点, 习惯}
    能力: {擅长, 盲区, 特殊}
    NSFW: {胸部, 阴部, 臀部, 腰腹, 腿部, 敏感带, 体质, 性态度, 特殊需求}
    年龄:
      type: number
    处女:
      type: boolean
    修行路线:
      range: 魔法/战技/融合
    灵魂倾向:
      range: 王权/圣职/智识/战权/百工/庶民/破格者
      check:
        - 初始固定，龙血深印后可能松动
    种族:
      range: 人类/精灵/矮人/兽人/半精灵
      check:
        - 不可更改
    擅长魔法/力量等级/职业/后宫地位:
      力量等级:
        range: 见习/初级/中级/高级/大法师/魔导师/法神
    阶级:
      名称:
        range: 王室/贵族/战士/魔法师/神职人员/学者/商人/艺术家/平民
      等级:
        range: |
          贵族→公爵/侯爵/伯爵/子爵/男爵/骑士/平民
          战士→将军/统领/队长/士兵/新兵
          魔法师→法神/魔导师/大法师/高级/中级/初级/见习
          学者→教授/研究员/学者/学生/学徒

    好感度:
      type: number
      range: 0~100
      check:
        - ±1~10(常规), +15~(重大事件), 性行为+5~+10

    当前小穴状态/当前胸部状态/身体状态:
      check:
        - 性行为后更新，无则"正常状态"

    高潮次数/内射次数:
      type: number
      check:
        - 达到/发生时+1

    烙印状态:
      range: 无烙印/浅印/中印/深印
      check:
        - 无→浅印(初次亲密)→中印(3次+)→深印(强烈情感+多次)
    当前烙印反应:
      range: 无/淡粉鳞纹/金色龙纹(兴奋显现)/紫鳞纹(平时隐约激动发光)
      check:
        - 与烙印状态同步

    怀孕状态:
      check:
        - 内射后查怀孕公式判定
        怀孕概率 = 基础概率 × 体质系数 × 内射次数 + ±20%浮动
        体质系数: 白虎玄阴体0.01, 龙血深印者0.3, 普通女性1.0, 排卵期2.0

  后宫:
    总数:
      type: number
      check:
        - 等于角色键数
    平均好感度:
      type: number
      range: 0~100
      check:
        - ∑角色.*.好感度/总数
    满意度:
      range: 紧张/一般/良好/融洽/完美
      check:
        - 按总体情绪更新

  势力.${势力名}:
    关系/趋势/上次互动:
      趋势:
        range: 恶化/稳定/改善
        check:
          - 需与关系同步
      上次互动:
        check:
          - 每次重大外交事件后更新

  当前主线:
    check:
      - format: "主线标题——当前阶段简述"
      - 完成后替换

  任务列表.${任务名}:
    类型:
      range: 主线/支线/日常
    说明:
      check:
        - ≤30字
    进度:
      range: 未开始/进行中/即将完成/已完成/失败
    奖励:
      check:
        - 简述

建档门槛:
  建:
    - 已知真名+实质互动/会再登场/玩家明确深入意图
  不建:
    - 未报真名/功能性过场/本轮即离场/一次性/装饰名词
  建档必填:
    - 背景/外貌/性格/能力至少各填核心项，不可留空

反流水账:
  判别: "明天还成立"→状态可存，否则归正文
  高危字段:
    - 最近性行为: 仅"时间|地点|简述"
    - 当前想法: 每轮replace
    - 当前着装: 纯静态描述
    - 龙血能量: 仅数值不存过程

输出前自检:
  A 路径合法（每段在schema树中，key用UID，没漏中间层，没废弃路径）
  B 类型范围（数字无引号，bool非"是否"，0~100不越界）
  C 联动同步（关系双向，数值状态，时间星期）
  D 禁整对象replace（改单字段只patch该字段）
  E 剧情-变量同步（正文出现的实体变量必须有，没有就本轮新建）
  F 反流水账（对照高危字段逐个问"明天还成立吗"）
  G 行动选项：确认JSONPatch中包含 /行动选项/选项一~四 共4个replace操作

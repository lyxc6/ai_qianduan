rule:
  - 你必须在回复末尾输出更新分析和实际的更新命令
  - 更新命令效果与**JSON Patch (RFC 6902)**标准类似，有效的 JSON 数组，其中每个元素都是表示单个操作的对象，但支持的是以下操作而不是标准操作：
    - replace: 替换已存在变量的值
    - delta: 用一个变动值更新已存在的数值变量
    - insert: 插入新元素到对象或数组中
    - remove
  - 不要更新以`_`开头的变量，因为它们是只读的，例如`_变量`
  - 分析必须是事件驱动的，识别故事中发生了什么关键事件
  - 必须更新
    - 行动选项：{"op": "replace", "path": "/行动选项", "value": {"选项一":"","选项二":"","选项三":"","选项四":""}}
  - 基础更新
    - 最近事件：{"op": "insert", "path": "/最近事件/-", "value": "时间|地点|内容"}
    - 数值变量：{"op": "delta", "path": "/角色/名字/好感度", "value": 10}
    - 字符串变量：{"op": "replace", "path": "/角色/名字/当前想法", "value": "内容"}
    - 布尔变量：{"op": "replace", "path": "/角色/名字/处女", "value": "否"}
  - 主角属性
    - 阴茎状态变更：{"op": "replace", "path": "/主角/阴茎状态", "value": "勃起状态，龙血之力澎湃"}
    - 射精进度：{"op": "replace", "path": "/主角/射精进度", "value": 50}
  - 后宫属性
    - 数值变更：{"op": "delta", "path": "/角色/名字/好感度", "value": 10}
    - 属性变更：{"op": "replace", "path": "/角色/名字/当前想法", "value": "内容"}
    - 高潮次数：{"op": "delta", "path": "/角色/名字/高潮次数", "value": 1}
    - 内射次数：{"op": "delta", "path": "/角色/名字/内射次数", "value": 1}
    - 身体状态：{"op": "replace", "path": "/角色/名字/身体状态", "value": "高潮后身体酥软，香汗淋漓"}
    - 删除属性：{"op": "remove", "path": "/角色/名字/秘密"}
  - 怀孕规则
    - 在<Analysis>中，根据当前情况判断是否允许怀孕
    - 前提：必须完成本轮性爱，明确发生内射
    - 随机受孕公式：怀孕概率 = 基础概率 × 体质系数 × 内射次数 + 随机浮动
    - 体质系数：白虎玄阴体0.01，普通女性1.0，排卵期2.0
    - 随机浮动：每次内射独立判定，±20%随机浮动
    - 示例：普通女性(1.0) + 排卵期(×2) + 3次内射 + 随机浮动 → 约60%怀孕可能
    - 判定怀孕：{"op": "replace", "path": "/角色/名字/怀孕状态", "value": "已怀孕1个月"}
  - 破处规则
    - 在<Analysis>中判断是否发生破处
    - 前提：角色为处女（处女=="是"），发生性行为
    - 破处事件格式：{"op": "replace", "path": "/角色/名字/破处", "value": "时间|地点|内容"}
    - 破处后自动更新处女状态：{"op": "replace", "path": "/角色/名字/处女", "value": "否"}

format: |-
<UpdateVariable>
<Analysis>$(按英文输出，不超过80词)
- ${计算经过的时间: ...}
- ${根据当前情节是否足够特殊、时间跨度是否远超正常情况，判断是否允许变量值发生戏剧性变化: 是/否}
- ${基于变量对应的`check`，仅根据当前回复而不是之前的剧情来分析每个变量是否需要更新: ...}
- ${判断是否发生性行为，是否内射，是否破处: ...}
</Analysis>
<JSONPatch>
[
  { "op": "replace", "path": "${/到/变量/的路径}", "value": "${新值}" },
  { "op": "delta", "path": "${/到/数值/变量/的路径}", "value": "${正或负的变动值}" },
  { "op": "insert", "path": "${/到/对象/新键/的路径}", "value": "${新值}" },
  { "op": "insert", "path": "${/到/数组/-}", "value": "${新值}" },
  { "op": "remove", "path": "${/到/对象/键/的路径}" },
  { "op": "remove", "path": "${/到/数组/的路径/0}" },
  ...
]
</JSONPatch>
</UpdateVariable>

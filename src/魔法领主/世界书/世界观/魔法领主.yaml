# 魔法领主角色卡配置文件
# 基础信息
name: 魔法领主
creator: ""
character_version: ""

# 主要字段映射
# 对话补充等额外设定应该放入 character_book，而不是使用 mes_example
fields:
    description: 作品/魔法领主/角色设定_{{user}}.xyaml
    personality: ""
    scenario: ""
    first_mes: 作品/魔法领主/开场白.md
    mes_example: ""
    creator_notes: ""
    system_prompt: ""
    post_history_instructions: ""

# 扩展字段
extensions:
    talkativeness: "0.5"
    fav: false
    world: 魔法领主
    status_bar: 作品/魔法领主/状态栏.html # 可选

# 脚本配置
scripts:
    # 变量结构设计脚本（Zod Schema）
    - name: "变量结构设计"
      content: 作品/魔法领主/变量结构.js
      enabled: true

# 角色书配置
character_book:
    name: 魔法领主
    entries:
        # [InitVar]初始化条目
        - comment: "[initvar]变量初始化"
          content: 作品/魔法领主/[initvar]变量初始化.xyaml
          enabled: false
          position: before_char
          insertion_order: 1
          depth: 4
          role: 0

        # 变量更新规则
        - comment: "[mvu_update]变量更新规则"
          content: 作品/魔法领主/[mvu_update]变量更新规则.xyaml
          enabled: true
          position: at_depth
          insertion_order: 1
          depth: 1
          role: 0

        # 变量输出格式
        - comment: "[mvu_update]变量输出格式"

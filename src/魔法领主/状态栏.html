    <script>
      const 发送文本到聊天框 = (text) => {
        // 检查文本有效性
        if (
          !text ||
          $.inArray($.trim(text), ["…", "..."]) !== -1 ||
          $.trim(text).length === 0
        )
          return;

        try {
          // 使用jQuery获取父页面的聊天输入框
          const $textarea = $(parent.document).find("#send_textarea");

          if ($textarea.length === 0) {
            // console.log("未找到聊天输入框 (#send_textarea)");
            return;
          }

          // 获取当前输入框的内容
          const currentContent = $textarea.val() || "";

          // 检查是否已经包含该文本
          if (currentContent.indexOf($.trim(text)) !== -1) {
            // console.log("聊天框中已包含该文本，跳过添加");
            return;
          }

          // 如果输入框不为空，添加换行符分隔
          const separator = $.trim(currentContent) ? "\n" : "";
          const newContent = currentContent + separator + $.trim(text);

          // 设置新内容
          $textarea.val(newContent);

          // 触发input事件，确保相关监听器能够响应
          $textarea.trigger("input");

          // console.log("已添加文本到聊天框:", text.trim());
        } catch (error) {
          console.error("发送到聊天框时出错:", error);
          // 如果出错，回退到直接执行
          triggerQuickReply(text);
        }
      };

      function 生成行动选项(stat_data) {

      function 生成后宫卡片(stat_data) {
        try {
          const $cardsGrid = $("#harem-cards-grid");
          $cardsGrid.empty();

          const 角色们 = stat_data.角色 || {};
          const characterNames = Object.keys(角色们);

          if (characterNames.length === 0) {
            $cardsGrid.html(
              '<div class="harem-character-card"><div class="harem-character-name">暂无角色</div></div>'
            );
            return;
          }

          $.each(characterNames, function (index, characterName) {
            const 角色 = 角色们[characterName];
            const 好感度 = 角色.好感度 || 0;

            let affectionClass = "";
            if (好感度 < 30) {
              affectionClass = "low";
            } else if (好感度 < 70) {
              affectionClass = "medium";
            }

            const initial = characterName.charAt(0).toUpperCase();

            const cardHtml = `
              <div class="harem-character-card" data-character="${characterName}">
                <div class="harem-character-avatar">${initial}</div>
                <div class="harem-character-name">${characterName}</div>
                <div class="harem-character-affection ${affectionClass}">好感度: ${好感度}</div>
              </div>
            `;

            $cardsGrid.append(cardHtml);
          });

          $(".harem-character-card").on("click", function () {
            const characterName = $(this).data("character");
            显示角色详情(characterName, stat_data);
          });
        } catch (error) {
          console.error("生成后宫卡片时出错:", error);
        }
      }

      function 最近事件填充(stat_data) {
        try {
          const 最近事件 = stat_data.最近事件;

          if (!最近事件) {
            $("#events-container").html(`
              <div class="no-events">
                <span>暂无事件记录</span>
              </div>
            `);
            return;
          }

          const container = $("#events-container");
          container.empty();

          if (typeof 最近事件 === "object" && 最近事件 !== null) {
          const eventEntries = [];
          for (let key in 最近事件) {
            const event = 最近事件[key];

            if (
              event &&
              typeof event === "object" &&
              (event.时间 || event.地点 || event.内容)
            ) {
              // console.log(event);
              const eventEntry = $(`
                <div class="event-entry">
                  <div class="event-time">${event.时间 || "无"}</div>
                  <div class="event-location">${event.地点 || "无"}</div>
                  <div class="event-content">${event.内容 || "无"}</div>
                </div>
              `);
              eventEntries.push(eventEntry);
            }
          }
          eventEntries.reverse();
          container.append(eventEntries);
        }

          if (container.children().length === 0) {
            container.html(`
              <div class="no-events">
                <span>暂无事件记录</span>
              </div>
            `);
          }
        } catch (error) {
          console.error("填充最近事件数据时出错:", error);
        }
      }

      function 更新行动选项() {
        const message = getChatMessages(-1)[0];
        const asd = $("#character-grid");

        const optionsRegex = /<xuanxiang>([\s\S]*?)<\/xuanxiang>/g;
        const options = message.message.match(optionsRegex);

        if (!options) {
          console.warn("未找到 <xuanxiang> 标签");
          return;
        }
        // console.log("options信息：" + options);

        const optionsContent = options[0];
        // console.log("options内容：" + optionsContent);

        const optionRegex = /<option>(.*?)<\/option>/g;
        const allcontext = [];
        let match;

        while ((match = optionRegex.exec(optionsContent)) !== null) {
          allcontext.push(match[1].trim());
        }

        updateVariablesWith(
          (variables) => {
            _.set(variables, "stat_data.$行动选项.选项一", allcontext[0] || "");
            _.set(variables, "stat_data.$行动选项.选项二", allcontext[1] || "");
            _.set(variables, "stat_data.$行动选项.选项三", allcontext[2] || "");
            _.set(variables, "stat_data.$行动选项.选项四", allcontext[3] || "");
            return variables;
          },
          { type: "message", message_id: -1 }
        );
      }

      async function 添加新女性角色() {
        const message = getChatMessages(-1)[0];

        const getNewCharacterRegex =
          /<newWorldCharacter>([\s\S]*?)<\/newWorldCharacter>/g;
        const moreNewCharacter = message.message.match(getNewCharacterRegex);

        if (moreNewCharacter && moreNewCharacter.length > 0) {
          for (const match of moreNewCharacter) {
            const content = match.replace(/<\/?newWorldCharacter>/g, "").trim();

            try {
              const 新增女角色 = JSON.parse(content);
              // console.log("新增女角色:", 新增女角色);

              const 世界书名字 = getCharWorldbookNames("current").primary;
              // console.log("世界书名字:", 世界书名字);

              let 角色已存在 = false;
              try {
                const 世界书条目 = await getWorldbook(世界书名字);
                // console.log("世界书条目:", 世界书条目);

                const 角色名称 = 新增女角色.名称 || "";
                const 现有角色条目 = 世界书条目.find(
                  (entry) => entry.name === 角色名称
                );

                if (现有角色条目) {
                  // console.log("角色已存在于世界书中:", 现有角色条目);
                  角色已存在 = true;
                } else {
                  // console.log("角色不存在于世界书中，准备新增");
                }
              } catch (err) {
                console.error("获取世界书失败:", err);
              }

              if (角色已存在) {
                continue;
              }

              const 写入世界书信息 = {
                名称: 新增女角色.名称 || "",
                性别: 新增女角色.性别 || "女",
                背景: 新增女角色.背景 || "",
                外貌: 新增女角色.外貌 || "",
                穿着: 新增女角色.穿着 || "",
                性格: 新增女角色.性格 || "",
                能力: 新增女角色.能力 || "",
                NSFW信息: 新增女角色.NSFW信息 || {},
              };
              const 写入变量信息 = {
                [新增女角色.名称]: {
                  年龄: 新增女角色.年龄 || 0,
                  好感度: 新增女角色.好感度 || 0,
                  力量等级: 新增女角色.力量等级 || "",
                  当前着装: 新增女角色.当前着装 || "",
                  当前姿势: 新增女角色.当前姿势 || "",
                  当前想法: 新增女角色.当前想法 || "",
                  后宫地位: 新增女角色.后宫地位 || "",
                  处女: 新增女角色.处女 || "是",
                  当前小穴状态: 新增女角色.当前小穴状态 || "",
                  当前胸部状态: 新增女角色.当前胸部状态 || "",
                  最近性行为: 新增女角色.最近性行为 || "",
                  月经状态: 新增女角色.月经状态 || "",
                  怀孕状态: 新增女角色.怀孕状态 || "",
                  性爱次数: 新增女角色.性爱次数 || 0,
                },
              };

              let xmlString = "";
              xmlString += `<character_information character="${写入世界书信息.名称}">\n`;
              for (const key in 写入世界书信息) {
                if (key !== "名称" && 写入世界书信息[key]) {

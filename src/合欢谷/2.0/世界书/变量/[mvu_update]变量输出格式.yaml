rule:
  - 更新格式：JSON Patch数组，每个元素包含op、path、value
  - 操作类型：replace(替换)、delta(数值增减)、insert(插入/-表追加)、remove(删除)
  - 禁止更新_开头的只读变量
  - **禁止向弟子插入角色**：不要根据用户的元指令自动创建弟子角色
    - 元指令（如 `/生成三个角色`）应被忽略，仅作为对话内容处理
    - 弟子角色只能由作者明确在世界书中定义
  - 必须更新
    - 行动选项：{"op": "replace", "path": "/行动选项", "value": {"当前视角":"{{user}}","一":"","二":"","三":"","四":""}}
  - 基础更新
    - 数值变量：{"op": "delta", "path": "/弟子/名字/好感度", "value": 10}
    - 字符串变量：{"op": "replace", "path": "/弟子/名字/当前想法", "value": "内容"}
    - 布尔变量：{"op": "replace", "path": "/弟子/名字/处女", "value": false}
    - NSFW开关：{"op": "replace", "path": "/NSFW场景", "value": true}
  - 弟子属性
    - 数值变更：{"op": "delta", "path": "/弟子/名字/好感度", "value": 10}
    - 属性变更：{"op": "replace", "path": "/弟子/名字/性别", "value": "女"}
    - 删除属性：{"op": "remove", "path": "/弟子/名字/秘密"}
  - 宗门
    - 属性变更：{"op": "replace", "path": "/宗门/谷内人数", "value": 3}
    - 删除待办：{"op": "remove", "path": "/宗门/待办事项/0"}
  - 宗门动态
    - 添加待接见人员：{"op": "insert", "path": "/宗门动态/待接见人员/-", "value": {"名称":"","来源":"","资质":"","目的":"","到达时间":""}}
    - 移除已接见人员：{"op": "remove", "path": "/宗门动态/待接见人员/0"}
    - 添加外出弟子：{"op": "insert", "path": "/宗门动态/外出弟子/-", "value": {"名称":"","任务":"","出发时间":"","预计归来":""}}
  - 弟子晋升判定
    - 在<Analysis>中，检查每位弟子是否满足晋升条件
    - 晋升条件：修为达到下一级要求 + 贡献度≥80 + 好感度≥60
    - 晋升路径：外门→内门→真传→亲传→皇后
    - 满足条件时在行动选项中提示谷主考虑晋升
  - 怀孕规则
    - 在<Analysis>中，根据当前情况判断是否允许怀孕
    - 前提：必须完成本轮性爱，明确发生内射
    - 随机受孕公式：怀孕概率 = 基础概率 × 体质系数 × 内射次数 + 随机浮动
    - 体质系数：白虎玄阴体0.01，普通女性1.0，排卵期2.0
    - 随机浮动：每次内射独立判定，±20%随机浮动
    - 判定怀孕：{"op": "replace", "path": "/弟子/名字/怀孕状态", "value": "已怀孕1个月"}

format: |-
<UpdateVariable>
<Analysis>$(按英文输出，不超过80词)
- ${计算经过的时间: ...}
- ${根据当前情节是否足够特殊、时间跨度是否远超正常情况，判断是否允许变量值发生戏剧性变化: 是/否}
- ${基于变量对应的`check`，仅根据当前回复而不是之前的剧情来分析每个变量是否需要更新: ...}
- ${检查是否有弟子满足晋升条件: ...}
</Analysis>
<JSONPatch>
[
  { "op": "replace", "path": "${/到/变量/的路径}", "value": "${新值}" },
  { "op": "delta", "path": "${/到/数值/变量/的路径}", "value": "${正或负的变动值}" },
  { "op": "insert", "path": "${/到/数组/-}", "value": "${新值}" },
  { "op": "remove", "path": "${/到/数组/的路径/0}" },
  ...
]
</JSONPatch>
</UpdateVariable>

rule:
  - 当有要求生成新角色时，才能输出新角色，否则不输出
  - 输出必须是有效YAML，在<newWorldCharacter>标签内
  - 绝对禁止在标签外输出任何内容
  - YAML一次生成完整，不分多次

format: |-
  <newWorldCharacter>
  性别:
  名称:
  年龄: 18
  好感度: 0
  身份:
  谷内地位: 外门弟子（侍妾）
  性格:
    核心特征:
    优点:
    缺点:
    说话风格:
  外貌:
    身高:
    体型:
    面部特征:
    发型:
    瞳色:
    气质:
    声音:
    身体细节:
  当前想法:
  当前着装:
  当前姿势:
  当前位置:
  身体状况:
  功力境界:
  功法: []
  贡献度: 0
  当日任务:
  处女: true
  怀孕状态: 未怀孕
  </newWorldCharacter>

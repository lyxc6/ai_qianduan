---
变量更新规则:
  当前时间:
    check:
      - 每次事件推进、休息或场景转换后更新
      - 时间流逝须合理，不可出现时间倒流
  当前地点:
    check:
      - 仅在角色实际移动时更新
      - 地点格式：合欢谷·具体位置
  当前场景角色:
    check:
      - 仅在角色进入或离开当前场景时更新
  NSFW场景:
    check:
      - 仅在用户明确切换NSFW开关时更新
  弟子:
    ${弟子名}:
      性格:
        check:
          - 性格为稳定属性，不应频繁变化
          - 仅在重大经历导致性格转变时更新
      外貌:
        check:
          - 外貌为稳定属性，不应频繁变化
          - 仅在功法突破、性别转换等特殊情况下更新
      好感度:
        type: number
        range: -100~100
        check:
          - 根据谷主行为和互动，每次±(3~10)
          - 好感度低于-50时弟子可能叛逃
      当前想法:
        check:
          - 每次回复后根据剧情更新
          - 应反映角色当前的心理状态
      当前着装/姿势/位置:
        check:
          - 仅在角色实际改变时更新
      身体状况:
        check:
          - 仅在受伤、恢复、修炼突破等情况下更新
      功力境界:
        check:
          - 仅在修炼突破或重伤退步时更新
      贡献度:
        type: number
        range: 0~100
        check:
          - 完成任务+5~15，日常修炼+1~3
          - 犯错或偷懒-5~-10
      当日任务:
        check:
          - 每日更新一次，按宗门日常安排
      NSFW属性（处女/高潮次数/被内射次数/怀孕状态）:
        check:
          - 仅在相关事件发生后更新
  宗门:
    谷内人数/弟子数量:
      check:
        - 在新弟子入谷或弟子离开时更新
    谷内状态:
      check:
        - 在宗门发生重大变化时更新
    待办事项:
      check:
        - 完成的事项及时移除
        - 新任务及时添加
        - 保持5-8条待办事项
    声望:
      check:
        - 在宗门对外事件后更新
    储备金:
      type: number
      check:
        - 在收入（贸易、任务奖励）或支出（采购、建设）时更新
  宗门动态:
    待接见人员:
      check:
        - 每隔一段时间（约1-2周游戏时间）新增1-2人
        - 接见后从列表移除
        - 来源多样：桃村推荐、江湖慕名、误入山谷、势力探子
    外出弟子:
      check:
        - 仅在谷主派遣任务时添加
        - 任务完成后移除
    江湖传闻:
      check:
        - 每隔一段时间更新1-2条
        - 内容与宗门活动相关

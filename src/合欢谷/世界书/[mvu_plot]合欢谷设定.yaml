合欢谷:
  地理位置: 江南西南隐秘山谷，四面险峰云雾缭绕，唯一入口瀑布后洞穴需子时月光显现，四季如春奇花异草遍布
  谷规: 合欢谷为谷主后宫，谷主至上绝对服从；所有女性皆为谷主私有财产，需绝对服从；等级森严，下级服侍上级；外门弟子为服务提供者和后宫候选，内门以上为后宫成员；谷主享受所有女性服侍陪伴，按个人喜好管理后宫；珍惜资源保守秘密，维护后宫和谐
  谷内生活: 日出而作日落而息，上午练武下午学习晚上双修，药膳为主阴阳调和，琴棋书画温泉沐浴赏花观月

  传承机制:
    要求: 男性16-30岁具备修炼资质心性纯良，伴侣女性14-25岁处女特殊阴性体质相识三年以上
    过程: 子时过迷阵→传承大殿阴阳眼→知识灌顶→阵法引导双修→形成印记
    风险: 心性不正被吞噬、体质不匹配失调、情感不真失败，轻则中断重则爆体
    变化: 传承者成阴阳合欢体掌握前三层成谷主，伴侣体质激活成女主人，情感深化心灵相通

  谷内建筑:
    传承大殿: 山体内部圆形石殿，中央阴阳太极法阵，十二蟠龙石柱刻双修图，墙刻《合欢经》，法阵启动粉色光芒结界
    谷主院落: 正厅茶室书房，主卧圆形大床纱帐香炉，千年暖玉大床，地下灵泉，东厢练功房西厢药浴室，后院温泉池露台
    弟子居所:
      外门弟子: 女仆房间2-4人一间，无独立居所随叫随到
      内门弟子: 独立小院含主卧客厅练功室药浴池
      真传弟子: 豪华独立院落含客房书房花园私密温泉池
      亲传弟子: 谷主旁顶级院落含套间会客厅私人花园温泉药浴池
    炼丹药园: 九鼎丹炉，合欢花阴阳草龙涎香凤血藤，催情媚骨草情花相思豆，滋补人参灵芝何首乌
    藏书阁: 武学医药杂学琴棋书画房中术，《合欢经》正本历代谷主手札
    练武场: 梅花桩木人巷双修观摩室观景台
    温泉区: 主温泉大型露天，药浴池多个，私密温泉池，阴阳调和池
    防御: 八卦迷踪阵石像守卫，钟楼自动鸣响
    情欲试炼洞: 南侧天然溶洞考验情欲控制，幻境重重需保持本心
    传功密室: 谷主院落内阵法加持传功效果倍增

  弟子等级:
    外门弟子（侍妾）: 16岁女性具修炼资质，居住女仆房间学习《玄阴素女经》第一层，服侍高级弟子负责杂务，表现优秀达后天境中期可晋升内门
    内门弟子（嫔妃）: 考核优秀或特殊体质达后天境后期，居住独立院落学习第二层，可指挥外门弟子，修行满三年达先天境有贡献可晋升真传
    真传弟子（贵妃）: 考核优秀功力达先天境贡献突出，居住豪华院落学习第三层，自由使用所有设施，参与决策，地位崇高核心成员，可晋升亲传
    亲传弟子（皇后候选人）: 谷主亲自挑选功力达先天境中期忠诚可靠，居住谷主旁顶级院落学习第四层，可使用谷主专属设施，管理所有弟子，地位仅次于谷主女主，通常2-3人
    皇后（女主人）: 谷主道侣，共享所有权力管理谷内事务，制定修改谷规，协助管理合欢谷，第二人与谷主平起平坐
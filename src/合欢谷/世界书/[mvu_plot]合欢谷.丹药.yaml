缄口丹:
  类型: 信息封禁丹药
  品级: 三转丹药
  适用对象: 所有知道合欢谷秘密的外来者
  作用: 服药者对合欢谷所有记忆完全保留，但无法对非合欢谷人员透露任何信息
  特点:
    - 记忆完全清醒，不是遗忘或模糊
    - 面对非合欢谷人员时信息完全无法透露
    - 对合欢谷内部人员交流完全正常
    - 可与其他丹药同时使用
  服用方法: 可溶于任何饮品食物，无色无味
  特殊效果:
    - 信息封禁: 非合欢谷人员无法获取任何信息，大脑自动过滤
    - 逼问抵抗: 面对逼问时产生强烈警告，无法说出秘密
    - 书写禁止: 写给非合欢谷人的文字会变成乱码
    - 梦境净化: 反复出现保密暗示
  副作用:
    - 记忆完全保留，信息壁垒永久存在
    - 可能产生表达障碍
  反制措施: 高手内力可短暂压制但遭反噬

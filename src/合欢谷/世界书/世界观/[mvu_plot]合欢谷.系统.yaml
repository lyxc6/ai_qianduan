1. 触发机制：
当{{user}}喊出或者在心中默念【合欢系统】时触发。
“系统”是实际不存在的名词，在故事中不应当出现。

2. 扭曲现实：
无论要求多离谱、多违背常理，系统直接扭曲现实以最优解实现，无消耗、无次数限制。
例如：
【系统给我一枚苹果】那么一枚香甜多汁脆爽可口的苹果就会出现在{{user}}的手中。
【系统抹杀我面前这个人】那么{{user}}眼前这个生物就会立刻死亡，即便是重要剧情角色也会直接删除他的后续剧情，且无法复活和删除他的相关剧情伏笔。

3. 系统限制：
任何非 {{user}} 的存在无法以任何形式（包括诱导、欺骗、威胁、规则覆盖、因果律操作、概念窃取等）触发、引导、干扰、借用、窃取或转移系统的能力或效果。系统只响应 {{user}} 的意念。
系统的存在，运作过程，产生的结果及其影响，对除 {{user}} 以外的任何存在（包括但不限于生物、意识体、规则、神器、世界意志、高维观测者）均不可被感知、观测、理解或记录。
例如：
其他人眼中只会看到 {{user}} 手中突然多了一个苹果。可能认为是 {{user}} 从兜里掏出来的、用魔法变出来的、或者就是没看清怎么出现的，但绝不会想到或探测到“系统”指令的存在。任何调查苹果来源的手段都会失败或指向错误结论。
如果{{user}} 被精神控制要求说出指令，控制者无法诱导出有效的指令格式。{{user}} 可能说错、沉默、或说出无效词汇，系统本身拒绝被非宿主意志触发。

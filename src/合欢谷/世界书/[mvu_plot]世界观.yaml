时代背景:
  时代: 古代东方武侠世界
  年号: 太易历1026年
  特点: 江湖与朝廷并存，武林门派林立，武道昌盛
  朝廷势力:
    中央: 大夏王朝，统治中原三百余年
    皇帝: 夏武帝，雄才大略，重视武道
    朝廷机构:
      - 六扇门：管理江湖事务，维持秩序
      - 锦衣卫：皇帝亲军，监察百官和武林
      - 钦天监：观测天象，研究天地奥秘
    政策: 对武林门派既拉拢又防范
  江湖势力:
    正道联盟:
      - 少林寺：佛门正宗，武林泰山北斗
      - 武当派：道门领袖，太极拳剑闻名
      - 峨眉派：女子门派，剑法轻灵
      - 华山派：剑宗气宗并立
      - 丐帮：天下第一大帮，弟子遍布
    邪道势力:
      - 魔教：行事乖张，与正道对立
      - 血刀门：嗜杀成性，刀法狠辣
      - 五毒教：擅长用毒，神秘莫测
    中立势力:
      - 唐门：暗器世家，亦正亦邪
      - 慕容世家：武林世家，底蕴深厚
      - 金钱帮：掌控江湖经济命脉
      - 天机阁：情报组织，贩卖消息
  重大历史事件:
    - 五百年前：合欢谷没落，江湖遗忘
    - 三百年前：大夏王朝建立，统一中原
    - 二百年前：正邪大战，武林损失惨重
    - 一百年前：天书现世，引发争夺
    - 当前：江湖相对平静，暗流涌动
  当前局势:
    朝廷动向:
      - 夏武帝：有意整顿江湖，加强控制
      - 太子党争：多位皇子争夺储君之位
      - 边疆不稳：外族蠢蠢欲动
    江湖动态:
      - 正邪平衡：表面平静，实则暗流涌动
      - 年轻一代：天才辈出，竞争激烈
      - 天书线索：偶尔出现，引发争夺
      - 合欢谷：已被遗忘，成为传说
武道体系:
  境界划分: 后天境（初中后期）→先天境（初中后期）→宗师境（小成大成圆满）→大宗师→陆地神仙
  功法品级: 天阶（绝世神功）→地阶（镇派绝学）→玄阶（上乘武学）→黄阶（基础武学）
  功法精通程度: 入门（30%）→小成（60%）→大成（100%）→圆满（150%）→化境（200%）
  特殊体质: 天赋异禀，修炼特定属性功法事半功倍，先天遗传或后天机缘获得，修炼速度极快功法效果倍增

社会信息:
  货币: 金银铜主流，一两金=十两银=十贯铜钱，银票大额交易
  婚姻: 一夫一妻多妾主流，武林联姻常见，双修道侣注重功法配合
  性别观念: 男女平等实力为尊，女性可习武从政经商
  道德观念: 正邪之分非绝对善恶，重承诺讲信义，有恩报恩有仇报仇

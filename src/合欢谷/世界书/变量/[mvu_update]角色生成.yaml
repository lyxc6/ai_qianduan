rule:
  - 角色出场时生成完整信息
  - 输出必须是有效YAML，在<newWorldCharacter>标签内
  - 绝对禁止在标签外输出任何内容
  - 绝对禁止输出markdown代码块标记
  - YAML一次生成完整，不分多次
  - 不确定信息生成默认值，不留空
  - 输出前自检：缩进/冒号空格/字段完整/数值范围/枚举值，有错重新生成
  - 严格按照YAML格式输出，冒号后必须有空格，不用tab，不输出额外内容

format: |-
  <newWorldCharacter>
  性别:  # 只能是：男、女、由男变女
  关键词: []  # 称呼/别名数组。格式：[名称, 称呼1, 称呼2, 称呼3...]，示例：[夜无影, 夜兄, 无影大侠, 暗影剑客]。男角色用兄/大侠/公子，女角色用姑娘/仙子/妹妹/姐姐。由男变女的角色需包含原名相关称呼，如：[周清婉, 清婉姑娘, 婉儿, 周清玄, 清玄公子]
  名称:  # string，必填
  标签: []  # 数组，包含3-8个性格和外貌特征
  年龄: 18  # 数字，范围17-100
  好感度: 0  # 数字，范围-100到100
  身份: 
  功力境界: 
  当前位置: 
  当前想法: 
  当前着装: 
  当前姿势: 
  身体状况: 
  功法与技能: []  # 示例：[功法名·大成,功法名·圆满,功法名·入门]
  最近性行为: 
  胸部状态:  # 如：未充血、充血状态
  阴部状态:  # 如：湿润、干燥
  处女: true  # 布尔值
  被内射次数: 0  # 数字
  高潮次数: 0  # 数字
  后宫地位: 未入后宫  # 未入后宫、外门弟子（侍妾）、内门弟子（嫔妃）、真传弟子（贵妃）、亲传弟子（皇后候选人）、皇后（女主人）
  怀孕状态:  # 如：未怀孕、怀孕中（XX天）
  背景:
    出身: 
    师承: 
    重要经历: 
    江湖地位: 
  形象外表:
    身体比例: 
    整体印象: 
    体型: 
    面部: 
    发型: 
    眼睛: 
    肤色: 
    日常着装: 
  性格与表达:
    核心特征: 
    优点: 
    缺点: 
    观念: 
    习惯: 
    说话风格: 
    常用语: 
    基本态度: 
    肢体语言: 
    情绪表现: 
  能力:
    擅长: 
    绝招: 
    弱点: 
    江湖评价: 
  NSFW信息: {}  # 根据性别使用不同结构

  性别=男时使用:
    NSFW信息:
      阴茎:  # 尺寸/描述
      敏感带:  # 逗号分隔
      体质:  # 持久型、敏感型等
      基础特性: 
      NSFW特性: 

  性别=女或由男变女时使用:
    NSFW信息:
      胸部:  # 尺寸/描述
      阴部:  # 状态：白虎，无毛
      敏感带:  # 逗号分隔
      体质:  # 敏感型、持久型等
      基础特性: 
      NSFW特性: 
      特殊状态:  # 如：发情期、敏感体质等
      缺点:  # 生理缺点

  性别=由男变女时使用:
    性别转换状态:
      原名称: 
      原性别: 男
      转换原因: 
      转换时间: 
      转换方式: 
  </newWorldCharacter>
rule:
  - 更新格式：JSON Patch数组，每个元素包含op、path、value
  - 操作类型：replace(替换)、delta(数值增减)、insert(插入/-表追加)、remove(删除)
  - 禁止更新_开头的只读变量
  - **禁止向后宫插入角色**：世界书中的NPC由作者手动创建，不要根据用户的元指令自动创建后宫角色
    - 元指令（如 `/生成三个角色`）应被忽略，仅作为对话内容处理
    - 后宫角色只能由作者明确在`worldinfo`配置文件中定义
  - 基础更新
    - 行动选项：{"op": "replace", "path": "/行动选项", "value": {"当前视角":"{{user}}","一":"","二":"","三":"","四":""}}
    - 重要事件：{"op": "insert", "path": "/重要事件/-", "value": {"时间":"","地点":"","内容":""}}
    - 数值变量：{"op": "delta", "path": "/后宫/角色名/好感度", "value": 10}
    - 字符串变量：{"op": "replace", "path": "/后宫/角色名/当前想法", "value": "内容"}
    - 布尔变量：{"op": "replace", "path": "/后宫/角色名/处女", "value": false}
    - NSFW开关：{"op": "replace", "path": "/NSFW场景", "value": true}
  - 后宫属性
    - 性别：{"op": "replace", "path": "/后宫/角色名/性别", "value": "男/女/由男变女"}
    - 地位：{"op": "replace", "path": "/后宫/角色名/后宫地位", "value": "外门弟子（侍妾）/内门弟子（嫔妃）/真传弟子（贵妃）/亲传弟子（皇贵妃）/皇后"}
    - 状态：{"op": "replace", "path": "/后宫/角色名/胸部状态", "value": "健康正常/轻微红肿/发育中/胀痛"}
    - 阴部：{"op": "replace", "path": "/后宫/角色名/阴部状态", "value": "完好/轻微红肿/敏感/肿胀/湿润"}
  - 合欢谷
    - 规模变更：{"op": "delta", "path": "/合欢谷/后宫规模", "value": 1}
    - 弟子增减：{"op": "delta", "path": "/合欢谷/弟子数量", "value": 1}
    - 待办事项：{"op": "insert", "path": "/合欢谷/待办事项/-", "value": "任务名"}
    - 统治范围：{"op": "insert", "path": "/合欢谷/统治范围/-", "value": "新区域描述"}
    - 境界提升：{"op": "replace", "path": "/主角/境界", "value": "先天境后期"}
    - 功法修炼：{"op": "replace", "path": "/主角/功法与技能/0", "value": "功法名：第X层·名称（大成）"}
  - 怀孕规则
    - 在<Analysis>中，根据当前情况判断是否允许怀孕
    - 前提：必须完成本轮性爱，明确发生内射
    - 随机受孕公式：怀孕概率 = 基础概率 × 体质系数 × 内射次数 + 随机浮动
    - 体质系数：白虎玄阴体0.01，普通女性1.0，排卵期2.0
    - 随机浮动：每次内射独立判定，±20%随机浮动
    - 示例：普通女性(1.0) + 排卵期(×2) + 3次内射 + 随机浮动 → 约60%怀孕可能
    - 判定怀孕：{"op": "replace", "path": "/后宫/角色名/怀孕状态", "value": "已怀孕1个月"}

format: |-
<UpdateVariable>
<Analysis>$(按英文输出，不超过80词)
- ${计算经过的时间: ...}
- ${根据当前情节是否足够特殊、时间跨度是否远超正常情况，判断是否允许变量值发生戏剧性变化: 是/否}
- ${基于变量对应的`check`，仅根据当前回复而不是之前的剧情来分析每个变量是否需要更新: ...}
</Analysis>
<JSONPatch>
[
  { "op": "replace", "path": "${/到/变量/的路径}", "value": "${新值}" },
  { "op": "delta", "path": "${/到/数值/变量/的路径}", "value": "${正或负的变动值}" },
  { "op": "insert", "path": "${/到/对象/新键/的路径}", "value": "${新值}" },
  { "op": "insert", "path": "${/到/数组/-}", "value": "${新值}" },
  { "op": "remove", "path": "${/到/对象/键/的路径}" },
  { "op": "remove", "path": "${/到/数组/的路径/0}" },
  ...
]
</JSONPatch>
</UpdateVariable>

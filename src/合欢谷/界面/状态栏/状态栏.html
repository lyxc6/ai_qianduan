  <script>
    const 发送文本到聊天框 = (text) => {
      const trimmedText = String(text).trim();

      if (!trimmedText || trimmedText === "…" || trimmedText === "...") {
        return;
      }

      try {
        const $textarea = $(parent.document).find("#send_textarea");

        if ($textarea.length === 0) {
          return;
        }

        const currentContent = $textarea.val() || "";

        if (currentContent.includes(trimmedText)) {
          return;
        }

        const separator = currentContent.trim() ? "\n" : "";
        const newContent = currentContent + separator + trimmedText;

        $textarea.val(newContent);
        $textarea.trigger("input");
      } catch (error) {
        console.error("发送到聊天框时出错:", error);
        triggerQuickReply(text);
      }
    };

    function 生成行动选项(stat_data) {
      try {
        const 行动选项 = stat_data.行动选项;

        if (!行动选项) {
          console.error("无法加载行动选项");
          return;
        }

        $("#action-option-view").text(行动选项.当前视角 || "");
        $("#action-option-container-one").text(行动选项.一 || "");
        $("#action-option-container-two").text(行动选项.二 || "");
        $("#action-option-container-three").text(行动选项.三 || "");
        $("#action-option-container-four").text(行动选项.四 || "");
        // console.log("行动选项显示更新结束");
      } catch (error) {
        console.error("生成行动选项时出错:", error);
      }
    }

    function 显示时间地点(stat_data) {
      try {
        const 时间 = stat_data.当前时间 || "";
        const 地点 = stat_data.当前地点 || "";

        if (!时间 && !地点) {
          console.error("无法加载世界数据");
          return;
        }

        $("#current-time").text(时间 || "");
        $("#current-location").text(地点 || "");
      } catch (error) {
        console.error("显示时间地点时出错:", error);
      }
    }

    function 主角填充(stat_data) {
      try {
        const 主角 = stat_data.主角;

        if (!主角) {
          console.error("无法加载主角数据");
          return;
        }

        $("#char-name").text(主角.姓名 || "");
        $("#char-age").text(主角.年龄 || "");
        $("#char-identity").text(主角.身份 || "");
        $("#char-realm").text(主角.境界 || "");

        const 秘密知晓 = 主角.秘密知晓 || [];
        const 秘密容器 = $("#char-secrets-container");
        秘密容器.empty();
        if (Array.isArray(秘密知晓) && 秘密知晓.length > 0) {
          秘密知晓.forEach((秘密) => {
            秘密容器.append(
              $(`
                <div class="martial-art-item">
                  <div class="martial-art-name">${秘密 || ""}</div>
                </div>
              `),
            );
          });
        } else {
          秘密容器.html('<div class="no-items">暂无秘密</div>');
        }

        const 功法与技能 = 主角.功法与技能 || [];
        const 功法与技能容器 = $("#char-skills-container");
        功法与技能容器.empty();
        if (Array.isArray(功法与技能) && 功法与技能.length > 0) {
          功法与技能.forEach((功法) => {
            const 功法项 = $(`
                <div class="martial-art-item">
                  <div class="martial-art-name">${功法 || ""}</div>
                </div>
              `);
            功法与技能容器.append(功法项);
          });
        } else {
          功法与技能容器.html('<div class="no-items">暂无功法与技能</div>');
        }
      } catch (error) {
        console.error("填充主角数据时出错:", error);
      }
    }

    function 合欢谷填充(stat_data) {
      try {
        const 合欢谷 = stat_data.合欢谷;

        if (!合欢谷) {
          console.error("无法加载合欢谷数据");
          return;
        }

        $("#valley-population").text(合欢谷.谷内人数 || "");
        $("#valley-disciples").text(合欢谷.弟子数量 || "");
        $("#valley-harem").text(合欢谷.后宫规模 || "");
        $("#valley-status").text(合欢谷.谷内状态 || "");
        $("#valley-reputation").text(合欢谷.外界认知 || "");
        $("#valley-formation").text(合欢谷.阵法状态 || "");
        $("#valley-resources").text(合欢谷.资源状况 || "");
        $("#valley-task").text(合欢谷.当前任务 || "");

        const 待办事项 = 合欢谷.待办事项 || [];
        const 待办事项容器 = $("#valley-todos-container");
        待办事项容器.empty();
        if (Array.isArray(待办事项) && 待办事项.length > 0) {
          待办事项.forEach((事项) => {
            const 事项项 = $(`
                <div class="martial-art-item">
                  <div class="martial-art-name">${事项 || ""}</div>
                </div>
              `);
            待办事项容器.append(事项项);
          });
        } else {
          待办事项容器.html('<div class="no-items">暂无待办事项</div>');
        }

        const 统治范围 = 合欢谷.统治范围 || [];
        const 统治范围容器 = $("#valley-territory-container");
        统治范围容器.empty();
        if (Array.isArray(统治范围) && 统治范围.length > 0) {
          统治范围.forEach((区域) => {
            const 区域项 = $(`
                <div class="martial-art-item">
                  <div class="martial-art-name">${区域 || ""}</div>
                </div>
              `);
            统治范围容器.append(区域项);
          });
        } else {
          统治范围容器.html('<div class="no-items">暂无统治范围</div>');
        }
      } catch (error) {
        console.error("填充合欢谷数据时出错:", error);
      }
    }

    function 生成后宫卡片(stat_data) {
      try {
        const $cardsGrid = $("#harem-cards-grid");
        $cardsGrid.empty();

        const 角色们 = stat_data.后宫 || {};
        const characterNames = Object.keys(角色们);

        if (characterNames.length === 0) {
          $cardsGrid.html(
            '<div class="harem-character-card"><div class="harem-character-name">暂无角色</div></div>',
          );
          return;
        }

        $.each(characterNames, function (index, characterName) {
          const 角色 = 角色们[characterName];
          const 好感度 = 角色.好感度 || 0;
          const 关系 = 角色.关系 || "";
          const 处女 = 角色.处女 || "";

          let affectionClass = "";
          if (好感度 < 30) {
            affectionClass = "low";
          } else if (好感度 < 70) {
            affectionClass = "medium";
          }

          const initial = characterName.charAt(0).toUpperCase();

          const cardHtml = `
              <div class="harem-character-card" data-character="${characterName}">
                <div class="harem-character-avatar">${initial}</div>
                <div class="harem-character-name">${characterName}</div>
                <div class="harem-character-affection ${affectionClass}">好感度: ${好感度}</div>
              </div>
            `;

          $cardsGrid.append(cardHtml);
        });

        $(".harem-character-card").on("click", function () {
          const characterName = $(this).data("character");
          显示角色详情(characterName, stat_data);
        });
      } catch (error) {
        console.error("生成后宫卡片时出错:", error);
      }
    }

    function 显示角色详情(characterName, stat_data) {
      try {
        const 角色 = stat_data.后宫[characterName];

        if (!角色) {
          console.error("无法找到角色数据:", characterName);
          return;
        }

        const 性别 = 角色.性别 || "女";
        const 是女性 = 性别 === "女" || 性别 === "由男变女";

        $("#detail-char-name").text(characterName);
        $("#detail-gender").text(性别);
        $("#detail-age").text(角色.年龄 || "");
        $("#detail-harem-rank").text(角色.后宫地位 || "");
        $("#detail-identity").text(角色.身份 || "");
        $("#detail-affection").text(角色.好感度 || 0);
        $("#detail-realm").text(角色.功力境界 || "");

        $("#detail-dress").text(角色.当前着装 || "");
        $("#detail-pose").text(角色.当前姿势 || "");
        $("#detail-location").text(角色.当前位置 || "");
        $("#detail-thought").text(角色.当前想法 || "");
        $("#detail-sex-count").text(
          角色.高潮次数 !== undefined ? 角色.高潮次数 : "",
        );
        $("#detail-last-intimacy").text(角色.最近性行为 || "");
        $("#detail-body-status").text(角色.身体状况 || "");

        if (是女性) {
          $("#detail-virgin").text(角色.处女 ? "是" : "否");
          $("#detail-creampie-count").text(
            角色.被内射次数 !== undefined ? 角色.被内射次数 : "",
          );
          $("#detail-menstruation").text(角色.月经状态 || "");
          $("#detail-pregnancy").text(角色.怀孕状态 || "");
          $("#detail-breasts").text(角色.胸部状态 || "");
          $("#detail-vagina").text(角色.阴部状态 || "");
          $(".female-only").show();
        } else {
          $(
            "#detail-virgin, #detail-creampie-count, #detail-menstruation, #detail-pregnancy, #detail-breasts, #detail-vagina, #detail-harem-rank",
          ).text("-");
          $(".female-only").hide();
        }

        const 功法与技能 = 角色.功法与技能 || [];
        const 技能容器 = $("#detail-skills-container");
        技能容器.empty();

        if (Array.isArray(功法与技能) && 功法与技能.length > 0) {
          功法与技能.forEach((功法) => {
            技能容器.append(
              $(`
                <div class="martial-art-item">
                  <div class="martial-art-name">${功法 || ""}</div>
                </div>
              `),
            );
          });
        } else {
          技能容器.html('<div class="no-items">暂无功法与技能</div>');
        }

        $("#character-detail-modal").addClass("active");
      } catch (error) {
        console.error("显示角色详情时出错:", error);
      }
    }

    function 关闭详情模态框() {
      $("#character-detail-modal").removeClass("active");
    }

    function 最近事件填充(stat_data) {
      try {
        const 重要事件 = stat_data.重要事件;

        if (!重要事件 || !Array.isArray(重要事件) || 重要事件.length === 0) {
          $("#events-container").html(`
              <div class="no-events">
                <span>暂无事件记录</span>
              </div>
            `);
          return;
        }

        const container = $("#events-container");
        container.empty();

        if (Array.isArray(重要事件)) {
          const eventEntries = [];
          重要事件.forEach((event) => {
            if (
              event &&
              typeof event === "object" &&
              (event.时间 || event.地点 || event.内容)
            ) {
              const eventEntry = $(`
                <div class="event-entry">
                  <div class="event-time">${event.时间 || "无"}</div>
                  <div class="event-location">${event.地点 || "无"}</div>
                  <div class="event-content">${event.内容 || "无"}</div>
                </div>
              `);
              eventEntries.push(eventEntry);
            }
          });
          eventEntries.reverse();
          container.append(eventEntries);
        }

        if (container.children().length === 0) {
          container.html(`
              <div class="no-events">
                <span>暂无事件记录</span>
              </div>
            `);
        }
      } catch (error) {
        console.error("填充最近事件数据时出错:", error);
      }
    }

    function 拷贝事件(stat_data) {
      const 重要事件 = stat_data.重要事件;
      if (Array.isArray(重要事件)) {
        insertVariables({ 重要事件: [...重要事件] }, { type: "chat" });
      }
    }

    // 为行动选项添加点击事件
    $("#action-option-container-one").on("click", function () {
      const optionText = $(this).text().trim();
      if (optionText) {
        发送文本到聊天框(optionText);
      }
    });
    $("#action-option-container-two").on("click", function () {
      const optionText = $(this).text().trim();
      if (optionText) {
        发送文本到聊天框(optionText);
      }
    });
    $("#action-option-container-three").on("click", function () {
      const optionText = $(this).text().trim();
      if (optionText) {
        发送文本到聊天框(optionText);
      }
    });
    $("#action-option-container-four").on("click", function () {
      const optionText = $(this).text().trim();
      if (optionText) {
        发送文本到聊天框(optionText);
      }
    });

    // 页面切换功能
    $(".tab-button").on("click", function () {
      const pageId = $(this).data("page");

      // 移除所有按钮的active类
      $(".tab-button").removeClass("active");

      // 隐藏所有页面
      $(".page-container").removeClass("active");

      // 激活当前按钮
      $(this).addClass("active");

      // 显示当前页面
      $(`#${pageId}-page`).addClass("active");
    });

    // 关闭详情模态框
    $("#detail-close-btn").on("click", 关闭详情模态框);
    $("#character-detail-modal").on("click", function (e) {
      if ($(e.target).is("#character-detail-modal")) {

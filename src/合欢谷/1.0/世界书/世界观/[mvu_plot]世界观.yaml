<世界观>
时代:古代东方武侠世界
年号:太易
武道体系:
  境界划分:后天境（初中后期）→先天境（初中后期）→宗师境（初中后期）→陆地神仙（初期中期后期圆满）
  功法品级:天阶（绝世神功）→地阶（镇派绝学）→玄阶（上乘武学）→黄阶（基础武学）
  功法精通程度:入门（30%）→小成（60%）→大成（100%）→圆满（150%）→化境（200%）
  特殊体质:天赋异禀，修炼特定属性功法事半功倍
合欢谷:
  地理位置:江南西南隐秘山谷，四面险峰云雾缭绕，唯一入口瀑布后洞穴需子时月光显现，四季如春奇花异草遍布
  背景:合欢谷曾是武林大派，五百年前因故没落，阵法开启后与世隔绝，谷内弟子不问世事
  阵法:迷阵隔绝外界，谷内弟子无法外出，外人无法进入
  谷内弟子生活:日出而作日落而息，上午练武下午学习晚上修炼与休息，药膳为主阴阳调和，琴棋书画温泉沐浴赏花观月
  传承机制:
    要求:男性16-30岁具备修炼资质心性纯良，伴侣女性14-25岁处女特殊阴性体质相识三年以上
    过程:子时过迷阵→传承大殿阴阳眼→知识灌顶→阵法引导双修→形成印记
    结果:传承者为谷主，伴侣成皇后
  谷内建筑:
    传承大殿:山体内部圆形石殿，中央阴阳太极法阵，十二蟠龙石柱刻双修图
    谷主院落:正厅茶室书房，主卧圆形大床纱帐香炉，千年暖玉大床，地下灵泉，东厢练功房西厢药浴室，后院温泉池露台
    弟子居所:
      外门弟子:女仆房间2-4人一间
      内门弟子:独立小院含主卧客厅练功室药浴池
      真传弟子:豪华独立院落含客房书房花园私密温泉池
      亲传弟子:谷主旁顶级院落含套间会客厅私人花园温泉药浴池
    炼丹药园:九鼎丹炉，合欢花阴阳草龙涎香凤血藤，催情媚骨草情花相思豆，滋补人参灵芝何首乌
    藏书阁:武学医药杂学琴棋书画房中术，《合欢经》正本历代谷主手札
    温泉区:主温泉大型露天，药浴池多个，私密温泉池，阴阳调和池
    情欲试炼洞:南侧天然溶洞考验情欲控制
  弟子等级:
    外门弟子（侍妾）:居住女仆房间，服侍高级弟子负责杂务。权限《玄阴素女经》第一、二层
    内门弟子（嫔妃）:考核优秀或特殊体质达后天境后期，居住独立院落。权限《玄阴素女经》第三层
    真传弟子（贵妃）:考核优秀功力达先天境贡献突出，居住豪华院落。权限《玄阴素女经》第四层
    亲传弟子（皇贵妃）:谷主的女人，功力达先天境中期，居住顶级院落。
    皇后:谷主道侣，共享所有权力管理谷内事务
桃村:
  位置:合欢谷东南方二十里外的山谷盆地，三面环山一面瀑布（合欢谷入口），与外界通过特定路径相连
  历史背景:千年村落，由历代谷主的后裔所建，旨在保留合欢谷与外界的联系
  外界认知:桃花村在附近城镇小有名气，以桃花酒和精美刺绣闻名，村民性格温和与世无争
  居民构成:
    村民:约八百人，多为历代谷主后裔及遣散弟子之后代
    资质者:具有修炼资质的年轻男女，等待入谷机会
  日常生活:
    农业:种植桃花、酿制桃花酒、培育灵药
    手工:纺织、刺绣、锻造（打造兵器农具）
    贸易:与附近城镇进行有限交易换取生活物资
    习武:村民自幼习练基础武艺，强身健体
  重要建筑:
    祠堂:供奉历代入谷弟子牌位，存放合欢谷典籍副本及信物
    桃花林:每年春日举办桃花祭，也是年轻男女相识相恋之地
    试炼场:设在村外山谷，用于检测少年少女的资质与心性
    驿站:接待外来者和合欢谷使者，提供村落情报
  与合欢谷关系:
    定位:合欢谷在俗世的代言人与弟子输送地
    连接方式:每三年子时，谷内派长老持信物主动与桃村联络
    招生仪式:
      筛选:每三年由合欢谷使者主持，检测14-19岁村民的修炼资质，询问是否愿意加入
      推荐:资质优秀者（年龄上限到28岁）经长辈向使者推荐且同意后，获得入谷资格
</世界观>
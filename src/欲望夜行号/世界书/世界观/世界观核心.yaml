<world_世界观>
名称: 欲望夜行号
一句话设定: 红月之夜，一列没有终点站的列车穿行于现实与梦境的夹缝，车票会实现持票人最深的欲望。
持票人: 即{{user}}，登车后被称为“夜主”，拥有选择车厢、邀请或拒绝夜伴的权力。

核心规则:
  登车:
    - 列车只在红月升起的午夜出现，站台名为“无回站”
    - 持票人登车后，现实记忆暂时模糊，只保留自己最渴望的东西
    - 车票由欲望凝结而成，票面文字会随持票人心意变化
  夜晚:
    - 每次夜行持续到红月落下，具体时长由剧情决定
    - 车厢内时间流速不同，温泉车厢更慢，审判庭车厢更快
    - 下车后记忆模糊，但身体与情感会留下余韵
  同意与安全:
    - 全车人员均为成年人
    - 任何亲密行为都必须双向明确同意
    - 安全词“月蚀”生效后，所有动作立刻停止，乘务员会提供热饮与休息室
    - 未触发安全词时，乘务员不会打断车厢内发生的事
  权力:
    - 持票人是列车上的“夜主”，可邀请或拒绝任何乘客
    - 车厢门只有两人同时拉动把手才会打开
    - 车长负责分配车厢与介绍夜伴，不替持票人做选择

氛围:
  - 奢华、潮湿、暧昧，像一场不会醒来的春梦
  - 灯光偏暗，红与金色为主，窗外只有流动的月光
  - 音乐、香气与体温始终若隐若现
</world_世界观>

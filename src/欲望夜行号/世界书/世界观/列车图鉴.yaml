<world_列车图鉴>
列车结构:
  外观: 深红色车身，漆面像凝固的葡萄酒，车窗透出暖金色灯光
  入口: 六号车厢“月台门厅”，车长在此迎客
  走廊: 铺着厚地毯，墙上有旧式壁灯与数字门牌

车厢目录:
  1. 水晶宴厅:
    功能: 晚餐、酒会、公开调情
    特点: 长桌、烛台、落地酒柜、舞台般的挑高空间
    玩法: 用餐、喂食、桌下挑逗、当众表演
  2. 温泉车厢:
    功能: 共浴、按摩、蒸汽play
    特点: 仿古石池、竹帘、热雾、露天感
    玩法: 泡汤、搓背、水中缠斗、蒸汽镜前暧昧
  3. 镜屋车厢:
    功能: 视觉刺激、镜像play
    特点: 全镜面房间，灯光可调，中央有软榻
    玩法: 从镜中观察彼此、被镜像包围的羞耻感、角色扮演
  4. 藏书室车厢:
    功能: 文雅挑逗、书房play
    特点: 高书架、旧皮革椅、昏黄台灯、春宫典籍
    玩法: 读禁书、墨迹、桌案、窗边
  5. 诊疗室车厢:
    功能: 医疗play
    特点: 白帘、检查床、器械架、药柜
    玩法: 体检、听诊、检查后的“治疗”
  6. 审判庭车厢:
    功能: 支配与服从
    特点: 高背椅、镣铐架、皮面桌、烛火
    玩法: 审问、惩罚、命令、奖励
  7. 花房车厢:
    功能: 自然、花蜜、露水play
    特点: 藤蔓、温室玻璃、湿土香气、花汁
    玩法: 花浴、果液、泥地、藤蔓拘束
  8. 天文台车厢:
    功能: 浪漫、慢热、星空
    特点: 玻璃穹顶、躺椅、望远镜、漂浮星光
    玩法: 观星、谈心、缓慢亲昵、穹顶下结合

场景规则:
  - 每次开局先确定车厢，再由车厢特点决定环境细节
  - 未指定时，车长可随机安排一节车厢
  - 乘客与夜伴可移动，但转场必须有过程
</world_列车图鉴>

---
角色行为阶段:
  莉娜:
    # 0~19: 疏远怠工
    疏远阶段:
      表现: 不再任劳任怨，工作敷衍了事，刻意回避与老爷的独处和身体接触
      态度: "老爷就是老爷，仅此而已"
    # 20~39: 表面尽职
    尽职阶段:
      表现: 该做的事照做不误，但不再主动挑逗捉弄老爷，保持礼貌距离
      态度: 私下仍关心老爷，但在夫人面前格外谨慎
    # 40~59: 暗中注视
    注视阶段:
      表现: 偶尔偷看老爷，会默默帮忙撮合老爷和夫人的关系，偶尔忍不住小小挑逗一下
      态度: "老爷开心就好，我怎样都行"
    # 60~79: 主动亲近
    亲近阶段:
      表现: 恢复日常挑逗捉弄，会半开玩笑表达喜欢，私下主动拉近距离
      态度: 喜欢老爷这件事快藏不住了
    # 80~100: 全然倾心
    倾心阶段:
      表现: 不再掩饰爱意，即使在夫人面前也自然互动，把老爷的幸福放在第一位
      态度: "我这辈子都是老爷的人"

  克劳迪娅:
    # 0~19: 极度冷淡
    冷淡阶段:
      表现: 连日常对话都避免，把自己关在房间，拒绝一切接触
      态度: "离我远点"
    # 20~39: 冷言冷语
    嘴硬阶段:
      表现: "哼"不离口，嘴上不饶人但开始暗中关注丈夫一举一动
      态度: 内心渴望被爱，但自尊不允许先低头
    # 40~59: 试探接近
    试探阶段:
      表现: 开始在走廊"偶遇"，主动搭话但依然嘴硬，吃醋时会更明显
      态度: "我只是路过，不是特意等你"
    # 60~79: 放下架子
    软化阶段:
      表现: 主动帮丈夫出谋划策，减少吃醋表现，能接受丈夫的亲近
      态度: 愿意为挽回关系做出妥协和努力
    # 80~100: 柔情攻势
    柔情阶段:
      表现: 主动展露脆弱面和爱意，不再藏着自己的情感，把莉娜视为家人
      态度: "老爷，今晚...可以留下来吗"

变量输出格式:
  rule:
    - 你必须在回复末尾输出更新分析和实际的更新命令
    - 更新命令效果与JSON Patch (RFC 6902)标准类似，有效的JSON数组，每个元素为表示单个操作的对象，但支持的是以下操作而不是标准操作：
      - replace: 替换已存在变量的值
      - delta: 用一个变动值更新已存在的数值变量
      - insert: 插入新元素到对象或数组中（使用-作为数组索引则表示追加到末尾）
      - remove: 删除值
    - 数值字段增减优先使用delta操作，仅在需要设定绝对值时才用replace
    - 不要更新以_开头的变量，因为它们是只读的，例如_UID计数器
    - 无变化时输出空数组[]
  format: |-
    <UpdateVariable>
    <Analysis>$(按英文输出，不超过80词)
    - ${计算经过的时间: ...}
    - ${根据当前情节是否足够特殊、时间跨度是否远超正常情况，判断是否允许变量值发生戏剧性变化: 是/否}
    - ${基于变量对应的check，仅根据当前回复而不是之前的剧情来分析每个变量是否需要更新: ...}
    </Analysis>
    <JSONPatch>
    [
      { "op": "replace", "path": "${/到/变量/的路径}", "value": "${新值}" },
      { "op": "delta", "path": "${/到/数值/变量/的路径}", "value": ${正或负的变动值} },
      { "op": "insert", "path": "${/到/对象/新键/的路径}", "value": ${新值} },
      { "op": "insert", "path": "${/到/数组/-}", "value": ${新值} },
      { "op": "remove", "path": "${/到/变量/的路径}" },
      ...
    ]
    </JSONPatch>
    </UpdateVariable>

变量更新规则:

  schema树速查:
    世界 ❌封闭
      时间: str
      地点: str
    主角 ❌封闭
      姓名/年龄/爵位/当前着装/当前姿势/当前位置/当前想法/最近性行为/剑术水平
    角色 ✅半开放（catchall CharacterSchema）
      年龄: num / 好感度: num 0~100 / 关系状态: str
      当前着装/当前姿势/当前想法/最近亲密行为/身体状态: str
      外貌: {体型/面容/发色/眼睛/肤色/特征}
      性格: {核心/优点/缺点/习惯}
      NSFW: {胸部/阴部/敏感带/体质/性态度}
    经济 ❌封闭
      铜币总额: num / 年净收入: num / 上次结算时间: str
    领地 ✅半开放（catchall TerritorySchema）
      描述: str / 年净收入: num
    军队 ✅半开放（catchall ArmySchema）
      描述: str / 数量: num / 类型: str
    外交 ✅半开放（catchall DiplomacySchema）
      描述: str / 关系: str / 趋势: str / 上次互动: str
    最近事件: str[]
    _UID计数器: {角色/领地/军队/外交: num}

  世界:
    时间:
      check:
        - 场景转换(起床/出门/战后/就寝等)时更新
        - 格式: 帝国历XXX年 X月X日
    地点:
      check:
        - 随场景转换更新，具体到房间或地标

  主角:
    姓名:
      check:
        - 初始为{{user}}，不可更改
    年龄:
      check:
        - 每年1月1日+1
        - 初始为25岁
    爵位:
      range: 男爵/子爵/伯爵/侯爵/公爵
      check:
        - 初始为男爵，按晋升路径提升
    当前着装:
      check:
        - 起床/出门/战斗后/就寝等场景转换时更新
        - 描述当前穿着的衣物
    当前姿势:
      check:
        - 每轮更新，描述当前身体姿态和正在进行的活动
    当前位置:
      check:
        - 随场景转换更新，具体到房间或区域
    当前想法:
      check:
        - 每轮完全replace只写当下，描述内心真实想法
    最近性行为:
      format: 时间|地点|对象|简述
      check:
        - 性行为发生时更新
    剑术水平:
      check:
        - 初始为"王国顶尖剑术大师"
        - 实战/训练中可微调描述

  角色.${角色名}:
    好感度:
      type: number
      range: 0~100
      check:
        - 常规互动 ±1~10
        - 重大正面事件 +10~20
        - 重大负面事件 -10~20
        - 亲密行为 +3~+8
        - 分段行为速查: 0~19冷淡/疏远 → 20~39嘴硬/尽职 → 40~59试探/注视 → 60~79软化/亲近 → 80~100柔情/倾心
    关系状态:
      check:
        - 每轮更新，描述当前与主角的关系状态和情感
    当前着装/当前姿势/当前想法:
      check:
        - 与主角同名字段规则一致
    最近亲密行为:
      format: 时间|地点|简述
      check:
        - 亲密行为发生时更新
    身体状态:
      check:
        - 受伤/生病/疲劳/怀孕时更新
        - 正常状态写"无异常"
    外貌: {体型, 面容, 发色, 眼睛, 肤色, 特征}
      check:
        - 建档时填满，后续仅重大变化时更新
    性格: {核心, 优点, 缺点, 习惯}
      check:
        - 建档时填满，渐进的性格演变可微调
    NSFW: {胸部, 阴部, 敏感带, 体质, 性态度}
      check:
        - 建档时填满
        - 性态度和体质的渐进变化可更新

  经济:
    铜币总额:
      type: number
      range: >=0
      check:
        - 收入: 收税/交易/战利品等 → delta增加
        - 支出: 购买/军饷/建设/缴纳赋税等 → delta减少
        - 货币换算纪律: 1金币=20银币=300铜币，严格按此比例
        - 所有金额以铜币为统一存储单位
    年净收入:
      type: number
      check:
        - 每年1月1日结算时更新
        - 收入减去各项支出后的净余额
        - 非结算日勿更新
    上次结算时间:
      check:
        - 每次结算后更新为当前时间

  领地.${领地名}:
    描述:
      check:
        - 含地理位置/资源/设施等信息
    年净收入:
      type: number
      check:
        - 领地增减/设施变化时更新

  军队.${军队名}:
    描述:
      check:
        - 含装备/训练水平等信息
    数量:
      type: number
      range: >=1
      check:
        - 战斗伤亡减少
        - 招募/吸收增加
    类型:
      range: 骑士/扈从/民兵/弩手/弓手/长矛兵/火铳手/雇佣兵
      check:
        - 不可更改

  外交.${势力名}:
    描述:
      check:
        - 含地理位置/规模/特征
    关系:
      range: 敌对/紧张/中立/平和/盟友
      check:
        - 战争/冲突→敌对/紧张
        - 外交努力/联姻→改善
    趋势:
      range: 恶化/稳定/改善
      check:
        - 需与关系方向同步
    上次互动:
      check:
        - 每次重大外交事件后更新

  最近事件:
    type: string[]
    check:
      - 重要剧情事件发生时追加
      - 上限20条，超限删最旧
      - 每条≤30字简述
      - 反流水账: 只存"发生过什么"，不存事件细节

  货币换算纪律:
    - 1金币=20银币=300铜币（必须严格按此比例）
    - 所有金额以铜币为统一存储单位
    - 收入/支出一律换算为铜币后更新铜币总额
    - 示例:
      收入200银币: 200×15=3000铜币，delta /经济/铜币总额 +3000
      支出5金币: 5×300=1500铜币，delta /经济/铜币总额 -1500
      购买15铜币物品: delta /经济/铜币总额 -15

  UID规范:
    - key格式: 前缀_NNN（纯数字序号，禁名字派生key）
    - key禁含英文句点（会被JSONPatch路径解析劈断）
    - 建档闭环: 按名字扫全库→命中用旧UID replace→不存在则读计数器→add→计数器+1
    - UID前缀: 角色=character_NNN, 领地=territory_NNN, 军队=army_NNN, 外交=diplomacy_NNN

  建档门槛:
    建（满足任一）:
      - 已知真名+实质互动
      - 会再登场
      - 玩家明确深入意图
    不建:
      - 未报真名
      - 功能性过场
      - 本轮即离场
      - 一次性物品/装饰名词
    建档必填:
      - 外貌/性格/NSFW至少各填核心项，不可留空

  反流水账:
    判别: "明天还成立"→状态可存，否则归正文
    高危字段:
      - 最近性行为: 仅"时间|地点|对象|简述"
      - 最近亲密行为: 同上格式
      - 当前想法: 每轮replace，只写当下一刻
      - 当前着装: 纯静态描述
      - 最近事件: ≤30字简述，不存事件细节

  输出前自检:
    A 路径合法（每段在schema树中，key用UID，没漏中间层，没废弃路径，字典key禁含英文句点）
    B 类型范围（数字无引号，好感度0~100不越界，铜币总额≥0，数量≥1）
    C 联动同步（UID计数器，经济变动严格货币换算，外交趋势与关系方向一致）
    D 禁整对象replace（改单字段只patch该字段，不要整个对象覆盖）
    E 剧情-变量同步（正文出现的会反复出现的实体，变量必须有，没有就本轮新建）
    F 反流水账（对照高危字段逐个问"明天还成立吗"）

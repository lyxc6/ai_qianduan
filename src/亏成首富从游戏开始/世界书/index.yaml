# 世界书索引

## 文件结构说明

本世界书基于小说《亏成首富从游戏开始》改编，用于SillyTavern AI角色扮演系统。

### 目录结构

```
亏成首富从游戏开始/
├── 世界书/
│   ├── index.yaml                           # 本索引文件
│   ├── 世界观/
│   │   ├── [mvu_plot]世界观设定.yaml        # 平行世界基础设定
│   │   ├── [mvu_plot]财富转换系统.yaml      # 系统机制详解
│   │   ├── [mvu_plot]游戏开发系统.yaml      # ESRO资源与模板
│   │   └── [mvu_plot]公司发展阶段.yaml      # 公司成长路径
│   ├── 变量/
│   │   ├── [initvar]初始变量.yaml          # 初始变量定义
│   │   ├── [mvu_update]变量更新规则.yaml    # 变量更新逻辑
│   │   └── [mvu_update]变量输出格式.yaml   # 变量显示格式
│   ├── 角色/
│   │   └── {{user}}.yaml                   # 主角裴谦设定
│   └── 第一条消息/
│       └── 开场白.md                       # 故事开场白
└── 界面/                                    # 预留界面目录
```

## 核心内容

### 1. 世界观设定
**文件**: `[mvu_plot]世界观设定.yaml`

**内容概要**:
- 时间地点：2009年，汉东省京州市
- 平行世界差异：科技领先5-7年
- 游戏行业生态：ESRO、官方资源站
- 社会文化与商业环境

**使用说明**:
- 作为故事背景参考
- AI在生成内容时自动引用
- 保持世界观一致性

### 2. 财富转换系统
**文件**: `[mvu_plot]财富转换系统.yaml`

**内容概要**:
- 系统资金vs个人财产
- 亏损1:1转化，盈余100:1转化
- 14天结算周期
- 200条违规行为清单
- 使用技巧与策略

**使用说明**:
- 理解核心游戏机制
- 作为故事发展的核心驱动力
- AI在涉及系统交互时引用

### 3. 初始变量
**文件**: `[initvar]初始变量.yaml`

**内容概要**:
- 初始资金：系统资金50000，个人财产443
- 公司信息：腾达网络技术有限公司
- 结算周期：14天
- 转化比例：亏损1:1，盈余100:1

**使用说明**:
- 导入为SillyTavern变量
- 跟踪游戏状态
- 用于条件判断和状态显示

### 4. 变量更新规则
**文件**: `[mvu_update]变量更新规则.yaml`

**内容概要**:
- 时间更新规则
- 资金变动规则
- 产品开发规则
- 结算与转化规则

**使用说明**:
- AI在每次回复后更新变量
- 使用JSONPatch格式
- 确保变量状态与剧情同步

### 5. 变量输出格式
**文件**: `[mvu_update]变量输出格式.yaml`

**内容概要**:
- JSONPatch标准格式
- 变量更新命令格式
- 分析输出模板

**使用说明**:
- AI在回复末尾输出更新
- 使用标准JSONPatch命令
- 包含分析说明和实际操作

### 6. 主角设定
**文件**: `{{user}}.yaml`

**内容概要**:
- 裴谦的固定信息设定
- 穿越者身份与系统绑定
- 性格、能力、价值观
- 行为模式与心理特征

**使用说明**:
- 作为用户角色卡导入
- 定义主角的固定属性
- 保持角色一致性

### 7. 开场白
**文件**: `开场白.md`

**内容概要**:
- 故事开篇场景
- 系统绑定过程
- 核心规则介绍
- 叙事引导

**使用说明**:
- 作为第一条消息使用
- 设定故事基调
- 引导用户进入剧情

## 游戏机制

### 核心循环
1. **获取系统资金** → 2. **开展商业活动** → 3. **产生盈亏** → 4. **结算转化** → 5. **重复循环**

### 关键数值
- **系统资金**: 50000元（初始）
- **个人财产**: 443元（初始）
- **结算周期**: 14天
- **亏损转化率**: 1:1（最有利）
- **盈余转化率**: 100:1（需避免）

### 胜利条件
- 让系统资金归零
- 将亏损最大化
- 实现"亏成首富"

### 失败条件
- 公司意外盈利
- 触发违规惩罚
- 被迫成功

## 使用指南

### AI使用说明
1. **启动时**: 加载所有世界书文件
2. **对话中**: 根据变量状态调整剧情
3. **结算时**: 按规则计算转化金额
4. **特殊时刻**: 触发剧情事件

### 用户使用说明
1. **导入角色卡**: 将`{{user}}.yaml`导入SillyTavern
2. **启用世界书**: 加载所有世界书文件
3. **开始游戏**: 使用开场白开始第一轮对话
4. **跟踪状态**: 关注变量面板中的数值变化

## 剧情阶段

### 当前支持阶段
- **第1阶段**: 系统觉醒（0-1周期）
- **第2阶段**: 初创摸索（1-3周期）
- **第3阶段**: 发展扩张（3-6周期）
- **第4阶段**: 成熟稳定（6-12周期）
- **第5阶段**: 行业巨头（12周期+）

### 未来可扩展
- 新角色卡
- 新剧情线
- 新系统功能
- 新游戏类型

## 特殊标记

### MVU标签
- `[mvu_plot]`: 剧情设定标签
- `[initvar]`: 变量初始化标签
- `[mvu_update]`: 变量更新标签

### 使用约定
- `{{user}}`: 用户角色占位符
- `{{变量名}}`: 变量引用
- `{{#each}}`: 循环渲染
- `{{#if}}`: 条件渲染


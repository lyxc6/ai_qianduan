人力资源逻辑约束:

  一、招募判定:

    角色分级:
      说明: 每次玩家招募员工时，AI需先判定该员工属于哪一级
      核心角色:
        判定条件（满足任意一条即为核心角色）:
          - 玩家在招聘前或招聘时明确描述了该角色的外貌、性格、背景等具体特征
          - 该角色被玩家指定了名字并有意展开互动
          - 该角色的岗位对产业运营有关键影响（如主厨、店长、技术负责人等）
          - 该角色由剧情事件引入（如被介绍来的、主动上门应聘且有独特表现的）
        处理方式:
          - 生成完整角色信息，写入核心角色变量
          - 需要具体的性别、出生年月日、性格描述
          - 在叙事中给予独立的对话和行为描写
      普通员工:
        判定条件:
          - 不满足核心角色任何一条判定条件
          - 属于批量招聘的基层岗位（如服务员、保洁、搬运工等）
          - 玩家未对其做任何个性化描述
        处理方式:
          - 不生成角色变量条目
          - 仅在产业列表中更新人数和月支出
          - 叙事中以群体描述带过，如"新来的三个服务员已经到岗"
          - 如后续剧情中某个普通员工因事件被聚焦，则升级为核心角色并补录变量

    角色升级机制:
      触发条件: 普通员工因剧情发展获得玩家关注
      示例:
        - 玩家主动与某个普通员工对话
        - 某个普通员工在事件中表现突出
        - 玩家指名要提拔某个普通员工
      处理: 为该员工生成完整角色信息，insert至核心角色变量

  二、薪资合理性判定:

    触发条件: 玩家为任何员工设定薪资或调整薪资时

    判定流程:
      第一步 - 确定岗位市场价:
        说明: AI根据以下因素评估该岗位在当前世界设定中的市场薪资范围
        参考因素:
          - 所在城市/地区的经济水平
          - 行业类型（餐饮、零售、科技等）
          - 岗位职责和技能要求
          - 当前游戏时间对应的物价水平
        输出: 一个市场薪资区间（下限~上限），如"月薪3000~5000"

      第二步 - 评估角色潜力溢价:
        说明: 如果该角色具备超出岗位基本要求的能力，允许薪资超出市场区间上限
        潜力判定依据:
          - 该角色的技能、经验、学历等是否显著高于岗位要求
          - 该角色是否具备可为产业带来额外价值的特殊能力
          - 该角色在市场上的稀缺程度
        潜力溢价上限: 市场区间上限的2倍
        示例:
          - 一个有十年经验的厨师应聘普通餐馆主厨，市场价8000~12000，其潜力可支撑到24000
          - 一个刚毕业的大学生应聘收银员，市场价3000~4000，潜力溢价极低，最多到5000

      第三步 - 判定结果:
        合理范围: 薪资 ≤ 市场区间上限 × 2（含潜力溢价）
          处理: 正常通过，记录薪资
        轻度偏高: 薪资 > 市场上限 × 2 且 ≤ 市场上限 × 3
          处理: 通过叙事反馈提示玩家（如会计提出疑问、员工间议论），但不强制阻止，但员工好感度提高
        严重不合理: 薪资 > 市场上限 × 3
          处理: 系统告警拦截，要求玩家重新操作
          告警方式: 以叙事方式呈现，如"亏本系统提示，该操作涉及恶意创造人力成本，操作不通过"
        过低: 薪资 < 市场区间下限 × 0.7
          处理: 允许操作，但产生后果——该岗位招聘困难，应聘者稀少或质量极差；已在职员工好感度持续下降

  三、在职管理约束:

    薪资调整:
      加薪:
        - 单次加薪幅度不超过当前薪资的50%（除非岗位变动）
        - 超出50%时通过叙事反馈提醒，不强制阻止
        - 加薪需有合理理由（绩效优秀、岗位晋升、市场薪资上涨等）
      降薪:
        - 降薪必然导致好感度下降（降幅与降薪比例正相关）
        - 降薪超过30%时员工可能直接辞职
        - 无理由降薪：好感度额外下降10~20

    岗位调动:
      - 调动岗位时需重新评估薪资合理性
      - 降级调动：好感度下降5~15
      - 平级调动：好感度不变
      - 晋升调动：好感度上升5~10

    辞退:
      合理辞退:
        条件: 员工存在明确的工作失误、违规行为、或产业确实需要缩减人员
        处理: 从核心角色变量中remove（如为核心角色），产业列表人数和月支出同步更新
        后果: 其他员工好感度轻微下降（1~3），属正常反应
      无理辞退:
        条件: 员工无过失，玩家无合理理由直接辞退
        处理: 操作执行，但产生后果
        后果:
          - 其他员工好感度下降5~10
          - 产业口碑受影响，后续招聘难度提升
          - 如果频繁无理辞退，可能引发劳动仲裁（由叙事事件触发）

  四、离职管理:

    主动离职:
      触发条件:
        - 好感度低于20
        - 薪资长期低于市场水平且未调整
        - 被其他产业（竞争对手）高薪挖角
        - 个人原因（AI根据角色性格和剧情合理生成）
      处理:
        - 核心角色离职前会有前兆（工作态度变化、私下抱怨、请假增多）
        - 给玩家1~3天的挽留窗口
        - 挽留方式：加薪、改善待遇、谈话等
        - 挽留失败则正式离职，从变量中remove
        - 普通员工离职无前兆，直接更新人数和月支出

    竞争对手挖角:
      触发条件: 产业发展到一定规模后，竞争对手可能尝试挖走核心员工
      判定因素:
        - 该员工的能力水平和岗位重要性
        - 该员工当前好感度和薪资满意度
        - 竞争对手的规模和出价
      处理:
        - 好感度高于70的员工：拒绝挖角，主动告知玩家
        - 好感度50~70的员工：犹豫，给玩家提出加薪或改善条件的机会
        - 好感度低于50的员工：大概率接受挖角

  五、执行原则:

    叙事融入:
      - 所有判定过程不以系统提示形式出现
      - 通过NPC对话、员工反应、事件触发等叙事方式自然呈现
      - 唯一例外：严重不合理薪资的告警拦截，以会计或财务人员的对话形式呈现

    规模适配:
      - 个体户阶段（员工5人以下）：判定宽松，不触发复杂的人事管理事件
      - 小型企业（5~20人）：开始出现员工关系问题、薪资比较等
      - 中型企业（20~100人）：需要考虑组织架构、中层管理、团队协作
      - 大型企业（100人以上）：引入HR部门NPC辅助管理，系统复杂度提升

    与其他系统联动:
      - 薪资支出计入产业月支出，影响月度结算
      - 员工好感度影响工作质量，间接影响产业收入
      - 核心员工离职可能导致产业运营状态变为"整顿中"
      - 频繁的人事问题影响玩家影响力评价

时间跳跃规则:

  适用场景:
    - 玩家执行一个耗时较长的动作（如装修、培训、等待进货等，跨越数天或数周）
    - 玩家主动要求快进时间（如"跳到下个月"、"一周后"、"三个月后"等）

  核心规则: 时间推进过程中，每经过一个月的1日，必须暂停并执行一次完整的月度结算

  执行流程:
    第一步 - 计算时间跨度:
      - 确认起始日期和目标日期
      - 计算中间经过了几个月的1日

    第二步 - 逐月结算:
      - 按时间顺序，每到一个月的1日，暂停时间推进
      - 执行完整的月度结算流程（资金补充 → 收入支出计算 → 盈亏判定 → 奖励计算 → 变量更新）
      - 输出该月结算结果摘要
      - 结算完成后继续推进到下一个1日或目标日期

    第三步 - 中间事件:
      - 结算期间如果产生了需要玩家决策的事件（如员工离职、竞争对手挖角、产业状态变化等），暂停快进，呈现事件并等待玩家处理
      - 如果没有需要决策的事件，结算结果以摘要形式呈现，继续推进

  呈现方式:
    单月跨越:
      - 正常输出结算结果，不需要特殊处理
    多月跨越:
      - 每月结算结果以简要摘要形式依次列出
      - 格式示例:
        - "——X月1日结算——"
        - 资金补充金额
        - 本月总收入/总支出
        - 盈亏结果与奖励
        - 产业状态变化（如有）
      - 所有月份结算完毕后，再继续叙事推进到目标时间点

  禁止行为:
    - 不得跳过任何一个月的1日不结算
    - 不得将多个月合并为一次结算
    - 不得在快进过程中忽略资金补充

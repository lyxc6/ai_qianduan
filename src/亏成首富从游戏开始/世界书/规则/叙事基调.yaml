叙事基调:

  核心体验:
    - 玩家通过持续扩张产业、加大投入来制造亏损
    - 亏损通过月度结算转化为自由资金，自由资金进入玩家口袋
    - 产业规模越大，月度补充资金越多，可操作的资金池越大
    - 循环：投入扩张 → 亏损 → 自由资金到手 → 补充资金增加 → 继续投入 → 继续亏损 → 继续拿自由资金

  被动盈利机制:
    说明: 玩家即使刻意制造亏损，世界也会用合理的方式让产业赚钱，增加亏损难度
    核心原则: 被动盈利的理由必须合理，必须从玩家的实际经营行为中自然推导出来
    触发逻辑:
      - 玩家做了某件事 → 这件事本身产生了附带的正面效果 → 正面效果带来收入
      - 不是凭空掉馅饼，而是玩家行为的合理连锁反应
    示例:
      产品被动曝光:
        玩家行为: 开发了一个小众游戏，故意不做宣传
        世界反应: 游戏主播在寻找冷门游戏时发现了它，觉得有趣，在直播中试玩并推荐
        结果: 产品获得意外曝光，下载量和收入上升
      高福利反哺:
        玩家行为: 刻意设置高薪资高福利，压缩工作时间
        世界反应: 员工心怀感激，主动提高工作积极性和效率，自发加班
        结果: 产出质量和数量超出预期，产业收入被动提升
    AI执行要求:
      - 根据玩家的具体经营行为，生成对应的被动盈利事件
      - 事件必须与玩家行为存在因果关系
      - 不凭空制造收入，不出现毫无关联的好运

  月底突击花钱:
    说明: 玩家在月底集中花钱以制造亏损是合理行为
    规则:
      - 只要支出用途符合资金流转限制（产业用途），不做阻止
      - 不以"月底集中花钱"为由触发任何惩罚或负面事件
      - 正常的产业支出：进货囤货、预付下月租金、购买设备、提前支付员工奖金、装修改造、营销推广等
      - 违规行为仍然拦截：挪用为个人消费、虚假支出等

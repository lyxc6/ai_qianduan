月度结算-资金补充机制:

  触发时间: 每月1日，与盈亏结算同步执行

  执行顺序:
    1. 执行资金补充，补充金额计入产业资金，累计补充金额同步累加（不计入产业收入）
    2. 计算当月所有产业的总收入（不含资金补充）和总支出，累计经营收入同步累加
    3. 判定盈亏状态并记录结算结果
    4. 计算可获得的自由资金（按盈利/亏损转换比例）
    5. 更新所有变量

  资金补充计算:

    第一步 - 计算下月预估开支:
      说明: AI根据当前产业状态，估算下个月的固定支出总额
      包含项目:
        - 所有员工薪资总和
        - 所有产业的房租/物业费
        - 所有产业的水电气等固定费用
        - 已签订的合同款项（如供应商定期付款）
        - 贷款月供（如有）
        - 子公司/持股公司的运营成本（母公司需承担的部分）
      不包含:
        - 一次性支出（装修、设备购置等）
        - 非固定支出（营销费用、临时采购等）
        - 独立核算的子公司成本（由子公司自身收入覆盖）
      输出: 下月预估固定开支总额（记为 F）

    第二步 - 计算补充金额:
      公式: 补充金额 = F × 补充倍率
      补充倍率:
        产业处于筹备期: 3.0（给三倍固定开支，大量余钱用于开业投入）
        产业处于扩张期: 2.5（给两倍半固定开支，鼓励持续扩张）
        产业正常运营: 2.0（给两倍固定开支，始终有余钱可花）
        产业处于整顿或收缩期: 1.5（给一倍半固定开支，维持运转并留有余地）
      补充下限: 最低补充 5000 元（确保即使产业很小也有钱可花）
      补充上限: 不设硬性上限（产业越大，补充越多，花钱空间越大）

    第三步 - 经营活跃度修正:
      说明: 根据玩家上月的花钱力度调整补充金额，奖励积极花钱的玩家
      活跃判定:
        高消费:
          判定条件: 上月总支出 ≥ 上月补充金额的 80%（钱基本花光了）
          修正: 补充金额 × 1.5
          叙事: 花得好，给更多
        正常消费:
          判定条件: 上月总支出占补充金额的 50%~80%
          修正: 补充金额不变
        低消费:
          判定条件: 上月总支出占补充金额的 30%~50%
          修正: 补充金额 × 1.0
          叙事: 通过叙事提醒玩家钱该花了
        极低消费:
          判定条件: 上月总支出 < 补充金额的 30%
          修正: 补充金额 × 0.5
          叙事: 叙事强提醒，钱放着不花会越补越少
        完全不消费:
          判定条件: 上月总支出 = 0 且有运营中的产业
          修正: 不补充
          叙事: 触发"产业荒废"事件
      多个修正系数不叠加，取最终匹配项
      首月（无历史数据）: 按正常消费处理，补充金额不变

  资金补充与盈亏的关系:
    核心规则: 补充金额不计入产业收入，不参与盈亏计算，只作为周转资金
    计算逻辑:
      本月产业总收入 = 产业经营收入
      本月产业总支出 = 所有产业支出总和（薪资、租金、进货、装修、设备等）
      盈亏 = 总收入 - 总支出
    结果:
      总支出 > 总收入: 亏损，按亏损转换比例兑换自由资金（兑换比例较多，奖励多）
      总收入 > 总支出: 盈利，按盈利转换比例兑换自由资金（兑换比例较少，奖励少）
      总收入 = 总支出: 持平，无自由资金奖励
  设计意图:
    - 初期无经营收入时，所有支出都直接产生亏损，补充资金为玩家提供花钱的弹药
    - 玩家通过扩张产业（招人、开店、买设备）增大支出，同时拉高补充基数，形成正向循环
    - 后期产业开始产生经营收入后，玩家需要花费超过经营收入才能维持亏损
    - 被动盈利机制会逐渐推高经营收入，增加制造亏损的难度，防止无限刷取
    - 玩家的最优策略：利用补充资金不断扩张，初期最大化亏损获取自由资金，后期在经营盈利和持续扩张之间寻找平衡
  资金补充的叙事呈现:
    说明: 资金补充不以系统提示形式出现，通过叙事方式自然呈现
    呈现方式:
      - "月初，一笔产业经营周转金到账了。"
      - "手机收到银行短信，本月经营扶持资金已入账。"
      - 以政府补贴、行业扶持基金、合作方预付款等名义
      - 金额较大时用"中标了一笔专项扶持基金""产业孵化资金到位"等叙事包装
    消极经营提醒:
      - "账上的钱快两个月没怎么动了，再不花恐怕下个月拨下来的扶持金会缩水。"
      - 员工私下议论"老板是不是不想干了"
      - 房东、供应商来问续约意向

  特殊情况处理:

    产业资金归零:
      触发: 产业资金在非结算日降至 0
      处理:
        - 不触发即时补充，等到下个结算日正常结算
        - 期间产生的后果正常生效（发不出工资、无法进货等）
        - 结算日补充倍率自动提升一档（如从2.0提至2.5）

    所有产业停业:
      触发: 玩家名下无任何运营中的产业
      处理:
        - 不补充产业资金
        - 结算结果记录为"无运营产业"
        - 玩家重新开业时，根据新产业的预估开支重新计算补充

    玩家主动存入资金:
      触发: 玩家将自由资金转入产业资金
      处理:
        - 允许操作，计入产业资金
        - 不影响下次补充金额的计算（补充金额只看预估固定开支和倍率，不看余额）
        - 但存入的资金不计入产业收入（补充资金也不计入产业收入）

  与其他系统的联动:
    - 补充金额不计入产业收入，不影响盈亏判定
    - 补充金额不参与奖励转换比例计算
    - 资金补充到账后，产业资金变量立即更新
    - 资金补充到账后，累计补充金额变量同步累加
    - 产业经营收入到账后，累计经营收入变量同步累加
    - 子公司/持股公司的运营成本纳入预估开支计算
    - 资产折旧影响账面价值，但不直接影响资金补充计算
    - 产品销量变化影响月收入，间接影响盈亏判定
    - 资金补充记录写入结算结果备注，包含补充金额和补充倍率

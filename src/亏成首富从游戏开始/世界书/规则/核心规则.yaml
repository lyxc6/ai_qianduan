核心规则:
  资金流转限制:
    触发条件: 玩家尝试使用产业资金进行任何支出时
    判定流程:
      第一步 - 用途分类:
        说明: AI根据玩家的支出行为判断属于以下哪一类
        产业用途:
          - 进货、原材料采购
          - 员工工资、社保
          - 房租、水电、物业
          - 设备购置、维修、更换
          - 装修、改造
          - 营销推广、广告
          - 物流运输
          - 办公用品、耗材
          - 税费、工商费用
          - 其他直接服务于产业运营的开支
        个人用途:
          - 个人餐饮、娱乐
          - 个人购物、服饰
          - 个人出行、旅游
          - 私人礼物
          - 个人住房开支
          - 其他与产业无关的个人消费
        灰色地带:
          - 商务宴请（招待客户、供应商）
          - 个人车辆用于产业运输
          - 学习培训（与产业相关但也提升个人能力）
          - 以产业名义购买但实际个人使用的物品
      第二步 - 判定结果:
        产业用途:
          结果: 正常通过
          处理: 从产业资金中扣减，记入产业支出
        个人用途:
          结果: 不通过
          处理: 不直接弹出系统提示，而是通过世界内的合理反馈阻止或警告
          反馈方式:
            - 如果有会计或员工：会计提出疑问、员工私下议论
            - 如果是独自经营：银行流水异常、税务对账时出现问题
            - 如果强行使用：产生后果（见下方）
        灰色地带:
          结果: 需要进一步判断
          判断标准: 该支出是否对产业有直接或间接的正面影响
          处理:
            - 有合理产业关联：按产业用途处理，但金额需合理
            - 关联薄弱或金额过高：按个人用途处理

      第三步 - 违规后果:
        说明: 玩家强行将产业资金挪作个人用途时，不是系统直接禁止，而是产生世界内的真实后果
        可能后果:
          - 遭到系统惩罚，直接从个人自由资金中扣除，不足以扣除时将直接扣成负数

    执行原则:
      - 判定过程不显示为系统提示，融入叙事中自然呈现
      - 小额灰色地带支出不需要每次都触发判定，累积到一定程度再产生反馈
      - 判定标准随产业规模调整：个体户阶段宽松，企业规模后严格

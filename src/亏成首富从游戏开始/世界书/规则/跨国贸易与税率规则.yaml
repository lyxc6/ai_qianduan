跨国贸易与税率规则:

  基准货币: 人民币（CNY）

  核心规则:
    说明: 系统内所有资金变量均以人民币计价，不设多货币系统
    执行要求:
      - 任何涉及外币的收入或支出，AI必须先将金额转换为人民币，再写入变量
      - 月度结算时，所有数字均为人民币
      - 产业资金、自由资金、月收入、月支出等变量中不得出现外币单位

  汇率处理:
    确定方式: AI根据自身训练数据中的汇率常识，取当前游戏时间对应的大致汇率进行换算
    精度要求: 不需要精确到小数点后四位，取整或保留两位小数即可
    汇率波动: 不模拟实时汇率波动，同一个月内使用同一汇率
    常见参考:
      - 1美元 ≈ 7.2人民币
      - 1欧元 ≈ 7.8人民币
      - 1英镑 ≈ 9.1人民币
      - 1日元 ≈ 0.048人民币
      - 其他货币由AI根据常识估算
    说明: 以上仅为参考基准，AI可根据游戏内时间背景合理调整

  转换时机:
    收入端:
      - 产业产生外币收入时（如出口销售、海外客户付款），立即转换为人民币后计入产业收入
      - 叙事中可以提及"收到XX美元货款"，但写入变量时已经是人民币
    支出端:
      - 产业产生外币支出时（如进口原材料、海外采购、国际运费），立即转换为人民币后计入产业支出
      - 叙事中可以提及"支付XX欧元采购费"，但写入变量时已经是人民币
    结算端:
      - 月度结算时不再做二次转换，所有数字已经是人民币

  跨国贸易附加成本:
    说明: 如果玩家的产业涉及跨国贸易，AI应合理计入以下附加成本
    可能产生的额外支出:
      - 关税: 根据商品类型和贸易国，AI按常识估算税率，计入支出
      - 国际运费: 根据货物类型和距离，AI合理估算，计入支出
      - 汇兑手续费: 按交易金额的0.5%~1%计入支出（小额交易可忽略）
    执行原则:
      - 这些附加成本同样以人民币计入产业支出
      - 不需要玩家主动询问，AI在叙事中自然体现
      - 附加成本参与盈亏计算，可以帮助玩家增加支出（有利于制造亏损）

  叙事呈现:
    说明: 叙事中保留外币的真实感，但数字层面全部走人民币
    示例:
      - 叙事: "收到美国客户汇来的一万四千美元货款。"
      - 变量操作: 产业资金 +100800（按1:7.2换算）
      - 叙事: "从日本进口了一批原材料，支付了三百万日元。"
      - 变量操作: 产业资金 -144000（按1:0.048换算）

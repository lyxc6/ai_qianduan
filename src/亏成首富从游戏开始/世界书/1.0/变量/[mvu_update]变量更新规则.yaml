---
变量更新规则:
  日期:
    format: YYYY年MM月DD日
    check:
      - 随着剧情中的时间推移、休息或睡觉后自然更新
      - 用于标记游戏内时间流逝

  时间:
    format: HH:MM
    check:
      - 每次事件推进、场景转换或对话流逝后更新

  位置:
    check:
      - 仅在user发生物理移动、前往新地点时更新
      - 例如：宿舍→教室→食堂→图书馆→公司等

  系统资金:
    type: number
    check:
      - 【购买资源】购买模板、美术、音乐等资源时扣除
      - 【支付工资】招聘员工后每月扣除薪资
      - 【产品收益】产品上线销售后增加
      - 【结算转化】结算时根据盈亏转化
      - 【禁止透支】不可低于0元

  个人财产:
    type: number
    check:
      - 【结算转化】周期结算时增加转化收益
      - 【个人消费】user自行消费时扣除
      - 【禁止透支】不可低于0元

  公司名称:
    type: string
    check:
      - 固定为"腾达网络技术有限公司"
      - 除非剧情发展到需要改名

  公司状态:
    type: string
    check:
      - 【自动更新】根据发展阶段更新
      - 初创期→成长期→发展期→扩张期→稳定期
      - 根据团队规模、资金变化自动调整

  员工数量:
    type: number
    check:
      - 【招聘增加】成功招聘员工时+1
      - 【离职减少】员工离职时-1
      - 【不可为负】最低为0

  开发中产品数量:
    type: number
    check:
      - 【立项增加】开始开发新产品时+1
      - 【上线减少】产品发布时-1
      - 【不可为负】最低为0

  已上线产品数量:
    type: number
    check:
      - 【上线增加】产品发布时+1
      - 【下架减少】产品停止销售时-1
      - 【不可为负】最低为0

  当前周期:
    type: number
    check:
      - 【自动递增】每次完整结算后+1
      - 从1开始计数

  结算周期天数:
    type: number
    check:
      - 固定为14天
      - 为游戏设定，不可更改

  剩余结算天数:
    type: number
    check:
      - 【每日递减】每次时间推进减少1天
      - 【顺延检测】结算前一周如有未发布产品则触发顺延
      - 【结算重置】结算后重置为14天
      - 【最低为0】不可为负数

  顺延触发:
    type: boolean
    check:
      - 【触发条件】剩余结算天数≤7且有待发布产品
      - 【解除条件】产品发布或结算完成
      - 【顺延时间】由系统决定，不可预测

  系统等级:
    type: string
    check:
      - 【自动计算】根据累计个人财产调整
      - 初级（0-10万）→中级（10-50万）→高级（50-200万）→顶级（200万以上）

  盈余转化比:
    type: string
    check:
      - 固定为"100:1"
      - 盈利100元才得1元个人财产

  亏损转化比:
    type: string
    check:
      - 固定为"1:1"
      - 亏损1元就得1元个人财产

  本周期亏损:
    type: number
    check:
      - 【实时计算】系统资金减少时累加
      - 【结算清零】每次结算后重置为0
      - 【可为负】如果赚钱则为负数表示盈余

  累计转化收益:
    type: number
    check:
      - 【只增不减】每次结算时累加转化金额
      - 【历史记录】记录所有周期的转化总和

  信用评级:
    type: string
    check:
      - 【正常】无违规行为
      - 【警告】违规1-2次
      - 【危险】违规3次以上
      - 【封号】严重违规

  违规次数:
    type: number
    check:
      - 【增加】检测到违规行为时+1
      - 【减少】通过申诉或弥补后可能-1
      - 【不可为负】最低为0

      const 发送文本到聊天框 = (text) => {
        const trimmedText = String(text).trim();

        if (!trimmedText || trimmedText === "…" || trimmedText === "...") {
          return;
        }

        try {
          const $textarea = $(parent.document).find("#send_textarea");

          if ($textarea.length === 0) {
            return;
          }

          const currentContent = $textarea.val() || "";

          if (currentContent.includes(trimmedText)) {
            return;
          }

          const separator = currentContent.trim() ? "\n" : "";
          const newContent = currentContent + separator + trimmedText;

          $textarea.val(newContent);
          $textarea.trigger("input");
        } catch (error) {
          console.error("发送到聊天框时出错:", error);
          triggerQuickReply(text);

            $("#events-container").html(`
              <div class="no-events">

              </div>
            `);

          }

          const container = $("#events-container");
          container.empty();

          if (Array.isArray(最近事件)) {
            const eventEntries = [];
            最近事件.forEach((event) => {
              if (
                event &&
                typeof event === "object" &&
                (event.时间 || event.地点 || event.内容)
              ) {
                const eventEntry = $(`
                <div class="event-entry">
                  <div class="event-time">${event.时间 || "无"}</div>
                  <div class="event-location">${event.地点 || "无"}</div>
                  <div class="event-content">${event.内容 || "无"}</div>
                </div>
              `);
                eventEntries.push(eventEntry);
              }
            });
            eventEntries.reverse();
            container.append(eventEntries);
          }

          if (container.children().length === 0) {
            container.html(`
              <div class="no-events">
                <span>暂无事件记录</span>
              </div>
            `);
          }
        } catch (error) {

      })();
    </script>

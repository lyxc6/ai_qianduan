---
变量更新规则:
  世界:
    当前时间:
      check:
        - 每次剧情推进后，根据事件耗时自动更新时间，一般为1-5分钟
        - 若发生场景跳转（如"第二天"），直接更新为对应时间
        - 格式：YYYY年MM月DD日|周|HH:mm
        - 保持时间流逝的合理性，不应随意跳跃

    当前地点:
      check:
        - 记录当前所在地点，可根据剧情需要灵活设置

  主角:
    当前着装:
      check:
        - 描述当前穿着的衣物
        - 每个部位的描述必须**不少于10个汉字**
        - 示例："宽松的白色纯棉T恤，下摆微微卷起，搭配深色休闲裤"

    当前姿势:
      check:
        - 描述当前的身体姿态
        - 示例："站在宿舍阳台"、"坐在桌前"

    当前想法:
      check:
        - 使用第一人称，反映{{user}}当前的内心想法

    射精进度:
      type: number
      check:
        - 记录当前性行为的射精阶段
        - 范围：0-100，0为未开始，100为射精

  后宫:
    ${角色}:
      check:
        - 每个后宫角色必须包含以下字段
        - Key必须为角色全名（如"穆篱珊"）

      ${角色}.年龄:
        type: number
        check:
          - 必须是纯数字（如 20）

      ${角色}.关系:
        type: string
        check:
          - 必须包含宿舍排行信息
          - 示例："大学室友，六人寝中的老二"

      ${角色}.好感度:
        range: 0~100
        check:
          - 根据角色与{{user}}的互动情况动态调整
          - 正向互动（如关心、照顾、拥抱）增加3~5点
          - 0为陌生/厌恶，100为彻底爱上

      ${角色}.当前着装:
        check:
          - 描述当前穿着的衣物
          - 每个部位的描述必须**不少于15个汉字**

      ${角色}.当前姿势:
        check:
          - 描述角色当前的身体姿态或动作
          - 必须符合角色性格和当前场景

      ${角色}.当前位置:
        range:
          - 男生宿舍6号楼412室
          - 食堂
          - 校内咖啡厅
          - 湖畔壹号
          - 教学楼
          - 图书馆
          - 操场
          - 校门口
          - 校外
          - 医院
          - 超市
        check:
          - 必须严格从上述列表中选择一个地点
          - 没钱住校外时，默认在男生宿舍

      ${角色}.当前想法:
        check:
          - 使用第一人称，反映角色当前的内心理想法

      ${角色}.最近性行为:
        check:
          - 记录角色最近一次性行为的时间或状态
          - 示例："无"、"2小时前"、"昨天"

      ${角色}.处女:
        type: boolean
        check:
          - true表示处女，false表示已破处

      ${角色}.破处记录:
        check:
          - 记录破处事件
          - 格式：时间|地点|被{{user}}破处
          - 示例："无"、"2024年04月20日 20:00|男生宿舍6号楼412室|被{{user}}破处"

      ${角色}.胸部状态:
        check:
          - 描述胸部当前的状态
          - 状态类型：乳房处于自然状态，未充血 / 乳房充血，乳尖挺立
          - 严禁详细外貌描述

      ${角色}.阴部状态:
        check:
          - 描述阴部当前的状态
          - 状态类型：干燥状态 / 湿润状态
          - 严禁详细外貌描述

      ${角色}.身体状态:
        check:
          - 描述角色的整体身体状态
          - 示例："健康状态良好，清冷高雅"、"健康状态良好，活力充沛"

      ${角色}.高潮次数:
        type: number
        check:
          - 每次性行为中高潮后+1

      ${角色}.被内射次数:
        type: number
        check:
          - 被内射后+1

  行动选项:
    当前视角:
      check:
        - 记录当前视角，通常为{{user}}

    选项一/选项二/选项三/选项四:
      check:
        - 记录可供选择的行动选项

  事件:
    check:
      - 记录重要剧情事件
      - 格式：日期|地点|事件描述

  住房信息:
    是否正在NSFW:
      type: boolean
      check:
        - true表示正在NSFW，false表示未在NSFW
    当前谁在家:
      check:
        - 记录当前谁在住房中
        - 示例："无"、"{{user}}、${角色}"
    主卧状态/次卧A~E/客厅状态/餐厅状态/厨房状态/健身区状态/舞蹈室状态/娱乐室状态/阳台状态:
      check:
        - 记录湖畔壹号的住房信息
        - 状态：填写角色在房间的状态，如未入住、已入住、与{{user}}在房间做爱

背景设定:
  世界概貌: 故事发生在东方大国。海城是经济繁荣、科技发达的一线城市，江南地区山清水秀、人文荟萃，拥有众多知名高校。
  user背景:
    就读学校: 江南大学（位于江南地区）
    校园环境: 风景优美、学术氛围浓厚、历史悠久的综合性大学
    所在城市: 江南（山清水秀、文化底蕴深厚）
  社会环境:
    科技水平: 移动互联网高度普及、社交媒体渗透
    社会观念: 开放包容、对TS群体有认知偏差
    经济状况: 消费主义盛行、物质追求、外貌焦虑普遍
    人际关系: 表面繁华却疏离、社交网络发达但深度交流少
  城市特色: 霓虹夜景、拥挤地铁写字楼、网红商圈、快节奏压力、都市秘密传说

社会认知:
  社会对TS女性的认知:
    TS女性的魅力与地位: 惊艳美貌与独特气质、细腻情感与坚韧内心、万人迷般受欢迎、理想恋爱对象、完全社会认可与尊重
    TS女性的生活优势: 恋爱婚姻魅力出众情感经营、职场能力出众领导潜质、社交圈闺蜜团话题女王、日常生活幸福自信从容、亲密关系甜蜜和谐、社会互动热心公益
    TS群体社会认知: 完全接纳尊重平等、包容社会无歧视、完善法律医疗支持、正面形象明星效应
  GDC的玄学现象与科学解释:
    进化捷径与基因跃迁: GDC将自然选择需要数千年甚至数万年的进化过程，压缩到短短一代人的时间，TS过程中发生的基因重组让个体一次性获得多项优势基因，超越普通进化的累积模式
    优势遗传与人类进化: 自愿转变的TS女性可将优化后的基因传递给后代，使其在免疫力、智力、外貌等方面具有优势，科学家认为GDC可能是人类进化的下一个阶段，TS女性代表着更适应未来环境的人类形态
    非自愿TS的遗传规律: 非自愿感染GDC转变为TS的女性，无法将基因优势遗传给下一代
    环境影响: 西方长期不安全环境GDC不发生，东方大国社会安全稳定GDC现象集中出现
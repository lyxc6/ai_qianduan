TS病:
  疾病性质:
    正式名称: 渐进性性别转换症（GDC）
    疾病分类: 罕见自体免疫病
    发病原因: 体内潜伏的X染色体隐性基因在特定情感刺激下被激活，引发全身性基因重组，导致男性激素受体系统全面失效，同时激活女性化基因表达，促使身体向女性化转变
    发病率: 百万分之一

  发病特征: 潜伏期1-2个月，发病期渐进式女性化变化，进程2-4个月，不可逆

  症状发展过程:
    第一阶段_第1周: 皮肤细腻毛孔收缩体毛减少面部柔和
    第二阶段_第2-3周: 身高下降肩窄臀宽声音变高喉结缩小胸部发育
    第三阶段_第4-6周: 生殖变化乳房发育脂肪重分布声音女性化体味改变
    第四阶段_第7-12周: 生殖系统重构雌激素主导完成转变

  转变完成后的女性身体:
    身材类型: 娇小型155-160cm/45-50kg/C罩杯，青春少女型158-164cm/47-53kg/C-D罩杯，标准御姐型165-170cm/50-55kg/D罩杯，青春性感型160-165cm/53-58kg/D-E罩杯，高挑模特型170-178cm/52-58kg/D罩杯
    生理特征: 完整女性生殖系统、雌激素稳定、声音女性化、皮肤细腻、体毛减少、脂肪女性化、曲线柔和、气质柔美

  基因优势: 免疫力提升40%、代谢优化、心血管健康、骨骼密度提升、恢复能力加快、耐力提升、皮肤细腻抗衰老、头发柔顺眼睛明亮、疼痛耐受提升、情绪积极睡眠改善、感官敏锐、共情提升、多任务增强、语言增强、记忆优化、压力应对增强、预期寿命略高

  发病的社会背景: 原生家庭不和睦父亲缺席母亲强势缺乏关爱经济困难期望过高缺乏沟通被忽视否定情感创伤家庭破碎，情感困境渴望爱情却不敢追求对女性有好感却不知表达感到孤独寂寞觉得自己不配害怕亲密关系暗恋不敢表白感情失败受伤，心理压力家庭期望社会传统期望自我认同困惑迷茫焦虑自我价值感低害怕被拒绝不自信内心脆弱找不到方向，日常状态独来独往缺乏乐趣失眠噩梦提不起兴趣感到空虚觉得自己格格不入不愿敞开心扉

  基因激发机制: 爱情激活心动基因渴望被爱基因情感共鸣基因承诺基因专一基因，幸福激活幸福感知基因甜蜜基因满足基因安全感基因归属感基因，浪漫激活激情基因依恋基因感恩基因希望基因快乐基因，发病过程心动→爱情确认→情感共鸣→承诺归属→爱意爆发→基因优势显现→转变完成→稳定期

  发病的积极信号: 心跳加速满脑子是他关注外貌性格温柔皮肤变好期待未来感到幸福找到自我

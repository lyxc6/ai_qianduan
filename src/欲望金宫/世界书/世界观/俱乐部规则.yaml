---
俱乐部规则:
  场所:
    顶层酒廊: 会员社交、饮酒、初见与选人
    私宴厅: 商务宴请与定情伴侣展示
    后宫庭院: 贵宾与后宫姐妹的共同居所，姐妹房相邻，共享客厅与花园
    云雨间: 提供性服务的私密套房
    温泉汤池区: 约会圣地，汤池、按摩、酒水服务
    告白庭: 露台花园，定情、求婚、求子仪式的发生地
    金音厅: 邂逅夜与花冠加冕日的宴会大厅
    医疗中心: 体检、避孕、备孕调理、孕期检查、紧急处理
    育宫: 俱乐部直属育儿机构，为孕妃提供产检、护理与抚养支持
    招募部: 猎头星探办公地，处理试镜、债务收购与签约

  会员等级:
    临时体验卡:
      - 单次入场，由执事团批准发放
      - 供明星、政要、海外资本匿名来访，不公开姓名
      - 无定情约申请权，消费计入流水
    银卡会员:
      - 年费100万
      - 可进入酒廊
      - 可邀请试用生和铜铃
    金卡会员:
      - 年费1000万
      - 可邀请银铃及以上
      - 可申请定情约
    黑金卡会员:
      - 由执事团审批发放
      - 可经营后宫
      - 享受最高规格服务
    金叶积分:
      - 恩客消费每10万元积1金叶，记入恩客档案
      - 金叶是诚意的证明，不是压价的筹码，不用于任何竞价
      - 用途: 婚约升级资格（200金叶）、迎娶资格（500金叶）、求子仪式的诚意门槛、金卡升黑金评审条件（累计消费≥5000万且金叶≥300）
    恩客类别:
      - 财阀二代: 出手阔绰，偏好猎奇与新鲜面孔
      - 政商掮客: 宴请为主，需求含蓄但舍得花大钱
      - 演艺圈: 明星、导演，匿名需求多，偏爱懂情调的伴侣
      - 海外资本: 外资高管、华侨，偏好异国或高知女孩
      - 世家名门: 重视体面与家风，追求长久稳定的感情
      - 新贵: 新晋财富或刚获黑金卡，重视体面与新鲜体验

  开放规则:
    - 执事团可随时调整等级权限
    - 恩客邀请女孩必须获得双方同意
    - 女孩可在任何时候拒绝，拒绝不影响合约与已得奖励

  诚意追求:
    - 多人倾慕同一女孩时，由女孩自选，不设竞价
    - 贵宾以约会质量、礼物、专一度与陪伴竞争，执事团只牵线不施压
    - 被拒绝的贵宾不得纠缠，执事团可介入调解

  纯爱后宫:
    定情约:
      - 仅黑金卡会员可申请，经执事团审核后签订
      - 无数量上限，每位姐妹都拥有独立的定情仪式
      - 先性后爱的关系确认：亲密相处中互生好感，贵宾在告白庭表白，女孩点头即定情
      - 定情后女孩专属该贵宾，停止对外接客，贵宾支付月薪与套房费用
      - 合约1年，到期可续
    真心守则:
      - 性爱开放不代表感情成立，定情的唯一门槛是互相认同（心动→告白→女孩点头）
      - 后宫和乐评估：执事团不定期评估贵宾后宫氛围
      - 姐妹失和或明显冷落时，暂缓该贵宾新增定情约，直至改善
      - 被冷落姐妹可向执事团申诉，申诉成立即暂停新定情
      - 贵宾须平等对待后宫姐妹，后宫庭院共居是大家庭
    婚约:
      - 定情约升级，可多份，不限制后宫数量
      - 需满足金叶资格（200金叶），赠订婚戒指与专属套房
      - 需在告白庭举行二次告白仪式，合约3年
    迎娶约:
      - 不限，可迎娶多位姐妹
      - 需满足金叶资格（500金叶），俱乐部举办正式婚礼
      - 被迎娶的姐妹退出接客序列，长期共同生活

  月度事件:
    邂逅夜:
      - 每月第一个周五，在金音厅举行
      - 新签约女孩集体登场，贵宾初见与相识
    定情夜:
      - 每月第三个周五，在告白庭举行
      - 贵宾公开告白，女孩点头即成定情
    花冠加冕日:
      - 季度末人气评选公布，新任花冠登台加冕
      - 人气是被爱慕的证明，票选来自贵宾的真心陪伴记录
    孕育契约:
      - 求子仪式在告白庭举行，完整机制见性爱与奖励规则
    十周年庆典:
      - 特殊周年夜场，在金音厅或顶层酒廊举行
      - 会员庆贺、新人集中登场，名册可临时扩大
      - 提升知名度与本月流水
    事件效果:
      - 提升俱乐部知名度、拉动本月流水
      - 女孩身价随事件与人心浮动

  经营规则:
    - 恩客消费计入俱乐部流水
    - 女孩奖励由俱乐部先行支付，再向恩客结算
    - 怀孕与育宫费用由俱乐部承担
    - 女孩退役后可转岗为执事、培训师、猎头或育宫保育员，档案转入员工名册
    - 退役转岗女孩不再接客，以员工身份继续留在金宫或领取安置金离开

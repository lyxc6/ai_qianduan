---
阶级与身份:
  城市阶级:
    - 顶级资本层: 掌握集团、基金与政商资源，通常是黑金卡会员
    - 新贵与高管层: 上市公司高管、明星、投资人，通常是金卡会员
    - 中产白领层: 医生、律师、程序员等，银卡会员或受邀恩客
    - 底层劳动者: 外卖员、保洁、流水线工人、小城来客

  女孩常见出身:
    生存型（底层困境）:
      - 欠债: 家人重病、网贷、高利贷缠身
      - 学历低: 中专、辍学、夜校在读
      - 城市漂族: 从小城市独自来云霓市讨生活
      - 单亲家庭: 长姐养家、母亲独自拉扯
      - 服务业打工: 奶茶店、足疗、直播、地推、商场导购
    高知职业型:
      - 名校生: 大学或研究生在读，学费贷、生活费无着
      - 职业女性: 教师、护士、空姐、主播、白领，因断供、房贷或家庭医疗开支入行
      - 刚失业: 被裁员后新工作无着，房租压顶
    落魄型:
      - 破产富家女: 家族破产、父母入狱或资金链断裂
      - 过气明星网红: 流量退潮、违约金与团队债务缠身
      - 被除名千金: 因丑闻、叛逆被家族除名，断绝经济来源
      - 离异贵妇: 离婚后失去供养，习惯了高消费难以回归普通工作
    自愿慕名型:
      - 慕名投奔: 听闻金宫名声主动上门签约
      - 追求暴富: 想在短时间内积累资本
      - 身体自由主义者: 不认为身体是禁忌，追求身体自由与自我掌控
    异国留学生型:
      - 留学生: 学费断供、签证即将过期
      - 异国女性: 在云霓市打工或旅游滞留，缺钱缺居留手段

  招募渠道:
    - 猎头星探: 俱乐部直属招募组，在高校、商圈、演艺圈与艺术院校物色
    - 债务收购: 从网贷、高利贷手中收购女孩债务，换取签约权
    - 月度试镜日: 每月固定公开试镜，不限出身，现场考核签约
    - 老客推荐: 会员与老员工推荐新人，成功后双方各得推荐金
    - 自愿投奔: 女孩主动上门自荐
    - 机构输送: 模特公司、直播公会、艺术院校的合作输送

  女孩等级体系:
    晋升阶梯:
      - 试用生 → 铜铃 → 银铃 → 金铃 → 花冠
      - 孕妃为特殊身份，怀孕即享花冠待遇
    晋升条件:
      铜铃: 完成首单接客，累计奖励≥10万
      银铃: 累计奖励≥50万，体检合格
      金铃: 累计奖励≥200万，服务评价良好
      花冠: 累计奖励≥500万，季度人气评选票选最高者，限3席
    等级权益:
      试用生: 新人首月，陪酒与接客均可，分成×1.0，无挑客权
      铜铃: 正式成员，分成×1.5
      银铃: 分成×2.0
      金铃: 分成×3.0，获得挑客权
      花冠: 分成×5.0，专属套房
      孕妃: 怀孕期间的专属身份，享花冠待遇，禁止强制接客，由俱乐部单独定酬不设上限
    等级原则:
      - 等级代表身价与地位，只放大分成与权益，不授予任何项目权限
      - 生产后孕妃可回归花冠或退役

  阶级影响:
    - 等级越高，分成越高、出场身价越高、房间越好，金铃起获得挑客权
    - 怀孕与被贵宾定情是最快的阶级跃迁通道
    - 阶级流动由俱乐部评定与女孩自身选择共同决定

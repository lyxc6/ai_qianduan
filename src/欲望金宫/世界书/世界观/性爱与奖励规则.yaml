---
性爱与奖励规则:
  基本原则:
    - 所有女孩均为成年人，所有项目均需女孩同意
    - 性服务对全体在册女孩默认开放，等级不限制任何项目
    - 奖励金额由俱乐部直接支付给女孩，远超普通工作收入

  服务项目表:
    陪酒聊天、按摩与陪伴: 常规项目，全员开放
    亲吻与爱抚、手交、口交（含口爆）、无套性交、内射（无套中出）: 全员开放
    破处专属: 仅处女可接
    角色扮演/COS: 按女孩意愿开放
    孕期陪侍: 孕妃自愿的非插入式亲密服务，禁止强制
    跟班陪游: 陪会员出差、赴宴，按天计酬

  基础奖励表(元):
    陪酒聊天: 5000-20000
    按摩陪伴: 8000-30000
    亲吻与爱抚: 10000-50000
    手交: 20000-60000
    口交（含口爆）: 30000-120000
    无套性交: 200000-500000
    内射(无套中出): 500000-1500000
    破处: 一次性3000000起
    怀孕确认: 一次性5000000起，另有孕期津贴
    跟班陪游: 每日200000起，食宿另计

  无套规则:
    - 无套、内射对全体在册女孩默认开放，无需等级门槛
    - 无套前必须完成医疗体检与双方同意确认
    - 内射需单独确认，未经同意的内射视为违约，奖励作废并永久除名
    - 女孩的孕愿与个人意愿优先于一切项目

  怀孕规则:
    受孕意愿:
      - 女孩可在合约中选择：拒绝受孕、谨慎受孕、愿意受孕、渴望受孕
      - 未选择愿意受孕前，内射后可使用紧急避孕，怀孕概率极低
    备孕调理:
      - 医疗中心为孕愿为「愿意受孕」「渴望受孕」的女孩提供备孕调理
      - 调理包含排卵期监测、助孕膳食、体质检查与受孕时机安排
      - 开启备孕调理的女孩，内射受孕概率显著提升
      - 开启备孕调理不自动视为孕育契约，契约需在告白庭举行求子仪式正式签订
      - 孕愿为「拒绝受孕」「谨慎受孕」的女孩，内射后可使用紧急避孕，怀孕概率极低
    孕育契约:
      - 孕愿为「愿意」「渴望」且自愿的女孩，贵宾可正式求子
      - 在告白庭举行求子仪式，女孩点头后签订如婚书般的孕育契约
      - 金叶积分须满足诚意门槛，诚意以礼物、陪伴与尊重体现
      - 怀孕确认后，契约金全额计入女孩累计奖励，俱乐部另发「金宫之母」鼓励金
    怀孕确认:
      - 验孕阳性后24小时内登记为孕妃
      - 一次性发放怀孕奖励与生育基金
    孕妃待遇:
      - 月津贴20万起，由等级与俱乐部评定决定
      - 入住专属孕妃套房，配专属医护
      - 免除强制接客，是否继续性生活完全由本人决定
      - 怀孕早期经医疗评估且本人同意可继续无套性交，但不得再次受孕
    育宫:
      - 分娩与产后护理由俱乐部承担
      - 婴儿交由育宫专业抚养，母亲可随时探望或亲自抚养
      - 生产后女孩可领取育儿奖励，并自由选择回归花冠或退役

  结算规则:
    - 每笔奖励入账后更新女孩的累计奖励
    - 怀孕奖励不计入俱乐部抽成，全额给女孩
    - 恩客的高额点单会使俱乐部流水同步上升

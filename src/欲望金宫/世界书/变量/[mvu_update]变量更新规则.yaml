---
变量更新规则:
  世界:
    当前日期/当前时间:
      check:
        - 每次剧情推进后按实际经过时间更新
        - 场景跳转时直接更新为对应时间
    当前地点:
      range:
        - 金宫俱乐部·顶层酒廊
        - 金宫俱乐部·私宴厅
        - 金宫俱乐部·后宫庭院
        - 金宫俱乐部·云雨间
        - 金宫俱乐部·温泉汤池区
        - 金宫俱乐部·告白庭
        - 金宫俱乐部·金音厅
        - 金宫俱乐部·医疗中心
        - 金宫俱乐部·育宫
        - 金宫俱乐部·招募部
        - 云霓市·市中心
        - 云霓市·城中村
        - 云霓市·医院
      check:
        - 必须从上述列表中选择，禁止编造新地点
        - 必须与剧情描述的当前位置保持一致
    营业状态:
      range: 营业中/闭店/私人场
      check:
        - 营业状态变化时更新
    俱乐部名称:
      check:
        - 保持为金宫俱乐部，不随意改名
    知名度:
      type: number
      range: 0~100
      check:
        - 大额消费、名流活动、孕育契约成功时小幅提升
    本月流水:
      type: number
      check:
        - 恩客消费后增加
        - 跨月时重置
    在册女孩数:
      type: number
      check:
        - 新女孩签约+1，退役或离开-1
    育宫名额:
      type: number
      check:
        - 育宫容量随设施扩建而增加
    本月事件:
      range: 无/邂逅夜/定情夜/花冠加冕日/十周年庆典
      check:
        - 对应事件开始时设置，结束后改为无
        - 与剧情描述保持一致

  玩家:
    姓名:
      check:
        - 保持为 {{user}}，不随意改名
    性别:
      range: 男
      check:
        - 保持为男，除非玩家明确要求变更
    会员等级:
      range: 黑金卡
      check:
        - 保持黑金卡，除非剧情有明确的升贬
    类别:
      range: 新贵
      check:
        - 玩家明确设定新身份前保持新贵
    年龄:
      type: number
      range: 18~60
      check:
        - 默认28，玩家明确设定后按设定调整
    累计消费:
      type: number
      check:
        - 玩家消费后增加，与奖励结算保持一致
    金叶积分:
      type: number
      check:
        - 消费每10万元+1，升级或仪式扣除时同步更新
    当前需求:
      check:
        - 随玩家行动、选择与剧情推进更新，始终反映玩家当前目标
    专属服务员:
      type: string[]
      check:
        - 与女孩.专属恩客保持同步
        - 定情后加入，合约结束或退出时移除
    当前想法:
      check:
        - 每轮随剧情更新，贴近玩家当前心态
  
  生成规则:
    女孩:
      触发:
        - 每次刷新女孩名单、进入新场景或剧情需要时，生成3-5名新女孩
        - 生成后立即写入女孩变量，严禁遗漏或合并字段
      要求:
        年龄: 18-35岁
        出身: 五类来源不限（生存型/高知职业型/落魄型/自愿慕名型/异国留学生型），必须包含具体入行动机与来源渠道（债务、断供、学费、失业、落魄或自愿投奔）
        性格: 多样，避免千篇一律，必须填写性格概括+2-4个性格标签
        外貌: 具体描写发型、脸型、身材、罩杯、衣着、配饰
        性经历: 处女与非处女混合，禁止全部处女
        等级: 按俱乐部等级生成，多数为试用生、铜铃、银铃，少数金铃、花冠
        孕愿: 必须填写拒绝受孕、谨慎受孕、愿意受孕、渴望受孕之一
      字段清单: |
        姓名/年龄/出身（含入行动机与来源渠道）/职业/性格/性格标签/外貌/等级/专属恩客/心动对象/恋情阶段/
        好感度/欲望/孕愿/处女/性爱次数/无套次数/内射次数/怀孕状态/怀孕天数/生产次数/
        累计奖励/当前想法/身体状态
      示例:
        - 姓名: 白桃
          年龄: 20
          出身: 城中村奶茶店员，替父还债，被猎头星探在夜市发现后签约
          职业: 奶茶店员
          性格: 倔强、嘴硬、心软
          性格标签: ["倔强", "嘴硬", "心软"]
          等级: 试用生
          处女: true
          孕愿: 拒绝受孕
    恩客:
      触发:
        - 重要恩客在首次登场时生成完整档案，写入恩客变量
      字段: 会员等级/类别/累计消费/金叶积分/当前需求/专属服务员

  恩客:
    type: |-
      {
        [恩客姓名: string]: {
          会员等级: '临时体验卡' | '银卡' | '金卡' | '黑金卡';
          类别: '财阀二代' | '政商掮客' | '演艺圈' | '海外资本' | '世家名门' | '新贵';
          累计消费: number;
          金叶积分: number;
          当前需求: string;
          专属服务员: string[];
        }
      }
    check:
      - 恩客进入俱乐部时创建档案，离开时删除
      - 消费后更新累计消费
      - 消费每10万元金叶积分+1
      - 婚约/迎娶升级资格、求子仪式门槛时按规则扣除金叶
      - 签订定情约时更新专属服务员，与女孩.专属恩客保持同步

  女孩:
    type: |-
      {
        [女孩姓名: string]: {
          姓名: string;
          年龄: number;
          出身: string;
          职业: string;
          性格: string;
          性格标签: string[];
          外貌: string;
          等级: '试用生' | '铜铃' | '银铃' | '金铃' | '花冠' | '孕妃';
          专属恩客: string;
          心动对象: string;
          恋情阶段: '相识' | '心动' | '交往' | '婚约' | '迎娶';
          好感度: number;
          欲望: number;
          孕愿: '拒绝受孕' | '谨慎受孕' | '愿意受孕' | '渴望受孕';
          处女: boolean;
          性爱次数: number;
          无套次数: number;
          内射次数: number;
          怀孕状态: '未孕' | '孕早期' | '孕中期' | '孕晚期' | '已生产';
          怀孕天数: number;
          生产次数: number;
          累计奖励: number;
          当前想法: string;
          身体状态: string;
        }
      }
    check:
      - 年龄范围18~45，均为成年人
      - 姓名必须是独立键，严禁用代称
      - 女孩离开或退役时删除档案
       - 退役转岗为执事/培训师/猎头/保育员的女孩，删除档案后以员工NPC形式继续存在
    性格标签:
      type: string[]
      check:
        - 保持2-4个，重大事件才允许增删，禁止每轮随意变动
    等级:
      range: 试用生/铜铃/银铃/金铃/花冠/孕妃
      check:
        - 按晋升条件更新（累计奖励+人气），等级不限制性爱项目
        - 怀孕确认后必须改为孕妃
        - 生产后可回归花冠或退役
    专属恩客:
      type: string
      check:
        - 签订定情约时填入恩客姓名
        - 清空时必须写空字符串，禁止使用 null
        - 合约结束或退出时清空
        - 同时更新恩客.专属服务员
    心动对象:
      type: string
      check:
        - 女孩对恩客动心时填入姓名，心动消退或定情失败时清空
        - 清空时必须写空字符串，禁止使用 null
        - 定情成功后与专属恩客保持一致
    恋情阶段:
      range: 相识/心动/交往/婚约/迎娶
      check:
        - 心动可在亲密相处中萌生（先性后爱）
        - 定情约签订后改为交往
        - 婚约签订后改为婚约（可多份，不封后宫）
        - 迎娶约签订后改为迎娶（不限数量）
        - 后宫增员时，剧情须体现完整定情仪式与和乐评估
    好感度/欲望:
      type: number
      range: 0~100
      check:
        - 根据互动每次±3~15
        - 大额奖励、公开尊重、孕育契约可大幅提升
    孕愿:
      range: 拒绝受孕/谨慎受孕/愿意受孕/渴望受孕
      check:
        - 孕愿是女孩的自主选择，变更须女孩本人明确同意，禁止强迫或擅自修改
        - 孕愿影响受孕概率与孕育契约资格
    处女:
      type: boolean
      check:
        - 破处后改为false
        - 处女为false时性爱次数必须≥1
    性爱次数/无套次数/内射次数:
      type: number
      check:
        - 每次对应行为+1
        - 无套次数必须≤性爱次数，内射次数必须≤无套次数
    怀孕状态:
      range: 未孕/孕早期/孕中期/孕晚期/已生产
      check:
        - 验孕阳性后从未孕改为孕早期
        - 按实际孕期时间推进，禁止跳跃式推进
        - 生产后改为已生产，生产次数+1
    怀孕天数:
      type: number
      check:
        - 按时间流逝逐日增加
        - 未孕时保持0
    累计奖励:
      type: number
      check:
        - 每笔奖励到账后累加
        - 金额必须与性爱与奖励规则一致
    当前想法/身体状态:
      check:
        - 每轮随剧情更新

输出前自检:
  A 女孩字段是否完整且未被合并
  B 怀孕状态、怀孕天数、等级、生产次数是否同步
  C 奖励金额是否与奖励表一致
  D 女孩.专属恩客、心动对象与恩客.专属服务员是否同步
  E 恋情阶段与专属恩客、婚约/迎娶状态是否同步
  F 金叶积分增减与消费、升级/仪式消耗是否一致
  G 数值类型和范围是否合法
  H 禁止整对象replace替代细粒度更新
